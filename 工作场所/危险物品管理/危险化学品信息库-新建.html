  <!-- 静态修复方案 - 确保Plus组件可用 -->
  <script>
  // 简单的静态修复 - 页面打开时自动执行
  window.addEventListener('load', function() {
    console.log('页面加载完成 - 开始静态修复...');

    // 确保ElementPlus对象存在时立即修复
    let checkCount = 0;
    const checkAndFix = function() {
      checkCount++;
      if (window.ElementPlus && window.Vue) {
        // 如果ElementPlus.Plus不存在，创建它
        if (!ElementPlus.Plus) {
          ElementPlus.Plus = Vue.defineComponent({
            name: 'Plus',
            template: '<span>+</span>'
          });
        }
        console.log('Plus组件修复完成');
        return true;
      } else if (checkCount < 10) {
        // 最多重试10次
        setTimeout(checkAndFix, 200);
        return false;
      }
      return false;
    };

    // 立即开始检查
    checkAndFix();
  });
  </script>

    handleMsdsPictogramChange(file, fileList){
      const isImage = file.raw.type === 'image/jpeg' || file.raw.type === 'image/png' || file.raw.type === 'image/gif';
      const isLt2M = file.raw.size / 1024 / 1024 < 2;

      if (!isImage) {
        ElMessage.error('只能上传图片格式(jpg/png/gif)!');
        return false;
      }
      if (!isLt2M) {
        ElMessage.error('图片大小不能超过 2MB!');
        return false;
      }
      this.msdsPictogramFileList = fileList;
      return true;
    },

    submit(){
      this.$refs.formRef.validate(valid=>{
        if(!valid){ ElMessage.warning('请完善表单'); return; }
        try{
          this.saving=true;
          setTimeout(()=>{ this.saving=false; ElMessage.success('提交成功'); window.history.back(); },800);
        }catch(err){
          this.saving=false;
          ElMessage.error('提交失败');
        }
      });
    },
    goBack(){ window.history.back(); }
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
