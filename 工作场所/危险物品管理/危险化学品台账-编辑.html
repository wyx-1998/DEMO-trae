<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作场所 - 危险化学品台账-编辑</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif;background:#f5f7fa}
    .app-container{min-height:100vh;display:flex;flex-direction:column}
    .page{max-width:1200px;margin:0 auto;padding:24px;width:100%}
    .content-card{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
    .form-container{padding:24px}
    .form-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #f0f0f0}
    .form-title{font-size:18px;font-weight:600;color:#333;display:flex;align-items:center;gap:10px}
    .form-sections{display:flex;flex-direction:column;gap:24px}
    .form-section{border:1px solid #e8e8e8;border-radius:8px;overflow:hidden;background:#fff}
    .section-header{background:#fafafa;padding:14px 20px;border-bottom:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:center}
    .section-title{font-size:16px;font-weight:600;color:#333;display:flex;align-items:center;gap:8px}
    .section-title-actions{display:flex;align-items:center;gap:8px}
    .form-section-content{padding:20px}
    .footer-bar{display:flex;gap:12px;justify-content:flex-end;margin-top:16px}
    .status-tag{font-size:12px;color:#909399}
    .el-select,.el-input,.el-textarea{width:100%}
    .el-button--primary{--el-button-bg-color:#409EFF;--el-button-border-color:#409EFF}
    .el-icon-plus {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 28px;
      color: #8c939d;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app" class="app-container">
  <div class="page">
    <div class="content-card">
      <div class="form-container">
        <div class="form-header">
          <div class="form-title"><i class="fas fa-edit"></i> 编辑危险化学品台账</div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <el-button type="success" @click="showImportDialog" :icon="Upload" size="small">
              从信息库导入
            </el-button>
            <div class="status-tag" v-if="form.cas">CAS：{{ form.cas }}</div>
          </div>
        </div>

        <el-alert v-if="errorMsg" :title="errorMsg" type="error" show-icon style="margin-bottom:12px"></el-alert>

        <template v-if="!loading">
          <el-form :model="form" :rules="rules" ref="formRef" label-width="140px">
            <div class="form-sections">
              <!-- 基本信息 -->
              <div class="form-section">
                <div class="section-header">
                  <div class="section-title"><i class="fas fa-info-circle"></i> 基本信息</div>
                  <div class="section-title-actions">
                    <el-button link size="small" @click="toggleSection('basic')">{{ sectionOpen.basic ? '收起' : '展开' }}</el-button>
                  </div>
                </div>
                <div class="form-section-content" v-show="sectionOpen.basic">
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="化学品名称" prop="name"><el-input v-model="form.name" placeholder="请输入化学品名称" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="英文名" prop="englishName"><el-input v-model="form.englishName" placeholder="请输入英文名" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="别名"><el-input v-model="form.alias" placeholder="请输入别名" /></el-form-item>
                    </el-col>
                  </el-row>
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="CAS号" prop="cas"><el-input v-model="form.cas" placeholder="XXXXX-XX-X" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="分子式"><el-input v-model="form.formula" placeholder="请输入分子式" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="危险性分类" prop="hazards">
                        <el-select
                            v-model="form.hazards"
                            placeholder="请选择危险性分类"
                            multiple
                            clearable>
                            <el-option label="爆炸物" value="爆炸物"></el-option>
                            <el-option label="易燃气体" value="易燃气体"></el-option>
                            <el-option label="易燃液体" value="易燃液体"></el-option>
                            <el-option label="易燃固体" value="易燃固体"></el-option>
                            <el-option label="自反应物质/混合物" value="自反应物质/混合物"></el-option>
                            <el-option label="自燃液体" value="自燃液体"></el-option>
                            <el-option label="自燃固体" value="自燃固体"></el-option>
                            <el-option label="遇水放出易燃气体物质" value="遇水放出易燃气体物质"></el-option>
                            <el-option label="氧化性气体" value="氧化性气体"></el-option>
                            <el-option label="氧化性液体" value="氧化性液体"></el-option>
                            <el-option label="氧化性固体" value="氧化性固体"></el-option>
                            <el-option label="有机过氧化物" value="有机过氧化物"></el-option>
                            <el-option label="腐蚀性物质" value="腐蚀性物质"></el-option>
                            <el-option label="高压气体" value="高压气体"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                  </el-row>
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="闪点(℃)"><el-input v-model="form.flashPoint" placeholder="请输入闪点" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="密度(g/cm³)"><el-input v-model="form.density" placeholder="请输入密度" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="分子量"><el-input v-model="form.mw" placeholder="请输入分子量" /></el-form-item>
                    </el-col>
                  </el-row>
                </div>
              </div>

              <!-- 企业库存信息 -->
              <div class="form-section">
                <div class="section-header">
                  <div class="section-title"><i class="fas fa-warehouse"></i> 企业库存信息</div>
                  <div class="section-title-actions">
                    <el-button link size="small" @click="toggleSection('enterprise')">{{ sectionOpen.enterprise ? '收起' : '展开' }}</el-button>
                  </div>
                </div>
                <div class="form-section-content" v-show="sectionOpen.enterprise">
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="储存位置" prop="location">
                        <el-select
                            v-model="form.location"
                            placeholder="请选择储存位置"
                            clearable
                            style="width: 100%">
                          <el-option label="危化仓A-01-01" value="危化仓A-01-01"></el-option>
                          <el-option label="危化仓A-01-02" value="危化仓A-01-02"></el-option>
                          <el-option label="危化仓A-01-03" value="危化仓A-01-03"></el-option>
                          <el-option label="危化仓A-01-04" value="危化仓A-01-04"></el-option>
                          <el-option label="危化仓A-01-05" value="危化仓A-01-05"></el-option>
                          <el-option label="危化仓A-01-06" value="危化仓A-01-06"></el-option>
                          <el-option label="危化仓B-02-01" value="危化仓B-02-01"></el-option>
                          <el-option label="危化仓B-02-02" value="危化仓B-02-02"></el-option>
                          <el-option label="危化仓B-02-03" value="危化仓B-02-03"></el-option>
                          <el-option label="危化仓C-03-01" value="危化仓C-03-01"></el-option>
                          <el-option label="危化仓C-03-02" value="危化仓C-03-02"></el-option>
                          <el-option label="危化仓D-04-01" value="危化仓D-04-01"></el-option>
                          <el-option label="危化仓D-04-02" value="危化仓D-04-02"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="库存数量" prop="stockQty"><el-input-number v-model="form.stockQty" placeholder="请输入库存数量" style="width: 100%" :min="0" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="计量单位" prop="unit">
                        <el-select
                            v-model="form.unit"
                            placeholder="请选择计量单位"
                            clearable>
                          <el-option label="kg" value="kg"></el-option>
                          <el-option label="L" value="L"></el-option>
                          <el-option label="吨" value="吨"></el-option>
                          <el-option label="m³" value="m³"></el-option>
                          <el-option label="个" value="个"></el-option>
                          <el-option label="瓶" value="瓶"></el-option>
                          <el-option label="桶" value="桶"></el-option>
                          <el-option label="袋" value="袋"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                  </el-row>
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="库存状态" prop="stockStatus">
                        <el-select
                            v-model="form.stockStatus"
                            placeholder="请选择库存状态"
                            clearable>
                          <el-option label="正常" value="正常"></el-option>
                          <el-option label="超期" value="超期"></el-option>
                          <el-option label="冻结" value="冻结"></el-option>
                          <el-option label="待检" value="待检"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="供应商" prop="supplier"><el-input v-model="form.supplier" placeholder="请输入供应商名称" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="批次号" prop="batchNo"><el-input v-model="form.batchNo" placeholder="请输入批次号" /></el-form-item>
                    </el-col>
                  </el-row>
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="生产日期" prop="prodDate">
                        <el-date-picker v-model="form.prodDate" type="date" placeholder="请选择生产日期" format="YYYY-MM-DD" value-format="YYYY-MM-DD" style="width: 100%" />
                      </el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="有效期至" prop="expireDate">
                        <el-date-picker v-model="form.expireDate" type="date" placeholder="请选择有效期" format="YYYY-MM-DD" value-format="YYYY-MM-DD" style="width: 100%" />
                      </el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="标签状态" prop="labelStatus">
                        <el-select
                            v-model="form.labelStatus"
                            placeholder="请选择标签状态"
                            clearable>
                          <el-option label="已粘贴" value="已粘贴"></el-option>
                          <el-option label="未粘贴" value="未粘贴"></el-option>
                          <el-option label="破损" value="破损"></el-option>
                          <el-option label="缺失" value="缺失"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                  </el-row>
                </div>
              </div>

              <!-- 包装信息 -->
              <div class="form-section">
                <div class="section-header">
                  <div class="section-title"><i class="fas fa-box"></i> 包装信息</div>
                  <div class="section-title-actions">
                    <el-button link size="small" @click="toggleSection('packaging')">{{ sectionOpen.packaging ? '收起' : '展开' }}</el-button>
                  </div>
                </div>
                <div class="form-section-content" v-show="sectionOpen.packaging">
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="包装类型"><el-input v-model="form.pkgType" placeholder="如：200L铁桶" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="包装材质"><el-input v-model="form.pkgMaterial" placeholder="如：不锈钢" /></el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="包装数量"><el-input-number v-model="form.pkgQty" placeholder="请输入包装数量" style="width: 100%" :min="0" /></el-form-item>
                    </el-col>
                  </el-row>
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="单包装容量"><el-input v-model="form.pkgCapacity" placeholder="如：200L" /></el-form-item>
                    </el-col>
                  </el-row>
                </div>
              </div>

              <!-- 特殊属性 -->
              <div class="form-section">
                <div class="section-header">
                  <div class="section-title"><i class="fas fa-exclamation-triangle"></i> 特殊属性</div>
                  <div class="section-title-actions">
                    <el-button link size="small" @click="toggleSection('special')">{{ sectionOpen.special ? '收起' : '展开' }}</el-button>
                  </div>
                </div>
                <div class="form-section-content" v-show="sectionOpen.special">
                  <el-row :gutter="20">
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="是否剧毒">
                        <el-select
                            v-model="form.isHighlyToxic"
                            placeholder="请选择"
                            clearable>
                          <el-option label="是" value="是"></el-option>
                          <el-option label="否" value="否"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="是否易制爆">
                        <el-select
                            v-model="form.isExplosive"
                            placeholder="请选择"
                            clearable>
                          <el-option label="是" value="是"></el-option>
                          <el-option label="否" value="否"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                    <el-col :xs="24" :sm="12" :md="8">
                      <el-form-item label="是否易制毒">
                        <el-select
                            v-model="form.isDrugPrecursor"
                            placeholder="请选择"
                            clearable>
                          <el-option label="是" value="是"></el-option>
                          <el-option label="否" value="否"></el-option>
                        </el-select>
                      </el-form-item>
                    </el-col>
                  </el-row>
                </div>
              </div>

              <!-- MSDS快速录入 -->
              <div class="form-section">
                <div class="section-header">
                  <div class="section-title"><i class="fas fa-file-alt"></i> MSDS 快速录入</div>
                  <div class="section-title-actions">
                    <el-button link size="small" @click="toggleSection('msds')">{{ sectionOpen.msds ? '收起' : '展开' }}</el-button>
                  </div>
                </div>
                <div class="form-section-content" v-show="sectionOpen.msds">
                  <p class="status-tag">以下 16 章字段遵循国标 SDS 结构，可按需填写核心信息。</p>

                  <!-- 第1章 -->
                  <el-collapse v-model="activeMsdsPanels" class="msds-collapse">
                    <el-collapse-item name="c1" title="第1章：化学品及企业标识">
                      <el-row :gutter="16">
                        <el-col :xs="24" :sm="12" :md="8"><el-form-item label="产品名称"><el-input v-model="form.msds.chapter1.product" /></el-form-item></el-col>
                        <el-col :xs="24" :sm="12" :md="8"><el-form-item label="推荐用途"><el-input v-model="form.msds.chapter1.use" /></el-form-item></el-col>
                        <el-col :xs="24" :sm="12" :md="8"><el-form-item label="供应商"><el-input v-model="form.msds.chapter1.supplier" /></el-form-item></el-col>
                      </el-row>
                      <el-row :gutter="16">
                        <el-col :xs="24" :sm="12" :md="8"><el-form-item label="地址"><el-input v-model="form.msds.chapter1.address" /></el-form-item></el-col>
                        <el-col :xs="24" :sm="12" :md="8"><el-form-item label="联系电话"><el-input v-model="form.msds.chapter1.phone" /></el-form-item></el-col>
                        <el-col :xs="24" :sm="12" :md="8"><el-form-item label="应急电话"><el-input v-model="form.msds.chapter1.emergency" /></el-form-item></el-col>
                      </el-row>
                    </el-collapse-item>

                    <!-- 第2章 -->
                    <el-collapse-item name="c2" title="第2章：危险性概述">
                      <el-row :gutter="16">
                        <el-col :xs="24" :sm="12"><el-form-item label="GHS分类"><el-input v-model="form.msds.chapter2.ghs" /></el-form-item></el-col>
                        <el-col :xs="24" :sm="12"><el-form-item label="信号词">
                          <el-select
                              v-model="form.msds.chapter2.signalWord"
                              placeholder="请选择信号词"
                              clearable>
                            <el-option label="Danger（严重危害）" value="Danger"></el-option>
                            <el-option label="Warning（一般危害）" value="Warning"></el-option>
                            <el-option label="Caution（注意）" value="Caution"></el-option>
                            <el-option label="Notice（提示）" value="Notice"></el-option>
                            <el-option label="Attention（关注）" value="Attention"></el-option>
                            <el-option label="Alarm（告警/报警）" value="Alarm"></el-option>
                          </el-select>
                        </el-form-item></el-col>
                      </el-row>
                      <el-row :gutter="16">
                        <el-col :span="24"><el-form-item label="象形图上传">
                          <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
                            <el-upload
                              action="#"
                              list-type="picture-card"
                              :auto-upload="false"
                              :limit="1"
                              :file-list="msdsPictogramFileList"
                              @change="handleMsdsPictogramChange"
                              style="margin-bottom: 4px;"
                            >
                              <div class="el-icon-plus">+</div>
                            </el-upload>
                            <div style="font-size: 12px; color: #909399; line-height: 1.4;">支持jpg/png/gif格式，大小不超过2MB</div>
                          </div>
                        </el-form-item></el-col>
                      </el-row>
                      <el-row :gutter="16">
                        <el-col :span="24"><el-form-item label="危险说明(H)"><el-input type="textarea" :rows="2" v-model="form.msds.chapter2.h" /></el-form-item></el-col>
                      </el-row>
                      <el-row :gutter="16">
                        <el-col :span="24"><el-form-item label="防范说明(P)"><el-input type="textarea" :rows="2" v-model="form.msds.chapter2.p" /></el-form-item></el-col>
                      </el-row>
                    </el-collapse-item>

                    <!-- 第3章 -->
                    <el-collapse-item name="c3" title="第3章：成分/组成信息">
                      <el-table :data="form.msds.chapter3.components" border size="small" style="width:100%">
                        <el-table-column label="化学名称">
                          <template #default="scope"><el-input v-model="scope.row.name" placeholder="化学名称" /></template>
                        </el-table-column>
                        <el-table-column label="CAS号" width="220">
                          <template #default="scope"><el-input v-model="scope.row.cas" placeholder="CAS号" /></template>
                        </el-table-column>
                        <el-table-column label="含量(%)" width="160">
                          <template #default="scope"><el-input v-model="scope.row.concentration" placeholder="例如 95" /></template>
                        </el-table-column>
                        <el-table-column label="操作" width="100">
                          <template #default="scope"><el-button type="danger" link size="small" @click="removeComponent(scope.$index)">删除</el-button></template>
                        </el-table-column>
                      </el-table>
                      <div style="margin-top:12px">
                        <el-button type="primary" plain @click="addComponentRow"><i class="fas fa-plus" style="margin-right:4px"></i>新增成分行</el-button>
                      </div>
                    </el-collapse-item>

                    <!-- 第4章 -->
                    <el-collapse-item name="c4" title="第4章：急救措施">
                      <el-row :gutter="16">
                        <el-col :xs="24" :sm="12"><el-form-item label="吸入"><el-input type="textarea" :rows="2" v-model="form.msds.chapter4.inhale" placeholder="脱离现场至空气新鲜处，保持呼吸道通畅" /></el-form-item></el-col>

          }
        ],
        location: [{ required: true, message: '请输入储存位置', trigger: 'blur' }],
        stockQty: [
          { required: true, message: '请输入库存数量', trigger: 'blur' },
          {
            validator: (rule, value, callback) => {
              if (value !== null && value !== undefined && value >= 0) {
                callback();
              } else {
                callback(new Error('库存数量必须为非负数'));
              }
            },
            trigger: 'blur'
          }
        ],
        unit: [{ required: true, message: '请选择计量单位', trigger: 'change' }],
        stockStatus: [{ required: true, message: '请选择库存状态', trigger: 'change' }],
        supplier: [],
        batchNo: [],
        prodDate: [],
        labelStatus: []
      },
      sectionOpen: {
        basic: true,
        enterprise: true,
        packaging: true,
        special: true,
        msds: true
      },
      activeMsdsPanels: ['c1', 'c2', 'c3'],
      importDialogVisible: false,
      chemicalSearchKeyword: '',
      chemicalList: [],
      filteredChemicalList: []
    }
  },
  mounted() {
    this.initChemicalList();
    this.loadData();
  },
  methods: {
    loadData() {
      const cas = getParam('cas');
      if (cas) {
        this.loading = true;

        // 模拟从后端加载数据
        setTimeout(() => {
          try {
            // 先从sessionStorage获取数据
            const 台账List = JSON.parse(sessionStorage.getItem('chemicalLedgerList') || '[]');
            let data = 台账List.find(item => item.cas === cas);

            // 如果没有找到，使用模拟数据
            if (!data) {
              data = {
                name: '乙醇',
                englishName: 'Ethanol',
                alias: '酒精',
                cas: cas,
                formula: 'C2H6O',
                hazards: ['易燃液体'],
                flashPoint: '12.8',
                density: '0.789',
                mw: '46.07',
                location: '危化仓A-01-05',
                stockQty: 120,
                unit: 'L',
                stockStatus: '正常',
                supplier: 'XX化工有限公司',
                batchNo: 'B202511-01',
                prodDate: '2025-10-12',
                expireDate: '2027-10-12',
                pkgType: '200L铁桶',
                pkgMaterial: '不锈钢',
                pkgQty: 10,
                pkgCapacity: '200L',
                isHighlyToxic: '否',
                isExplosive: '否',
                isDrugPrecursor: '否',
                msds: createEmptyMsds()
              };
            }

            // 确保所有字段都存在，避免字段丢失
            this.form = Object.assign({}, this.form, data);
            this.backup = { ...this.form };
            this.loading = false;
          } catch (error) {
            this.loading = false;
            this.errorMsg = '加载数据失败';
          }
        }, 500);
      } else {
        this.errorMsg = '缺少CAS参数';
      }
    },
    toggleSection(key) {
      this.sectionOpen[key] = !this.sectionOpen[key];
    },
    addComponentRow() {
      this.form.msds.chapter3.components.push({ name: '', cas: '', concentration: '' });
    },
    removeComponent(index) {
      this.form.msds.chapter3.components.splice(index, 1);
    },
    showImportDialog() {
      this.importDialogVisible = true;
      this.filterChemicals();
    },
    mergeMsds(currentMsds, importedMsds) {
      return {
        chapter1: { ...currentMsds.chapter1, ...importedMsds.chapter1 },
        chapter2: { ...currentMsds.chapter2, ...importedMsds.chapter2 },
        chapter3: { components: importedMsds.chapter3?.components || currentMsds.chapter3.components },
        chapter4: { ...currentMsds.chapter4, ...importedMsds.chapter4 },
        chapter5: { ...currentMsds.chapter5, ...importedMsds.chapter5 },
        chapter6: { ...currentMsds.chapter6, ...importedMsds.chapter6 },
        chapter7: { ...currentMsds.chapter7, ...importedMsds.chapter7 },
        chapter8: { ...currentMsds.chapter8, ...importedMsds.chapter8 },
        chapter9: { ...currentMsds.chapter9, ...importedMsds.chapter9 },
        chapter10: { ...currentMsds.chapter10, ...importedMsds.chapter10 },
        chapter11: { ...currentMsds.chapter11, ...importedMsds.chapter11 },
        chapter12: { ...currentMsds.chapter12, ...importedMsds.chapter12 },
        chapter13: { ...currentMsds.chapter13, ...importedMsds.chapter13 },
        chapter14: { ...currentMsds.chapter14, ...importedMsds.chapter14 },
        chapter15: { ...currentMsds.chapter15, ...importedMsds.chapter15 },
        chapter16: { ...currentMsds.chapter16, ...importedMsds.chapter16 }
      };
    },
    initChemicalList() {
      // 模拟信息库数据，实际项目中这里会调用后端API
      this.chemicalList = [
        {
          name: '乙醇',
          englishName: 'Ethanol',
          alias: '酒精',
          cas: '64-17-5',
          formula: 'C2H6O',
          hazards: ['易燃液体'],
          flashPoint: '12.8',
          density: '0.789',
          mw: '46.07'
        },
        {
          name: '丙酮',
          englishName: 'Acetone',
          alias: '二甲基酮',
          cas: '67-64-1',
          formula: 'C3H6O',
          hazards: ['易燃液体'],
          flashPoint: '-20',
          density: '0.7845',
          mw: '58.08'
        },
        {
          name: '氢氧化钠',
          englishName: 'Sodium Hydroxide',
          alias: '烧碱、火碱',
          cas: '1310-73-2',
          formula: 'NaOH',
          hazards: ['腐蚀性物质'],
          flashPoint: '',
          density: '2.13',
          mw: '40.00'
        },
        {
          name: '硫酸',
          englishName: 'Sulfuric Acid',
          alias: '浓硫酸',
          cas: '7664-93-9',
          formula: 'H2SO4',
          hazards: ['腐蚀性物质'],
          flashPoint: '',
          density: '1.84',
          mw: '98.08'
        },
        {
          name: '甲醇',
          englishName: 'Methanol',
          alias: '木醇',
          cas: '67-56-1',
          formula: 'CH4O',
          hazards: ['易燃液体', '毒性物质'],
          flashPoint: '11',
          density: '0.7918',
          mw: '32.04'
        }
      ];

      // 初始化过滤列表
      this.filteredChemicalList = [...this.chemicalList];
      console.log('化学品列表初始化完成:', this.chemicalList.length, '个化学品');
    },
    filterChemicals() {
      const keyword = this.chemicalSearchKeyword.toLowerCase().trim();

      console.log('过滤化学品，搜索关键词:', keyword);
      console.log('原始化学品列表长度:', this.chemicalList.length);

      if (!keyword) {
        this.filteredChemicalList = [...this.chemicalList];
        console.log('无关键词，显示全部化学品:', this.filteredChemicalList.length);
        return;
      }

      this.filteredChemicalList = this.chemicalList.filter(chemical => {
        return (
          chemical.name.toLowerCase().includes(keyword) ||
          chemical.cas.includes(keyword) ||
          (chemical.alias && chemical.alias.toLowerCase().includes(keyword)) ||
          (chemical.englishName && chemical.englishName.toLowerCase().includes(keyword))
        );
      });
      console.log('过滤后化学品列表长度:', this.filteredChemicalList.length);
    },
    getHazardType(hazard) {
      if (hazard.includes('易燃')) {
        return 'danger';
      } else if (hazard.includes('腐蚀')) {
        return 'warning';
      } else if (hazard.includes('毒性')) {
        return 'info';
      } else if (hazard.includes('爆炸')) {
        return 'danger';
      } else if (hazard.includes('氧化')) {
        return 'warning';
      } else {
        return 'primary';
      }
    },
    selectChemical(chemical) {
      // 合并导入的数据到表单（保留原有的ID和创建时间）
      this.form = {
        ...this.form,
        name: chemical.name || this.form.name,
        englishName: chemical.englishName || this.form.englishName,
        alias: chemical.alias || this.form.alias,
        cas: chemical.cas || this.form.cas,
        formula: chemical.formula || this.form.formula,
        hazards: chemical.hazards || this.form.hazards,
        flashPoint: chemical.flashPoint || this.form.flashPoint,
        density: chemical.density || this.form.density,
        mw: chemical.mw || this.form.mw,
        msds: this.mergeMsds(this.form.msds, chemical.msds || {})
      };

      // 更新MSDS默认打开的章节
      this.activeMsdsPanels = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10', 'c11', 'c12', 'c13', 'c14', 'c15', 'c16'];

      ElMessage.success(`成功导入 ${chemical.name} 的信息！`);
      this.importDialogVisible = false;
      this.chemicalSearchKeyword = '';
    },
    onCancel() {
      if (this.backup) {
        this.form = { ...this.backup };
      }
      window.location.href = './危险化学品台账.html';
    },
    onSave() {
      this.$refs.formRef.validate((valid) => {
        if (!valid) {
          ElMessage.warning('请完善必填信息');
          return;
        }

        try {
          this.saving = true;

          // 模拟保存到后端
          setTimeout(() => {
            this.saving = false;
            ElMessage.success('保存成功');

            // 更新sessionStorage中的数据
            try {
              const 台账List = JSON.parse(sessionStorage.getItem('chemicalLedgerList') || '[]');
              const index = 台账List.findIndex(item => item.cas === this.form.cas);
              if (index !== -1) {
                台账List[index] = {
                  ...this.form,
                  updateTime: new Date().toISOString()
                };
                sessionStorage.setItem('chemicalLedgerList', JSON.stringify(台账List));
              }
            } catch (e) {
              console.warn('更新本地存储失败', e);
            }

            // 返回列表页面
            window.location.href = './危险化学品台账.html';
          }, 1000);
        } catch (error) {
          this.saving = false;
          ElMessage.error('保存失败，请重试');
        }
      });
    },
    handleMsdsPictogramChange(file, fileList) {
      const raw = file.raw;
      const isImage = raw && (raw.type === 'image/jpeg' || raw.type === 'image/png' || raw.type === 'image/gif');
      const isLt2M = raw ? (raw.size / 1024 / 1024 < 2) : true;
      if (!isImage) {
        ElMessage.error('只能上传图片格式(jpg/png/gif)!');
        return false;
      }
      if (!isLt2M) {
        ElMessage.error('图片大小不能超过 2MB!');
        return false;
      }
      this.msdsPictogramFileList = fileList;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        this.form.msds.chapter2.pictograms = dataUrl;
      };
      reader.readAsDataURL(raw);
      return true;
    }
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
