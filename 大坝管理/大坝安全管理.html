<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大坝安全管理</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Element Plus JS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>

    <style>
        :root {
            --primary-color: #3366CC;
            --primary-light: #e6f7ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --text-primary: #303133;
            --text-secondary: #606266;
            --text-tertiary: #909399;
            --bg-light: #f5f7fa;
            --bg-white: #ffffff;
            --border-color: #e5e7eb;
            --border-light: #f0f0f0;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.12);
            --radius-small: 4px;
            --radius-medium: 8px;
            --radius-large: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            padding-bottom: 80px; /* 为固定的按钮条留出空间 */
        }

        /* 顶部导航栏 - 固定定位 */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
            margin-bottom: 24px;
            border-radius: var(--radius-medium);
            overflow: hidden;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #66b3ff 100%);
            color: white;
        }

        .nav-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-title i {
            font-size: 24px;
        }

        .nav-subtitle {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: var(--radius-small);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .nav-content {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 大坝切换器 - 单行横向滚动设计 */
        .dam-switcher {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .switcher-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .dam-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 8px 0;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .dam-tabs::-webkit-scrollbar {
            height: 6px;
        }

        .dam-tabs::-webkit-scrollbar-track {
            background: var(--bg-light);
            border-radius: 3px;
        }

        .dam-tabs::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .dam-tabs::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        .dam-tab {
            padding: 8px 16px;
            border-radius: var(--radius-small);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            border: none;
            background: transparent;
        }

        .dam-tab.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 2px 4px rgba(51, 102, 204, 0.2);
        }

        .dam-tab:hover:not(.active) {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        /* 大坝卡片样式 - 图片名称左右排列 */
        .dam-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-medium);
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: fit-content;
            flex-shrink: 0;
            position: relative;
            box-shadow: var(--shadow-light);
            height: 60px;
        }

        .dam-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-medium);
            transform: translateY(-1px);
        }

        .dam-card.active {
            border-color: var(--primary-color);
            background: var(--primary-light);
            box-shadow: 0 4px 12px rgba(51, 102, 204, 0.3);
        }

        .dam-card.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--primary-color);
            border-radius: 3px 0 0 3px;
        }

        .dam-card-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--bg-light);
            color: var(--primary-color);
            border-radius: 50%;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .dam-card.active .dam-card-image {
            background: var(--primary-color);
            color: white;
        }

        .dam-card-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            line-height: 1.4;
        }

        .dam-card.active .dam-card-name {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 核心指标区域 */
        .core-metrics {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: nowrap;
            margin-left: 24px;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-light);
            border-radius: var(--radius-small);
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .metric-icon {
            font-size: 14px;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .metric-value {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .metric-label {
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        /* 主内容区域 - 调整为上下布局 */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 新增内容区域容器 */
        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            align-items: start;
        }

        /* 左侧内容区域 */
        .left-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 大坝图片区域样式优化 */
        .overview-card .section-header {
            margin-bottom: 16px;
        }

        .overview-card .section-content {
            padding: 0;
        }

        #overviewTitle {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-medium);
            background: var(--bg-light);
            transition: all 0.3s ease;
        }

        #overviewTitle:hover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        /* 左侧表单区域 */
        .form-section {
            background: var(--bg-white);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-light);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary-color);
        }

        .section-actions {
            display: flex;
            gap: 8px;
        }

        .section-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-white);
            color: var(--text-secondary);
            border-radius: var(--radius-small);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .section-btn.primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .section-btn.primary:hover {
            background: #2952a3;
        }

        /* 表单内容区域 */
        .section-content {
            padding: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-label.required::before {
            content: '*';
            color: var(--danger-color);
            margin-right: 2px;
        }

        .form-control {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--bg-white);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(51, 102, 204, 0.2);
        }

        .form-input:disabled {
            background: var(--bg-light);
            color: var(--text-tertiary);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%233366CC' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .form-select:hover {
            border-color: var(--primary-color);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%232952a3' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(51, 102, 204, 0.1);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%233366CC' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        }

        .form-select:disabled {
            background-color: var(--bg-light);
            color: var(--text-tertiary);
            cursor: not-allowed;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23c0c4cc' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }

        /* 大坝图片上传 - 概览区域 */
        .overview-image-upload {
            position: relative;
            width: 80px;
            height: 60px;
            margin-right: 12px;
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-medium);
            background: var(--bg-light);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 大图片上传区域样式 */
        .overview-image-upload.large-upload {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 300px;
            margin: 0;
            border: 3px dashed var(--border-light);
            border-radius: var(--radius-large);
            background: var(--bg-white);
        }

        .overview-image-upload.large-upload:hover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        .overview-image-upload:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(51, 102, 204, 0.15);
        }

        .overview-image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-small);
        }

        .overview-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--text-tertiary);
            font-size: 20px;
        }

        .overview-image-upload input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .overview-image-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--danger-color);
            border: none;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .overview-image-upload.has-image .overview-image-remove {
            display: flex;
        }

        .overview-image-remove:hover {
            background: var(--danger-color);
            color: white;
            transform: scale(1.1);
        }

        /* 大图片上传区域的删除按钮 */
        .overview-image-upload.large-upload .overview-image-remove {
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            font-size: 18px;
        }

        /* 台账记录表格样式 - 参考标准样式 */
        .records-table-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .records-table-header {
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
        }

        .records-table-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr 1fr 1.5fr 1fr 0.8fr;
            gap: 0;
            align-items: center;
        }

        .records-table-row.inspection-columns {
            grid-template-columns: 1fr 1.2fr 1.5fr 1fr 0.8fr;
        }

        .records-table-cell {
            padding: 16px 12px;
            font-size: 14px;
            color: var(--text-primary);
            border-right: 1px solid var(--border-light);
            text-align: left;
            line-height: 1.4;
        }

        .records-table-header .records-table-cell {
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-light);
        }

        .records-table-cell:last-child {
            border-right: none;
            text-align: center;
            padding: 12px 8px;
            overflow: visible;
        }

        .records-table-body .records-table-row {
            border-bottom: 1px solid var(--border-light);
            transition: background-color 0.2s ease;
        }

        .records-table-body .records-table-row:hover {
            background: var(--primary-light);
        }

        .records-table-body .records-table-row:last-child {
            border-bottom: none;
        }

        .records-table-cell .file-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .records-table-cell .file-attachment:hover {
            color: #2952a3;
        }

        .records-table-cell .file-attachment i {
            font-size: 16px;
        }

        /* 操作按钮容器样式 - 确保按钮不被割掉 */
        .record-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            padding: 0 4px;
            margin: 0 -2px;
        }

        /* 操作按钮基础样式 */
        .record-action-btn {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            padding: 0 4px;
            margin: 0 -2px;
        }

        .record-action-btn {
            padding: 6px 8px;
            border: none;
            border-radius: var(--radius-small);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 3px;
            min-width: auto;
            width: auto;
            white-space: nowrap;
            overflow: visible;
        }

        .record-action-btn.edit {
            background: var(--primary-color);
            color: white;
        }

        .record-action-btn.edit:hover {
            background: #2952a3;
        }

        .record-action-btn.delete {
            background: var(--danger-color);
            color: white;
        }

        .record-action-btn.delete:hover {
            background: #d63031;
        }

        .no-records-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }

        .no-records-message i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-records-message p {
            font-size: 16px;
            margin: 0;
        }

        /* 新增记录表单样式 */
        .record-form-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .record-form-content {
            background: white;
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-medium);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .record-form-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-form-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .record-form-body {
            padding: 24px;
        }

        .record-form-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 表单网格样式 */
        .record-form-body .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: start;
        }

        /* 优化表单组布局 - 左右分布 */
        .record-form-body .form-group {
            margin-bottom: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .record-form-body .form-group.full-width {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .record-form-body .form-group.full-width .form-label {
            margin-bottom: 8px;
            width: 100%;
        }

        .record-form-body .form-label {
            margin-bottom: 0;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            min-width: 100px;
            max-width: 120px;
            text-align: right;
            flex-shrink: 0;
        }

        .record-form-body .form-control {
            flex: 1;
            min-width: 0;
        }

        /* 台账记录管理区域样式 */
        .records-tabs-container {
            background: var(--bg-white);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-light);
            overflow: hidden;
            margin-top: 16px;
        }

        .records-tabs-header {
            display: flex;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
        }

        .records-tab {
            flex: 1;
            padding: 16px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        .records-tab:hover {
            color: var(--primary-color);
            background: rgba(51, 102, 204, 0.05);
        }

        .records-tab.active {
            color: var(--primary-color);
            background: white;

        // 更新概览信息 - 仅保留图片上传和显示

            // 仅显示图片上传区域 - 大图片区域

                <div class="overview-image-upload large-upload ${dam.damImage ? 'has-image' : ''}" onclick="document.getElementById('overviewImageInput').click()">

            `;

            document.getElementById('overviewExtra').innerHTML = '';

        // 处理概览图片上传
        function handleOverviewImageUpload(input) {
            const file = input.files[0];
            if (file) {
                // 文件大小检查 (5MB限制)
                if (file.size > 5 * 1024 * 1024) {
                    showMessage('图片大小不能超过5MB', 'error');
                    return;
                }

                // 文件类型检查
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    showMessage('请上传 JPG、PNG 或 GIF 格式的图片', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const dam = dams.find(d => d.id === currentDamId);
                    if (dam) {
                        dam.damImage = e.target.result;
                        updateOverview(dam);
                        showMessage('大坝图片上传成功', 'success');
                    }
                };
                reader.onerror = function() {
                    showMessage('图片上传失败，请重试', 'error');
                };
                reader.readAsDataURL(file);
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveData();
                }
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    printPage();
                }
            });

            // 表单变化监听
            document.addEventListener('input', function(e) {
                if (e.target.classList.contains('form-input')) {
                    // 实时更新查看模式内容
                    const viewElement = e.target.parentElement.querySelector('.view-content');
                    if (viewElement) {
                        viewElement.textContent = e.target.value;
                    }
                }
            });

            // 大坝卡片横向滚动支持
            const damTabsContainer = document.getElementById('damTabs');
            if (damTabsContainer) {
                // 鼠标滚轮横向滚动
                damTabsContainer.addEventListener('wheel', function(e) {
                    if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) {
                        e.preventDefault();
                        this.scrollLeft += e.deltaY;
                    }
                });

                // 触摸滑动支持
                let isDown = false;
                let startX;
                let scrollLeft;

                damTabsContainer.addEventListener('mousedown', function(e) {
                    isDown = true;
                    startX = e.pageX - this.offsetLeft;
                    scrollLeft = this.scrollLeft;
                    this.style.cursor = 'grabbing';
                });

                damTabsContainer.addEventListener('mouseleave', function() {
                    isDown = false;
                    this.style.cursor = 'grab';
                });

                damTabsContainer.addEventListener('mouseup', function() {
                    isDown = false;
                    this.style.cursor = 'grab';
                });

                damTabsContainer.addEventListener('mousemove', function(e) {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - this.offsetLeft;
                    const walk = (x - startX) * 2; // 滑动速度
                    this.scrollLeft = scrollLeft - walk;
                });

                // 设置初始光标
                damTabsContainer.style.cursor = 'grab';
            }
        }

        // 文件选择处理函数
        function handleFileSelect(input, type) {
            const files = Array.from(input.files);
            const containerId = type === 'registration' ? 'registrationSelectedFiles' : 'inspectionSelectedFiles';
            const container = document.getElementById(containerId);

            container.innerHTML = '';

            if (files.length > 0) {
                const filesList = document.createElement('div');
                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'selected-file-item';
                    fileItem.innerHTML = `
                        <span class="selected-file-name">${file.name}</span>
                        <span class="selected-file-remove" onclick="removeSelectedFile('${containerId}', ${index})" title="移除文件">
                            <i class="fas fa-times"></i>
                        </span>
                    `;
                    filesList.appendChild(fileItem);
                });
                container.appendChild(filesList);
            }
        }

        // 移除选中的文件
        function removeSelectedFile(containerId, index) {
            const container = document.getElementById(containerId);
            const input = container.parentElement.querySelector('input[type="file"]');
            const files = Array.from(input.files);

            files.splice(index, 1);

            // 创建新的FileList
            const dataTransfer = new DataTransfer();
            files.forEach(file => dataTransfer.items.add(file));
            input.files = dataTransfer.files;

            // 重新渲染文件列表
            handleFileSelect(input, containerId.includes('registration') ? 'registration' : 'inspection');
        }

        // 拖拽上传功能
        function setupDragAndDrop() {
            const uploadContainers = document.querySelectorAll('.file-upload-container');

            uploadContainers.forEach(container => {
                container.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    container.classList.add('dragover');
                });

                container.addEventListener('dragleave', () => {
                    container.classList.remove('dragover');
                });

                container.addEventListener('drop', (e) => {
                    e.preventDefault();
                    container.classList.remove('dragover');

                    const files = Array.from(e.dataTransfer.files);
                    const input = container.querySelector('input[type="file"]');

                    // 合并文件
                    const existingFiles = Array.from(input.files);
                    const newFiles = [...existingFiles, ...files];

                    const dataTransfer = new DataTransfer();
                    newFiles.forEach(file => dataTransfer.items.add(file));
                    input.files = dataTransfer.files;

                    // 触发change事件
                    input.dispatchEvent(new Event('change'));
                });
            });
        }

            for (let i = 0; i < recordCount; i++) {
                const year = 2020 + Math.floor(Math.random() * 4); // 2020-2023年

                };

        // 收集表单数据
        function collectFormData(dam) {
            // 获取所有表单组
            const formGroups = document.querySelectorAll('.form-group');

            formGroups.forEach(group => {
                const label = group.querySelector('.form-label').textContent.trim();
                const input = group.querySelector('.form-input');
                const select = group.querySelector('.form-select');

                if (input || select) {
                    const field = input || select;
                    const value = field.value.trim();

                    // 根据标签文本映射到对应的dam属性
                    switch(label) {
                        case '大坝名称':
                            dam.name = value;
                            break;
                        case '大坝编号':
                            dam.code = value;
                            break;
                        case '所属单位':
                            // 处理下拉选择
                            const unitMap = {
                                'unit1': 'XX水电公司',
                                'unit2': 'YY水电集团',
                                'unit3': 'ZZ电力'
                            };
                            dam.unit = unitMap[value] || value;
                            break;
                        case '坝型':
                            const damTypeMap = {
                                'earth': '土石坝',
                                'gravity': '重力坝',
                                'arch': '拱坝',
                                'panel': '面板堆石坝'
                            };
                            dam.damType = damTypeMap[value] || value;
                            break;
                        case '工程等别':
                            const gradeMap = {
                                'large1': '大(1)型',
                                'large2': '大(2)型',
                                'medium': '中型'
                            };
                            dam.projectGrade = gradeMap[value] || value;
                            break;
                        case '坝高(m)':
                            dam.damHeight = parseFloat(value) || 0;
                            break;
                        case '库容(万m³)':
                            dam.capacity = parseFloat(value) || 0;
                            break;
                        case '建成时间':
                            dam.buildDate = value;
                            break;
                        case '管理责任人':
                            dam.manager = value;
                            break;
                        case '联系方式':
                            dam.phone = value;
                            break;
                        case '地理位置':
                            dam.location = value;
                            break;
                        case '省份':
                            dam.province = value;
                            break;
                        case '运行单位':
                            dam.operatingUnit = value;
                            break;
                        case '装机(MW)':
                            dam.installedCapacity = parseFloat(value) || 0;
                            break;
                        case '竣工时间':
                            dam.completionDate = value;
                            break;
                        case '蓄水时间':
                            dam.impoundmentDate = value;
                            break;
                        case '地理位置':
                            dam.location = value;
                            break;
                        case '坐标信息':
                            dam.coordinates = value;
                            break;
                    }
                }
            });

            // 更新计算字段
            dam.completionRate = calculateCompletionRate(dam);
            dam.dataIntegrity = calculateDataIntegrity(dam);
        }

        // 计算完成率
        function calculateCompletionRate(dam) {
            let completedFields = 0;
            let totalFields = 0;

            const requiredFields = ['name', 'unit', 'damType', 'projectGrade', 'buildDate'];
            const optionalFields = ['code', 'damHeight', 'capacity', 'installedCapacity', 'province', 'operatingUnit', 'completionDate', 'impoundmentDate', 'manager', 'phone', 'location', 'coordinates', 'damImage'];

            // 检查必填字段
            requiredFields.forEach(field => {
                totalFields++;
                if (dam[field] && dam[field].toString().trim() !== '') {
                    completedFields++;
                }
            });

            // 检查可选字段
            optionalFields.forEach(field => {
                totalFields++;
                if (dam[field] && dam[field].toString().trim() !== '') {
                    completedFields++;
                }
            });

            return Math.round((completedFields / totalFields) * 100);
        }

        // 计算数据完整性
        function calculateDataIntegrity(dam) {
            // 基于完成率和其他因素计算数据完整性
            let integrity = dam.completionRate;

            // 如果有联系方式，增加完整性
            if (dam.phone && dam.phone.trim() !== '') {
                integrity += 5;
            }

            // 如果有坐标信息，增加完整性
            if (dam.coordinates && dam.coordinates.trim() !== '') {
                integrity += 5;
            }

            return Math.min(integrity, 100);
        }

        // 表单验证
        function validateForm() {
            const requiredFields = document.querySelectorAll('.required');
            let isValid = true;

            requiredFields.forEach(label => {
                const input = label.closest('.form-group').querySelector('.form-input');
                if (input && !input.value.trim()) {
                    input.style.borderColor = 'var(--danger-color)';
                    isValid = false;
                } else if (input) {
                    input.style.borderColor = 'var(--border-color)';
                }
            });

            if (!isValid) {
                showMessage('请填写所有必填字段', 'error');
            }

            return isValid;
        }

        function saveRegistrationRecord() {
            const type = document.getElementById('registrationType').value;
            const grade = document.getElementById('registrationGrade').value;
            const date = document.getElementById('registrationDate').value;
            const status = document.getElementById('registrationStatus').value;
            const number = document.getElementById('registrationNumber').value;
            const attachments = document.getElementById('registrationAttachments').files;

            if (!type || !grade || !date) {
                showMessage('请填写必填项', 'error');
                return;
            }

            const currentDam = dams.find(d => d.id === currentDamId);
            if (!currentDam.registrationRecords) {
                currentDam.registrationRecords = [];
            }

            const record = {
                id: Date.now(),
                type: type,
                grade: grade,
                date: date,
                status: status,
                number: number,
                attachments: []
            };

            // 处理文件上传
            if (attachments.length > 0) {
                Array.from(attachments).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        record.attachments.push({
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            data: e.target.result
                        });
                    };
                    reader.readAsDataURL(file);
                });
            }

            currentDam.registrationRecords.push(record);
            renderRegistrationRecords();
            closeRegistrationModal();
            showMessage('注册备案记录保存成功', 'success');
        }

                        <div class="file-upload-container" onclick="document.getElementById('registrationAttachments').click()">
                            <input type="file" class="file-input-hidden" id="registrationAttachments" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="handleFileSelect(this, 'registration')">
                            <div class="file-upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                            <div class="file-upload-text">点击或拖拽文件到此处上传</div>
                            <div class="file-upload-format">支持 PDF、Word、图片格式文件</div>
                        </div>
                        <div class="selected-files" id="registrationSelectedFiles"></div>
                    </div>
                </div>
            </div>
            <div class="record-form-footer">
                <button class="section-btn" onclick="closeRegistrationModal()">取消</button>
                <button class="section-btn primary" onclick="saveRegistrationRecord()">保存</button>
            </div>
        </div>
    </div>

    <!-- 定期检查记录模态框 -->
    <div class="record-form-modal" id="inspectionModal" style="display: none;">
        <div class="record-form-content">
            <div class="record-form-header">
                <div class="record-form-title">定期检查记录</div>
                <button class="record-action-btn" onclick="closeInspectionModal()" style="background: none; border: none; font-size: 20px;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="record-form-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label required">定检次数</label>
                        <div class="form-control">
                            <select class="form-select" id="inspectionNumber">
                                <option value="">请选择定检次数</option>
                                <option value="第一次">第一次</option>
                                <option value="第二次">第二次</option>
                                <option value="第三次">第三次</option>
                                <option value="第四次">第四次</option>
                                <option value="第五次">第五次</option>
                                <option value="第六次">第六次</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label required">审查结束时间</label>
                        <div class="form-control">
                            <input type="date" class="form-input" id="inspectionEndDate">
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">定检结论</label>
                        <div class="form-control">
                            <select class="form-select" id="inspectionConclusion">
                                <option value="">请选择定检结论</option>
                                <option value="正常坝（A级）">正常坝（A级）</option>
                                <option value="病坝（B级）">病坝（B级）</option>
                                <option value="险坝（C级）">险坝（C级）</option>
                                <option value="需要进一步检查">需要进一步检查</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">附件</label>
                        <div class="file-upload-container" onclick="document.getElementById('inspectionAttachments').click()">
                            <input type="file" class="file-input-hidden" id="inspectionAttachments" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="handleFileSelect(this, 'inspection')">
                            <div class="file-upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                            <div class="file-upload-text">点击或拖拽文件到此处上传</div>
                            <div class="file-upload-format">支持 PDF、Word、图片格式文件</div>
                        </div>
                        <div class="selected-files" id="inspectionSelectedFiles"></div>
                    </div>
                </div>
            </div>
            <div class="record-form-footer">
                <button class="section-btn" onclick="closeInspectionModal()">取消</button>
                <button class="section-btn primary" onclick="saveInspectionRecord()">保存</button>
            </div>
        </div>
    </div>
</body>
</html>
