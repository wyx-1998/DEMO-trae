<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全会议管理系统</title>
    <!-- Element Plus -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3366CC;
            --primary-light: #5a7fd4;
            --primary-dark: #2952a3;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-primary: #303133;
            --text-secondary: #606266;
            --border-color: #dcdfe6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(51, 102, 204, 0.15);
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 400;
        }

        .search-form {
            background: var(--card-bg);
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .button-group {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .custom-button {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            padding: 10px 20px;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(51, 102, 204, 0.3);
        }

        .btn-danger {
            background: #f56c6c;
            color: white;
            padding: 10px 20px;
        }

        .btn-danger:hover {
            background: #f04747;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 108, 108, 0.3);
        }

        .btn-success {
            background: #67c23a;
            color: white;
            padding: 10px 20px;
        }

        .btn-success:hover {
            background: #5daf34;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(103, 194, 58, 0.3);
        }

        .data-table {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .el-table {
            border-radius: 12px;
        }

        .el-table th {
            background-color: #fafbfc;
            color: var(--text-primary);
            font-weight: 600;
        }

        .el-table td {
            border-bottom: 1px solid #f0f2f5;
        }

        .el-table tr:hover {
            background-color: #f8f9ff;
        }

        .status-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }

        .status-ongoing {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }

        .status-completed {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }

        .operation-btn {
            padding: 6px 12px;
            margin: 0 4px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view {
            background: #e6f7ff;
            color: #1890ff;
        }

        .btn-view:hover {
            background: #bae7ff;
            transform: scale(1.05);
        }

        .btn-edit {
            background: #fff7e6;
            color: #fa8c16;
        }

        .btn-edit:hover {
            background: #ffd591;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #fff2f0;
            color: #ff4d4f;
        }

        .btn-delete:hover {
            background: #ffccc7;
            transform: scale(1.05);
        }

        .btn-qr {
            background: #f6ffed;
            color: #52c41a;
        }

        .btn-qr:hover {
            background: #d9f7be;
            transform: scale(1.05);
        }

        .pagination-wrapper {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .el-form-item {
            margin-bottom: 18px;
        }

        .el-input, .el-select, .el-date-picker {
            border-radius: 8px;
        }

        .el-button {
            border-radius: 8px;
            font-weight: 500;
        }

        .el-button--primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .el-button--primary:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-light);
        }

        .meeting-level {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .level-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .level-company { background: #ff4d4f; }
        .level-department { background: #fa8c16; }
        .level-team { background: #52c41a; }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            
            .page-header {
                padding: 20px;
            }
            
            .page-title {
                font-size: 24px;
            }
            
            .search-form {
                padding: 16px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .custom-button {
                width: 100%;
                justify-content: center;
            }
        }

        [v-cloak] {
            display: none;
        }

        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div class="container">
            <!-- 页面头部 -->
            <div class="page-header">
                <div class="page-title">
                    <i class="fas fa-users"></i>
                    安全会议管理
                </div>
                <div class="page-subtitle">
                    企业安全会议的创建、管理与参会人员签到系统
                </div>
            </div>

            <!-- 功能按钮组 -->
            <div class="button-group">
                <button class="custom-button btn-primary" @click="handleCreate">
                    <i class="fas fa-plus"></i>
                    新建安全会议
                </button>
                <button class="custom-button btn-danger" @click="handleBatchDelete" :disabled="multipleSelection.length === 0">
                    <i class="fas fa-trash"></i>
                    批量删除 ({{ multipleSelection.length }})
                </button>
                <button class="custom-button btn-success" @click="handleExport">
                    <i class="fas fa-download"></i>
                    导出会议记录
                </button>
            </div>

            <!-- 搜索表单 -->
            <div class="search-form">
                <el-form :model="searchForm" ref="searchFormRef" :inline="true">
                    <template v-for="(field, index) in visibleSearchFields" :key="field.prop">
                        <el-form-item :label="field.label">
                            <el-input 
                                v-if="field.type === 'input'"
                                v-model="searchForm[field.prop]"
                                :placeholder="'请输入' + field.label"
                                clearable
                                style="width: 200px;">
                            </el-input>
                            <el-select
                                v-if="field.type === 'select'"
                                v-model="searchForm[field.prop]"
                                :placeholder="'请选择' + field.label"
                                clearable
                                style="width: 200px;">
                                <el-option
                                    v-for="item in field.options"
                                    :key="item.value"
                                    :label="item.label"
                                    :value="item.value">
                                </el-option>
                            </el-select>
                            <el-date-picker
                                v-if="field.type === 'daterange'"
                                v-model="searchForm[field.prop]"
                                type="datetimerange"
                                range-separator="至"
                                start-placeholder="开始时间"
                                end-placeholder="结束时间"
                                format="YYYY-MM-DD HH:mm"
                                value-format="YYYY-MM-DD HH:mm:ss"
                                style="width: 350px;">
                            </el-date-picker>
                        </el-form-item>
                    </template>
                    <el-form-item>
                        <el-button type="primary" @click="handleSearch">
                            <i class="fas fa-search"></i>
                            搜索
                        </el-button>
                        <el-button @click="handleReset">
                            <i class="fas fa-redo"></i>
                            重置
                        </el-button>
                        <el-button type="text" @click="toggleSearchFields">
                            {{ isExpanded ? '收起' : '展开' }}
                            <i :class="['fas', 'fa-chevron-' + (isExpanded ? 'up' : 'down')]"></i>
                        </el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 数据表格 -->
            <div class="data-table">
                <el-table
                    :data="tableData"
                    style="width: 100%"
                    stripe
                    @selection-change="handleSelectionChange"
                    :header-cell-style="{background: '#fafbfc', color: '#303133', fontWeight: '600'}">
                    <el-table-column
                        type="selection"
                        width="55">
                    </el-table-column>
                    <el-table-column
                        prop="meetingCode"
                        label="会议编号"
                        width="180"
                        sortable>
                        <template #default="scope">
                            <span style="font-family: monospace; color: #666;">{{ scope.row.meetingCode }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column
                        prop="meetingName"
                        label="会议名称"
                        min-width="200"
                        sortable>
                        <template #default="scope">
                            <div style="font-weight: 500;">{{ scope.row.meetingName }}</div>
                        </template>
                    </el-table-column>
                    <el-table-column
                        prop="meetingType"
                        label="会议类型"
                        width="160"
                        sortable>
                    </el-table-column>
                    <el-table-column
                        prop="meetingLevel"
                        label="会议级别"
                        width="120"
                        sortable>
                        <template #default="scope">
                            <div class="meeting-level">
                                <span :class="['level-icon', getLevelClass(scope.row.meetingLevel)]"></span>
                                {{ scope.row.meetingLevel }}
                            </div>
                        </template>
                    </el-table-column>
                    <el-table-column
                        prop="meetingTime"
                        label="会议时间"
                        width="180"
                        sortable>
                        <template #default="scope">
                            <div style="font-size: 13px;">
                                <div>{{ formatDateTime(scope.row.startTime) }}</div>
                                <div style="color: #999; margin-top: 2px;">{{ formatDateTime(scope.row.endTime) }}</div>
                            </div>
                        </template>
                    </el-table-column>
                    <el-table-column
                        prop="location"
                        label="会议地点"
                        width="150">
                    </el-table-column>
                    <el-table-column
                        prop="organizer"
                        label="主持人"
                        width="120">
                    </el-table-column>
                    <el-table-column
                        prop="attendeeCount"
                        label="参会人数"
                        width="100"
                        align="center">
                        <template #default="scope">
                            <span style="color: #1890ff; font-weight: 500;">{{ scope.row.attendeeCount }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column
                        prop="signInCount"
                        label="签到人数"
                        width="100"
                        align="center">
                        <template #default="scope">
                            <span style="color: #52c41a; font-weight: 500;">{{ scope.row.signInCount }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column
                        prop="status"
                        label="状态"
                        width="100"
                        sortable>
                        <template #default="scope">
                            <span :class="['status-tag', getStatusClass(scope.row.status)]">
                                {{ getStatusText(scope.row.status) }}
                            </span>
                        </template>
                    </el-table-column>
                    <el-table-column
                        label="操作"
                        width="220"
                        fixed="right">
                        <template #default="scope">
                            <button class="operation-btn btn-view" @click="handleView(scope.row)">
                                <i class="fas fa-eye"></i>
                                查看
                            </button>
                            <button class="operation-btn btn-edit" @click="handleEdit(scope.row)">
                                <i class="fas fa-edit"></i>
                                编辑
                            </button>
                            <button class="operation-btn btn-qr" @click="handleQRCode(scope.row)">
                                <i class="fas fa-qrcode"></i>
                                签到码
                            </button>
                            <button class="operation-btn btn-delete" @click="handleDelete(scope.row)">
                                <i class="fas fa-trash"></i>
                                删除
                            </button>
                        </template>
                    </el-table-column>
                </el-table>
            </div>

            <!-- 分页 -->
            <div class="pagination-wrapper">
                <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="total">
                </el-pagination>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        createApp({
            setup() {
                // 响应式数据
                const isExpanded = ref(false);
                const searchForm = ref({});
                const tableData = ref([]);
                const multipleSelection = ref([]);
                const currentPage = ref(1);
                const pageSize = ref(10);
                const total = ref(0);
                const searchFormRef = ref(null);

                // 搜索字段配置
                const searchFields = ref([
                    { label: '会议名称', prop: 'meetingName', type: 'input' },
                    { label: '会议类型', prop: 'meetingType', type: 'select', options: [
                        { label: '年度安全工作会议', value: '年度安全工作会议' },
                        { label: '安全生产管理委员会', value: '安全生产管理委员会' },
                        { label: '安全生产会议', value: '安全生产会议' },
                        { label: '安全生产监督网络会议', value: '安全生产监督网络会议' },
                        { label: '专题会议', value: '专题会议' },
                        { label: '防汛工作例会', value: '防汛工作例会' }
                    ]},
                    { label: '会议级别', prop: 'meetingLevel', type: 'select', options: [
                        { label: '公司级', value: '公司级' },
                        { label: '部门级', value: '部门级' },
                        { label: '班组级', value: '班组级' }
                    ]},
                    { label: '会议时间', prop: 'meetingTimeRange', type: 'daterange' },
                    { label: '会议地点', prop: 'location', type: 'input' },
                    { label: '主持人', prop: 'organizer', type: 'input' },
                    { label: '状态', prop: 'status', type: 'select', options: [
                        { label: '待开始', value: 'pending' },
                        { label: '进行中', value: 'ongoing' },
                        { label: '已结束', value: 'completed' }
                    ]}
                ]);

                // 计算属性
                const visibleSearchFields = computed(() => {
                    return isExpanded.value ? searchFields.value : searchFields.value.slice(0, 4);
                });

                // 方法
                const loadData = () => {
                    // 模拟数据
                    const mockData = [
                        {
                            meetingCode: 'GTZB-AQHY-20241201-001',
                            meetingName: '2024年度安全生产工作总结会议',
                            meetingType: '年度安全工作会议',
                            meetingLevel: '公司级',
                            startTime: '2024-12-01 09:00:00',
                            endTime: '2024-12-01 11:30:00',
                            location: '总部会议室A',
                            organizer: '张安全',
                            attendeeCount: 45,
                            signInCount: 42,
                            status: 'completed'
                        },
                        {
                            meetingCode: 'GTZB-AQHY-20241202-002',
                            meetingName: '安全生产管理委员会季度例会',
                            meetingType: '安全生产管理委员会',
                            meetingLevel: '公司级',
                            startTime: '2024-12-02 14:00:00',
                            endTime: '2024-12-02 16:00:00',
                            location: '总部会议室B',
                            organizer: '李主任',
                            attendeeCount: 25,
                            signInCount: 23,
                            status: 'ongoing'
                        },
                        {
                            meetingCode: 'GTZB-AQHY-20241203-003',
                            meetingName: '生产车间安全培训会议',
                            meetingType: '安全生产会议',
                            meetingLevel: '部门级',
                            startTime: '2024-12-03 10:00:00',
                            endTime: '2024-12-03 12:00:00',
                            location: '生产车间会议室',
                            organizer: '王班长',
                            attendeeCount: 18,
                            signInCount: 0,
                            status: 'pending'
                        },
                        {
                            meetingCode: 'GTZB-AQHY-20241204-004',
                            meetingName: '防汛应急预案讨论会',
                            meetingType: '防汛工作例会',
                            meetingLevel: '部门级',
                            startTime: '2024-12-04 15:30:00',
                            endTime: '2024-12-04 17:00:00',
                            location: '应急指挥中心',
                            organizer: '陈经理',
                            attendeeCount: 12,
                            signInCount: 0,
                            status: 'pending'
                        },
                        {
                            meetingCode: 'GTZB-AQHY-20241205-005',
                            meetingName: '班组安全学习交流会',
                            meetingType: '专题会议',
                            meetingLevel: '班组级',
                            startTime: '2024-12-05 08:30:00',
                            endTime: '2024-12-05 10:00:00',
                            location: '班组活动室',
                            organizer: '刘组长',
                            attendeeCount: 8,
                            signInCount: 0,
                            status: 'pending'
                        }
                    ];
                    
                    total.value = mockData.length;
                    tableData.value = mockData;
                };

                const handleSelectionChange = (val) => {
                    multipleSelection.value = val;
                };

                const handleCreate = () => {
                    ElMessage.success('跳转到新建安全会议页面');
                };

                const handleBatchDelete = () => {
                    if (multipleSelection.value.length === 0) {
                        ElMessage.warning('请选择要删除的会议');
                        return;
                    }
                    ElMessageBox.confirm(
                        `确定要删除选中的 ${multipleSelection.value.length} 个会议吗？`,
                        '批量删除确认',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning',
                        }
                    ).then(() => {
                        ElMessage.success('批量删除成功');
                        loadData();
                    }).catch(() => {
                        ElMessage.info('已取消删除');
                    });
                };

                const handleExport = () => {
                    ElMessage.success('正在导出会议记录...');
                };

                const handleView = (row) => {
                    ElMessage.info(`查看会议：${row.meetingName}`);
                };

                const handleEdit = (row) => {
                    ElMessage.info(`编辑会议：${row.meetingName}`);
                };

                const handleQRCode = (row) => {
                    ElMessage.success(`生成签到二维码：${row.meetingName}`);
                };

                const handleDelete = (row) => {
                    ElMessageBox.confirm(
                        `确定要删除会议"${row.meetingName}"吗？`,
                        '删除确认',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning',
                        }
                    ).then(() => {
                        ElMessage.success('删除成功');
                        loadData();
                    }).catch(() => {
                        ElMessage.info('已取消删除');
                    });
                };

                const handleSearch = () => {
                    console.log('搜索条件：', searchForm.value);
                    currentPage.value = 1;
                    loadData();
                    ElMessage.success('搜索完成');
                };

                const handleReset = () => {
                    if (searchFormRef.value) {
                        searchFormRef.value.resetFields();
                    }
                    Object.keys(searchForm.value).forEach(key => {
                        searchForm.value[key] = '';
                    });
                    handleSearch();
                };

                const toggleSearchFields = () => {
                    isExpanded.value = !isExpanded.value;
                };

                const handleSizeChange = (val) => {
                    pageSize.value = val;
                    loadData();
                };

                const handleCurrentChange = (val) => {
                    currentPage.value = val;
                    loadData();
                };

                const getLevelClass = (level) => {
                    const levelMap = {
                        '公司级': 'level-company',
                        '部门级': 'level-department',
                        '班组级': 'level-team'
                    };
                    return levelMap[level] || 'level-company';
                };

                const getStatusClass = (status) => {
                    const statusMap = {
                        'pending': 'status-pending',
                        'ongoing': 'status-ongoing',
                        'completed': 'status-completed'
                    };
                    return statusMap[status] || 'status-pending';
                };

                const getStatusText = (status) => {
                    const statusMap = {
                        'pending': '待开始',
                        'ongoing': '进行中',
                        'completed': '已结束'
                    };
                    return statusMap[status] || '未知';
                };

                const formatDateTime = (dateTimeStr) => {
                    if (!dateTimeStr) return '';
                    const date = new Date(dateTimeStr);
                    return date.toLocaleString('zh-CN', {
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                };

                // 初始化
                onMounted(() => {
                    // 初始化搜索表单
                    searchFields.value.forEach(field => {
                        searchForm.value[field.prop] = '';
                    });
                    loadData();
                });

                return {
                    isExpanded,
                    searchForm,
                    searchFormRef,
                    tableData,
                    multipleSelection,
                    currentPage,
                    pageSize,
                    total,
                    searchFields,
                    visibleSearchFields,
                    handleSelectionChange,
                    handleCreate,
                    handleBatchDelete,
                    handleExport,
                    handleView,
                    handleEdit,
                    handleQRCode,
                    handleDelete,
                    handleSearch,
                    handleReset,
                    toggleSearchFields,
                    handleSizeChange,
                    handleCurrentChange,
                    getLevelClass,
                    getStatusClass,
                    getStatusText,
                    formatDateTime
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
