<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 国投集团智能安全生产管理系统</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: url('assets/login-bg.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            z-index: 1;
        }

        /* 顶部导航 */
        .login-header {
            position: relative;
            z-index: 10;
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .logo i {
            font-size: 32px;
            color: #FF6B35;
        }

        .logo span {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* 主体区域 */
        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .login-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            gap: 100px;
        }

        /* 左侧品牌区 */
        .brand-area {
            flex: 1;
            color: #fff;
        }

        .brand-slogan {
            font-size: 56px;
            font-weight: 300;
            line-height: 1.4;
            letter-spacing: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .brand-slogan .highlight {
            display: block;
            margin-top: 10px;
            margin-left: 80px;
        }

        /* 复选框主色 */
        .el-checkbox__input.is-checked .el-checkbox__inner {
            background-color: #3366CC;
            border-color: #3366CC;
        }

        .el-checkbox__input.is-checked+.el-checkbox__label {
            color: #3366CC;
        }

        /* 右侧登录卡片 */
        .login-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Tab切换 */
        .login-tabs {
            display: flex;
            border-bottom: 1px solid #E4E7ED;
            margin-bottom: 30px;
        }

        .login-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
        }

        .login-tab:hover {
            color: #3366CC;
        }

        .login-tab.active {
            color: #3366CC;
            font-weight: 600;
            border-bottom-color: #3366CC;
        }

        /* 表单面板 */
        .login-panel {
            display: none;
        }

        .login-panel.active {
            display: block;
        }

        /* 表单项 */
        .form-item {
            margin-bottom: 24px;
        }

        .form-item .el-input__wrapper {
            padding: 0 15px;
            height: 48px;
            border-radius: 8px;
        }

        .form-item .el-input__inner {
            height: 48px;
            font-size: 14px;
        }

        .form-item .el-input__prefix {
            font-size: 18px;
            color: #909399;
        }

        /* 验证码行 */
        .captcha-row {
            display: flex;
            gap: 12px;
        }

        .captcha-row .el-input {
            flex: 1;
        }

        .captcha-img {
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #DCDFE6;
        }

        .captcha-img:hover {
            border-color: #3366CC;
        }

        /* 短信验证码 */
        .sms-row {
            display: flex;
            gap: 12px;
        }

        .sms-row .el-input {
            flex: 1;
        }

        .sms-btn {
            width: 120px;
            height: 48px;
            border-radius: 8px;
        }

        /* 记住密码和忘记密码 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .forget-link {
            color: #3366CC;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .forget-link:hover {
            text-decoration: underline;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            height: 50px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            background: linear-gradient(135deg, #3366CC 0%, #5588EE 100%);
            border: none;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(51, 102, 204, 0.4);
        }





        /* 忘记密码弹窗样式 */
        .el-dialog {
            border-radius: 12px;
            overflow: hidden;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            margin: 0 !important;
        }

        .el-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .el-overlay .el-dialog {
            margin: 0 !important;
        }

        .el-dialog__header {
            background: #fff;
            padding: 20px 24px;
            margin: 0;
            border-bottom: none;
        }

        .el-dialog__title {
            color: #1F1F1F;
            font-size: 18px;
            font-weight: 600;
        }

        .el-dialog__headerbtn {
            top: 20px;
            right: 20px;
        }

        .el-dialog__headerbtn .el-dialog__close {
            color: #909399;
            font-size: 20px;
        }

        .el-dialog__headerbtn:hover .el-dialog__close {
            color: #303133;
        }

        .el-dialog__body {
            padding: 20px 40px 30px;
        }

        .el-dialog__footer {
            padding: 0 40px 30px;
            border-top: none;
        }

        .forget-input {
            margin-bottom: 16px;
        }

        .forget-input .el-input__wrapper {
            height: 48px;
            border-radius: 8px;
            padding: 0 15px;
        }

        .forget-code-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .forget-code-row .el-input {
            flex: 1;
        }

        .forget-code-row .el-input__wrapper {
            height: 48px;
            border-radius: 8px;
            padding: 0 15px;
        }

        .forget-code-btn {
            height: 48px;
            padding: 0 20px;
            border-radius: 8px;
            background: #3366CC;
            border-color: #3366CC;
            color: #fff !important;
            font-size: 14px;
        }

        .forget-code-btn:hover {
            background: #4477DD;
            border-color: #4477DD;
            color: #fff !important;
        }

        .forget-code-btn:disabled {
            background: #a0cfff;
            border-color: #a0cfff;
            color: #fff !important;
        }

        .reset-btn {
            width: 100%;
            height: 48px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            background: #3366CC;
            border: none;
        }

        .reset-btn:hover {
            background: #4477DD;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .login-content {
                flex-direction: column;
                gap: 50px;
            }

            .brand-area {
                text-align: center;
            }

            .brand-slogan {
                font-size: 42px;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                width: 100%;
                padding: 30px 20px;
            }

            .brand-slogan {
                font-size: 32px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="login-container">
            <!-- 顶部Logo -->
            <header class="login-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>国投集团智能安全生产管理系统</span>
                </div>
            </header>

            <!-- 主体区域 -->
            <main class="login-main">
                <div class="login-content">
                    <!-- 左侧品牌区 -->
                    <div class="brand-area">
                        <h1 class="brand-slogan">
                            安天下
                            <span class="highlight">智无疆</span>
                        </h1>
                    </div>

                    <!-- 右侧登录卡片 -->
                    <div class="login-card">
                        <!-- Tab切换 -->
                        <div class="login-tabs">
                            <button class="login-tab" :class="{ active: activeTab === 'account' }"
                                @click="activeTab = 'account'">
                                账号登录
                            </button>
                            <button class="login-tab" :class="{ active: activeTab === 'sms' }"
                                @click="activeTab = 'sms'">
                                短信登录
                            </button>

                        </div>

                        <!-- 账号登录 -->
                        <div class="login-panel" :class="{ active: activeTab === 'account' }">
                            <el-form :model="accountForm" :rules="accountRules" ref="accountFormRef">
                                <el-form-item prop="username" class="form-item">
                                    <el-input v-model="accountForm.username" placeholder="请输入用户名/手机号" size="large">
                                        <template #prefix>
                                            <i class="fas fa-user"></i>
                                        </template>
                                    </el-input>
                                </el-form-item>

                                <el-form-item prop="password" class="form-item">
                                    <el-input v-model="accountForm.password" type="password" placeholder="请输入密码"
                                        size="large" show-password>
                                        <template #prefix>
                                            <i class="fas fa-lock"></i>
                                        </template>
                                    </el-input>
                                </el-form-item>

                                <el-form-item prop="captcha" class="form-item">
                                    <div class="captcha-row">
                                        <el-input v-model="accountForm.captcha" placeholder="请输入验证码" size="large">
                                            <template #prefix>
                                                <i class="fas fa-shield-halved"></i>
                                            </template>
                                        </el-input>
                                        <img class="captcha-img" :src="captchaUrl" @click="refreshCaptcha" alt="验证码"
                                            title="点击刷新">
                                    </div>
                                </el-form-item>

                                <div class="form-options">
                                    <el-checkbox v-model="accountForm.remember">记住密码</el-checkbox>
                                    <a class="forget-link" @click="handleForgetPassword">忘记密码？</a>
                                </div>

                                <el-button type="primary" class="login-btn" @click="handleAccountLogin"
                                    :loading="loading">
                                    登 录
                                </el-button>
                            </el-form>
                        </div>

                        <!-- 短信登录 -->
                        <div class="login-panel" :class="{ active: activeTab === 'sms' }">
                            <el-form :model="smsForm" :rules="smsRules" ref="smsFormRef">
                                <el-form-item prop="phone" class="form-item">
                                    <el-input v-model="smsForm.phone" placeholder="请输入手机号" size="large">
                                        <template #prefix>
                                            <i class="fas fa-mobile-screen"></i>
                                        </template>
                                    </el-input>
                                </el-form-item>

                                <el-form-item prop="code" class="form-item">
                                    <div class="sms-row">
                                        <el-input v-model="smsForm.code" placeholder="请输入验证码" size="large">
                                            <template #prefix>
                                                <i class="fas fa-message"></i>
                                            </template>
                                        </el-input>
                                        <el-button class="sms-btn" :disabled="smsCooldown > 0" @click="sendSmsCode">
                                            {{ smsCooldown > 0 ? `${smsCooldown}s后重发` : '获取验证码' }}
                                        </el-button>
                                    </div>
                                </el-form-item>

                                <el-button type="primary" class="login-btn" @click="handleSmsLogin" :loading="loading"
                                    style="margin-top: 50px;">
                                    登 录
                                </el-button>
                            </el-form>
                        </div>




                    </div>
                </div>
            </main>
        </div>

        <!-- 忘记密码弹窗 -->
        <el-dialog v-model="forgetDialogVisible" title="忘记密码" width="500px" :close-on-click-modal="false" align-center>
            <div class="forget-input">
                <el-input v-model="forgetForm.account" placeholder="请输入注册时使用的邮箱/手机号" size="large"></el-input>
            </div>
            <div class="forget-code-row">
                <el-input v-model="forgetForm.code" placeholder="请输入验证码" size="large"></el-input>
                <el-button class="forget-code-btn" :disabled="forgetCooldown > 0" @click="sendForgetCode">
                    <i class="fas fa-envelope" style="margin-right: 6px;"></i>
                    {{ forgetCooldown > 0 ? `${forgetCooldown}s后重发` : '获取验证码' }}
                </el-button>
            </div>
            <el-button type="primary" class="reset-btn" @click="handleResetPassword" :loading="resetLoading">
                重置密码
            </el-button>
        </el-dialog>
    </div>

    <!-- Vue3 -->
    <script src="https://unpkg.com/vue@3.3.8/dist/vue.global.prod.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.min.js"></script>

    <script>
        const { createApp, ref, reactive } = Vue;

        const app = createApp({
            setup() {
                // Tab状态
                const activeTab = ref('account');

                // 加载状态
                const loading = ref(false);

                // 验证码URL
                const captchaUrl = ref('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="48"><rect fill="%23f5f7fa" width="120" height="48"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="24" font-weight="bold" fill="%233366CC">5 4 2 0</text></svg>');

                // 账号表单
                const accountForm = reactive({
                    username: '',
                    password: '',
                    captcha: '',
                    remember: false
                });

                const accountRules = {
                    username: [
                        { required: true, message: '请输入用户名/手机号', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '请输入密码', trigger: 'blur' }
                    ],
                    captcha: [
                        { required: true, message: '请输入验证码', trigger: 'blur' }
                    ]
                };

                // 短信表单
                const smsForm = reactive({
                    phone: '',
                    code: ''
                });

                const smsRules = {
                    phone: [
                        { required: true, message: '请输入手机号', trigger: 'blur' },
                        { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号', trigger: 'blur' }
                    ],
                    code: [
                        { required: true, message: '请输入验证码', trigger: 'blur' }
                    ]
                };

                // 短信倒计时
                const smsCooldown = ref(0);

                // 刷新验证码
                const refreshCaptcha = () => {
                    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    let code = '';
                    for (let i = 0; i < 4; i++) {
                        code += chars[Math.floor(Math.random() * chars.length)] + ' ';
                    }
                    captchaUrl.value = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="48"><rect fill="%23f5f7fa" width="120" height="48"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="20" font-weight="bold" fill="%233366CC">${code.trim()}</text></svg>`;
                };

                // 发送短信验证码
                const sendSmsCode = () => {
                    if (!smsForm.phone) {
                        ElementPlus.ElMessage.warning('请先输入手机号');
                        return;
                    }
                    if (!/^1[3-9]\d{9}$/.test(smsForm.phone)) {
                        ElementPlus.ElMessage.warning('请输入正确的手机号');
                        return;
                    }

                    smsCooldown.value = 60;
                    const timer = setInterval(() => {
                        smsCooldown.value--;
                        if (smsCooldown.value <= 0) {
                            clearInterval(timer);
                        }
                    }, 1000);

                    ElementPlus.ElMessage.success('验证码已发送');
                };



                // 账号登录
                const handleAccountLogin = () => {
                    loading.value = true;
                    setTimeout(() => {
                        loading.value = false;
                        ElementPlus.ElMessage.success('登录成功');
                        // 跳转到主页
                        window.location.href = '安全管理系统.html';
                    }, 1500);
                };

                // 短信登录
                const handleSmsLogin = () => {
                    loading.value = true;
                    setTimeout(() => {
                        loading.value = false;
                        ElementPlus.ElMessage.success('登录成功');
                        window.location.href = '安全管理系统.html';
                    }, 1500);
                };

                // 忘记密码弹窗
                const forgetDialogVisible = ref(false);
                const resetLoading = ref(false);
                const forgetCooldown = ref(0);

                const forgetForm = reactive({
                    account: '',
                    code: ''
                });

                const forgetRules = {
                    account: [
                        { required: true, message: '请输入邮箱或手机号', trigger: 'blur' }
                    ],
                    code: [
                        { required: true, message: '请输入验证码', trigger: 'blur' }
                    ]
                };

                // 忘记密码
                const handleForgetPassword = () => {
                    forgetDialogVisible.value = true;
                    forgetForm.account = '';
                    forgetForm.code = '';
                };

                // 发送忘记密码验证码
                const sendForgetCode = () => {
                    if (!forgetForm.account) {
                        ElementPlus.ElMessage.warning('请先输入邮箱或手机号');
                        return;
                    }

                    forgetCooldown.value = 60;
                    const timer = setInterval(() => {
                        forgetCooldown.value--;
                        if (forgetCooldown.value <= 0) {
                            clearInterval(timer);
                        }
                    }, 1000);

                    ElementPlus.ElMessage.success('验证码已发送');
                };

                // 重置密码
                const handleResetPassword = () => {
                    if (!forgetForm.account || !forgetForm.code) {
                        ElementPlus.ElMessage.warning('请填写完整信息');
                        return;
                    }

                    resetLoading.value = true;
                    setTimeout(() => {
                        resetLoading.value = false;
                        forgetDialogVisible.value = false;
                        ElementPlus.ElMessageBox.alert('您的密码已重置为：Sdic123456@', '重置成功', {
                            confirmButtonText: '我知道了',
                            type: 'success'
                        });
                    }, 1500);
                };



                return {
                    activeTab,
                    loading,
                    captchaUrl,
                    accountForm,
                    accountRules,
                    smsForm,
                    smsRules,
                    smsCooldown,
                    forgetDialogVisible,
                    forgetForm,
                    forgetRules,
                    forgetCooldown,
                    resetLoading,
                    refreshCaptcha,
                    sendSmsCode,

                    handleAccountLogin,
                    handleSmsLogin,
                    handleForgetPassword,
                    sendForgetCode,
                    handleResetPassword,

                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>

</html>
