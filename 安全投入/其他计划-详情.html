<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投入计划管理 - 其他计划详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 表单标签右对齐，最多6字换行 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 140px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基本信息模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基本信息
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="项目编号" prop="projectCode">
                                    <el-input v-model="formData.projectCode" placeholder="请输入项目编号" :disabled="isView" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属类别" prop="category" required>
                                    <el-select v-model="formData.category" placeholder="请选择类别" :disabled="isView"
                                        style="width: 100%;">
                                        <el-option label="与安全生产直接相关的其他支出" value="与安全生产直接相关的其他支出"></el-option>
                                        <el-option label="安全科技研发" value="安全科技研发"></el-option>
                                        <el-option label="安全信息化建设" value="安全信息化建设"></el-option>
                                        <el-option label="安全文化建设" value="安全文化建设"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="项目名称" prop="projectName" required>
                                    <el-input v-model="formData.projectName" placeholder="请输入项目名称" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="项目内容" prop="projectContent" required>
                                    <el-input v-model="formData.projectContent" type="textarea" :rows="4"
                                        placeholder="请输入项目内容" :disabled="isView" :maxlength="200" show-word-limit />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="计划完成时间" prop="planDate" required>
                                    <el-date-picker v-model="formData.planDate" type="date" placeholder="请选择日期"
                                        value-format="YYYY-MM-DD" style="width: 100%;" :disabled="isView" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="计划投入费用" prop="planCost" required>
                                    <el-input v-model="formData.planCostDisplay" placeholder="请输入金额" :disabled="isView"
                                        @input="handleCostInput" @blur="formatCost">
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="责任单位" prop="responsibleUnit" required>
                                    <el-select v-model="formData.responsibleUnit" placeholder="请选择责任单位"
                                        :disabled="isView" style="width: 100%;">
                                        <el-option label="设备部" value="设备部"></el-option>
                                        <el-option label="安健环管理部" value="安健环管理部"></el-option>
                                        <el-option label="生产部" value="生产部"></el-option>
                                        <el-option label="运维部" value="运维部"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="责任人" prop="responsiblePerson" required>
                                    <el-input v-model="formData.responsiblePerson" placeholder="请输入责任人"
                                        :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="备注" prop="remark">
                                    <el-input v-model="formData.remark" type="textarea" :rows="3" placeholder="请输入备注"
                                        :disabled="isView" :maxlength="200" show-word-limit />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);

                // 页面模式
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');

                // 模块折叠状态
                const modules = ref({
                    basic: true
                });

                // 表单数据
                const formData = ref({
                    projectCode: '',
                    category: '与安全生产直接相关的其他支出',
                    projectName: '',
                    projectContent: '',
                    planDate: '',
                    planCost: 0,
                    planCostDisplay: '',
                    responsibleUnit: '设备部',
                    responsiblePerson: '张三',
                    remark: ''
                });

                // 表单验证规则
                const formRules = ref({
                    category: [{ required: true, message: '请选择所属类别', trigger: 'change' }],
                    projectName: [{ required: true, message: '请输入项目名称', trigger: 'blur' }],
                    projectContent: [{ required: true, message: '请输入项目内容', trigger: 'blur' }],
                    planDate: [{ required: true, message: '请选择计划完成时间', trigger: 'change' }],
                    planCost: [{ required: true, message: '请输入计划投入费用', trigger: 'blur' }],
                    responsibleUnit: [{ required: true, message: '请选择责任单位', trigger: 'change' }],
                    responsiblePerson: [{ required: true, message: '请输入责任人', trigger: 'blur' }]
                });

                // 格式化金额（千分号，2位小数）
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 解析金额字符串
                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                // 处理金额输入
                const handleCostInput = (value) => {
                    formData.value.planCostDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化金额显示
                const formatCost = () => {
                    const value = parseAmount(formData.value.planCostDisplay);
                    formData.value.planCost = value;
                    formData.value.planCostDisplay = formatAmount(value);
                };

                // 生成编号
                const generateCode = () => {
                    const now = new Date();
                    const dateStr = now.getFullYear().toString() +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0');
                    const randomNum = String(Math.floor(Math.random() * 9999) + 1).padStart(4, '0');
                    formData.value.projectCode = `AQTRJH-${dateStr}-${randomNum}`;
                };

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    } else {
                        generateCode();
                    }
                });

                // 加载数据
                const loadData = (id) => {
                    // 模拟数据
                    const presetData = {
                        '1': {
                            projectCode: 'AQTRJH-20260101-0003',
                            category: '与安全生产直接相关的其他支出',
                            projectName: '安全生产责任保险',
                            projectContent: '购买企业安全生产责任保险，保障员工和企业安全',
                            planDate: '2026-01-31',
                            planCost: 300000,
                            planCostDisplay: '300,000.00',
                            responsibleUnit: '安健环管理部',
                            responsiblePerson: '张三',
                            remark: ''
                        },
                        '2': {
                            projectCode: 'AQTRJH-20260101-0004',
                            category: '安全科技研发',
                            projectName: '智能安全监控系统研发',
                            projectContent: '研发基于AI的安全监控预警系统，实现隐患自动识别',
                            planDate: '2026-12-31',
                            planCost: 500000,
                            planCostDisplay: '500,000.00',
                            responsibleUnit: '设备部',
                            responsiblePerson: '李四',
                            remark: '重点科研项目'
                        }
                    };

                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };
                    } else {
                        generateCode();
                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 切换到编辑模式
                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                // 返回列表
                const goBack = () => {
                    window.location.href = '其他计划.html';
                };

                return {
                    formRef,
                    mode,
                    isView,
                    modules,
                    formData,
                    formRules,
                    toggleModule,
                    handleCostInput,
                    formatCost,
                    handleSave,
                    switchToEdit,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
