<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投入计划管理 - 安措计划</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .content-card {
            flex: 1;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .function-bar {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .function-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-area {
            padding: 20px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .search-fields {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .search-fields-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-fields-row .el-form-item {
            margin-bottom: 0;
        }

        .search-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            margin-left: 16px;
            padding-top: 2px;
        }

        .expand-btn {
            color: #409EFF;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .expand-btn:hover {
            color: #66b1ff;
        }

        .table-area {
            flex: 1;
            padding: 24px;
            overflow-x: auto;
        }

        .pagination-bar {
            padding: 16px 24px;
            background: #f8f9fa;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
        }

        .content-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <div class="content-card">
                <!-- 功能按钮区 -->
                <div class="function-bar">
                    <div class="function-left">
                        <el-button type="primary" @click="handleAdd">
                            <i class="fas fa-plus"></i> 新建
                        </el-button>
                        <el-button type="danger" @click="handleBatchDelete" :disabled="selectedRows.length === 0">
                            <i class="fas fa-trash-alt"></i> 批量删除
                        </el-button>
                        <el-button @click="handleImport">
                            <i class="fas fa-file-import"></i> 导入
                        </el-button>
                        <el-button @click="handleExport">
                            <i class="fas fa-file-export"></i> 导出
                        </el-button>
                    </div>
                </div>

                <!-- 搜索区域 -->
                <div class="search-area">
                    <el-form :model="searchForm" :inline="true">
                        <div class="search-row">
                            <div class="search-fields">
                                <!-- 第一行：3个字段 -->
                                <div class="search-fields-row">
                                    <el-form-item label="投入类别">
                                        <el-select v-model="searchForm.category" placeholder="请选择类别" clearable
                                            style="width: 160px;">
                                            <el-option label="安全标志" value="安全标志"></el-option>
                                            <el-option label="安全防护设备" value="安全防护设备"></el-option>
                                            <el-option label="安全培训" value="安全培训"></el-option>
                                            <el-option label="应急救援" value="应急救援"></el-option>
                                            <el-option label="安全检查" value="安全检查"></el-option>
                                        </el-select>
                                    </el-form-item>
                                    <el-form-item label="项目名称">
                                        <el-input v-model="searchForm.projectName" placeholder="请输入项目名称" clearable
                                            style="width: 180px;" />
                                    </el-form-item>
                                    <el-form-item label="责任单位">
                                        <el-select v-model="searchForm.responsibleUnit" placeholder="请选择责任单位" clearable
                                            style="width: 160px;">
                                            <el-option label="设备部" value="设备部"></el-option>
                                            <el-option label="安健环管理部" value="安健环管理部"></el-option>
                                            <el-option label="生产部" value="生产部"></el-option>
                                            <el-option label="运维部" value="运维部"></el-option>
                                        </el-select>
                                    </el-form-item>
                                </div>
                                <!-- 第二行：展开后显示的字段 -->
                                <div class="search-fields-row" v-show="isExpanded">
                                    <el-form-item label="责任人">
                                        <el-input v-model="searchForm.responsiblePerson" placeholder="请输入责任人" clearable
                                            style="width: 120px;" />
                                    </el-form-item>
                                    <el-form-item label="计划完成时间">
                                        <el-date-picker v-model="searchForm.planDate" type="daterange"
                                            range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
                                            value-format="YYYY-MM-DD" style="width: 260px;" />
                                    </el-form-item>
                                </div>
                            </div>
                            <!-- 按钮区域固定在右侧 -->
                            <div class="search-buttons">
                                <el-button type="primary" @click="handleSearch">
                                    <i class="fas fa-search"></i> 查询
                                </el-button>
                                <el-button @click="handleReset">
                                    <i class="fas fa-redo"></i> 重置
                                </el-button>
                                <span class="expand-btn" @click="toggleExpand">
                                    {{ isExpanded ? '收起' : '展开' }}
                                    <i :class="isExpanded ? 'fas fa-angle-up' : 'fas fa-angle-down'"></i>
                                </span>
                            </div>
                        </div>
                    </el-form>
                </div>

                <!-- 表格区域 -->
                <div class="table-area">
                    <el-table :data="pagedData" style="width: 100%" stripe border v-loading="loading"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column prop="category" label="投入类别" min-width="120"></el-table-column>
                        <el-table-column prop="projectCode" label="项目编号" min-width="160"></el-table-column>
                        <el-table-column prop="projectName" label="项目名称" min-width="180">
                            <template #default="{ row }">
                                <a href="javascript:void(0)" @click="handleView(row)"
                                    style="color: #409EFF; text-decoration: underline; cursor: pointer;">{{
                                    row.projectName }}</a>
                            </template>
                        </el-table-column>
                        <el-table-column prop="projectContent" label="项目内容" min-width="200">
                            <template #default="{ row }">
                                <el-tooltip :content="row.projectContent" placement="top" :show-after="300">
                                    <div class="content-cell">{{ row.projectContent }}</div>
                                </el-tooltip>
                            </template>
                        </el-table-column>
                        <el-table-column prop="planDate" label="计划完成时间" min-width="120"></el-table-column>
                        <el-table-column prop="planCost" label="计划投入费用（元）" min-width="150" align="right">
                            <template #default="{ row }">
                                {{ formatAmount(row.planCost) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="responsibleUnit" label="责任单位（部门）" min-width="140"></el-table-column>
                        <el-table-column prop="responsiblePerson" label="责任人" min-width="100"></el-table-column>
                        <el-table-column prop="dataSource" label="数据来源" width="120">
                            <template #default="{ row }">
                                <el-tag :type="getDataSourceType(row.dataSource)" size="small">
                                    {{ row.dataSource || '人工录入' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="120" fixed="right" align="center">
                            <template #default="{ row }">
                                <el-button size="small" @click="handleView(row)" link>
                                    <i class="fas fa-eye" style="color: #67C23A;"></i>
                                </el-button>
                                <el-button size="small" @click="handleEdit(row)" link>
                                    <i class="fas fa-edit" style="color: #409EFF;"></i>
                                </el-button>
                                <el-button size="small" @click="handleDelete(row)" link>
                                    <i class="fas fa-trash-alt" style="color: #F56C6C;"></i>
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 分页 -->
                <div class="pagination-bar">
                    <el-pagination background size="small" v-model:current-page="currentPage"
                        v-model:page-size="pageSize" :page-sizes="[10, 20, 50, 100]" :total="filteredData.length"
                        layout="total, ->, sizes, prev, pager, next, jumper" />
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        createApp({
            setup() {
                const loading = ref(false);
                const selectedRows = ref([]);
                const currentPage = ref(1);
                const pageSize = ref(20);
                const isExpanded = ref(false);

                const searchForm = ref({
                    category: '',
                    projectName: '',
                    responsibleUnit: '',
                    responsiblePerson: '',
                    planDate: null
                });

                // 切换展开/收起
                const toggleExpand = () => {
                    isExpanded.value = !isExpanded.value;
                };

                // 模拟表格数据
                const tableData = ref([
                    {
                        id: 1,
                        category: '安全标志',
                        projectCode: 'AQTRJH-20260101-0001',
                        projectName: '厂区安全警示标志更新',
                        projectContent: '对厂区内老旧安全警示标志进行全面更新，包括危险区域标识、安全通道指引等',
                        planDate: '2026-03-31',
                        planCost: 50000,
                        responsibleUnit: '设备部',
                        responsiblePerson: '张三',
                        dataSource: '人工录入'
                    },
                    {
                        id: 2,
                        category: '安全防护设备',
                        projectCode: 'AQTRJH-20260101-0002',
                        projectName: '员工个人防护装备采购',
                        projectContent: '采购安全帽、防护眼镜、防护手套等个人防护装备，确保一线员工安全',
                        planDate: '2026-02-28',
                        planCost: 120000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '李四',
                        dataSource: '隐患治理'
                    },
                    {
                        id: 3,
                        category: '安全培训',
                        projectCode: 'AQTRJH-20260101-0003',
                        projectName: '年度安全培训计划',
                        projectContent: '组织全员安全知识培训，包括消防安全、用电安全、应急逃生等内容',
                        planDate: '2026-06-30',
                        planCost: 80000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '王五',
                        dataSource: '安全培训'
                    },
                    {
                        id: 4,
                        category: '应急救援',
                        projectCode: 'AQTRJH-20260101-0004',
                        projectName: '应急救援器材配置',
                        projectContent: '配置应急救援器材，包括担架、急救箱、消防器材等',
                        planDate: '2026-04-30',
                        planCost: 150000,
                        responsibleUnit: '运维部',
                        responsiblePerson: '赵六',
                        dataSource: '应急演练'
                    },
                    {
                        id: 5,
                        category: '安全检查',
                        projectCode: 'AQTRJH-20260101-0005',
                        projectName: '隐患排查治理专项',
                        projectContent: '开展全厂安全隐患排查，建立隐患台账并跟踪整改',
                        planDate: '2026-12-31',
                        planCost: 200000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '张三',
                        dataSource: '人工录入'
                    }
                ]);

                // 过滤后的数据
                const filteredData = computed(() => {
                    let data = tableData.value;

                    if (searchForm.value.category) {
                        data = data.filter(item => item.category === searchForm.value.category);
                    }
                    if (searchForm.value.projectName) {
                        data = data.filter(item => item.projectName.includes(searchForm.value.projectName));
                    }
                    if (searchForm.value.responsibleUnit) {
                        data = data.filter(item => item.responsibleUnit === searchForm.value.responsibleUnit);
                    }
                    if (searchForm.value.responsiblePerson) {
                        data = data.filter(item => item.responsiblePerson.includes(searchForm.value.responsiblePerson));
                    }
                    if (searchForm.value.planDate && searchForm.value.planDate.length === 2) {
                        const [start, end] = searchForm.value.planDate;
                        data = data.filter(item => item.planDate >= start && item.planDate <= end);
                    }

                    return data;
                });

                // 分页数据
                const pagedData = computed(() => {
                    const start = (currentPage.value - 1) * pageSize.value;
                    return filteredData.value.slice(start, start + pageSize.value);
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 搜索
                const handleSearch = () => {
                    loading.value = true;
                    currentPage.value = 1;
                    setTimeout(() => {
                        loading.value = false;
                        ElMessage.success('查询完成');
                    }, 300);
                };

                // 重置
                const handleReset = () => {
                    searchForm.value = {
                        category: '',
                        projectName: '',
                        responsibleUnit: '',
                        responsiblePerson: '',
                        planDate: null
                    };
                    currentPage.value = 1;
                };

                // 选择变化
                const handleSelectionChange = (selection) => {
                    selectedRows.value = selection;
                };

                // 新建
                const handleAdd = () => {
                    window.location.href = '安措计划-详情.html?mode=add';
                };

                // 批量删除
                const handleBatchDelete = () => {
                    ElMessageBox.confirm(
                        `确定要删除选中的 ${selectedRows.value.length} 条记录吗？`,
                        '确认删除',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        ElMessage.success('删除成功');
                        selectedRows.value = [];
                    }).catch(() => { });
                };

                // 删除单条
                const handleDelete = (row) => {
                    ElMessageBox.confirm(
                        `确定要删除项目"${row.projectName}"吗？`,
                        '确认删除',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        ElMessage.success('删除成功');
                    }).catch(() => { });
                };

                // 查看
                const handleView = (row) => {
                    window.location.href = `安措计划-详情.html?mode=view&id=${row.id}`;
                };

                // 编辑
                const handleEdit = (row) => {
                    window.location.href = `安措计划-详情.html?mode=edit&id=${row.id}`;
                };

                // 导入
                const handleImport = () => {
                    ElMessage.info('导入功能开发中...');
                };

                // 导出
                const handleExport = () => {
                    ElMessage.info('导出功能开发中...');
                };

                // 获取数据来源标签类型
                const getDataSourceType = (dataSource) => {
                    const typeMap = {
                        '人工录入': '',
                        '隐患治理': 'warning',
                        '安全培训': 'success',
                        '应急演练': 'danger'
                    };
                    return typeMap[dataSource] || '';
                };

                return {
                    loading,
                    selectedRows,
                    currentPage,
                    pageSize,
                    isExpanded,
                    searchForm,
                    tableData,
                    filteredData,
                    pagedData,
                    toggleExpand,
                    formatAmount,
                    getDataSourceType,
                    handleSearch,
                    handleReset,
                    handleSelectionChange,
                    handleAdd,
                    handleBatchDelete,
                    handleDelete,
                    handleView,
                    handleEdit,
                    handleImport,
                    handleExport
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
