<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用计划 - 正式计划</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        /* 左侧面板 */
        .left-panel {
            width: 280px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .year-card {
            padding: 20px;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .year-card:hover {
            background-color: #f5f7fa;
        }

        .year-card.active {
            background-color: #ecf5ff;
            border-right: 3px solid #409EFF;
        }

        .year-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .year-card-title i {
            margin-right: 8px;
            color: #409EFF;
        }

        .year-card-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .stat-label {
            color: #909399;
        }

        .stat-value {
            color: #303133;
            font-family: Monaco, 'Courier New', Courier, monospace;
            font-weight: 500;
        }

        /* 右侧面板 */
        .right-panel {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        /* 表格区域 */
        .table-area {
            margin-top: 0;
        }

        /* 状态标签样式 */
        .status-draft {
            color: #909399;
        }

        .status-finalized {
            color: #67C23A;
        }

        .amount-link {
            color: #409EFF;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <!-- 左侧年度卡片 -->
        <div class="left-panel">
            <div v-for="year in yearCards" :key="year.year" class="year-card"
                :class="{ active: selectedYear === year.year }" @click="selectYear(year.year)">
                <div class="year-card-title">
                    <i class="fas fa-calendar-alt"></i>
                    {{ year.year }}年度
                </div>
                <div class="year-card-stats">
                    <div class="stat-item">
                        <span class="stat-label">年度计划总额(万元)</span>
                        <span class="stat-value">{{ formatAmount(year.totalAmount) }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧详情内容 -->
        <div class="right-panel">
            <div class="panel-content">
                <!-- 正式计划列表表格 -->
                <div class="table-area">
                    <el-table :data="tableData" style="width: 100%" stripe border v-loading="loading" row-key="id"
                        :tree-props="{ children: 'children', hasChildren: 'hasChildren' }" default-expand-all>
                        <el-table-column prop="companyName" label="企业名称" min-width="280"></el-table-column>
                        <el-table-column prop="totalAmount" label="年度计划总额(万元)" min-width="180" align="left">
                            <template #default="{ row }">
                                <span class="amount-link" @click="handleView(row)">
                                    {{ formatAmount(row.totalAmount) }}
                                </span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="status" label="状态" min-width="100" align="center">
                            <template #default="{ row }">
                                <span v-if="hasChildren(row)">-</span>
                                <span v-else :class="getStatusClass(row.status)">{{ row.status }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column label="提交人" min-width="120" align="center">
                            <template #default="{ row }">
                                <span v-if="hasChildren(row)">-</span>
                                <span v-else-if="row.status !== '草稿'">{{ row.submitter || '-' }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column label="提交时间" min-width="170" align="center">
                            <template #default="{ row }">
                                <span v-if="hasChildren(row)">-</span>
                                <span v-else-if="row.status !== '草稿'">{{ row.submitTime || '-' }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="120" fixed="right" align="center">
                            <template #default="{ row }">
                                <div style="display: flex; justify-content: center; gap: 4px;">
                                    <el-button size="small" @click="handleView(row)" link>
                                        <i class="fas fa-eye" style="color: #67C23A;"></i>
                                    </el-button>
                                    <el-button size="small" @click="handleEdit(row)" link
                                        v-if="row.companyName === '国投电力本部'" :disabled="row.status === '已定稿'">
                                        <i class="fas fa-edit" style="color: #409EFF;"></i>
                                    </el-button>
                                </div>
                            </template>
                        </el-table-column>
                    </el-table>

                    <!-- 分页 -->
                    <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
                        <el-pagination background size="small" v-model:current-page="currentPage"
                            v-model:page-size="pageSize" :page-sizes="[10, 20, 50, 100]" :total="tableData.length"
                            layout="total, ->, sizes, prev, pager, next, jumper" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const loading = ref(false);
                const currentPage = ref(1);
                const pageSize = ref(10);
                const selectedYear = ref(2026);

                // 年度卡片数据
                const yearCards = ref([
                    {
                        year: 2026,
                        totalAmount: 6000000
                    },
                    {
                        year: 2025,
                        totalAmount: 5500000
                    },
                    {
                        year: 2024,
                        totalAmount: 5200000
                    }
                ]);

                // 选择年度
                const selectYear = (year) => {
                    selectedYear.value = year;
                    ElMessage.success(`已切换至 ${year} 年度`);
                };

                // 模拟表格数据（树形结构）
                const sourceData = ref([
                    {
                        id: 1,
                        year: '2026',
                        companyName: '国投电力',
                        totalAmount: 6000000,
                        status: '草稿',
                        children: [
                            {
                                id: 11,
                                year: '2026',
                                companyName: '国投电力本部',
                                totalAmount: 1500000,
                                status: '草稿'
                            },
                            {
                                id: 12,
                                year: '2026',
                                companyName: '云南大朝山',
                                totalAmount: 1200000,
                                status: '草稿'
                            },
                            {
                                id: 13,
                                year: '2026',
                                companyName: '华夏电力',
                                totalAmount: 1800000,
                                status: '已定稿',
                                submitter: '王建国',
                                submitTime: '2025-11-20 14:30:00'
                            },
                            {
                                id: 14,
                                year: '2026',
                                companyName: '广西新能源',
                                totalAmount: 1500000,
                                status: '草稿',
                                children: [
                                    {
                                        id: 140,
                                        year: '2026',
                                        companyName: '广西新能源本部',
                                        totalAmount: 400000,
                                        status: '草稿'
                                    },
                                    {
                                        id: 141,
                                        year: '2026',
                                        companyName: '分公司1',
                                        totalAmount: 600000,
                                        status: '草稿'
                                    },
                                    {
                                        id: 142,
                                        year: '2026',
                                        companyName: '分公司2',
                                        totalAmount: 500000,
                                        status: '草稿'
                                    }
                                ]
                            }
                        ]
                    },
                    {
                        id: 2,
                        year: '2025',
                        companyName: '国投电力',
                        totalAmount: 5500000,
                        status: '已定稿',
                        submitter: '张伟',
                        submitTime: '2024-12-30 09:15:00',
                        children: [
                            {
                                id: 21,
                                year: '2025',
                                companyName: '国投电力本部',
                                totalAmount: 1400000,
                                status: '已定稿'
                            },
                            {
                                id: 22,
                                year: '2025',
                                companyName: '云南大朝山',
                                totalAmount: 1100000,
                                status: '已定稿'
                            },
                            {
                                id: 23,
                                year: '2025',
                                companyName: '华夏电力',
                                totalAmount: 1700000,
                                status: '已定稿'
                            },
                            {
                                id: 24,
                                year: '2025',
                                companyName: '广西新能源',
                                totalAmount: 1300000,
                                status: '已定稿'
                            }
                        ]
                    }
                ]);

                // 过滤后的表格数据
                const tableData = computed(() => {
                    return sourceData.value.filter(item => item.year == selectedYear.value);
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 6
                    }).format(value);
                };

                // 获取状态样式类
                const getStatusClass = (status) => {
                    switch (status) {
                        case '草稿': return 'status-draft';
                        case '已定稿': return 'status-finalized';
                        default: return '';
                    }
                };

                // 查看
                const handleView = (row) => {
                    window.location.href = `正式计划-详情.html?id=${row.id}&year=${row.year}&companyName=${encodeURIComponent(row.companyName)}&mode=view`;
                };

                // 编辑
                const handleEdit = (row) => {
                    window.location.href = `正式计划-详情.html?id=${row.id}&year=${row.year}&companyName=${encodeURIComponent(row.companyName)}&mode=edit`;
                };

                // 判断是否有子节点
                const hasChildren = (row) => {
                    return row.children && row.children.length > 0;
                };

                return {
                    selectedYear,
                    yearCards,
                    selectYear,
                    loading,
                    currentPage,
                    pageSize,
                    tableData,
                    formatAmount,
                    getStatusClass,
                    handleView,
                    handleEdit,
                    hasChildren
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
