<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全预算管理 - 安全投入</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .content-card {
            flex: 1;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .function-bar {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .function-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-area {
            padding: 20px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .search-fields {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            flex: 1;
        }

        .search-fields .el-form-item {
            margin-bottom: 0;
        }

        .search-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            margin-left: 16px;
        }

        .table-area {
            flex: 1;
            padding: 24px;
            overflow-x: auto;
        }

        .pagination-bar {
            padding: 16px 24px;
            background: #f8f9fa;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
        }

        .content-cell {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <div class="content-card">
                <!-- 功能按钮区 -->
                <div class="function-bar">
                    <div class="function-left">
                        <el-button type="primary" @click="handleAdd">
                            <i class="fas fa-plus"></i> 新建
                        </el-button>
                        <el-button type="danger" @click="handleBatchDelete" :disabled="selectedRows.length === 0">
                            <i class="fas fa-trash-alt"></i> 批量删除
                        </el-button>
                        <el-button @click="handleExport">
                            <i class="fas fa-file-export"></i> 导出
                        </el-button>
                    </div>
                </div>

                <!-- 搜索区域 -->
                <div class="search-area">
                    <el-form :model="searchForm" :inline="true">
                        <div class="search-row">
                            <div class="search-fields">
                                <el-form-item label="项目名称">
                                    <el-input v-model="searchForm.projectName" placeholder="请输入项目名称" clearable
                                        style="width: 180px;" />
                                </el-form-item>
                                <el-form-item label="是否两措">
                                    <el-select v-model="searchForm.measureType" placeholder="请选择" clearable
                                        style="width: 120px;">
                                        <el-option label="安措" value="安措"></el-option>
                                        <el-option label="反措" value="反措"></el-option>
                                        <el-option label="其他" value="其他"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item label="实际完成时间">
                                    <el-date-picker v-model="searchForm.completeDate" type="daterange"
                                        range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
                                        value-format="YYYY-MM-DD" style="width: 260px;" />
                                </el-form-item>
                            </div>
                            <div class="search-buttons">
                                <el-button type="primary" @click="handleSearch">
                                    <i class="fas fa-search"></i> 查询
                                </el-button>
                                <el-button @click="handleReset">
                                    <i class="fas fa-redo"></i> 重置
                                </el-button>
                            </div>
                        </div>
                    </el-form>
                </div>

                <!-- 表格区域 -->
                <div class="table-area">
                    <el-table :data="pagedData" style="width: 100%" stripe border v-loading="loading"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column prop="code" label="编号" min-width="160"></el-table-column>
                        <el-table-column prop="projectName" label="项目名称" min-width="180">
                            <template #default="{ row }">
                                <a href="javascript:void(0)" @click="handleView(row)"
                                    style="color: #409EFF; text-decoration: underline; cursor: pointer;">{{
                                    row.projectName }}</a>
                            </template>
                        </el-table-column>
                        <el-table-column prop="category" label="所属类别" min-width="140"></el-table-column>
                        <el-table-column prop="measureType" label="是否两措" min-width="100">
                            <template #default="{ row }">
                                <el-tag
                                    :type="row.measureType === '安措' ? 'success' : row.measureType === '反措' ? 'warning' : 'info'"
                                    size="small">
                                    {{ row.measureType }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="planCompleteDate" label="计划完成时间" min-width="120"></el-table-column>
                        <el-table-column prop="actualCompleteDate" label="实际完成时间" min-width="120"></el-table-column>
                        <el-table-column prop="planCost" label="计划投入费用（元）" min-width="160" align="right">
                            <template #default="{ row }">
                                {{ formatAmount(row.planCost) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="actualCost" label="实际投入费用（元）" min-width="160" align="right">
                            <template #default="{ row }">
                                {{ formatAmount(row.actualCost) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="responsibleUnit" label="责任单位（部门）" min-width="140"></el-table-column>
                        <el-table-column prop="responsiblePerson" label="责任人" min-width="100"></el-table-column>
                        <el-table-column label="操作" width="120" fixed="right" align="center">
                            <template #default="{ row }">
                                <el-button size="small" @click="handleView(row)" link>
                                    <i class="fas fa-eye" style="color: #67C23A;"></i>
                                </el-button>
                                <el-button size="small" @click="handleEdit(row)" link>
                                    <i class="fas fa-edit" style="color: #409EFF;"></i>
                                </el-button>
                                <el-button size="small" @click="handleDelete(row)" link>
                                    <i class="fas fa-trash-alt" style="color: #F56C6C;"></i>
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 分页 -->
                <div class="pagination-bar">
                    <el-pagination background size="small" v-model:current-page="currentPage"
                        v-model:page-size="pageSize" :page-sizes="[10, 20, 50, 100]" :total="filteredData.length"
                        layout="total, ->, sizes, prev, pager, next, jumper" />
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        createApp({
            setup() {
                const loading = ref(false);
                const selectedRows = ref([]);
                const currentPage = ref(1);
                const pageSize = ref(20);

                const searchForm = ref({
                    projectName: '',
                    measureType: '',
                    completeDate: null
                });

                // 模拟表格数据
                const tableData = ref([
                    {
                        id: 1,
                        code: 'AQTR-20260105-001',
                        projectName: '现场消防设备维护保养',
                        category: '消防设施维护及检测',
                        measureType: '安措',
                        planCompleteDate: '2026-01-03',
                        actualCompleteDate: '2026-01-05',
                        planCost: 80000,
                        actualCost: 85000,
                        responsibleUnit: '设备部',
                        responsiblePerson: '张三'
                    },
                    {
                        id: 2,
                        code: 'AQTR-20260110-002',
                        projectName: '主变压器绝缘隐患整治',
                        category: '设备重大缺陷和隐患治理',
                        measureType: '反措',
                        planCompleteDate: '2026-01-08',
                        actualCompleteDate: '2026-01-10',
                        planCost: 800000,
                        actualCost: 850000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '李四'
                    },
                    {
                        id: 3,
                        code: 'AQTR-20260115-003',
                        projectName: '安全生产责任保险',
                        category: '与安全生产直接相关的其他支出',
                        measureType: '其他',
                        planCompleteDate: '2026-01-15',
                        actualCompleteDate: '2026-01-15',
                        planCost: 300000,
                        actualCost: 300000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '王五'
                    },
                    {
                        id: 4,
                        code: 'AQTR-20260120-004',
                        projectName: '员工个人防护装备采购',
                        category: '安全防护设备',
                        measureType: '安措',
                        planCompleteDate: '2026-01-18',
                        actualCompleteDate: '2026-01-20',
                        planCost: 120000,
                        actualCost: 128000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '赵六'
                    }
                ]);

                // 过滤后的数据
                const filteredData = computed(() => {
                    let data = tableData.value;

                    if (searchForm.value.projectName) {
                        data = data.filter(item => item.projectName.includes(searchForm.value.projectName));
                    }
                    if (searchForm.value.measureType) {
                        data = data.filter(item => item.measureType === searchForm.value.measureType);
                    }
                    if (searchForm.value.completeDate && searchForm.value.completeDate.length === 2) {
                        const [start, end] = searchForm.value.completeDate;
                        data = data.filter(item => item.actualCompleteDate >= start && item.actualCompleteDate <= end);
                    }

                    return data;
                });

                // 分页数据
                const pagedData = computed(() => {
                    const start = (currentPage.value - 1) * pageSize.value;
                    return filteredData.value.slice(start, start + pageSize.value);
                });

                // 格式化金额（千分号，2位小数）
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 搜索
                const handleSearch = () => {
                    loading.value = true;
                    currentPage.value = 1;
                    setTimeout(() => {
                        loading.value = false;
                        ElMessage.success('查询完成');
                    }, 300);
                };

                // 重置
                const handleReset = () => {
                    searchForm.value = {
                        projectName: '',
                        measureType: '',
                        completeDate: null
                    };
                    currentPage.value = 1;
                };

                // 选择变化
                const handleSelectionChange = (selection) => {
                    selectedRows.value = selection;
                };

                // 新建
                const handleAdd = () => {
                    window.location.href = '安全投入-详情.html?mode=add';
                };

                // 批量删除
                const handleBatchDelete = () => {
                    ElMessageBox.confirm(
                        `确定要删除选中的 ${selectedRows.value.length} 条记录吗？`,
                        '确认删除',
                        { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' }
                    ).then(() => {
                        ElMessage.success('删除成功');
                        selectedRows.value = [];
                    }).catch(() => { });
                };

                // 删除单条
                const handleDelete = (row) => {
                    ElMessageBox.confirm(
                        `确定要删除项目"${row.projectName}"的投入记录吗？`,
                        '确认删除',
                        { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' }
                    ).then(() => {
                        ElMessage.success('删除成功');
                    }).catch(() => { });
                };

                // 查看
                const handleView = (row) => {
                    window.location.href = `安全投入-详情.html?mode=view&id=${row.id}`;
                };

                // 编辑
                const handleEdit = (row) => {
                    window.location.href = `安全投入-详情.html?mode=edit&id=${row.id}`;
                };

                // 导出
                const handleExport = () => {
                    ElMessage.info('导出功能开发中...');
                };

                return {
                    loading,
                    selectedRows,
                    currentPage,
                    pageSize,
                    searchForm,
                    filteredData,
                    pagedData,
                    formatAmount,
                    handleSearch,
                    handleReset,
                    handleSelectionChange,
                    handleAdd,
                    handleBatchDelete,
                    handleDelete,
                    handleView,
                    handleEdit,
                    handleExport
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
