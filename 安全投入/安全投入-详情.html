<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全预算管理 - 安全投入详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 表单标签右对齐，最多6字换行 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 170px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="170px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编号" prop="code">
                                    <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="数据来源" prop="dataSource" required>
                                    <el-radio-group v-model="formData.dataSource" :disabled="isView"
                                        @change="handleDataSourceChange">
                                        <el-radio label="计划内">计划内</el-radio>
                                        <el-radio label="计划外">计划外</el-radio>
                                    </el-radio-group>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="是否两措" prop="measureType" required>
                                    <el-select v-model="formData.measureType" placeholder="请选择" :disabled="isView"
                                        style="width: 100%;" @change="handleMeasureTypeChange">
                                        <el-option label="安措" value="安措"></el-option>
                                        <el-option label="反措" value="反措"></el-option>
                                        <el-option label="其他" value="其他"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="项目名称" prop="projectName" required>
                                    <!-- 计划内：下拉选择 -->
                                    <el-select v-if="formData.dataSource === '计划内'" v-model="formData.projectName"
                                        placeholder="请选择项目" :disabled="isView" style="width: 100%;"
                                        @change="handleProjectChange" filterable>
                                        <el-option v-for="item in projectOptions" :key="item.id" :label="item.name"
                                            :value="item.name"></el-option>
                                    </el-select>
                                    <!-- 计划外：文本输入 -->
                                    <el-input v-else v-model="formData.projectName" placeholder="请输入项目名称"
                                        :disabled="isView" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属类别" prop="category" required>
                                    <el-input v-model="formData.category"
                                        :disabled="isView || formData.dataSource === '计划内'" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="责任单位（部门）" prop="responsibleUnit" required>
                                    <el-input v-model="formData.responsibleUnit"
                                        :disabled="isView || formData.dataSource === '计划内'" />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="责任人" prop="responsiblePerson" required>
                                    <el-input v-model="formData.responsiblePerson"
                                        :disabled="isView || formData.dataSource === '计划内'" />
                                </el-form-item>
                            </div>
                        </div>
                        <!-- 计划内才显示的字段 -->
                        <template v-if="formData.dataSource === '计划内'">
                            <div class="form-row">
                                <div class="form-item full-width">
                                    <el-form-item label="项目内容" prop="projectContent" required>
                                        <el-input v-model="formData.projectContent" type="textarea" :rows="3"
                                            disabled />
                                    </el-form-item>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-item">
                                    <el-form-item label="计划完成时间" prop="planDate" required>
                                        <el-input v-model="formData.planDate" disabled />
                                    </el-form-item>
                                </div>
                                <div class="form-item">
                                    <el-form-item label="计划投入费用（元）" prop="planCost" required>
                                        <el-input v-model="formData.planCostDisplay" disabled />
                                    </el-form-item>
                                </div>
                            </div>
                        </template>
                    </el-form>
                </div>
            </div>

            <!-- 实际投入模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('actual')">
                    <div class="module-title">
                        <i class="fas fa-coins"></i>
                        实际投入
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.actual }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.actual }">
                    <el-form :model="formData" :rules="formRules" ref="actualFormRef" label-width="170px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="实际投入时间" prop="actualDate" required>
                                    <el-date-picker v-model="formData.actualDate" type="date" placeholder="请选择日期"
                                        value-format="YYYY-MM-DD" style="width: 100%;" :disabled="isView" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="实际投入费用（元）" prop="actualCost" required>
                                    <el-input v-model="formData.actualCostDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleCostInput" @blur="formatCost">
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="实际项目内容" prop="actualProjectContent" required>
                                    <el-input v-model="formData.actualProjectContent" type="textarea" :rows="3"
                                        placeholder="请输入实际项目内容" :disabled="isView" :maxlength="200" show-word-limit />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="备注" prop="remark">
                                    <el-input v-model="formData.remark" type="textarea" :rows="3" placeholder="请输入备注"
                                        :disabled="isView" :maxlength="500" show-word-limit />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="附件" prop="attachments">
                                    <el-upload action="#" :auto-upload="false" :file-list="formData.attachments"
                                        :disabled="isView" multiple>
                                        <el-button type="primary" :disabled="isView">
                                            <i class="fas fa-upload"></i> 上传附件
                                        </el-button>
                                        <template #tip>
                                            <div class="el-upload__tip">支持上传多个文件</div>
                                        </template>
                                    </el-upload>
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);
                const actualFormRef = ref(null);

                // 页面模式
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');

                // 模块折叠状态
                const modules = ref({
                    basic: true,
                    actual: true
                });

                // 项目选项（模拟数据）
                const allProjects = ref({
                    安措: [
                        {
                            id: 1,
                            name: '现场消防设备维护保养',
                            category: '消防设施维护及检测',
                            content: '检查现场消防设备并进行维修保养，确保消防设备正常',
                            planDate: '2026-01-05',
                            planCost: 80000,
                            responsibleUnit: '设备部',
                            responsiblePerson: '张三'
                        },
                        {
                            id: 2,
                            name: '员工个人防护装备采购',
                            category: '安全防护设备',
                            content: '采购安全帽、防护眼镜、防护手套等个人防护装备',
                            planDate: '2026-02-28',
                            planCost: 120000,
                            responsibleUnit: '安健环管理部',
                            responsiblePerson: '李四'
                        }
                    ],
                    反措: [
                        {
                            id: 3,
                            name: '主变压器绝缘隐患整治',
                            category: '设备重大缺陷和隐患治理',
                            content: '更换绝缘材料，消除设备隐患，确保设备安全稳定运行',
                            planDate: '2026-06-30',
                            planCost: 800000,
                            responsibleUnit: '安健环管理部',
                            responsiblePerson: '张三'
                        },
                        {
                            id: 4,
                            name: '厂区排水系统改造',
                            category: '防汛抗旱工程',
                            content: '扩大排水管道，增设排水泵站，提高防汛能力',
                            planDate: '2026-05-31',
                            planCost: 1500000,
                            responsibleUnit: '设备部',
                            responsiblePerson: '王五'
                        }
                    ],
                    其他: [
                        {
                            id: 5,
                            name: '安全生产责任保险',
                            category: '与安全生产直接相关的其他支出',
                            content: '购买企业安全生产责任保险，保障员工和企业安全',
                            planDate: '2026-01-31',
                            planCost: 300000,
                            responsibleUnit: '安健环管理部',
                            responsiblePerson: '张三'
                        }
                    ]
                });

                const projectOptions = computed(() => {
                    return allProjects.value[formData.value.measureType] || [];
                });

                // 表单数据
                const formData = ref({
                    code: '',
                    dataSource: '计划内',
                    measureType: '安措',
                    projectName: '现场消防设备维护保养',
                    category: '消防设施维护及检测',
                    projectContent: '检查现场消防设备并进行维修保养，确保消防设备正常',
                    planDate: '2026-01-05',
                    planCost: 80000,
                    planCostDisplay: '80,000.00',
                    responsibleUnit: '设备部',
                    responsiblePerson: '张三',
                    actualDate: new Date().toISOString().slice(0, 10),
                    actualCost: 0,
                    actualCostDisplay: '',
                    actualProjectContent: '',
                    remark: '',
                    attachments: []
                });

                // 表单验证规则
                const formRules = ref({
                    dataSource: [{ required: true, message: '请选择数据来源', trigger: 'change' }],
                    measureType: [{ required: true, message: '请选择是否两措', trigger: 'change' }],
                    projectName: [{ required: true, message: '请输入项目名称', trigger: 'blur' }],
                    category: [{ required: true, message: '请输入所属类别', trigger: 'blur' }],
                    responsibleUnit: [{ required: true, message: '请输入责任单位', trigger: 'blur' }],
                    responsiblePerson: [{ required: true, message: '请输入责任人', trigger: 'blur' }],
                    actualDate: [{ required: true, message: '请选择实际投入时间', trigger: 'change' }],
                    actualCost: [{ required: true, message: '请输入实际投入费用', trigger: 'blur' }],
                    actualProjectContent: [{ required: true, message: '请输入实际项目内容', trigger: 'blur' }]
                });

                // 格式化金额（千分号，2位小数）
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 解析金额字符串
                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                // 处理金额输入
                const handleCostInput = (value) => {
                    formData.value.actualCostDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化金额显示
                const formatCost = () => {
                    const value = parseAmount(formData.value.actualCostDisplay);
                    formData.value.actualCost = value;
                    formData.value.actualCostDisplay = formatAmount(value);
                };

                // 处理数据来源变化
                const handleDataSourceChange = () => {
                    // 切换数据来源时重置相关字段
                    formData.value.projectName = '';
                    formData.value.category = '';
                    formData.value.projectContent = '';
                    formData.value.planDate = '';
                    formData.value.planCost = 0;
                    formData.value.planCostDisplay = '';
                    formData.value.responsibleUnit = '';
                    formData.value.responsiblePerson = '';
                };

                // 处理两措类型变化
                const handleMeasureTypeChange = () => {
                    if (formData.value.dataSource === '计划内') {
                        formData.value.projectName = '';
                        formData.value.category = '';
                        formData.value.projectContent = '';
                        formData.value.planDate = '';
                        formData.value.planCost = 0;
                        formData.value.planCostDisplay = '';
                        formData.value.responsibleUnit = '';
                        formData.value.responsiblePerson = '';
                    }
                };

                // 处理项目选择变化
                const handleProjectChange = (projectName) => {
                    const projects = allProjects.value[formData.value.measureType] || [];
                    const selected = projects.find(p => p.name === projectName);
                    if (selected) {
                        formData.value.category = selected.category;
                        formData.value.projectContent = selected.content;
                        formData.value.planDate = selected.planDate;
                        formData.value.planCost = selected.planCost;
                        formData.value.planCostDisplay = formatAmount(selected.planCost);
                        formData.value.responsibleUnit = selected.responsibleUnit;
                        formData.value.responsiblePerson = selected.responsiblePerson;
                    }
                };

                // 生成编号
                const generateCode = () => {
                    const now = new Date();
                    const dateStr = now.getFullYear().toString() +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0');
                    const randomNum = String(Math.floor(Math.random() * 999) + 1).padStart(3, '0');
                    formData.value.code = `AQTR-${dateStr}-${randomNum}`;
                };

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    } else {
                        generateCode();
                    }
                });

                // 加载数据
                const loadData = (id) => {
                    const presetData = {
                        '1': {
                            code: 'AQTR-20260105-001',
                            dataSource: '计划内',
                            measureType: '安措',
                            projectName: '现场消防设备维护保养',
                            category: '消防设施维护及检测',
                            projectContent: '检查现场消防设备并进行维修保养，确保消防设备正常',
                            planDate: '2026-01-05',
                            planCost: 8,
                            planCostDisplay: '8.000000',
                            responsibleUnit: '设备部',
                            responsiblePerson: '张三',
                            actualDate: '2026-01-05',
                            actualCost: 85000,
                            actualCostDisplay: '85,000.00',
                            actualProjectContent: '对厂区所有消防设备进行了全面检查和维护，更换了部分老旧设备零部件，确保消防设备处于良好状态',
                            remark: '维护工作完成顺利',
                            attachments: []
                        }
                    };

                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };
                    } else {
                        generateCode();
                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 切换到编辑模式
                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                // 返回列表
                const goBack = () => {
                    window.location.href = '安全投入.html';
                };

                return {
                    formRef,
                    actualFormRef,
                    mode,
                    isView,
                    modules,
                    formData,
                    formRules,
                    projectOptions,
                    formatAmount,
                    handleCostInput,
                    handleDataSourceChange,
                    formatCost,
                    handleMeasureTypeChange,
                    handleProjectChange,
                    toggleModule,
                    handleSave,
                    switchToEdit,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
