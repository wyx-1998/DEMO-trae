<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入 - 综合统计看板</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        /* 筛选区域 */
        .filter-section {
            background: #fff;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .stats-cards-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .stats-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            min-height: 150px;
            flex: 1;
            min-width: 0;
        }

        .stats-card.double-width {
            flex: 2;
        }

        .stats-card-divider {
            height: 1px;
            background: #f0f0f0;
            margin: 12px 0;
        }

        .stats-card-section {
            flex: 1;
        }

        .stats-card-label-with-tip {
            display: flex;
            align-items: center;
            gap: 4px;
        }



        .stats-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .stats-card-title {
            font-size: 14px;
            color: #606266;
            font-weight: 500;
        }

        .stats-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }

        .stats-card-icon.blue {
            background: linear-gradient(135deg, #409EFF 0%, #36D1DC 100%);
        }

        .stats-card-icon.green {
            background: linear-gradient(135deg, #67C23A 0%, #20c997 100%);
        }

        .stats-card-icon.orange {
            background: linear-gradient(135deg, #E6A23C 0%, #F7BA2A 100%);
        }

        .stats-card-icon.purple {
            background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 100%);
        }

        .stats-card-content {
            flex: 1;
        }

        .stats-card-value {
            font-size: 28px;
            font-weight: 700;
            color: #303133;
            margin-bottom: 8px;
        }

        .stats-card-subtitle {
            font-size: 12px;
            color: #606266;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stats-card-progress {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-card-progress-label {
            font-size: 12px;
            color: #606266;
            white-space: nowrap;
            min-width: 42px;
        }

        .stats-card-progress-bar {
            flex: 1;
        }

        .stats-card-compare {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
        }

        .compare-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        .compare-item.up {
            color: #F56C6C;
        }

        .compare-item.down {
            color: #67C23A;
        }

        /* 图表区域 */
        .charts-section {
            display: grid;
            grid-template-columns: 60% 40%;
            gap: 16px;
            margin-bottom: 16px;
        }

        .chart-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-card.half-width {
            grid-column: span 1;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title i {
            color: #409EFF;
        }

        .chart-container {
            width: 100%;
            height: 300px;
        }

        /* 对比分析布局 */
        .compare-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .compare-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .compare-column-title {
            background: #fff;
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }

            .compare-container {
                grid-template-columns: 1fr;
            }
        }

        /* 增加说明标识样式 */
        body {
            counter-reset: info-mark-counter;
        }

        .info-mark {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 16px;
            height: 16px;
            background-color: #E6A23C;
            /* 警告黄 */
            border-radius: 2px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 4px;
            position: relative;
            top: -1px;

            /* 文字样式 */
            font-size: 10px;
            color: #fff;
            line-height: 1;
        }

        .info-mark::after {
            counter-increment: info-mark-counter;
            content: counter(info-mark-counter);
        }

        .info-mark:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <!-- 筛选区域 -->
            <div class="filter-section">
                <el-form-item label="统计周期" style="margin-bottom: 0;">
                    <info-mark content="默认为当前年"></info-mark>
                    <el-date-picker v-model="queryYear" type="year" placeholder="选择年份" value-format="YYYY"
                        style="width: 120px;" size="small" />
                </el-form-item>
                <el-button size="small" @click="handleRefresh">
                    <i class="fas fa-sync"></i> 刷新
                </el-button>
            </div>

            <!-- 核心指标卡片区 -->
            <div class="stats-cards-section">
                <!-- 正式计划总额 -->
                <div class="stats-card">
                    <div class="stats-card-header">
                        <div class="stats-card-title">
                            正式计划总额（万元）
                            <info-mark content="为该年份正式计划总额"></info-mark>
                        </div>
                        <div class="stats-card-icon purple">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                    </div>
                    <div class="stats-card-content">
                        <div class="stats-card-value">{{ formatMoneyValue(orgData.planTotal) }}</div>
                    </div>
                </div>

                <!-- 提取总额、实际总额和投入率合并卡片 -->
                <div class="stats-card">
                    <div class="stats-card-content" style="display: flex; flex-direction: column; height: 100%;">
                        <!-- 上半部分：三个并排的区域 -->
                        <div style="display: flex; gap: 20px; flex: 1;">
                            <!-- 提取总额部分 -->
                            <div class="stats-card-section" style="flex: 1;">
                                <div class="stats-card-header" style="margin-bottom: 8px;">
                                    <div class="stats-card-title">
                                        实际提取总额（万元）
                                        <info-mark content="为该年份实际提取总额"></info-mark>
                                    </div>
                                    <div class="stats-card-icon blue">
                                        <i class="fas fa-coins"></i>
                                    </div>
                                </div>
                                <div class="stats-card-value">{{ formatMoneyValue(orgData.accrualTotal) }}</div>
                            </div>

                            <div class="stats-card-divider" style="width: 1px; height: auto; margin: 0;"></div>

                            <!-- 实际总额部分 -->
                            <div class="stats-card-section" style="flex: 1;">
                                <div class="stats-card-header" style="margin-bottom: 8px;">
                                    <div class="stats-card-title">
                                        实际使用总额（万元）
                                        <info-mark content="为该年份实际使用总额"></info-mark>
                                    </div>
                                    <div class="stats-card-icon orange">
                                        <i class="fas fa-chart-line"></i>
                                    </div>
                                </div>
                                <div class="stats-card-value">{{ formatMoneyValue(orgData.actualTotal) }}</div>
                            </div>

                            <div class="stats-card-divider" style="width: 1px; height: auto; margin: 0;"></div>

                            <!-- 使用率部分 -->
                            <div class="stats-card-section" style="flex: 1;">
                                <div class="stats-card-header" style="margin-bottom: 8px;">
                                    <div class="stats-card-label-with-tip">
                                        <span class="stats-card-title">
                                            使用率（%）
                                            <info-mark content="为该年份使用率=实际使用总额/实际提取总额*100%"></info-mark>
                                        </span>
                                        <el-tooltip placement="top" effect="light">
                                            <template #content>
                                                使用率=实际使用总额/实际提取总额×100%
                                            </template>
                                            <i class="fas fa-question-circle"
                                                style="color: #909399; font-size: 12px; cursor: help;"></i>
                                        </el-tooltip>
                                    </div>
                                    <div class="stats-card-icon green">
                                        <i class="fas fa-percentage"></i>
                                    </div>
                                </div>
                                <div class="stats-card-value">{{ orgData.completionRate }}%</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- 图表区域 -->
            <div class="charts-section">
                <!-- 月度趋势图 -->
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-chart-bar"></i>
                        <span>月度趋势图</span>
                        <info-mark content="本组织的月度趋势，柱状图为实际使用金额（来源于安全费用使用），折线图为实际提取金额（来源于安全费用提取）"></info-mark>
                    </div>
                    <div class="chart-container" ref="trendChartRef"></div>
                </div>

                <!-- 支出范围实际分布图 -->
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-chart-pie"></i>
                        <span>支出范围实际分布图</span>
                        <info-mark content="本组织的支出范围实际使用分布，数据来源于安全费用使用"></info-mark>
                    </div>
                    <div class="chart-container" ref="categoryChartRef"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
            setup() {
                const queryYear = ref(new Date().getFullYear().toString());

                // 本组织数据
                const orgData = reactive({
                    planTotal: 15800000,
                    anCuo: 8500000,
                    fanCuo: 5200000,
                    other: 2100000,
                    budgetTotal: 15000000,
                    accrualTotal: 14200000,
                    actualTotal: 12855000,
                    completionRate: ((12855000 / 14200000) * 100).toFixed(2)
                });

                const trendChartRef = ref(null);
                const categoryChartRef = ref(null);

                // 格式化金额为万元（不带单位）
                const formatMoneyValue = (value) => {
                    if (value >= 10000) {
                        return (value / 10000).toFixed(2);
                    }
                    return value.toFixed(2);
                };

                const getProgressColor = (percentage) => {
                    if (percentage >= 90) return '#67C23A';
                    if (percentage >= 70) return '#E6A23C';
                    return '#F56C6C';
                };

                const initTrendChart = (chartRef) => {
                    if (!chartRef) return;
                    const chart = echarts.init(chartRef);
                    // 提取金额 = 提取总额 / 12
                    const monthlyAccrual = (orgData.accrualTotal / 10000 / 12).toFixed(2);
                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            axisPointer: { type: 'shadow' }
                        },
                        legend: {
                            data: ['实际使用金额', '实际提取金额'],
                            bottom: 0
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '12%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'category',
                            data: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月']
                        },
                        yAxis: {
                            type: 'value',
                            name: '金额(万元)'
                        },
                        series: [
                            {
                                name: '实际使用金额',
                                type: 'bar',
                                data: [105, 115, 120, 110, 118, 125, 115, 122, 128, 120, 125, 132],
                                itemStyle: {
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        { offset: 0, color: '#409EFF' },
                                        { offset: 1, color: '#66b1ff' }
                                    ])
                                },
                                barWidth: '50%'
                            },
                            {
                                name: '实际提取金额',
                                type: 'line',
                                data: Array(12).fill(parseFloat(monthlyAccrual)),
                                lineStyle: {
                                    color: '#67C23A',
                                    width: 2,
                                    type: 'dashed'
                                },
                                symbol: 'circle',
                                symbolSize: 6,
                                itemStyle: {
                                    color: '#67C23A'
                                }
                            }
                        ]
                    };
                    chart.setOption(option);
                    window.addEventListener('resize', () => chart.resize());
                };

                const initCategoryChart = (chartRef) => {
                    if (!chartRef) return;
                    const chart = echarts.init(chartRef);
                    const option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: '{a} <br/>{b}: {c}万元 ({d}%)'
                        },
                        legend: {
                            orient: 'vertical',
                            right: 10,
                            top: 'center'
                        },
                        series: [
                            {
                                name: '投入金额',
                                type: 'pie',
                                radius: ['40%', '70%'],
                                avoidLabelOverlap: false,
                                itemStyle: {
                                    borderRadius: 10,
                                    borderColor: '#fff',
                                    borderWidth: 2
                                },
                                label: {
                                    show: true,
                                    formatter: '{b}\n{c}万元\n({d}%)',
                                    fontSize: 11
                                },
                                labelLine: {
                                    show: true,
                                    length: 15,
                                    length2: 10
                                },
                                emphasis: {
                                    label: {
                                        show: true,
                                        fontSize: 14,
                                        fontWeight: 'bold'
                                    }
                                },
                                data: [
                                    { value: 250, name: '安全防护设备、设施支出' },
                                    { value: 180, name: '应急救援器材、设备设施支出' },
                                    { value: 150, name: '重大危险源检测评估监控支出' },
                                    { value: 120, name: '安全生产检查评估支出' },
                                    { value: 98, name: '安全培训教育支出' },
                                    { value: 85, name: '安全防护用品支出' },
                                    { value: 110, name: '新技术新设备推广支出' },
                                    { value: 75, name: '安全设施检测检验支出' },
                                    { value: 60, name: '安全生产责任保险支出' },
                                    { value: 157.5, name: '其他安全生产支出' }
                                ]
                            }
                        ]
                    };
                    chart.setOption(option);
                    window.addEventListener('resize', () => chart.resize());
                };


                const handleRefresh = () => {
                    ElMessage.success('刷新成功');
                };

                const handleCardClick = (type) => {
                    ElMessage.info(`点击了${type}卡片，可跳转到详情页面`);
                };

                onMounted(() => {
                    nextTick(() => {
                        // 初始化图表
                        initTrendChart(trendChartRef.value);
                        initCategoryChart(categoryChartRef.value);
                    });
                });

                return {
                    queryYear,
                    orgData,
                    trendChartRef,
                    categoryChartRef,
                    formatMoneyValue,
                    getProgressColor,
                    handleRefresh,
                    handleCardClick
                };
            }
        });

        // 注册 info-mark 组件
        app.component('info-mark', {
            props: ['content'],
            template: `
                <el-popover
                    placement="top"
                    title="说明"
                    :width="200"
                    trigger="click"
                    :content="content"
                >
                    <template #reference>
                        <span class="info-mark" @click.stop></span>
                    </template>
                </el-popover>
            `
        });

        app.use(ElementPlus).mount('#app');
    </script>
</body>

</html>
