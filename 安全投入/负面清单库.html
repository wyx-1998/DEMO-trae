<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用标准库 - 负面清单库</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            gap: 20px;
        }

        /* 左侧树形结构 */
        .tree-panel {
            width: 280px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .tree-search {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .tree-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        /* 右侧列表区域 */
        .content-card {
            flex: 1;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .function-bar {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .function-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-area {
            padding: 20px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-form {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .search-form .el-form-item {
            margin-bottom: 0;
        }

        .table-area {
            flex: 1;
            padding: 24px;
            overflow-x: auto;
        }

        .pagination-bar {
            padding: 16px 24px;
            background: #f8f9fa;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
        }

        /* 自定义树样式 */
        .el-tree {
            background: transparent;
        }

        .el-tree-node__content {
            height: 36px;
        }

        .custom-tree-node {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .custom-tree-node i {
            color: #909399;
        }

        .custom-tree-node.active i {
            color: #409EFF;
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <!-- 左侧行业树 -->
            <div class="tree-panel">
                <div class="tree-search">
                    <el-input v-model="treeFilterText" placeholder="搜索企业分类" clearable size="default">
                        <template #prefix>
                            <i class="fas fa-search"></i>
                        </template>
                    </el-input>
                </div>
                <div class="tree-content">
                    <el-tree ref="treeRef" :data="industryTree" :props="treeProps" :filter-node-method="filterNode"
                        @node-click="handleNodeClick" highlight-current default-expand-all>
                        <template #default="{ node, data }">
                            <span class="custom-tree-node" :class="{ active: currentIndustry === data.value }">
                                <i :class="data.icon || 'fas fa-folder'"></i>
                                <span>{{ node.label }}</span>
                            </span>
                        </template>
                    </el-tree>
                </div>
            </div>

            <!-- 右侧列表区 -->
            <div class="content-card">
                <div class="function-bar">
                    <div class="function-left">
                        <el-button type="primary" @click="handleAdd">
                            <i class="fas fa-plus"></i> 新建
                        </el-button>
                        <el-button type="success" @click="handleImport">
                            <i class="fas fa-file-import"></i> 导入
                        </el-button>
                        <el-button type="danger" @click="handleBatchDelete" :disabled="selectedRows.length === 0">
                            <i class="fas fa-trash-alt"></i> 批量删除
                        </el-button>
                    </div>
                </div>

                <div class="search-area">
                    <el-form :model="searchForm" :inline="true" class="search-form"
                        style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; gap: 16px;">
                            <el-form-item label="所属支出范围名称">
                                <el-input v-model="searchForm.scopeName" placeholder="请输入支出范围名称" clearable
                                    style="width: 200px;" />
                            </el-form-item>
                            <el-form-item label="负面清单名称">
                                <el-input v-model="searchForm.negativeListName" placeholder="请输入负面清单名称" clearable
                                    style="width: 200px;" />
                            </el-form-item>
                        </div>
                        <el-form-item style="margin-left: auto;">
                            <el-button type="primary" @click="handleSearch">
                                <i class="fas fa-search"></i> 查询
                            </el-button>
                            <el-button @click="handleReset">
                                <i class="fas fa-redo"></i> 重置
                            </el-button>
                        </el-form-item>
                    </el-form>
                </div>

                <div class="table-area">
                    <el-table :data="pagedData" style="width: 100%" stripe border v-loading="loading"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column prop="industryType" label="所属企业分类" min-width="180"></el-table-column>
                        <el-table-column prop="scopeName" label="所属支出范围名称" min-width="300"></el-table-column>
                        <el-table-column prop="negativeListName" label="负面清单名称" min-width="300"></el-table-column>
                        <el-table-column label="操作" width="140" fixed="right" align="center">
                            <template #default="{ row }">
                                <el-button size="small" @click="handleEdit(row)" link>
                                    <i class="fas fa-edit" style="color: #409EFF;"></i>
                                </el-button>
                                <el-button size="small" @click="handleDelete(row)" link>
                                    <i class="fas fa-trash-alt" style="color: #F56C6C;"></i>
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <div class="pagination-bar">
                    <el-pagination background size="small" v-model:current-page="currentPage"
                        v-model:page-size="pageSize" :page-sizes="[10, 20, 50, 100]" :total="filteredData.length"
                        layout="total, ->, sizes, prev, pager, next, jumper" />
                </div>
            </div>
        </div>

        <!-- 新建/编辑负面清单弹窗 -->
        <el-dialog v-model="dialogVisible" :title="dialogTitle" width="600px" :close-on-click-modal="false">
            <el-form :model="formData" :rules="formRules" ref="formRef" label-width="140px" label-position="left">
                <el-form-item label="所属企业分类" prop="industryType">
                    <el-tree-select v-model="formData.industryType" :data="industryTreeOptions"
                        :props="{ label: 'label', value: 'value' }" placeholder="请选择企业分类" style="width: 100%;"
                        check-strictly :render-after-expand="false" @change="handleIndustryChange" />
                </el-form-item>
                <el-form-item label="所属支出范围名称" prop="scopeName">
                    <el-select v-model="formData.scopeName" placeholder="请选择支出范围" style="width: 100%;" filterable>
                        <el-option v-for="item in scopeOptions" :key="item.value" :label="item.label"
                            :value="item.value" />
                    </el-select>
                </el-form-item>
                <el-form-item label="负面清单名称" prop="negativeListName">
                    <el-input v-model="formData.negativeListName" type="textarea" :rows="3" placeholder="请输入负面清单名称"
                        maxlength="500" show-word-limit />
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" @click="handleSave">保存并关闭</el-button>
            </template>
        </el-dialog>

        <!-- 导入弹窗 -->
        <el-dialog v-model="importDialogVisible" title="导入负面清单" width="500px">
            <el-upload class="upload-demo" drag action="#" :auto-upload="false" :on-change="handleFileChange"
                accept=".xlsx,.xls">
                <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: #409EFF; margin-bottom: 16px;"></i>
                <div class="el-upload__text">将文件拖到此处，或<em>点击上传</em></div>
                <template #tip>
                    <div class="el-upload__tip">只能上传 xlsx/xls 文件</div>
                </template>
            </el-upload>
            <template #footer>
                <el-button @click="importDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmImport">确定导入</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, watch } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        createApp({
            setup() {
                const treeRef = ref(null);
                const formRef = ref(null);
                const treeFilterText = ref('');
                const currentIndustry = ref('');
                const currentIndustryLabel = ref('');
                const loading = ref(false);
                const selectedRows = ref([]);
                const currentPage = ref(1);
                const pageSize = ref(20);
                const dialogVisible = ref(false);
                const importDialogVisible = ref(false);
                const dialogTitle = ref('新建负面清单');
                const editingId = ref(null);
                const importFile = ref(null);

                const searchForm = ref({
                    scopeName: '',
                    negativeListName: ''
                });

                const formData = ref({
                    industryType: '',
                    scopeName: '',
                    negativeListName: ''
                });

                const formRules = ref({
                    industryType: [{ required: true, message: '请选择企业分类', trigger: 'change' }],
                    scopeName: [{ required: true, message: '请选择支出范围', trigger: 'change' }],
                    negativeListName: [{ required: true, message: '请输入负面清单名称', trigger: 'blur' }]
                });

                // 行业树数据
                const industryTree = ref([
                    {
                        label: '安全生产费用企业分类',
                        value: '',
                        icon: 'fas fa-building',
                        children: [
                            { label: '煤炭生产企业', value: 'coal', icon: 'fas fa-industry' },
                            { label: '非煤矿山开采企业', value: 'non_coal_mining', icon: 'fas fa-mountain' },
                            { label: '石油天然气开采企业', value: 'oil_gas', icon: 'fas fa-oil-can' },
                            { label: '建设工程施工企业', value: 'construction', icon: 'fas fa-hard-hat' },
                            { label: '危险品生产与存储企业', value: 'hazardous', icon: 'fas fa-exclamation-triangle' },
                            { label: '交通运输企业', value: 'transportation', icon: 'fas fa-truck' },
                            { label: '冶金企业', value: 'metallurgy', icon: 'fas fa-fire' },
                            { label: '机械制造企业', value: 'machinery', icon: 'fas fa-cogs' },
                            { label: '烟花爆竹生产企业', value: 'fireworks', icon: 'fas fa-bomb' },
                            { label: '民用爆炸物品生产企业', value: 'explosives', icon: 'fas fa-radiation' },
                            { label: '武器装备研制生产与实验企业', value: 'weapons', icon: 'fas fa-shield-alt' },
                            { label: '电力生产与供应企业', value: 'power', icon: 'fas fa-bolt' },
                            { label: '其他企业', value: 'other', icon: 'fas fa-ellipsis-h' }
                        ]
                    }
                ]);

                // 行业树选项（用于弹窗选择）
                const industryTreeOptions = computed(() => {
                    return industryTree.value[0].children.map(item => ({
                        label: item.label,
                        value: item.value
                    }));
                });

                // 支出范围选项（根据行业过滤）
                const allScopeOptions = ref([
                    { industryValue: 'power', value: '（一）安全防护设备、设施支出', label: '（一）安全防护设备、设施支出' },
                    { industryValue: 'power', value: '（二）应急救援器材支出', label: '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出' },
                    { industryValue: 'power', value: '（三）重大危险源检测支出', label: '（三）开展重大危险源检测、评估、监控支出' },
                    { industryValue: 'power', value: '（四）安全生产检查支出', label: '（四）安全生产检查、评估评价、咨询和标准化建设支出' },
                    { industryValue: 'power', value: '（五）安全生产宣传支出', label: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出' },
                    { industryValue: 'power', value: '（六）安全防护用品支出', label: '（六）配备和更新现场作业人员安全防护用品支出' },
                    { industryValue: 'power', value: '（七）新技术推广应用支出', label: '（七）安全生产适用的新技术、新标准的推广应用支出' },
                    { industryValue: 'power', value: '（八）安全设施检测支出', label: '（八）安全设施及特种设备检测检验、检定校准支出' },
                    { industryValue: 'power', value: '（九）安全生产责任保险支出', label: '（九）安全生产责任保险支出' },
                    { industryValue: 'power', value: '（十）其他支出', label: '（十）与安全生产直接相关的其他支出' },
                    { industryValue: 'coal', value: '煤炭（一）灾害防治', label: '（一）煤与瓦斯突出及冲击地压等灾害防治支出' },
                    { industryValue: 'coal', value: '煤炭（二）综合防尘', label: '（二）综合防尘和职业健康防护支出' },
                    { industryValue: 'coal', value: '煤炭（三）通风系统', label: '（三）通风系统装备及改造支出' }
                ]);

                const scopeOptions = computed(() => {
                    if (!formData.value.industryType) return [];
                    return allScopeOptions.value.filter(item => item.industryValue === formData.value.industryType);
                });

                const treeProps = {
                    children: 'children',
                    label: 'label'
                };

                // 模拟表格数据
                const tableData = ref([
                    {
                        id: 1,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（一）安全防护设备、设施支出',
                        negativeListName: '非生产经营活动所用安全防护设备的购置费用'
                    },
                    {
                        id: 2,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（一）安全防护设备、设施支出',
                        negativeListName: '日常办公设备（如空调、打印机等）的购置费用'
                    },
                    {
                        id: 3,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（二）应急救援器材支出',
                        negativeListName: '与安全生产无关的活动组织费用'
                    },
                    {
                        id: 4,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（三）重大危险源检测支出',
                        negativeListName: '用于重大危险源检测以外的日常环境监测费用'
                    },
                    {
                        id: 5,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（五）安全生产宣传支出',
                        negativeListName: '企业形象宣传、商业广告等与安全生产无关的宣传费用'
                    },
                    {
                        id: 6,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（五）安全生产宣传支出',
                        negativeListName: '非安全生产内容的培训费用（如管理培训、技能培训等）'
                    },
                    {
                        id: 7,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（六）安全防护用品支出',
                        negativeListName: '用于非生产作业人员的防护用品'
                    },
                    {
                        id: 8,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        scopeName: '（六）安全防护用品支出',
                        negativeListName: '超出合理标准的奢侈品类防护用品'
                    },
                    {
                        id: 9,
                        industryType: '煤炭生产企业',
                        industryValue: 'coal',
                        scopeName: '煤炭（一）灾害防治',
                        negativeListName: '与瓦斯、冲击地压防治无直接关系的一般性设备维护费用'
                    },
                    {
                        id: 10,
                        industryType: '煤炭生产企业',
                        industryValue: 'coal',
                        scopeName: '煤炭（二）综合防尘',
                        negativeListName: '非矿井作业区域的日常清洁费用'
                    }
                ]);

                // 过滤后的数据
                const filteredData = computed(() => {
                    let data = tableData.value;

                    // 按行业过滤
                    if (currentIndustry.value) {
                        data = data.filter(item => item.industryValue === currentIndustry.value);
                    }

                    // 按支出范围名称搜索
                    if (searchForm.value.scopeName) {
                        const keyword = searchForm.value.scopeName.toLowerCase();
                        data = data.filter(item => item.scopeName.toLowerCase().includes(keyword));
                    }

                    // 按负面清单名称搜索
                    if (searchForm.value.negativeListName) {
                        const keyword = searchForm.value.negativeListName.toLowerCase();
                        data = data.filter(item => item.negativeListName.toLowerCase().includes(keyword));
                    }

                    return data;
                });

                // 分页数据
                const pagedData = computed(() => {
                    const start = (currentPage.value - 1) * pageSize.value;
                    return filteredData.value.slice(start, start + pageSize.value);
                });

                // 树节点过滤
                const filterNode = (value, data) => {
                    if (!value) return true;
                    return data.label.includes(value);
                };

                // 监听树搜索文本变化
                watch(treeFilterText, (val) => {
                    treeRef.value?.filter(val);
                });

                // 树节点点击
                const handleNodeClick = (data) => {
                    currentIndustry.value = data.value;
                    currentIndustryLabel.value = data.value ? data.label : '';
                    currentPage.value = 1;
                };

                // 企业分类变化时清空支出范围
                const handleIndustryChange = () => {
                    formData.value.scopeName = '';
                };

                // 搜索
                const handleSearch = () => {
                    loading.value = true;
                    currentPage.value = 1;
                    setTimeout(() => {
                        loading.value = false;
                        ElMessage.success('查询完成');
                    }, 300);
                };

                // 重置
                const handleReset = () => {
                    searchForm.value.scopeName = '';
                    searchForm.value.negativeListName = '';
                    currentPage.value = 1;
                };

                // 选择变化
                const handleSelectionChange = (selection) => {
                    selectedRows.value = selection;
                };

                // 新建
                const handleAdd = () => {
                    editingId.value = null;
                    dialogTitle.value = '新建负面清单';
                    formData.value = {
                        industryType: currentIndustry.value || '',
                        scopeName: '',
                        negativeListName: ''
                    };
                    dialogVisible.value = true;
                };

                // 导入
                const handleImport = () => {
                    importFile.value = null;
                    importDialogVisible.value = true;
                };

                // 处理文件选择
                const handleFileChange = (file) => {
                    importFile.value = file;
                };

                // 确认导入
                const confirmImport = () => {
                    if (!importFile.value) {
                        ElMessage.warning('请先选择文件');
                        return;
                    }
                    ElMessage.success('导入成功');
                    importDialogVisible.value = false;
                };

                // 编辑
                const handleEdit = (row) => {
                    editingId.value = row.id;
                    dialogTitle.value = '编辑负面清单';
                    formData.value = {
                        industryType: row.industryValue,
                        scopeName: row.scopeName,
                        negativeListName: row.negativeListName
                    };
                    dialogVisible.value = true;
                };

                // 保存
                const handleSave = async () => {
                    try {
                        await formRef.value.validate();

                        const industryLabel = industryTreeOptions.value.find(
                            item => item.value === formData.value.industryType
                        )?.label || '';

                        if (editingId.value) {
                            // 编辑模式：更新现有数据
                            const index = tableData.value.findIndex(item => item.id === editingId.value);
                            if (index > -1) {
                                tableData.value[index] = {
                                    ...tableData.value[index],
                                    industryType: industryLabel,
                                    industryValue: formData.value.industryType,
                                    scopeName: formData.value.scopeName,
                                    negativeListName: formData.value.negativeListName
                                };
                            }
                            ElMessage.success('更新成功');
                        } else {
                            // 新建模式
                            const newItem = {
                                id: Date.now(),
                                industryType: industryLabel,
                                industryValue: formData.value.industryType,
                                scopeName: formData.value.scopeName,
                                negativeListName: formData.value.negativeListName
                            };
                            tableData.value.push(newItem);
                            ElMessage.success('添加成功');
                        }

                        dialogVisible.value = false;
                    } catch (error) {
                        // 验证失败
                    }
                };

                // 删除单条
                const handleDelete = (row) => {
                    ElMessageBox.confirm(
                        '确定要删除该负面清单吗？',
                        '确认删除',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        const index = tableData.value.findIndex(item => item.id === row.id);
                        if (index > -1) {
                            tableData.value.splice(index, 1);
                        }
                        ElMessage.success('删除成功');
                    }).catch(() => { });
                };

                // 批量删除
                const handleBatchDelete = () => {
                    ElMessageBox.confirm(
                        `确定要删除选中的 ${selectedRows.value.length} 条记录吗？`,
                        '确认删除',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        const idsToDelete = selectedRows.value.map(row => row.id);
                        tableData.value = tableData.value.filter(item => !idsToDelete.includes(item.id));
                        ElMessage.success('删除成功');
                        selectedRows.value = [];
                    }).catch(() => { });
                };

                return {
                    treeRef,
                    formRef,
                    treeFilterText,
                    currentIndustry,
                    currentIndustryLabel,
                    loading,
                    selectedRows,
                    currentPage,
                    pageSize,
                    searchForm,
                    industryTree,
                    industryTreeOptions,
                    scopeOptions,
                    treeProps,
                    tableData,
                    filteredData,
                    pagedData,
                    dialogVisible,
                    importDialogVisible,
                    dialogTitle,
                    formData,
                    formRules,
                    filterNode,
                    handleNodeClick,
                    handleIndustryChange,
                    handleSearch,
                    handleReset,
                    handleSelectionChange,
                    handleAdd,
                    handleImport,
                    handleFileChange,
                    confirmImport,
                    handleEdit,
                    handleSave,
                    handleDelete,
                    handleBatchDelete
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
