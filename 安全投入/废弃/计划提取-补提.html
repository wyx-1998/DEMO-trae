<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用计提管理 - 补提费用</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        .formula-hint {
            font-size: 12px;
            color: #67C23A;
            margin-top: 4px;
        }

        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 200px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        .total-info {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            color: #606266;
        }

        .total-info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .total-info-label {
            color: #606266;
        }

        .total-info-value {
            font-weight: 700;
            color: #303133;
            font-size: 15px;
        }

        .table-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        .supplement-input .el-input__inner {
            text-align: right;
            color: #409EFF;
            font-weight: normal;
        }

        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" label-width="140px" label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编号" prop="code">
                                    <el-input v-model="formData.code" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="组织名称" prop="orgName">
                                    <el-input v-model="formData.orgName" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属行业类型" prop="industryType">
                                    <el-input v-model="formData.industryType" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取类型" prop="extractType">
                                    <el-input v-model="formData.extractType" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取规则类型" prop="ruleType">
                                    <el-input v-model="formData.ruleTypeDisplay" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取周期类型" prop="cycleType">
                                    <el-input v-model="formData.cycleTypeDisplay" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取周期" prop="cycle">
                                    <el-input :model-value="formData.cycle + '年'" disabled />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 提取数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('extract')">
                    <div class="module-title">
                        <i class="fas fa-calculator"></i>
                        提取数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.extract }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.extract }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="200px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取依据名称">
                                    <el-input v-model="formData.basisName" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取依据值">
                                    <el-input :model-value="formatAmount(formData.basisValue)" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="本周期应提取金额(元)">
                                    <el-input :model-value="formatAmount(formData.shouldExtractAmount)" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="本周期计划金额(元)">
                                    <el-input :model-value="formatAmount(formData.planBudget)" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="上一周期结余金额(元)">
                                    <el-input :model-value="formatAmount(formData.carryOver)" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="本周期已提取金额(元)">
                                    <el-input :model-value="formatAmount(formData.extractedAmount)" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="本周期补提金额(元)" prop="supplementAmount" required>
                                    <el-input v-model="formData.supplementAmountDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleSupplementInput"
                                        @blur="formatSupplementAmount" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item required>
                                    <template #label>
                                        <span>本周期累计提取金额(元)</span>
                                        <el-tooltip placement="top" effect="light">
                                            <template #content>
                                                本周期累计提取金额=本周期已提取金额+本周期补提金额
                                            </template>
                                            <i class="fas fa-question-circle"
                                                style="color: #909399; font-size: 12px; cursor: help; margin-left: 4px;"></i>
                                        </el-tooltip>
                                    </template>
                                    <el-input v-model="formData.accumulatedAmountDisplay" placeholder="自动计算"
                                        :disabled="isView" @input="handleAccumulatedInput"
                                        @blur="formatAccumulatedAmount" />
                                    <div class="formula-hint">= 本周期已提取金额 + 本周期补提金额</div>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="补提原因备注" prop="remark">
                                    <el-input v-model="formData.remark" type="textarea" :rows="3"
                                        placeholder="请输入补提原因备注" :disabled="isView" :maxlength="500" show-word-limit />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细计划模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('plan')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        详细计划
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.plan }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.plan }">
                    <div class="table-toolbar">
                        <div class="total-info">
                            <div class="total-info-item">
                                <span class="total-info-label">本周期已提取总额(元)：</span>
                                <span class="total-info-value">{{ formatAmount(totalExtracted) }}</span>
                            </div>
                            <span style="color: #dcdfe6;">|</span>
                            <div class="total-info-item">
                                <span class="total-info-label">本周期补提总额(元)：</span>
                                <span class="total-info-value" style="color: #409EFF;">{{ formatAmount(totalSupplement)
                                    }}</span>
                            </div>
                        </div>
                    </div>
                    <el-table :data="categoriesData" border stripe>
                        <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                        <el-table-column prop="name" label="支出范围类别名称" min-width="300"></el-table-column>
                        <el-table-column prop="planCost" label="本周期计划金额(元)" width="180" align="right">
                            <template #default="{ row }">
                                {{ formatAmount(row.planCost) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="本周期已提取金额(元)" width="180" align="right">
                            <template #default="{ row }">
                                <span style="color: #303133;">{{ formatAmount(row.extractedAmount) }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column label="本周期补提金额(元)" width="180" align="right">
                            <template #default="{ row }">
                                <template v-if="!isView">
                                    <el-input v-model="row.supplementAmountDisplay" class="supplement-input"
                                        placeholder="请输入" @input="handleCategoryInput(row)"
                                        @blur="formatCategoryAmount(row)" />
                                </template>
                                <template v-else>
                                    <span style="color: #409EFF; font-weight: 600;">{{
                                        formatAmount(row.supplementAmount) }}</span>
                                </template>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);

                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');

                const modules = ref({
                    basic: true,
                    extract: true,
                    plan: true
                });

                const formData = ref({
                    code: 'AQTRJH-2026-001',
                    orgName: 'xx电力',
                    industryType: '电力生产与供应企业',
                    extractType: '电力生产企业',
                    ruleType: 'excess',
                    ruleTypeDisplay: '超额累退',
                    cycleType: 'yearly',
                    cycleTypeDisplay: '年度分摊提取',
                    cycle: '2026',
                    basisName: '上一年度营业收入(元)',
                    basisValue: 1500000000,
                    shouldExtractAmount: 15500000,
                    planBudget: 14500000,
                    carryOver: 50000,
                    extractedAmount: 15550000,
                    supplementAmount: 0,
                    supplementAmountDisplay: '',
                    accumulatedAmount: 15550000,
                    accumulatedAmountDisplay: '15,550,000.00',
                    remark: '',
                    categories: []
                });

                const formRules = ref({
                    supplementAmount: [{ required: true, message: '请输入补提金额', trigger: 'blur' }]
                });

                const defaultCategories = [
                    { code: 'TRLB-0001', name: '（一）安全防护设备、设施支出', planCost: 2000000, extractedAmount: 2200000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0002', name: '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出', planCost: 1800000, extractedAmount: 1980000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0003', name: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出', planCost: 1500000, extractedAmount: 1650000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0004', name: '（四）安全生产检查、评估评价、咨询和标准化建设支出', planCost: 1200000, extractedAmount: 1320000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0005', name: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出', planCost: 1000000, extractedAmount: 1100000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0006', name: '（六）配备和更新现场作业人员安全防护用品支出', planCost: 800000, extractedAmount: 880000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0007', name: '（七）安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出', planCost: 1500000, extractedAmount: 1650000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0008', name: '（八）安全设施及特种设备检测检验、检定校准支出', planCost: 1000000, extractedAmount: 1100000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0009', name: '（九）安全生产责任保险支出', planCost: 500000, extractedAmount: 550000, supplementAmount: 0, supplementAmountDisplay: '' },
                    { code: 'TRLB-0010', name: '（十）与安全生产直接相关的其他支出', planCost: 700000, extractedAmount: 770000, supplementAmount: 0, supplementAmountDisplay: '' }
                ];

                const categoriesData = computed(() => formData.value.categories);

                const totalExtracted = computed(() => {
                    return formData.value.categories.reduce((sum, item) => sum + (item.extractedAmount || 0), 0);
                });

                const totalSupplement = computed(() => {
                    return formData.value.categories.reduce((sum, item) => sum + (item.supplementAmount || 0), 0);
                });

                // 监听补提金额变化，自动计算累计金额
                watch(totalSupplement, (newVal) => {
                    formData.value.supplementAmount = newVal;
                    formData.value.supplementAmountDisplay = formatAmount(newVal);
                    updateAccumulatedAmount();
                });

                const updateAccumulatedAmount = () => {
                    const accumulated = formData.value.extractedAmount + formData.value.supplementAmount;
                    formData.value.accumulatedAmount = accumulated;
                    formData.value.accumulatedAmountDisplay = formatAmount(accumulated);
                };

                const formatAmount = (value) => {
                    if (value === null || value === undefined || value === '') return '-';
                    const num = parseFloat(value);
                    if (isNaN(num)) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(num);
                };

                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                const handleSupplementInput = (value) => {
                    formData.value.supplementAmountDisplay = value.replace(/[^\d.]/g, '');
                };

                const formatSupplementAmount = () => {
                    const value = parseAmount(formData.value.supplementAmountDisplay);
                    formData.value.supplementAmount = value;
                    formData.value.supplementAmountDisplay = formatAmount(value);
                    updateAccumulatedAmount();
                };

                const handleAccumulatedInput = (value) => {
                    formData.value.accumulatedAmountDisplay = value.replace(/[^\d.]/g, '');
                };

                const formatAccumulatedAmount = () => {
                    const value = parseAmount(formData.value.accumulatedAmountDisplay);
                    formData.value.accumulatedAmount = value;
                    formData.value.accumulatedAmountDisplay = formatAmount(value);
                };

                const handleCategoryInput = (row) => {
                    row.supplementAmountDisplay = row.supplementAmountDisplay.replace(/[^\d.]/g, '');
                };

                const formatCategoryAmount = (row) => {
                    const value = parseAmount(row.supplementAmountDisplay);
                    row.supplementAmount = value;
                    row.supplementAmountDisplay = value.toFixed(2);
                };

                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    formData.value.categories = JSON.parse(JSON.stringify(defaultCategories));

                    if (id && mode.value === 'view') {
                        loadData(id);
                    }
                });

                const loadData = (id) => {
                    // 模拟加载已有补提记录
                    const presetData = {
                        '1': {
                            supplementAmount: 500000,
                            supplementAmountDisplay: '500,000.00',
                            categories: defaultCategories.map(cat => ({
                                ...cat,
                                supplementAmount: Math.round(cat.extractedAmount * 0.05),
                                supplementAmountDisplay: formatAmount(Math.round(cat.extractedAmount * 0.05))
                            }))
                        }
                    };

                    if (presetData[id]) {
                        const data = presetData[id];
                        formData.value.supplementAmount = data.supplementAmount;
                        formData.value.supplementAmountDisplay = data.supplementAmountDisplay;
                        formData.value.categories = data.categories;
                        updateAccumulatedAmount();
                    }
                };

                const handleSave = () => {
                    if (totalSupplement.value <= 0) {
                        ElMessage.warning('请输入补提金额');
                        return;
                    }
                    ElMessage.success('补提费用保存成功');
                    setTimeout(() => {
                        goBack();
                    }, 1000);
                };

                const goBack = () => {
                    window.location.href = '计划提取.html';
                };

                return {
                    formRef,
                    mode,
                    isView,
                    modules,
                    formData,
                    formRules,
                    categoriesData,
                    totalExtracted,
                    totalSupplement,
                    formatAmount,
                    handleSupplementInput,
                    formatSupplementAmount,
                    handleAccumulatedInput,
                    formatAccumulatedAmount,
                    handleCategoryInput,
                    formatCategoryAmount,
                    toggleModule,
                    handleSave,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
