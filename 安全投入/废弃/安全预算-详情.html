<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全预算管理 - 安全预算详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 表格样式 */
        .budget-table {
            width: 100%;
            border-collapse: collapse;
        }

        .budget-table th,
        .budget-table td {
            border: 1px solid #ebeef5;
            padding: 12px 16px;
            text-align: left;
        }

        .budget-table th {
            background: #fafafa;
            font-weight: 600;
            color: #606266;
        }

        .budget-table td {
            color: #303133;
        }

        .budget-table .number-cell {
            text-align: right;
        }

        /* 表单标签右对齐，最多6字换行 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 160px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        /* 两措属性标签 */
        .measure-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .measure-an {
            background-color: #e6f7ff;
            color: #1890ff;
        }

        .measure-fan {
            background-color: #fff7e6;
            color: #fa8c16;
        }

        .measure-other {
            background-color: #f6ffed;
            color: #52c41a;
        }

        /* 表格操作栏 */
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        /* 合计信息显示 */
        .total-info {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            color: #606266;
        }

        .total-info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .total-info-label {
            color: #606266;
        }

        .total-info-value {
            font-weight: 700;
            color: #303133;
            font-size: 15px;
        }

        /* 嵌套表格样式 */
        .nested-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }

        .nested-table th,
        .nested-table td {
            border: 1px solid #ebeef5;
            padding: 10px 14px;
            text-align: left;
        }

        .nested-table th {
            background: #f5f7fa;
            font-weight: 600;
            color: #606266;
            font-size: 13px;
        }

        .nested-table td {
            color: #303133;
            font-size: 13px;
        }

        /* 展开行样式 */
        .expand-row {
            cursor: pointer;
        }

        .expand-row:hover {
            background-color: #f5f7fa;
        }

        .expand-icon {
            color: #409EFF;
            margin-right: 8px;
            transition: transform 0.3s;
        }

        .expand-icon.expanded {
            transform: rotate(90deg);
        }

        .child-row {
            background-color: #fafafa;
        }

        .child-table-wrapper {
            padding: 12px 12px 12px 40px;
            background-color: #fafafa;
        }

        /* 弹窗表单两列布局 */
        .dialog-form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 0;
        }

        .dialog-form-row .el-form-item {
            flex: 1;
            min-width: 0;
        }

        .dialog-form-row .el-form-item.full-width {
            flex: 0 0 100%;
        }

        /* 弹窗内容滚动区域 */
        .dialog-scroll-content {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="160px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编号" prop="code">
                                    <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="预算时间" prop="budgetYear" required>
                                    <el-date-picker v-model="formData.budgetYear" type="year" placeholder="请选择年份"
                                        value-format="YYYY" style="width: 100%;" :disabled="isView" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="预算总金额（元）" prop="totalBudget" required>
                                    <el-input v-model="formData.totalBudgetDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleBudgetInput" @blur="formatBudget">
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细预算模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('detail')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        详细预算
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.detail }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.detail }">
                    <!-- 编辑模式下的表格 -->
                    <template v-if="!isView">
                        <div class="table-toolbar">
                            <el-button type="primary" @click="openAddPlanDialog">
                                <i class="fas fa-plus"></i> 新增计划
                            </el-button>
                            <div class="total-info">
                                <div class="total-info-item">
                                    <span class="total-info-label">计划投入费用总额（元）：</span>
                                    <span class="total-info-value">{{ formatAmount(totalPlanCost) }}</span>
                                </div>
                                <span style="color: #dcdfe6;">|</span>
                                <div class="total-info-item">
                                    <span class="total-info-label">投入预算总额（元）：</span>
                                    <span class="total-info-value">{{ formatAmount(totalDetailBudget) }}</span>
                                </div>
                            </div>
                        </div>
                        <table class="budget-table">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">序号</th>
                                    <th>项目名称</th>
                                    <th>投入类别名称</th>
                                    <th style="width: 100px;">两措类型</th>
                                    <th style="width: 160px;" class="number-cell">计划投入费用（元）</th>
                                    <th style="width: 180px;" class="number-cell">投入预算（元）</th>
                                    <th style="width: 80px;">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(item, index) in budgetDetails" :key="item.id">
                                    <td>{{ index + 1 }}</td>
                                    <td>{{ item.projectName }}</td>
                                    <td>{{ item.categoryName }}</td>
                                    <td>
                                        <span v-if="item.measureType"
                                            :class="['measure-tag', getMeasureClass(item.measureType)]">
                                            {{ item.measureType }}
                                        </span>
                                        <span v-else>-</span>
                                    </td>
                                    <td class="number-cell">{{ formatAmount(item.planCost) }}</td>
                                    <td class="number-cell">
                                        <el-input v-model="item.budgetDisplay" placeholder="请输入预算"
                                            @input="handleItemInput(index)" @blur="formatItemBudget(index)"
                                            size="small" />
                                    </td>
                                    <td style="text-align: center;">
                                        <el-button size="small" link @click="deleteItem(index)">
                                            <i class="fas fa-trash-alt" style="color: #F56C6C;"></i>
                                        </el-button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </template>

                    <!-- 查看模式下的嵌套表格 -->
                    <template v-else>
                        <div class="table-toolbar">
                            <div></div>
                            <div class="total-info">
                                <div class="total-info-item">
                                    <span class="total-info-label">计划投入费用总额（元）：</span>
                                    <span class="total-info-value">{{ formatAmount(totalPlanCost) }}</span>
                                </div>
                                <span style="color: #dcdfe6;">|</span>
                                <div class="total-info-item">
                                    <span class="total-info-label">投入预算总额（元）：</span>
                                    <span class="total-info-value">{{ formatAmount(totalDetailBudget) }}</span>
                                </div>
                            </div>
                        </div>
                        <table class="budget-table">
                            <thead>
                                <tr>
                                    <th style="width: 90px;">序号</th>
                                    <th>投入类别名称</th>
                                    <th style="width: 180px;" class="number-cell">计划投入费用（元）</th>
                                    <th style="width: 180px;" class="number-cell">投入预算（元）</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template v-for="(category, cIndex) in groupedBudgetData" :key="category.id">
                                    <tr class="expand-row" @click="toggleExpand(category.id)">
                                        <td>
                                            {{ cIndex + 1 }}
                                            <i class="fas fa-chevron-right expand-icon"
                                                :class="{ expanded: expandedRows.includes(category.id) }"
                                                style="margin-left: 8px;"></i>
                                        </td>
                                        <td>{{ category.categoryName }}</td>
                                        <td class="number-cell">{{ formatAmount(category.totalPlanCost) }}</td>
                                        <td class="number-cell">{{ formatAmount(category.totalBudget) }}</td>
                                    </tr>
                                    <tr v-if="expandedRows.includes(category.id)">
                                        <td colspan="4" style="padding: 0;">
                                            <div class="child-table-wrapper">
                                                <table class="nested-table">
                                                    <thead>
                                                        <tr>
                                                            <th style="width: 50px;">序号</th>
                                                            <th>项目名称</th>
                                                            <th>投入类别名称</th>
                                                            <th style="width: 100px;">两措类型</th>
                                                            <th style="width: 140px;" class="number-cell">计划投入费用（元）
                                                            </th>
                                                            <th style="width: 140px;" class="number-cell">投入预算（元）</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr v-for="(item, iIndex) in category.children" :key="item.id">
                                                            <td>{{ iIndex + 1 }}</td>
                                                            <td>{{ item.projectName }}</td>
                                                            <td>{{ item.categoryName }}</td>
                                                            <td>
                                                                <span v-if="item.measureType"
                                                                    :class="['measure-tag', getMeasureClass(item.measureType)]">
                                                                    {{ item.measureType }}
                                                                </span>
                                                                <span v-else>-</span>
                                                            </td>
                                                            <td class="number-cell">{{ formatAmount(item.planCost) }}
                                                            </td>
                                                            <td class="number-cell">{{ formatAmount(item.budget) }}
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>

        <!-- 新增计划弹窗 -->
        <el-dialog v-model="addPlanDialogVisible" title="新增计划" width="750px" :close-on-click-modal="false">
            <div class="dialog-scroll-content">
                <el-form :model="planFormData" :rules="planFormRules" ref="planFormRef" label-width="120px"
                    label-position="left">
                    <div class="dialog-form-row">
                        <el-form-item label="项目编号" prop="projectCode" required>
                            <el-input v-model="planFormData.projectCode" placeholder="请输入项目编号" />
                        </el-form-item>
                        <el-form-item label="两措属性" prop="measureType" required>
                            <el-select v-model="planFormData.measureType" placeholder="请选择两措属性" style="width: 100%;">
                                <el-option label="安措" value="安措"></el-option>
                                <el-option label="反措" value="反措"></el-option>
                                <el-option label="其他" value="其他"></el-option>
                            </el-select>
                        </el-form-item>
                    </div>
                    <div class="dialog-form-row">
                        <el-form-item label="所属类别" prop="categoryName" required>
                            <el-select v-model="planFormData.categoryName" placeholder="请选择所属类别" style="width: 100%;">
                                <el-option v-for="cat in categoryOptions" :key="cat" :label="cat"
                                    :value="cat"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item label="项目名称" prop="projectName" required>
                            <el-input v-model="planFormData.projectName" placeholder="请输入项目名称" />
                        </el-form-item>
                    </div>
                    <el-form-item label="项目内容" prop="projectContent" required>
                        <el-input v-model="planFormData.projectContent" type="textarea" :rows="3" placeholder="请输入项目内容"
                            maxlength="200" show-word-limit />
                    </el-form-item>
                    <div class="dialog-form-row">
                        <el-form-item label="计划完成时间" prop="planFinishDate" required>
                            <el-date-picker v-model="planFormData.planFinishDate" type="date" placeholder="请选择日期"
                                value-format="YYYY-MM-DD" style="width: 100%;" />
                        </el-form-item>
                        <el-form-item label="计划投入费用" prop="planCost" required>
                            <el-input v-model="planFormData.planCost" placeholder="请输入计划投入费用">
                                <template #suffix><span style="color: #909399;">元</span></template>
                            </el-input>
                        </el-form-item>
                    </div>
                    <div class="dialog-form-row">
                        <el-form-item label="责任单位" prop="responsibleUnit" required>
                            <el-select v-model="planFormData.responsibleUnit" placeholder="请选择责任单位"
                                style="width: 100%;">
                                <el-option v-for="unit in unitOptions" :key="unit" :label="unit"
                                    :value="unit"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item label="责任人" prop="responsiblePerson" required>
                            <el-input v-model="planFormData.responsiblePerson" placeholder="请输入责任人" />
                        </el-form-item>
                    </div>
                    <el-form-item label="备注" prop="remark" required>
                        <el-input v-model="planFormData.remark" type="textarea" :rows="3" placeholder="请输入备注"
                            maxlength="200" show-word-limit />
                    </el-form-item>
                </el-form>
            </div>
            <template #footer>
                <el-button @click="addPlanDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="savePlan">保存</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);
                const planFormRef = ref(null);

                // 页面模式
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');

                // 模块折叠状态
                const modules = ref({
                    basic: true,
                    detail: true
                });

                // 展开行状态
                const expandedRows = ref([]);

                // 表单数据
                const formData = ref({
                    code: '',
                    budgetYear: '2026',
                    totalBudget: 0,
                    totalBudgetDisplay: ''
                });

                // 详细预算数据（使用电力生产与供应企业一级投入类别，按排序号排序）
                const budgetDetails = ref([
                    { id: 1, projectName: '安全标志购置', categoryName: '（一）安全防护设备、设施支出', measureType: '安措', planCost: 500000, budget: 600000, budgetDisplay: '600,000.00' },
                    { id: 2, projectName: '防护设备采购', categoryName: '（一）安全防护设备、设施支出', measureType: '安措', planCost: 1200000, budget: 1500000, budgetDisplay: '1,500,000.00' },
                    { id: 3, projectName: '应急装备配置', categoryName: '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出', measureType: '反措', planCost: 1500000, budget: 1800000, budgetDisplay: '1,800,000.00' },
                    { id: 4, projectName: '隐患排查整改', categoryName: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出', measureType: '安措', planCost: 2000000, budget: 2500000, budgetDisplay: '2,500,000.00' },
                    { id: 5, projectName: '安全检查评价', categoryName: '（四）安全生产检查、评估评价、咨询和标准化建设支出', measureType: '反措', planCost: 1000000, budget: 1200000, budgetDisplay: '1,200,000.00' },
                    { id: 6, projectName: '安全技能培训', categoryName: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出', measureType: '安措', planCost: 800000, budget: 1000000, budgetDisplay: '1,000,000.00' },
                    { id: 7, projectName: '劳动防护用品', categoryName: '（六）配备和更新现场作业人员安全防护用品支出', measureType: '其他', planCost: 800000, budget: 1000000, budgetDisplay: '1,000,000.00' },
                    { id: 8, projectName: '安全新技术应用', categoryName: '（七）安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出', measureType: '安措', planCost: 2000000, budget: 2500000, budgetDisplay: '2,500,000.00' },
                    { id: 9, projectName: '安全生产责任保险', categoryName: '（九）安全生产责任保险支出', measureType: '其他', planCost: 500000, budget: 800000, budgetDisplay: '800,000.00' },
                    { id: 10, projectName: '其他安全生产支出', categoryName: '（十）与安全生产直接相关的其他支出', measureType: '其他', planCost: 300000, budget: 400000, budgetDisplay: '400,000.00' }
                ]);

                // 分组后的预算数据（查看模式使用）
                const groupedBudgetData = computed(() => {
                    const groups = {};
                    budgetDetails.value.forEach(item => {
                        if (!groups[item.categoryName]) {
                            groups[item.categoryName] = {
                                id: 'cat-' + item.categoryName,
                                categoryName: item.categoryName,
                                totalPlanCost: 0,
                                totalBudget: 0,
                                children: []
                            };
                        }
                        groups[item.categoryName].totalPlanCost += item.planCost || 0;
                        groups[item.categoryName].totalBudget += item.budget || 0;
                        groups[item.categoryName].children.push(item);
                    });
                    return Object.values(groups);
                });

                // 切换展开状态
                const toggleExpand = (id) => {
                    const index = expandedRows.value.indexOf(id);
                    if (index > -1) {
                        expandedRows.value.splice(index, 1);
                    } else {
                        expandedRows.value.push(id);
                    }
                };

                // 类别选项（电力生产与供应企业一级投入类别）
                const categoryOptions = ref([
                    '（一）安全防护设备、设施支出',
                    '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                    '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出',
                    '（四）安全生产检查、评估评价、咨询和标准化建设支出',
                    '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出',
                    '（六）配备和更新现场作业人员安全防护用品支出',
                    '（七）安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出',
                    '（八）安全设施及特种设备检测检验、检定校准支出',
                    '（九）安全生产责任保险支出',
                    '（十）与安全生产直接相关的其他支出'
                ]);

                // 责任单位选项
                const unitOptions = ref([
                    '安全生产部',
                    '设备管理部',
                    '人力资源部',
                    '综合管理部',
                    '生产运营部'
                ]);

                // 新增计划弹窗
                const addPlanDialogVisible = ref(false);
                const planFormData = ref({
                    projectCode: '',
                    measureType: '',
                    categoryName: '',
                    projectName: '',
                    projectContent: '',
                    planFinishDate: '',
                    planCost: '',
                    responsibleUnit: '',
                    responsiblePerson: '',
                    remark: ''
                });

                const planFormRules = ref({
                    projectCode: [{ required: true, message: '请输入项目编号', trigger: 'blur' }],
                    measureType: [{ required: true, message: '请选择两措属性', trigger: 'change' }],
                    categoryName: [{ required: true, message: '请选择所属类别', trigger: 'change' }],
                    projectName: [{ required: true, message: '请输入项目名称', trigger: 'blur' }],
                    projectContent: [{ required: true, message: '请输入项目内容', trigger: 'blur' }],
                    planFinishDate: [{ required: true, message: '请选择计划完成时间', trigger: 'change' }],
                    planCost: [{ required: true, message: '请输入计划投入费用', trigger: 'blur' }],
                    responsibleUnit: [{ required: true, message: '请选择责任单位', trigger: 'change' }],
                    responsiblePerson: [{ required: true, message: '请输入责任人', trigger: 'blur' }],
                    remark: [{ required: true, message: '请输入备注', trigger: 'blur' }]
                });

                // 打开新增计划弹窗
                const openAddPlanDialog = () => {
                    // 生成默认项目编号
                    const now = new Date();
                    const dateStr = now.getFullYear().toString() +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0');
                    const seq = String(budgetDetails.value.length + 1).padStart(4, '0');

                    planFormData.value = {
                        projectCode: `AQTRJH-${dateStr}-${seq}`,
                        measureType: '',
                        categoryName: '',
                        projectName: '',
                        projectContent: '',
                        planFinishDate: '',
                        planCost: '',
                        responsibleUnit: '',
                        responsiblePerson: '',
                        remark: ''
                    };
                    addPlanDialogVisible.value = true;
                };

                // 保存新增计划
                const savePlan = () => {
                    planFormRef.value?.validate((valid) => {
                        if (valid) {
                            const newId = Date.now();
                            const planCostValue = parseFloat(planFormData.value.planCost.replace(/,/g, '')) || 0;
                            budgetDetails.value.push({
                                id: newId,
                                projectName: planFormData.value.projectName,
                                categoryName: planFormData.value.categoryName,
                                measureType: planFormData.value.measureType,
                                planCost: planCostValue,
                                budget: 0,
                                budgetDisplay: '0.00'
                            });
                            addPlanDialogVisible.value = false;
                            ElMessage.success('计划添加成功');
                        } else {
                            ElMessage.warning('请填写完整信息');
                        }
                    });
                };

                // 删除项
                const deleteItem = (index) => {
                    budgetDetails.value.splice(index, 1);
                    ElMessage.success('删除成功');
                };

                // 计算总计划费用
                const totalPlanCost = computed(() => {
                    return budgetDetails.value.reduce((sum, item) => sum + (item.planCost || 0), 0);
                });

                // 计算总详细预算
                const totalDetailBudget = computed(() => {
                    return budgetDetails.value.reduce((sum, item) => sum + (item.budget || 0), 0);
                });

                // 表单验证规则
                const formRules = ref({
                    budgetYear: [{ required: true, message: '请选择预算时间', trigger: 'change' }],
                    totalBudget: [{ required: true, message: '请输入预算总金额', trigger: 'blur' }]
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 解析金额字符串
                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                // 处理预算输入
                const handleBudgetInput = (value) => {
                    formData.value.totalBudgetDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化预算显示
                const formatBudget = () => {
                    const value = parseAmount(formData.value.totalBudgetDisplay);
                    formData.value.totalBudget = value;
                    formData.value.totalBudgetDisplay = formatAmount(value);
                };

                // 处理明细项输入
                const handleItemInput = (index) => {
                    budgetDetails.value[index].budgetDisplay = budgetDetails.value[index].budgetDisplay.replace(/[^\d.]/g, '');
                };

                // 格式化明细项预算
                const formatItemBudget = (index) => {
                    const value = parseAmount(budgetDetails.value[index].budgetDisplay);
                    budgetDetails.value[index].budget = value;
                    budgetDetails.value[index].budgetDisplay = formatAmount(value);
                };

                // 获取两措属性样式类
                const getMeasureClass = (type) => {
                    const map = {
                        '安措': 'measure-an',
                        '反措': 'measure-fan',
                        '其他': 'measure-other'
                    };
                    return map[type] || '';
                };

                // 生成编号
                const generateCode = () => {
                    const year = formData.value.budgetYear || new Date().getFullYear().toString();
                    const randomNum = String(Math.floor(Math.random() * 999) + 1).padStart(3, '0');
                    formData.value.code = `AQYS-${year}-${randomNum}`;
                };

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    } else {
                        generateCode();
                    }
                });

                // 加载数据
                const loadData = (id) => {
                    const presetData = {
                        '1': {
                            code: 'AQYS-2026-001',
                            budgetYear: '2026',
                            totalBudget: 15000000,
                            totalBudgetDisplay: '15,000,000.00'
                        }
                    };

                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };
                    } else {
                        generateCode();
                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 切换到编辑模式
                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                // 返回列表
                const goBack = () => {
                    window.location.href = '安全预算.html';
                };

                return {
                    formRef,
                    planFormRef,
                    mode,
                    isView,
                    modules,
                    formData,
                    formRules,
                    budgetDetails,
                    groupedBudgetData,
                    expandedRows,
                    totalPlanCost,
                    totalDetailBudget,
                    categoryOptions,
                    unitOptions,
                    addPlanDialogVisible,
                    planFormData,
                    planFormRules,
                    formatAmount,
                    handleBudgetInput,
                    formatBudget,
                    handleItemInput,
                    formatItemBudget,
                    getMeasureClass,
                    toggleModule,
                    toggleExpand,
                    openAddPlanDialog,
                    savePlan,
                    deleteItem,
                    handleSave,
                    switchToEdit,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
