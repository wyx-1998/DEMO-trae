<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用计提（相关方） - 详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        .formula-hint {
            font-size: 12px;
            color: #67C23A;
            margin-top: 4px;
        }

        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 200px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        .total-info {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            color: #606266;
        }

        .total-info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .total-info-label {
            color: #606266;
        }

        .total-info-value {
            font-weight: 700;
            color: #303133;
            font-size: 15px;
        }

        .table-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        .accrual-amount-input .el-input__inner {
            text-align: right;
            color: #409EFF;
            font-weight: normal;
        }

        .project-select-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-select-input .el-select {
            flex: 1;
        }

        .project-select-btn {
            flex-shrink: 0;
        }

        .project-dialog-search {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .project-dialog-search .el-input {
            width: 200px;
        }

        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="160px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="关联相关方项目" prop="relatedProject" required>
                                    <div class="project-select-input">
                                        <el-select v-model="formData.relatedProject" placeholder="请选择项目"
                                            :disabled="isView" style="flex: 1;" filterable>
                                            <el-option v-for="project in allProjects" :key="project.id"
                                                :label="project.name" :value="project.id"></el-option>
                                        </el-select>
                                        <el-button class="project-select-btn" :disabled="isView"
                                            @click="openProjectDialog">
                                            <i class="fas fa-search"></i>
                                        </el-button>
                                    </div>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="编号" prop="code" required>
                                    <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属行业类型" prop="industryType" required>
                                    <el-input v-model="formData.industryType" placeholder="行业类型" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取类型" prop="extractType" required>
                                    <el-input v-model="formData.extractType" placeholder="提取类型" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取规则类型" prop="ruleType" required>
                                    <el-select v-model="formData.ruleType" placeholder="请选择" disabled
                                        style="width: 100%;">
                                        <el-option label="超额累退" value="excess"></el-option>
                                        <el-option label="比例提取" value="proportion"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取周期类型" prop="cycleType" required>
                                    <el-select v-model="formData.cycleType" placeholder="请选择" disabled
                                        style="width: 100%;">
                                        <el-option label="年度分摊提取" value="yearly"></el-option>
                                        <el-option label="月度实时提取" value="monthly"></el-option>
                                        <el-option label="项目进度提取" value="project"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取周期" prop="cycle" required>
                                    <el-date-picker v-model="formData.cycle" type="year" placeholder="请选择年份"
                                        value-format="YYYY" style="width: 100%;" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 提取数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('extract')">
                    <div class="module-title">
                        <i class="fas fa-calculator"></i>
                        提取数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.extract }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.extract }">
                    <el-form :model="formData" label-width="200px" label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取依据名称" prop="basisName" required>
                                    <el-input v-model="formData.basisName" placeholder="提取依据" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取依据值" prop="basisValue" required>
                                    <el-input v-model="formData.basisValueDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleBasisValueInput" @blur="formatBasisValue" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="本周期应提取金额（元）" required>
                                    <el-input :model-value="formatAmount(calculatedAmount)" disabled>
                                        <template #suffix>
                                            <el-button link type="primary" @click="showCalculationDialog"
                                                style="padding: 0; margin-right: 8px;">
                                                <i class="fas fa-calculator" style="font-size: 16px;"></i>
                                            </el-button>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="本周期计划投入预算（元）" required>
                                    <el-input :model-value="formatAmount(formData.planBudget)" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="上一周期结余金额（元）" prop="carryOver" required>
                                    <el-input v-model="formData.carryOverDisplay" placeholder="请输入金额" :disabled="isView"
                                        @input="handleCarryOverInput" @blur="formatCarryOver" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item required>
                                    <template #label>
                                        <span>本周期计提金额（元）</span>
                                        <el-tooltip placement="top" effect="light">
                                            <template #content>
                                                本周期计提金额=本周期应提取金额+上一周期结余金额
                                            </template>
                                            <i class="fas fa-question-circle"
                                                style="color: #909399; font-size: 12px; cursor: help; margin-left: 4px;"></i>
                                        </el-tooltip>
                                    </template>
                                    <el-input v-model="formData.totalAccrualDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleTotalAccrualInput"
                                        @blur="formatTotalAccrual" />
                                    <div class="formula-hint">= 本周期应提取金额 + 上一周期结余金额</div>
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细计划模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('plan')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        详细计划
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.plan }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.plan }">
                    <div class="table-toolbar">
                        <div class="total-info">
                            <div class="total-info-item">
                                <span class="total-info-label">计划投入预算总额（元）：</span>
                                <span class="total-info-value">{{ formatAmount(totalPlanCost) }}</span>
                            </div>
                            <span style="color: #dcdfe6;">|</span>
                            <div class="total-info-item">
                                <span class="total-info-label">计提金额总额（元）：</span>
                                <span class="total-info-value">{{ formatAmount(totalCategoryAccrual) }}</span>
                            </div>
                        </div>
                    </div>
                    <el-table :data="categoriesData" border stripe>
                        <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                        <el-table-column prop="name" label="投入类别名称" min-width="350"></el-table-column>
                        <el-table-column prop="planCost" label="本周期计划投入预算（元）" width="200" align="right">
                            <template #default="{ row }">
                                {{ formatAmount(row.planCost) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="本周期计提金额（元）" width="200" align="right">
                            <template #default="{ row }">
                                <template v-if="!isView">
                                    <el-input v-model="row.accrualAmountDisplay" class="accrual-amount-input"
                                        placeholder="请输入" @input="handleCategoryInput(row)"
                                        @blur="formatCategoryAmount(row)" />
                                </template>
                                <template v-else>
                                    <span style="color: #409EFF;">{{ formatAmount(row.accrualAmount) }}</span>
                                </template>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>
        </div>

        <!-- 计算规则弹窗 -->
        <el-dialog v-model="calculationDialogVisible" title="计提金额计算规则" width="700px">
            <div style="margin-bottom: 16px;">
                <div
                    style="padding: 12px; background: #f0f9ff; border-left: 4px solid #409EFF; border-radius: 4px; margin-bottom: 16px;">
                    <div style="font-weight: 600; color: #303133; margin-bottom: 8px;">
                        <i class="fas fa-info-circle" style="color: #409EFF; margin-right: 6px;"></i>
                        计算规则说明
                    </div>
                    <div style="color: #606266; font-size: 14px; line-height: 1.6;">
                        采用<strong style="color: #E6A23C;">超额累退</strong>方式计算，根据提取依据值分段按不同比例提取安全费用
                    </div>
                </div>
                <el-table :data="calculationRulesDisplay" border stripe>
                    <el-table-column label="序号" width="60" align="center" type="index"></el-table-column>
                    <el-table-column label="提取依据值范围" min-width="200">
                        <template #default="{ row }">
                            <span>{{ row.range }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="提取比例" width="120" align="center">
                        <template #default="{ row }">
                            <el-tag type="primary">{{ row.ratio }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="本次计提金额（元）" width="160" align="right">
                        <template #default="{ row }">
                            <span
                                :style="{ color: row.amount > 0 ? '#409EFF' : '#909399', fontWeight: row.amount > 0 ? '600' : 'normal' }">
                                {{ formatAmount(row.amount) }}
                            </span>
                        </template>
                    </el-table-column>
                </el-table>
                <div style="margin-top: 16px; padding: 12px; background: #f5f7fa; border-radius: 4px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 14px; color: #606266;">提取依据值：</span>
                        <span style="font-size: 16px; font-weight: 600; color: #303133;">{{
                            formatAmount(formData.basisValue) }} 元</span>
                    </div>
                    <el-divider style="margin: 12px 0;"></el-divider>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 14px; color: #606266;">本周期应提取金额：</span>
                        <span style="font-size: 18px; font-weight: 700; color: #409EFF;">{{
                            formatAmount(calculatedAmount) }} 元</span>
                    </div>
                </div>
            </div>
            <template #footer>
                <el-button type="primary" @click="calculationDialogVisible = false">确定</el-button>
            </template>
        </el-dialog>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>

        <!-- 项目选择弹窗 -->
        <el-dialog v-model="projectDialogVisible" title="选择相关方项目" width="600px" :close-on-click-modal="false">
            <div class="project-dialog-search">
                <el-input v-model="projectSearch.name" placeholder="请输入项目名称" clearable>
                    <template #prefix>
                        <i class="fas fa-file-alt"></i>
                    </template>
                </el-input>
                <el-button type="primary" @click="searchProjects">
                    <i class="fas fa-search"></i> 搜索
                </el-button>
                <el-button @click="resetProjectSearch">
                    <i class="fas fa-redo"></i> 重置
                </el-button>
            </div>
            <el-table :data="filteredProjects" style="width: 100%" stripe border highlight-current-row
                @current-change="handleProjectSelect" :current-row-key="selectedProjectInDialog">
                <el-table-column type="index" label="序号" width="60"></el-table-column>
                <el-table-column prop="code" label="项目编号" min-width="180"></el-table-column>
                <el-table-column prop="name" label="项目名称" min-width="200"></el-table-column>
            </el-table>
            <template #footer>
                <el-button @click="projectDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmProjectSelect" :disabled="!selectedProjectInDialog">
                    确定
                </el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');

                const modules = ref({
                    basic: true,
                    extract: true,
                    plan: true
                });

                // 项目选择弹窗
                const projectDialogVisible = ref(false);
                const projectSearch = ref({ name: '' });
                const selectedProjectInDialog = ref(null);

                const allProjects = ref([
                    { id: 'p1', code: 'XGF-PRJ-001', name: '变电站改造项目' },
                    { id: 'p2', code: 'XGF-PRJ-002', name: '输电线路检修项目' },
                    { id: 'p3', code: 'XGF-PRJ-003', name: '配电网升级项目' }
                ]);

                const filteredProjects = computed(() => {
                    let data = allProjects.value;
                    if (projectSearch.value.name) {
                        data = data.filter(p => p.name.includes(projectSearch.value.name));
                    }
                    return data;
                });

                const formData = ref({
                    relatedProject: '',
                    code: '',
                    industryType: '电力生产与供应企业',
                    extractType: '营业收入',
                    ruleType: 'excess',
                    cycleType: 'yearly',
                    cycle: '2026',
                    basisName: '营业收入',
                    basisValue: 500000000,
                    basisValueDisplay: '500,000,000.00',
                    planBudget: 15500000,
                    carryOver: 50000,
                    carryOverDisplay: '50,000.00',
                    totalAccrual: 0,
                    totalAccrualDisplay: ''
                });

                const formRules = ref({
                    relatedProject: [{ required: true, message: '请选择关联相关方项目', trigger: 'change' }],
                    cycle: [{ required: true, message: '请选择提取周期', trigger: 'change' }]
                });

                // 详细计划数据
                const categoriesData = ref([
                    { id: 1, name: '（一）安全防护设备、设施支出', planCost: 2100000, accrualAmount: 2100000, accrualAmountDisplay: '2,100,000.00' },
                    { id: 2, name: '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出', planCost: 1800000, accrualAmount: 1800000, accrualAmountDisplay: '1,800,000.00' },
                    { id: 3, name: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出', planCost: 2500000, accrualAmount: 2500000, accrualAmountDisplay: '2,500,000.00' },
                    { id: 4, name: '（四）安全生产检查、评估评价、咨询和标准化建设支出', planCost: 1200000, accrualAmount: 1200000, accrualAmountDisplay: '1,200,000.00' },
                    { id: 5, name: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出', planCost: 1000000, accrualAmount: 1000000, accrualAmountDisplay: '1,000,000.00' }
                ]);

                const calculatedAmount = computed(() => {
                    return formData.value.basisValue * 0.01;
                });

                const totalPlanCost = computed(() => {
                    return categoriesData.value.reduce((sum, item) => sum + item.planCost, 0);
                });

                const totalCategoryAccrual = computed(() => {
                    return categoriesData.value.reduce((sum, item) => sum + (item.accrualAmount || 0), 0);
                });

                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                const handleBasisValueInput = (value) => {
                    formData.value.basisValueDisplay = value.replace(/[^\d.]/g, '');
                };

                const formatBasisValue = () => {
                    const value = parseAmount(formData.value.basisValueDisplay);
                    formData.value.basisValue = value;
                    formData.value.basisValueDisplay = formatAmount(value);
                };

                const handleCarryOverInput = (value) => {
                    formData.value.carryOverDisplay = value.replace(/[^\d.]/g, '');
                };

                const formatCarryOver = () => {
                    const value = parseAmount(formData.value.carryOverDisplay);
                    formData.value.carryOver = value;
                    formData.value.carryOverDisplay = formatAmount(value);
                };

                const handleTotalAccrualInput = (value) => {
                    formData.value.totalAccrualDisplay = value.replace(/[^\d.]/g, '');
                };

                const formatTotalAccrual = () => {
                    const value = parseAmount(formData.value.totalAccrualDisplay);
                    formData.value.totalAccrual = value;
                    formData.value.totalAccrualDisplay = formatAmount(value);
                };

                const handleCategoryInput = (row) => {
                    row.accrualAmountDisplay = row.accrualAmountDisplay.replace(/[^\d.]/g, '');
                };

                const formatCategoryAmount = (row) => {
                    const value = parseAmount(row.accrualAmountDisplay);
                    row.accrualAmount = value;
                    row.accrualAmountDisplay = formatAmount(value);
                };

                const generateCode = () => {
                    const now = new Date();
                    const dateStr = now.getFullYear().toString() +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0');
                    const randomNum = String(Math.floor(Math.random() * 9999) + 1).padStart(4, '0');
                    formData.value.code = `XGFJT-${dateStr}-${randomNum}`;
                };

                const openProjectDialog = () => {
                    projectDialogVisible.value = true;
                    selectedProjectInDialog.value = formData.value.relatedProject;
                };

                const searchProjects = () => { };

                const resetProjectSearch = () => {
                    projectSearch.value = { name: '' };
                };

                const handleProjectSelect = (row) => {
                    if (row) {
                        selectedProjectInDialog.value = row.id;
                    }
                };

                const confirmProjectSelect = () => {
                    formData.value.relatedProject = selectedProjectInDialog.value;
                    projectDialogVisible.value = false;
                };

                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    } else {
                        generateCode();
                    }
                });

                const loadData = (id) => {
                    formData.value.relatedProject = 'p1';
                    formData.value.code = `XGFJT-20260105-0001`;
                };

                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                const goBack = () => {
                    window.location.href = '安全费用计提(相关方).html';
                };

                // 计算规则弹窗
                const calculationDialogVisible = ref(false);
                const calculationRulesDisplay = ref([
                    { range: '0 - 1000万', ratio: '4.0%', amount: 400000 },
                    { range: '1000万 - 1亿', ratio: '2.0%', amount: 1800000 },
                    { range: '1亿 - 10亿', ratio: '0.5%', amount: 2000000 },
                    { range: '10亿 - 50亿', ratio: '0.2%', amount: 800000 }
                ]);

                const showCalculationDialog = () => {
                    calculationDialogVisible.value = true;
                };

                // 监听本周期应提取金额和上一周期结余金额的变化，自动更新本周期计提金额
                watch([calculatedAmount, () => formData.value.carryOver], ([newCalculated, newCarryOver]) => {
                    if (newCalculated !== undefined && newCarryOver !== undefined && !isView.value) {
                        const total = newCalculated + newCarryOver;
                        formData.value.totalAccrual = total;
                        formData.value.totalAccrualDisplay = formatAmount(total);
                    }
                }, { immediate: true });

                return {
                    formRef,
                    mode,
                    isView,
                    modules,
                    formData,
                    formRules,
                    allProjects,
                    filteredProjects,
                    projectDialogVisible,
                    projectSearch,
                    selectedProjectInDialog,
                    categoriesData,
                    calculatedAmount,
                    totalPlanCost,
                    totalCategoryAccrual,
                    calculationDialogVisible,
                    calculationRulesDisplay,
                    showCalculationDialog,
                    formatAmount,
                    handleBasisValueInput,
                    formatBasisValue,
                    handleCarryOverInput,
                    formatCarryOver,
                    handleTotalAccrualInput,
                    formatTotalAccrual,
                    handleCategoryInput,
                    formatCategoryAmount,
                    toggleModule,
                    openProjectDialog,
                    searchProjects,
                    resetProjectSearch,
                    handleProjectSelect,
                    confirmProjectSelect,
                    handleSave,
                    switchToEdit,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
