<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下级企业计划详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-content {
            padding: 24px;
        }

        /* 表格区域 */
        .table-area {
            margin-top: 0;
        }

        .content-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 公司信息 */
        .company-info {
            margin-bottom: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #409EFF15 0%, #67C23A15 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .company-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .company-info-label {
            color: #909399;
            font-size: 14px;
        }

        .company-info-value {
            color: #303133;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <!-- 表单容器 -->
        <div class="form-container">
            <div class="form-module">
                <div class="module-header">
                    <div class="module-title">
                        <i class="fas fa-building"></i>
                        {{ companyName }} - {{ currentYear }}年度计划详情
                    </div>
                </div>
                <div class="module-content">
                    <!-- 公司信息概要 -->
                    <div class="company-info">
                        <div class="company-info-item">
                            <span class="company-info-label">企业名称：</span>
                            <span class="company-info-value">{{ companyName }}</span>
                        </div>
                        <div class="company-info-item">
                            <span class="company-info-label">年度：</span>
                            <span class="company-info-value">{{ currentYear }}</span>
                        </div>
                        <div class="company-info-item">
                            <span class="company-info-label">年度计划总额：</span>
                            <span class="company-info-value" style="color: #409EFF;">{{ formatAmount(totalAmount) }}
                                元</span>
                        </div>
                    </div>

                    <!-- Tab页签 -->
                    <el-tabs v-model="activeTab" type="border-card">
                        <!-- 项目维度 -->
                        <el-tab-pane label="项目维度" name="project">
                            <div class="table-area">
                                <el-table :data="projectData" style="width: 100%" stripe border>
                                    <el-table-column prop="projectCode" label="项目编号" min-width="160"></el-table-column>
                                    <el-table-column prop="projectName" label="项目名称" min-width="180"></el-table-column>
                                    <el-table-column prop="category" label="支出范围类别" min-width="200">
                                        <template #default="{ row }">
                                            <el-tooltip :content="row.category" placement="top" :show-after="300">
                                                <div class="content-cell">{{ row.category }}</div>
                                            </el-tooltip>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="projectContent" label="项目内容" min-width="200">
                                        <template #default="{ row }">
                                            <el-tooltip :content="row.projectContent" placement="top" :show-after="300">
                                                <div class="content-cell">{{ row.projectContent }}</div>
                                            </el-tooltip>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="planDate" label="计划完成时间" min-width="120"></el-table-column>
                                    <el-table-column prop="planCost" label="计划金额(元)" min-width="140" align="right">
                                        <template #default="{ row }">
                                            {{ formatAmount(row.planCost) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="responsibleUnit" label="责任单位"
                                        min-width="120"></el-table-column>
                                    <el-table-column prop="responsiblePerson" label="责任人"
                                        min-width="80"></el-table-column>
                                </el-table>

                                <!-- 分页 -->
                                <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
                                    <el-pagination background size="small" v-model:current-page="projectPage"
                                        v-model:page-size="projectPageSize" :page-sizes="[10, 20, 50, 100]"
                                        :total="projectData.length"
                                        layout="total, ->, sizes, prev, pager, next, jumper" />
                                </div>
                            </div>
                        </el-tab-pane>

                        <!-- 类别维度 -->
                        <el-tab-pane label="类别维度" name="category">
                            <div class="table-area">
                                <el-table :data="categoryData" style="width: 100%" stripe border show-summary
                                    :summary-method="getCategorySummary">
                                    <el-table-column type="index" label="序号" width="70"
                                        align="center"></el-table-column>
                                    <el-table-column prop="categoryName" label="支出范围名称"
                                        min-width="400"></el-table-column>
                                    <el-table-column prop="totalAmount" label="计划总额(元)" min-width="160" align="right">
                                        <template #default="{ row }">
                                            {{ formatAmount(row.totalAmount) }}
                                        </template>
                                    </el-table-column>
                                </el-table>
                            </div>
                        </el-tab-pane>
                    </el-tabs>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">返回</el-button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const currentYear = ref('');
                const companyName = ref('');
                const activeTab = ref('project');
                const projectPage = ref(1);
                const projectPageSize = ref(10);

                // 支出范围类别列表
                const categoryList = [
                    '(一)安全防护设备、设施支出',
                    '(二)应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                    '(三)开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出',
                    '(四)安全生产检查、评估评价、咨询和标准化建设支出',
                    '(五)安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出',
                    '(六)配备和更新现场作业人员安全防护用品支出',
                    '(七)安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出',
                    '(八)安全设施及特种设备检测检验、检定校准支出',
                    '(九)安全生产责任保险支出',
                    '(十)与安全生产直接相关的其他支出'
                ];

                // 项目维度数据
                const projectData = ref([
                    {
                        id: 1,
                        category: '(一)安全防护设备、设施支出',
                        projectCode: 'YSJH-20260101-0001',
                        projectName: '安全防护栏杆更换',
                        projectContent: '对厂区内老旧安全防护栏杆进行更换，确保员工安全',
                        planDate: '2026-03-31',
                        planCost: 80000,
                        responsibleUnit: '设备部',
                        responsiblePerson: '张三'
                    },
                    {
                        id: 2,
                        category: '(二)应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                        projectCode: 'YSJH-20260101-0002',
                        projectName: '应急演练组织实施',
                        projectContent: '组织开展年度综合应急演练，提升员工应急处置能力',
                        planDate: '2026-05-30',
                        planCost: 50000,
                        responsibleUnit: '安健环管理部',
                        responsiblePerson: '李四'
                    },
                    {
                        id: 3,
                        category: '(三)开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出',
                        projectCode: 'YSJH-20260101-0003',
                        projectName: '安全监控系统升级',
                        projectContent: '对现有安全监控系统进行升级改造，增加智能分析功能',
                        planDate: '2026-08-31',
                        planCost: 200000,
                        responsibleUnit: '信息部',
                        responsiblePerson: '王五'
                    },
                    {
                        id: 4,
                        category: '(五)安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出',
                        projectCode: 'YSJH-20260101-0004',
                        projectName: '安全培训课程开发',
                        projectContent: '开发线上安全培训课程，覆盖全员培训需求',
                        planDate: '2026-06-30',
                        planCost: 60000,
                        responsibleUnit: '人力资源部',
                        responsiblePerson: '赵六'
                    },
                    {
                        id: 5,
                        category: '(六)配备和更新现场作业人员安全防护用品支出',
                        projectCode: 'YSJH-20260101-0005',
                        projectName: '劳动防护用品采购',
                        projectContent: '采购安全帽、防护服、安全鞋等劳动防护用品',
                        planDate: '2026-02-28',
                        planCost: 150000,
                        responsibleUnit: '采购部',
                        responsiblePerson: '钱七'
                    }
                ]);

                // 计算总金额
                const totalAmount = computed(() => {
                    return projectData.value.reduce((sum, item) => sum + item.planCost, 0);
                });

                // 类别维度数据 - 根据项目数据自动汇总
                const categoryData = computed(() => {
                    const categoryMap = {};

                    // 初始化所有类别
                    categoryList.forEach(cat => {
                        categoryMap[cat] = 0;
                    });

                    // 汇总各类别金额
                    projectData.value.forEach(item => {
                        if (categoryMap.hasOwnProperty(item.category)) {
                            categoryMap[item.category] += item.planCost;
                        }
                    });

                    // 转换为数组格式，只返回有数据的类别
                    return categoryList.map(cat => ({
                        categoryName: cat,
                        totalAmount: categoryMap[cat]
                    })).filter(item => item.totalAmount > 0);
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 类别维度合计
                const getCategorySummary = ({ columns, data }) => {
                    const sums = [];
                    columns.forEach((column, index) => {
                        if (index === 0) {
                            sums[index] = '';
                            return;
                        }
                        if (index === 1) {
                            sums[index] = '合计';
                            return;
                        }
                        if (column.property === 'totalAmount') {
                            const total = data.reduce((sum, item) => sum + item.totalAmount, 0);
                            sums[index] = formatAmount(total);
                        }
                    });
                    return sums;
                };

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    currentYear.value = urlParams.get('year') || new Date().getFullYear().toString();
                    companyName.value = urlParams.get('companyName') || 'A分公司';
                });

                // 返回
                const goBack = () => {
                    history.back();
                };

                return {
                    currentYear,
                    companyName,
                    activeTab,
                    projectPage,
                    projectPageSize,
                    projectData,
                    categoryData,
                    totalAmount,
                    formatAmount,
                    getCategorySummary,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
