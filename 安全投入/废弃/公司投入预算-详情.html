<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入 - 公司投入预算详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .page-header {
            background: white;
            padding: 20px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: #409EFF;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        .form-item.half-width {
            flex: 0 0 calc(50% - 12px);
        }

        /* 表格区域样式 */
        .table-section {
            margin-top: 16px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-title {
            font-size: 14px;
            font-weight: 500;
            color: #606266;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 金额显示 */
        .amount-display {
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            color: #409EFF;
            font-weight: 600;
            font-size: 16px;
        }

        .amount-display.large {
            font-size: 20px;
            color: #67C23A;
        }

        /* 计算说明 */
        .calc-hint {
            font-size: 12px;
            color: #909399;
            margin-top: 4px;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }

        /* 表单标签右对齐 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <!-- 表单容器 -->
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编号" prop="code">
                                    <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="组织名称" prop="orgName">
                                    <el-input v-model="formData.orgName" placeholder="组织名称" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属行业类型" prop="industryType">
                                    <el-input v-model="formData.industryType" placeholder="行业类型" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取类型" prop="extractType">
                                    <el-input v-model="formData.extractType" placeholder="提取类型" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取规则类型" prop="ruleType">
                                    <el-select v-model="formData.ruleType" placeholder="请选择" disabled
                                        style="width: 100%;">
                                        <el-option label="超额累退" value="excess"></el-option>
                                        <el-option label="比例提取" value="proportion"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取周期类型" prop="cycleType">
                                    <el-select v-model="formData.cycleType" placeholder="请选择" disabled
                                        style="width: 100%;">
                                        <el-option label="年度分摊提取" value="yearly"></el-option>
                                        <el-option label="月度实时提取" value="monthly"></el-option>
                                        <el-option label="项目进度提取" value="project"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取周期" prop="cycle">
                                    <el-date-picker v-model="formData.cycle" type="year" placeholder="请选择年份"
                                        value-format="YYYY" style="width: 100%;" :disabled="isView"
                                        @change="handleCycleChange" />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 提取数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('extract')">
                    <div class="module-title">
                        <i class="fas fa-calculator"></i>
                        提取数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.extract }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.extract }">
                    <el-form :model="formData" label-width="180px" label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取依据名称" prop="basisName">
                                    <el-input v-model="formData.basisName" placeholder="提取依据" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取依据值（元）" prop="basisValue" required>
                                    <el-input v-model="formData.basisValueDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleBasisValueInput" @blur="formatBasisValue">
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="应提取金额（元）" required>
                                    <el-input :model-value="formatAmount(calculatedAmount)" disabled>
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="上一周期结余金额（元）" prop="carryOver" required>
                                    <el-input v-model="formData.carryOverDisplay" placeholder="请输入金额" :disabled="isView"
                                        @input="handleCarryOverInput" @blur="formatCarryOver">
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="投入预算（元）" required>
                                    <el-input v-model="formData.totalBudgetDisplay" :disabled="isView"
                                        @input="handleTotalBudgetInput" @blur="formatTotalBudget">
                                        <template #suffix>
                                            <span style="color: #909399;">元</span>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细计划模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('plan')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        详细计划
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.plan }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.plan }">
                    <div class="table-header" style="justify-content: flex-end;">
                        <div>
                            <span style="font-size: 12px; color: #909399; margin-right: 16px;">
                                已分配: <span style="font-weight: 500;">{{ formatAmount(allocatedTotal) }}</span> /
                                总预算: <span style="font-weight: 500;">{{ formatAmount(formData.totalBudget) }}</span>
                            </span>
                        </div>
                    </div>
                    <el-table :data="formData.categories" border stripe>
                        <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                        <el-table-column prop="name" label="投入类别名称" min-width="400">
                            <template #default="{ row }">
                                <span>{{ row.name }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="budget" label="投入预算（元）" width="200">
                            <template #default="{ row }">
                                <el-input-number v-if="!isView" v-model="row.budget" :min="0" :precision="2"
                                    :controls="false" style="width: 100%;"
                                    :formatter="(value) => `${value}`.replace(/\B(?=(\d{3})+(?!\d))/g, ',')"
                                    :parser="(value) => value.replace(/\$\s?|(,*)/g, '')"></el-input-number>
                                <span v-else>{{ formatAmount(row.budget) }}</span>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);

                // 页面模式
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');
                const isEdit = computed(() => mode.value === 'edit');
                const pageTitle = computed(() => {
                    const titles = {
                        add: '新建公司投入预算',
                        edit: '编辑公司投入预算',
                        view: '查看公司投入预算'
                    };
                    return titles[mode.value] || '公司投入预算详情';
                });

                // 模块折叠状态
                const modules = ref({
                    basic: true,
                    extract: true,
                    plan: true
                });

                // 表单数据
                const formData = ref({
                    code: '',
                    orgName: '国投电力',
                    industryType: '电力生产与供应企业',
                    extractType: '电力生产企业',
                    ruleType: 'excess',
                    cycleType: 'yearly',
                    cycle: new Date().getFullYear().toString(),
                    basisName: '上一年度营业收入（元）',
                    basisValue: 1500000000,
                    basisValueDisplay: '1,500,000,000.00',
                    carryOver: 50000,
                    carryOverDisplay: '50,000.00',
                    totalBudget: 14700000,
                    totalBudgetDisplay: '14,700,000.00',
                    categories: []
                });

                // 超额累退规则（电力生产企业）
                const excessRules = [
                    { lowerLimit: 0, upperLimit: 10000000, ratio: 0.03 },           // 0-1000万: 3%
                    { lowerLimit: 10000000, upperLimit: 100000000, ratio: 0.015 },  // 1000万-1亿: 1.5%
                    { lowerLimit: 100000000, upperLimit: 1000000000, ratio: 0.01 }, // 1亿-10亿: 1%
                    { lowerLimit: 1000000000, upperLimit: 5000000000, ratio: 0.008 }, // 10亿-50亿: 0.8%
                    { lowerLimit: 5000000000, upperLimit: 10000000000, ratio: 0.006 }, // 50亿-100亿: 0.6%
                    { lowerLimit: 10000000000, upperLimit: null, ratio: 0.002 }     // 100亿以上: 0.2%
                ];

                // 投入类别列表
                const defaultCategories = [
                    { code: 'TRLB-0001', name: '（一）完善、改造和维护安全防护设备、设施支出', sortOrder: 1, budget: 0 },
                    { code: 'TRLB-0002', name: '（二）配备、维护、保养应急救援器材、设备设施支出和应急救援队伍建设、应急预案制修订与应急演练支出', sortOrder: 2, budget: 0 },
                    { code: 'TRLB-0003', name: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出', sortOrder: 3, budget: 0 },
                    { code: 'TRLB-0004', name: '（四）安全生产检查、评估评价、咨询和标准化建设支出', sortOrder: 4, budget: 0 },
                    { code: 'TRLB-0005', name: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出', sortOrder: 5, budget: 0 },
                    { code: 'TRLB-0006', name: '（六）配备和更新现场作业人员安全防护用品支出', sortOrder: 6, budget: 0 },
                    { code: 'TRLB-0007', name: '（七）安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出', sortOrder: 7, budget: 0 },
                    { code: 'TRLB-0008', name: '（八）安全设施及特种设备检测检验、检定校准支出', sortOrder: 8, budget: 0 },
                    { code: 'TRLB-0009', name: '（九）安全生产责任保险支出', sortOrder: 9, budget: 0 },
                    { code: 'TRLB-0010', name: '（十）与安全生产直接相关的其他支出', sortOrder: 10, budget: 0 }
                ];

                // 表单验证规则
                const formRules = ref({
                    cycle: [{ required: true, message: '请选择提取周期', trigger: 'change' }]
                });

                // 计算应提取金额（超额累退）
                const calculatedAmount = computed(() => {
                    const basisValue = formData.value.basisValue || 0;
                    let total = 0;
                    let remaining = basisValue;

                    for (const rule of excessRules) {
                        if (remaining <= 0) break;

                        const upperLimit = rule.upperLimit || Infinity;
                        const rangeSize = upperLimit - rule.lowerLimit;
                        const applicableAmount = Math.min(remaining, rangeSize);

                        if (basisValue > rule.lowerLimit) {
                            total += applicableAmount * rule.ratio;
                            remaining -= applicableAmount;
                        }
                    }

                    return Math.round(total * 100) / 100;
                });

                // 计算总预算
                const totalBudget = computed(() => {
                    return calculatedAmount.value + (formData.value.carryOver || 0);
                });

                // 计算已分配总额
                const allocatedTotal = computed(() => {
                    return formData.value.categories.reduce((sum, item) => sum + (item.budget || 0), 0);
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(value);
                };

                // 解析金额字符串
                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                // 处理提取依据值输入
                const handleBasisValueInput = (value) => {
                    // 只保留数字和小数点
                    formData.value.basisValueDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化提取依据值
                const formatBasisValue = () => {
                    const value = parseAmount(formData.value.basisValueDisplay);
                    formData.value.basisValue = value;
                    formData.value.basisValueDisplay = formatAmount(value);
                };

                // 处理结余金额输入
                const handleCarryOverInput = (value) => {
                    formData.value.carryOverDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化结余金额
                const formatCarryOver = () => {
                    const value = parseAmount(formData.value.carryOverDisplay);
                    formData.value.carryOver = value;
                    formData.value.carryOverDisplay = formatAmount(value);
                };

                // 处理投入预算输入
                const handleTotalBudgetInput = (value) => {
                    formData.value.totalBudgetDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化投入预算
                const formatTotalBudget = () => {
                    const value = parseAmount(formData.value.totalBudgetDisplay);
                    formData.value.totalBudget = value;
                    formData.value.totalBudgetDisplay = formatAmount(value);
                };

                // 提取周期变化
                const handleCycleChange = () => {
                    generateCode();
                };

                // 生成编号
                const generateCode = () => {
                    const year = formData.value.cycle || new Date().getFullYear().toString();
                    formData.value.code = `AQTRJH-${year}-001`;
                };

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    // 初始化类别列表
                    formData.value.categories = JSON.parse(JSON.stringify(defaultCategories));

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    } else {
                        generateCode();
                    }
                });

                // 加载数据
                const loadData = (id) => {
                    // 模拟数据
                    const presetData = {
                        '1': {
                            code: 'AQTRJH-2026-001',
                            orgName: '国投电力',
                            industryType: '电力生产与供应企业',
                            extractType: '电力生产企业',
                            ruleType: 'excess',
                            cycleType: 'yearly',
                            cycle: '2026',
                            basisName: '上一年度营业收入（元）',
                            basisValue: 1500000000,
                            basisValueDisplay: '1,500,000,000.00',
                            carryOver: 50000,
                            carryOverDisplay: '50,000.00',
                            totalBudget: 14700000,
                            totalBudgetDisplay: '14,700,000.00',
                            categories: [
                                { code: 'TRLB-0001', name: '（一）完善、改造和维护安全防护设备、设施支出', sortOrder: 1, budget: 3000000 },
                                { code: 'TRLB-0002', name: '（二）配备、维护、保养应急救援器材、设备设施支出和应急救援队伍建设、应急预案制修订与应急演练支出', sortOrder: 2, budget: 2000000 },
                                { code: 'TRLB-0003', name: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出', sortOrder: 3, budget: 2500000 },
                                { code: 'TRLB-0004', name: '（四）安全生产检查、评估评价、咨询和标准化建设支出', sortOrder: 4, budget: 1500000 },
                                { code: 'TRLB-0005', name: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出', sortOrder: 5, budget: 1000000 },
                                { code: 'TRLB-0006', name: '（六）配备和更新现场作业人员安全防护用品支出', sortOrder: 6, budget: 800000 },
                                { code: 'TRLB-0007', name: '（七）安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出', sortOrder: 7, budget: 1200000 },
                                { code: 'TRLB-0008', name: '（八）安全设施及特种设备检测检验、检定校准支出', sortOrder: 8, budget: 1000000 },
                                { code: 'TRLB-0009', name: '（九）安全生产责任保险支出', sortOrder: 9, budget: 500000 },
                                { code: 'TRLB-0010', name: '（十）与安全生产直接相关的其他支出', sortOrder: 10, budget: 2000000 }
                            ]
                        },
                        '2': {
                            code: 'AQTRJH-2025-001',
                            orgName: '国投电力',
                            industryType: '电力生产与供应企业',
                            extractType: '电力生产企业',
                            ruleType: 'excess',
                            cycleType: 'yearly',
                            cycle: '2025',
                            basisName: '上一年度营业收入（元）',
                            basisValue: 1400000000,
                            basisValueDisplay: '1,400,000,000.00',
                            carryOver: 100000,
                            carryOverDisplay: '100,000.00',
                            totalBudget: 13850000,
                            totalBudgetDisplay: '13,850,000.00',
                            categories: JSON.parse(JSON.stringify(defaultCategories))
                        }
                    };

                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };
                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            // 验证分配金额
                            if (allocatedTotal.value > totalBudget.value) {
                                ElMessage.warning('已分配金额超过总预算，请调整');
                                return;
                            }
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 切换到编辑模式
                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                // 返回列表
                const goBack = () => {
                    window.location.href = '公司投入预算.html';
                };

                return {
                    formRef,
                    mode,
                    isView,
                    isEdit,
                    pageTitle,
                    modules,
                    formData,
                    formRules,
                    calculatedAmount,
                    totalBudget,
                    allocatedTotal,
                    toggleModule,
                    formatAmount,
                    handleBasisValueInput,
                    formatBasisValue,
                    handleCarryOverInput,
                    formatCarryOver,
                    handleTotalBudgetInput,
                    formatTotalBudget,
                    handleCycleChange,
                    handleSave,
                    switchToEdit,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
