<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用标准库 - 计提标准库详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .page-header {
            background: white;
            padding: 20px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: #409EFF;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        .form-item.half-width {
            flex: 0 0 calc(50% - 12px);
        }

        /* 表格区域样式 */
        .table-section {
            margin-top: 16px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-title {
            font-size: 14px;
            font-weight: 500;
            color: #606266;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }

        /* 表单标签右对齐 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
        }

        /* 两措属性标签 */
        .measure-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .measure-an {
            background-color: #e6f7ff;
            color: #1890ff;
        }

        .measure-fan {
            background-color: #fff7e6;
            color: #fa8c16;
        }

        .measure-other {
            background-color: #f6ffed;
            color: #52c41a;
        }

        /* 增加说明标识样式 */
        body {
            counter-reset: info-mark-counter;
        }

        .info-mark {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 16px;
            height: 16px;
            background-color: #E6A23C;
            /* 警告黄 */
            border-radius: 2px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 4px;
            position: relative;
            top: -1px;

            /* 文字样式 */
            font-size: 10px;
            color: #fff;
            line-height: 1;
        }

        .info-mark::after {
            counter-increment: info-mark-counter;
            content: counter(info-mark-counter);
        }

        .info-mark:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <!-- 表单容器 -->
        <div class="form-container">
            <!-- 基本信息模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基本信息
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编号" prop="code">
                                    <el-input v-model="formData.code" placeholder="自动生成，如AQTR-0001"
                                        :disabled="isView || isEdit" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属企业分类" prop="industryType">
                                    <template #label>
                                        <span>所属企业分类</span>
                                        <info-mark content="1、数据来源“安全生产费用企业分类”；2、新建时需要将列表页左侧树所选节点值带过来"></info-mark>
                                    </template>
                                    <el-select v-model="formData.industryType" placeholder="请选择行业类型" :disabled="isView"
                                        style="width: 100%;">
                                        <el-option v-for="item in industryOptions" :key="item.value" :label="item.label"
                                            :value="item.value" />
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取类型" prop="extractType">
                                    <el-input v-model="formData.extractType" placeholder="请输入提取类型" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细提取规则模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('rules')">
                    <div class="module-title">
                        <i class="fas fa-calculator"></i>
                        详细提取规则
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.rules }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.rules }">
                    <el-form :model="formData" :rules="rulesFormRules" ref="rulesFormRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取周期类型" prop="cycleType" required>
                                    <el-select v-model="formData.cycleType" placeholder="请选择提取周期类型" :disabled="isView"
                                        style="width: 100%;" @change="handleCycleTypeChange">
                                        <el-option label="月度实时提取" value="monthly"></el-option>
                                        <el-option label="年度分摊提取" value="yearly"></el-option>
                                        <el-option label="项目进度提取" value="project"></el-option>
                                        <el-option label="自定义提取" value="custom"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取规则类型" prop="ruleType" required>
                                    <template #label>
                                        <span>提取规则类型</span>
                                        <info-mark
                                            content="1、选择“超额累退”时，需要显示下方的详细规则，用于后续的计算。超额累退的计算举例说明：比如某危险品生产企业上一年度营业收入为1200万元，其中1000万元按照4.5%提取，剩余的200万元按照2.25%提取，然后相加。计算方式如下：M ≤1000万元，按M×4.5%计提；1000万元＜M≤1亿元，按1000万元×4.5%+（M-1000万元）×2.25%计提；1亿元＜M≤10亿元，按1000万元×4.5%+（1亿元-1000万元）×2.25%+（M-1亿元）×0.55%计提；10亿元＜M，按1000万元×4.5%+（1亿元-1000万元）×2.25%+（10亿元-1亿元）×0.55%+（M-10亿元）×0.2%计提。2、选择“比例提取”时，需要显示提取比例和提取比例单位，用于后续的计算，计算规则为后续提取页面中输入的提取依据值*提取比例。3、需要注意单位的换算"></info-mark>
                                    </template>
                                    <el-select v-model="formData.ruleType" placeholder="请选择提取规则类型"
                                        :disabled="isView || formData.cycleType === 'custom'" style="width: 100%;"
                                        @change="handleRuleTypeChange">
                                        <el-option label="比例提取" value="proportion"
                                            v-if="formData.cycleType !== 'custom'"></el-option>
                                        <el-option label="超额累退" value="excess"
                                            v-if="formData.cycleType !== 'custom'"></el-option>
                                        <el-option label="自定义提取" value="custom"
                                            v-if="formData.cycleType === 'custom'"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item" v-if="formData.ruleType !== 'custom'">
                                <el-form-item label="提取依据名称" prop="basisName" required>
                                    <el-input v-model="formData.basisName" placeholder="请输入提取依据名称" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row" v-if="formData.ruleType !== 'custom'">
                            <div class="form-item">
                                <el-form-item label="提取依据单位" prop="basisUnit" required>
                                    <el-input v-model="formData.basisUnit" placeholder="请输入提取依据单位，如：元、万元、吨等"
                                        :disabled="isView" />
                                </el-form-item>
                            </div>
                            <!-- 比例提取字段 -->
                            <div class="form-item" v-if="formData.ruleType === 'proportion'">
                                <el-form-item label="提取比例" prop="proportionRatio" required>
                                    <el-input v-model="formData.proportionRatio" placeholder="请输入提取比例"
                                        :disabled="isView" />
                                </el-form-item>
                            </div>
                            <div class="form-item" v-if="formData.ruleType === 'proportion'">
                                <el-form-item label="提取比例单位" prop="ruleUnit" required>
                                    <el-input v-model="formData.ruleUnit" placeholder="请输入提取比例单位" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>

                        <!-- 超额累退表格 -->
                        <div class="table-section" v-if="formData.ruleType === 'excess'">
                            <div class="table-header" style="justify-content: flex-start;">
                                <el-button type="primary" size="small" @click="addExcessRow" v-if="!isView">
                                    <i class="fas fa-plus"></i> 添加
                                </el-button>
                            </div>
                            <el-table :data="formData.excessRules" border stripe>
                                <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                                <el-table-column prop="lowerLimit" label="下限（万元）" min-width="180">
                                    <template #default="{ row }">
                                        <span v-if="isView">{{ formatNumber(row.lowerLimit) }}</span>
                                        <el-input-number v-else v-model="row.lowerLimit" :min="0"
                                            :formatter="(value) => `${value}`.replace(/\B(?=(\d{3})+(?!\d))/g, ',')"
                                            :parser="(value) => value.replace(/\$\s?|(,*)/g, '')" :controls="false"
                                            style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="upperLimit" label="上限（万元）" min-width="180">
                                    <template #default="{ row }">
                                        <span v-if="isView">{{ row.upperLimit ? formatNumber(row.upperLimit) : '无上限'
                                            }}</span>
                                        <el-input-number v-else v-model="row.upperLimit" :min="0"
                                            :formatter="(value) => `${value}`.replace(/\B(?=(\d{3})+(?!\d))/g, ',')"
                                            :parser="(value) => value.replace(/\$\s?|(,*)/g, '')" :controls="false"
                                            style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="ratio" label="提取比例（%）" width="150">
                                    <template #default="{ row }">
                                        <span v-if="isView">{{ row.ratio }}%</span>
                                        <el-input-number v-else v-model="row.ratio" :min="0" :max="100" :precision="2"
                                            :controls="false" style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column label="操作" width="80" align="center" v-if="!isView">
                                    <template #default="{ $index }">
                                        <el-button type="danger" size="small" @click="removeExcessRow($index)" link>
                                            <i class="fas fa-trash-alt"></i>
                                        </el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 支出范围模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('scope')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        支出范围
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.scope }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.scope }">
                    <div
                        style="margin-bottom: 12px; padding: 12px; background: #f0f9ff; border-left: 4px solid #409EFF; border-radius: 4px;">
                        <i class="fas fa-info-circle" style="color: #409EFF; margin-right: 8px;"></i>
                        <span style="color: #606266; font-size: 14px;">支出范围数据来源于支出范围库，根据"所属企业分类"自动关联，仅供查看</span>
                    </div>
                    <el-table :data="investmentCategories" border stripe>
                        <el-table-column prop="categoryName" label="支出范围名称" min-width="350"></el-table-column>
                        <el-table-column prop="shortName" label="支出范围简称" width="180"></el-table-column>
                        <el-table-column prop="sortOrder" label="排序号" width="100" align="center">
                            <template #header>
                                <span>排序号</span>
                                <info-mark content="按照排序号排序"></info-mark>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>

            <!-- 适用企业模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('units')">
                    <div class="module-title">
                        <i class="fas fa-building"></i>
                        适用企业
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.units }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.units }">
                    <div class="table-header" style="justify-content: flex-start;">
                        <div v-if="!isView" style="display: flex; gap: 8px;">
                            <el-button type="primary" size="small" @click="showSelectOrgDialog">
                                <i class="fas fa-plus"></i> 添加
                                <info-mark
                                    content="1、打开多择组织组件弹窗多选组织；2、选择组织后则后续该组织在维护安全费用计划、安全费用提取、安全费用使用、统计查询等功能时，可以定位到企业所属的企业分类和提取类型，自动过滤对应的支出范围、根据提取标准规则计算提取金额；3、和企业档案内“安全生产费用企业分类”字段保持一致，两边修改变更需要同步"></info-mark>
                            </el-button>
                            <el-button type="danger" size="small" @click="batchDeleteOrgs"
                                :disabled="selectedOrgs.length === 0">
                                <i class="fas fa-trash-alt"></i> 删除
                            </el-button>
                        </div>
                    </div>
                    <el-table :data="formData.organizations" border stripe @selection-change="handleOrgSelectionChange">
                        <el-table-column type="selection" width="55" v-if="!isView"></el-table-column>
                        <el-table-column prop="shortName" label="企业简称" width="150"></el-table-column>
                        <el-table-column prop="fullName" label="企业名称" min-width="200"></el-table-column>
                        <el-table-column prop="category" label="企业类型" width="120"></el-table-column>
                        <el-table-column prop="industryType" label="行业类型" width="120"></el-table-column>
                        <el-table-column label="操作" width="80" align="center" v-if="!isView">
                            <template #default="{ $index }">
                                <el-button type="danger" size="small" @click="removeOrg($index)" link>
                                    <i class="fas fa-trash-alt"></i>
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>

        <!-- 选择企业弹窗 -->
        <el-dialog v-model="orgDialogVisible" title="选择企业" width="800px">
            <el-input v-model="orgSearchText" placeholder="搜索企业名称" clearable style="margin-bottom: 16px;">
                <template #prefix>
                    <i class="fas fa-search"></i>
                </template>
            </el-input>
            <el-table :data="filteredOrgList" border stripe height="400" @selection-change="handleTempOrgSelection">
                <el-table-column type="selection" width="55"></el-table-column>
                <el-table-column prop="shortName" label="企业简称" width="150"></el-table-column>
                <el-table-column prop="fullName" label="企业名称" min-width="200"></el-table-column>
                <el-table-column prop="category" label="企业类型" width="120"></el-table-column>
                <el-table-column prop="industryType" label="行业类型" width="120"></el-table-column>
            </el-table>
            <template #footer>
                <el-button @click="orgDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmSelectOrgs">确定（已选 {{ tempSelectedOrgs.length }} 个）</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, reactive } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        const app = createApp({
            setup() {
                const formRef = ref(null);

                // 页面模式
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');
                const isEdit = computed(() => mode.value === 'edit');
                const pageTitle = computed(() => {
                    const titles = {
                        add: '新建安全费用标准',
                        edit: '编辑安全费用标准',
                        view: '查看安全费用标准'
                    };
                    return titles[mode.value] || '安全费用标准详情';
                });

                // 模块折叠状态
                const modules = ref({
                    basic: true,
                    rules: true,
                    scope: true,
                    units: true
                });

                // 行业选项
                const industryOptions = ref([
                    { label: '煤炭生产企业', value: 'coal' },
                    { label: '非煤矿山开采企业', value: 'non_coal_mining' },
                    { label: '石油天然气开采企业', value: 'oil_gas' },
                    { label: '建设工程施工企业', value: 'construction' },
                    { label: '危险品生产与存储企业', value: 'hazardous' },
                    { label: '交通运输企业', value: 'transportation' },
                    { label: '冶金企业', value: 'metallurgy' },
                    { label: '机械制造企业', value: 'machinery' },
                    { label: '烟花爆竹生产企业', value: 'fireworks' },
                    { label: '民用爆炸物品生产企业', value: 'explosives' },
                    { label: '武器装备研制生产与实验企业', value: 'weapons' },
                    { label: '电力生产与供应企业', value: 'power' },
                    { label: '其他企业', value: 'other' }
                ]);

                // 支出范围库数据（仅一级，无子级）
                const allInvestmentCategories = ref([
                    {
                        id: 1,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 1,
                        categoryName: '（一）安全防护设备、设施支出',
                        shortName: '（一）安全防护设备设施'
                    },
                    {
                        id: 2,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 2,
                        categoryName: '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                        shortName: '（二）应急救援'
                    },
                    {
                        id: 3,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 3,
                        categoryName: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出',
                        shortName: '（三）危险源与隐患排查'
                    },
                    {
                        id: 4,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 4,
                        categoryName: '（四）安全生产检查、评估评价、咨询和标准化建设支出',
                        shortName: '（四）安全检查评估'
                    },
                    {
                        id: 5,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 5,
                        categoryName: '（五）安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出',
                        shortName: '（五）宣传教育培训'
                    },
                    {
                        id: 6,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 6,
                        categoryName: '（六）配备和更新现场作业人员安全防护用品支出',
                        shortName: '（六）安全防护用品'
                    },
                    {
                        id: 7,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 7,
                        categoryName: '（七）安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出',
                        shortName: '（七）新技术新设备'
                    },
                    {
                        id: 8,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 8,
                        categoryName: '（八）安全设施及特种设备检测检验、检定校准支出',
                        shortName: '（八）设备检测检验'
                    },
                    {
                        id: 9,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 9,
                        categoryName: '（九）安全生产责任保险支出',
                        shortName: '（九）责任保险'
                    },
                    {
                        id: 10,
                        industryType: '电力生产与供应企业',
                        industryValue: 'power',
                        sortOrder: 10,
                        categoryName: '（十）与安全生产直接相关的其他支出',
                        shortName: '（十）其他支出'
                    }
                ]);

                // 根据行业类型筛选投入类别
                const investmentCategories = computed(() => {
                    if (!formData.value.industryType) return [];
                    return allInvestmentCategories.value.filter(item =>
                        item.industryValue === formData.value.industryType
                    );
                });

                // 表单数据
                const formData = ref({
                    code: '',
                    industryType: '',
                    extractType: '',
                    cycleType: '',
                    ruleType: '',
                    basisName: '上一年度营业收入',
                    basisUnit: '万元',
                    proportionRatio: '',
                    ruleUnit: '',
                    proportionRules: [
                        { basisName: '', ratio: 0 }
                    ],
                    excessRules: [
                        { lowerLimit: 0, upperLimit: 1000, ratio: 4 },
                        { lowerLimit: 1000, upperLimit: 5000, ratio: 2 },
                        { lowerLimit: 5000, upperLimit: 10000, ratio: 0.5 }
                    ],
                    organizations: [
                        { shortName: '集团总部', fullName: '国投集团总部', category: '集团', industryType: '综合' },
                        { shortName: '电力分公司', fullName: '国投电力有限责任公司', category: '子公司', industryType: '电力' }
                    ]
                });

                // 表单验证规则
                const formRules = ref({
                    code: [{ required: true, message: '请输入编号', trigger: 'blur' }],
                    industryType: [{ required: true, message: '请选择行业类型', trigger: 'change' }],
                    extractType: [{ required: true, message: '请输入提取类型', trigger: 'blur' }]
                });

                const rulesFormRules = ref({
                    cycleType: [{ required: true, message: '请选择提取周期类型', trigger: 'change' }],
                    ruleType: [{ required: true, message: '请选择提取规则类型', trigger: 'change' }],
                    basisName: [{ required: true, message: '请输入提取依据名称', trigger: 'blur' }],
                    basisUnit: [{ required: true, message: '请输入提取依据单位', trigger: 'blur' }],
                    proportionRatio: [{ required: true, message: '请输入提取比例', trigger: 'blur' }],
                    ruleUnit: [{ required: true, message: '请输入提取比例单位', trigger: 'blur' }]
                });

                // 选中的数据
                const selectedOrgs = ref([]);

                // 组织选择弹窗
                const orgDialogVisible = ref(false);
                const orgSearchText = ref('');
                const tempSelectedOrgs = ref([]);

                // 模拟组织列表（可选企业列表）
                const orgList = ref([
                    { shortName: '电力生产公司', fullName: '国投电力生产有限责任公司', category: '子公司', industryType: '电力' },
                    { shortName: '电力供应公司', fullName: '国投电力供应有限责任公司', category: '子公司', industryType: '电力' },
                    { shortName: '华北电力', fullName: '国投华北电力有限公司', category: '子公司', industryType: '电力' },
                    { shortName: '华东电力', fullName: '国投华东电力有限公司', category: '子公司', industryType: '电力' },
                    { shortName: '西南电力', fullName: '国投西南电力有限公司', category: '子公司', industryType: '电力' },
                    { shortName: '新能源发电', fullName: '国投新能源发电有限公司', category: '子公司', industryType: '电力' },
                    { shortName: '风电公司', fullName: '国投风力发电有限责任公司', category: '子公司', industryType: '电力' },
                    { shortName: '光伏发电', fullName: '国投光伏发电有限责任公司', category: '子公司', industryType: '电力' },
                    { shortName: '水电公司', fullName: '国投水力发电有限责任公司', category: '子公司', industryType: '电力' },
                    { shortName: '火电公司', fullName: '国投火力发电有限责任公司', category: '子公司', industryType: '电力' }
                ]);

                // 过滤后的组织列表
                const filteredOrgList = computed(() => {
                    if (!orgSearchText.value) return orgList.value;
                    const keyword = orgSearchText.value.toLowerCase();
                    return orgList.value.filter(org =>
                        org.shortName.toLowerCase().includes(keyword) ||
                        org.fullName.toLowerCase().includes(keyword)
                    );
                });

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    }

                    if (mode.value === 'add') {
                        // 生成新编号
                        formData.value.code = 'AQTR-' + String(Math.floor(Math.random() * 9000) + 1000).padStart(4, '0');
                    }
                });

                // 加载数据
                const loadData = (id) => {
                    // 预置数据库
                    const presetData = {
                        '1': {
                            code: 'AQTR-0001',
                            industryType: 'power',
                            extractType: '电力生产企业',
                            cycleType: 'yearly',
                            ruleType: 'excess',
                            basisName: '上一年度营业收入(元)',
                            proportionRules: [],
                            excessRules: [
                                { lowerLimit: 0, upperLimit: 10000000, ratio: 3 },
                                { lowerLimit: 10000000, upperLimit: 100000000, ratio: 1.5 },
                                { lowerLimit: 100000000, upperLimit: 1000000000, ratio: 1 },
                                { lowerLimit: 1000000000, upperLimit: 5000000000, ratio: 0.8 },
                                { lowerLimit: 5000000000, upperLimit: 10000000000, ratio: 0.6 },
                                { lowerLimit: 10000000000, upperLimit: null, ratio: 0.2 }
                            ],
                            organizations: [
                                { shortName: '电力生产公司', fullName: '国投电力生产有限责任公司', category: '子公司', industryType: '电力' }
                            ]
                        },
                        '2': {
                            code: 'AQTR-0002',
                            industryType: 'power',
                            extractType: '电力供应企业',
                            cycleType: 'yearly',
                            ruleType: 'excess',
                            basisName: '上一年度营业收入(元)',
                            proportionRules: [],
                            excessRules: [
                                { lowerLimit: 0, upperLimit: 50000000000, ratio: 0.5 },
                                { lowerLimit: 50000000000, upperLimit: 100000000000, ratio: 0.4 },
                                { lowerLimit: 100000000000, upperLimit: 200000000000, ratio: 0.3 },
                                { lowerLimit: 200000000000, upperLimit: null, ratio: 0.2 }
                            ],
                            organizations: [
                                { shortName: '电力供应公司', fullName: '国投电力供应有限责任公司', category: '子公司', industryType: '电力' }
                            ]
                        }
                    };

                    // 根据ID加载数据
                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };
                    } else {
                        // 默认数据
                        formData.value = {
                            code: 'AQTR-' + id.padStart(4, '0'),
                            industryType: 'coal',
                            extractType: '原煤产量提取',
                            cycleType: 'monthly',
                            ruleType: 'excess',
                            basisName: '原煤产量',
                            proportionRules: [{ basisName: '原煤产量', ratio: 2.5 }],
                            excessRules: [
                                { lowerLimit: 0, upperLimit: 1000, ratio: 4 },
                                { lowerLimit: 1000, upperLimit: 5000, ratio: 2 },
                                { lowerLimit: 5000, upperLimit: null, ratio: 0.5 }
                            ],
                            organizations: []
                        };
                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 格式化数字（千分号）
                const formatNumber = (value) => {
                    if (value === null || value === undefined) return '无上限';
                    // 去掉小数点后无意义的0，添加千分号
                    let num = parseFloat(value);
                    let str = num.toString();
                    // 分离整数和小数部分
                    let parts = str.split('.');
                    // 整数部分添加千分号
                    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                    return parts.join('.');
                };

                // 周期类型变化
                const handleCycleTypeChange = (val) => {
                    if (val === 'custom') {
                        formData.value.ruleType = 'custom';
                        handleRuleTypeChange();
                    }
                };

                // 规则类型变化
                const handleRuleTypeChange = () => {
                    if (formData.value.ruleType === 'proportion' && formData.value.proportionRules.length === 0) {
                        formData.value.proportionRules.push({ basisName: '', ratio: 0 });
                    }
                    if (formData.value.ruleType === 'excess' && formData.value.excessRules.length === 0) {
                        formData.value.excessRules.push({ lowerLimit: 0, upperLimit: 0, ratio: 0 });
                    }
                };

                // 比例提取表格操作
                const addProportionRow = () => {
                    formData.value.proportionRules.push({ basisName: '', ratio: 0 });
                };
                const removeProportionRow = (index) => {
                    formData.value.proportionRules.splice(index, 1);
                };

                // 超额累退表格操作
                const addExcessRow = () => {
                    formData.value.excessRules.push({ lowerLimit: 0, upperLimit: 0, ratio: 0 });
                };
                const removeExcessRow = (index) => {
                    formData.value.excessRules.splice(index, 1);
                };

                // 组织操作
                const handleOrgSelectionChange = (selection) => {
                    selectedOrgs.value = selection;
                };
                const showSelectOrgDialog = () => {
                    orgSearchText.value = '';
                    tempSelectedOrgs.value = [];
                    orgDialogVisible.value = true;
                };
                const handleTempOrgSelection = (selection) => {
                    tempSelectedOrgs.value = selection;
                };
                const confirmSelectOrgs = () => {
                    tempSelectedOrgs.value.forEach(org => {
                        if (!formData.value.organizations.find(o => o.fullName === org.fullName)) {
                            formData.value.organizations.push({ ...org });
                        }
                    });
                    orgDialogVisible.value = false;
                    ElMessage.success('添加成功');
                };
                const removeOrg = (index) => {
                    formData.value.organizations.splice(index, 1);
                };
                const batchDeleteOrgs = () => {
                    selectedOrgs.value.forEach(item => {
                        const index = formData.value.organizations.indexOf(item);
                        if (index > -1) formData.value.organizations.splice(index, 1);
                    });
                    selectedOrgs.value = [];
                    ElMessage.success('删除成功');
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 切换到编辑模式
                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                // 返回列表
                const goBack = () => {
                    window.location.href = '计提标准库.html';
                };

                // 获取两措属性样式
                const getMeasureClass = (type) => {
                    const map = {
                        '安措': 'measure-an',
                        '反措': 'measure-fan',
                        '其他': 'measure-other'
                    };
                    return map[type] || '';
                };

                return {
                    formRef,
                    mode,
                    isView,
                    isEdit,
                    pageTitle,
                    modules,
                    industryOptions,
                    formData,
                    formRules,
                    rulesFormRules,
                    selectedOrgs,
                    orgDialogVisible,
                    orgSearchText,
                    tempSelectedOrgs,
                    filteredOrgList,
                    investmentCategories,
                    toggleModule,
                    handleCycleTypeChange,
                    handleRuleTypeChange,
                    addProportionRow,
                    removeProportionRow,
                    addExcessRow,
                    removeExcessRow,
                    handleOrgSelectionChange,
                    showSelectOrgDialog,
                    handleTempOrgSelection,
                    confirmSelectOrgs,
                    removeOrg,
                    batchDeleteOrgs,
                    handleSave,
                    switchToEdit,
                    goBack,
                    formatNumber,
                    getMeasureClass
                };
            }
        });

        app.component('info-mark', {
            props: ['content'],
            template: `
                <el-popover
                    placement="top"
                    title="说明"
                    :width="200"
                    trigger="click"
                    :content="content"
                >
                    <template #reference>
                        <span class="info-mark" @click.stop></span>
                    </template>
                </el-popover>
            `
        });

        app.use(ElementPlus).mount('#app');
    </script>
</body>

</html>
