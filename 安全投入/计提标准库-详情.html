<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用标准库 - 计提标准库详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .page-header {
            background: white;
            padding: 20px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: #409EFF;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        .form-item.half-width {
            flex: 0 0 calc(50% - 12px);
        }

        /* 表格区域样式 */
        .table-section {
            margin-top: 16px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-title {
            font-size: 14px;
            font-weight: 500;
            color: #606266;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }

        /* 表单标签右对齐 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
        }

        /* 两措属性标签 */
        .measure-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .measure-an {
            background-color: #e6f7ff;
            color: #1890ff;
        }

        .measure-fan {
            background-color: #fff7e6;
            color: #fa8c16;
        }

        .measure-other {
            background-color: #f6ffed;
            color: #52c41a;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <!-- 表单容器 -->
        <div class="form-container">
            <!-- 基本信息模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基本信息
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编码" prop="code">
                                    <el-input v-model="formData.code" placeholder="自动生成，如AQTR-0001"
                                        :disabled="isView || isEdit" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属行业类型" prop="industryType">
                                    <el-select v-model="formData.industryType" placeholder="请选择行业类型" :disabled="isView"
                                        style="width: 100%;">
                                        <el-option v-for="item in industryOptions" :key="item.value" :label="item.label"
                                            :value="item.value" />
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取类型" prop="extractType">
                                    <el-input v-model="formData.extractType" placeholder="请输入提取类型" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细提取规则模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('rules')">
                    <div class="module-title">
                        <i class="fas fa-calculator"></i>
                        详细提取规则
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.rules }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.rules }">
                    <el-form :model="formData" :rules="rulesFormRules" ref="rulesFormRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取周期类型" prop="cycleType" required>
                                    <el-select v-model="formData.cycleType" placeholder="请选择提取周期类型" :disabled="isView"
                                        style="width: 100%;">
                                        <el-option label="月度实时提取" value="monthly"></el-option>
                                        <el-option label="年度分摊提取" value="yearly"></el-option>
                                        <el-option label="项目进度提取" value="project"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取规则类型" prop="ruleType" required>
                                    <el-select v-model="formData.ruleType" placeholder="请选择提取规则类型" :disabled="isView"
                                        style="width: 100%;" @change="handleRuleTypeChange">
                                        <el-option label="比例提取" value="proportion"></el-option>
                                        <el-option label="超额累退" value="excess"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取依据名称" prop="basisName" required>
                                    <el-input v-model="formData.basisName" placeholder="请输入提取依据名称" :disabled="isView" />
                                </el-form-item>
                            </div>
                        </div>

                        <!-- 比例提取表格 -->
                        <div class="table-section" v-if="formData.ruleType === 'proportion'">
                            <div class="table-header" style="justify-content: flex-start;">
                                <el-button type="primary" size="small" @click="addProportionRow" v-if="!isView">
                                    <i class="fas fa-plus"></i> 添加
                                </el-button>
                            </div>
                            <el-table :data="formData.proportionRules" border stripe>
                                <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                                <el-table-column prop="basisName" label="提取依据名称" min-width="200">
                                    <template #default="{ row }">
                                        <el-input v-model="row.basisName" placeholder="请输入"
                                            :disabled="isView"></el-input>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="ratio" label="提取比例（%）" width="150">
                                    <template #default="{ row }">
                                        <el-input-number v-model="row.ratio" :min="0" :max="100" :precision="2"
                                            :disabled="isView" style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column label="操作" width="80" align="center" v-if="!isView">
                                    <template #default="{ $index }">
                                        <el-button type="danger" size="small" @click="removeProportionRow($index)" link>
                                            <i class="fas fa-trash-alt"></i>
                                        </el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>

                        <!-- 超额累退表格 -->
                        <div class="table-section" v-if="formData.ruleType === 'excess'">
                            <div class="table-header" style="justify-content: flex-start;">
                                <el-button type="primary" size="small" @click="addExcessRow" v-if="!isView">
                                    <i class="fas fa-plus"></i> 添加
                                </el-button>
                            </div>
                            <el-table :data="formData.excessRules" border stripe>
                                <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                                <el-table-column prop="lowerLimit" label="下限" min-width="180">
                                    <template #default="{ row }">
                                        <span v-if="isView">{{ formatNumber(row.lowerLimit) }}</span>
                                        <el-input-number v-else v-model="row.lowerLimit" :min="0"
                                            :formatter="(value) => `${value}`.replace(/\B(?=(\d{3})+(?!\d))/g, ',')"
                                            :parser="(value) => value.replace(/\$\s?|(,*)/g, '')" :controls="false"
                                            style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="upperLimit" label="上限" min-width="180">
                                    <template #default="{ row }">
                                        <span v-if="isView">{{ row.upperLimit ? formatNumber(row.upperLimit) : '无上限'
                                            }}</span>
                                        <el-input-number v-else v-model="row.upperLimit" :min="0"
                                            :formatter="(value) => `${value}`.replace(/\B(?=(\d{3})+(?!\d))/g, ',')"
                                            :parser="(value) => value.replace(/\$\s?|(,*)/g, '')" :controls="false"
                                            style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="ratio" label="提取比例（%）" width="150">
                                    <template #default="{ row }">
                                        <span v-if="isView">{{ row.ratio }}%</span>
                                        <el-input-number v-else v-model="row.ratio" :min="0" :max="100" :precision="2"
                                            :controls="false" style="width: 100%;"></el-input-number>
                                    </template>
                                </el-table-column>
                                <el-table-column label="操作" width="80" align="center" v-if="!isView">
                                    <template #default="{ $index }">
                                        <el-button type="danger" size="small" @click="removeExcessRow($index)" link>
                                            <i class="fas fa-trash-alt"></i>
                                        </el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 投入范围模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('scope')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        投入范围
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.scope }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.scope }">
                    <div style="margin-bottom: 12px; padding: 12px; background: #f0f9ff; border-left: 4px solid #409EFF; border-radius: 4px;">
                        <i class="fas fa-info-circle" style="color: #409EFF; margin-right: 8px;"></i>
                        <span style="color: #606266; font-size: 14px;">投入范围数据来源于投入类别库，根据所选行业类型自动关联，仅供查看</span>
                    </div>
                    <el-table :data="investmentCategories" border stripe row-key="id" 
                        :tree-props="{ children: 'children', hasChildren: 'hasChildren' }">
                        <el-table-column prop="categoryName" label="投入类别名称" min-width="400"></el-table-column>
                        <el-table-column prop="sortOrder" label="排序号" width="100" align="center"></el-table-column>
                        <el-table-column prop="measureType" label="两措属性" width="120" align="center">
                            <template #default="{ row }">
                                <span v-if="row.measureType" :class="['measure-tag', getMeasureClass(row.measureType)]">
                                    {{ row.measureType }}
                                </span>
                                <span v-else>-</span>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>

            <!-- 单位配置模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('units')">
                    <div class="module-title">
                        <i class="fas fa-building"></i>
                        单位配置
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.units }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.units }">
                    <div class="table-header" style="justify-content: flex-start;">
                        <div v-if="!isView" style="display: flex; gap: 8px;">
                            <el-button type="primary" size="small" @click="showSelectOrgDialog">
                                <i class="fas fa-plus"></i> 添加
                            </el-button>
                            <el-button type="danger" size="small" @click="batchDeleteOrgs"
                                :disabled="selectedOrgs.length === 0">
                                <i class="fas fa-trash-alt"></i> 删除
                            </el-button>
                        </div>
                    </div>
                    <el-table :data="formData.organizations" border stripe @selection-change="handleOrgSelectionChange">
                        <el-table-column type="selection" width="55" v-if="!isView"></el-table-column>
                        <el-table-column prop="shortName" label="组织简称" width="150"></el-table-column>
                        <el-table-column prop="fullName" label="组织名称" min-width="250"></el-table-column>
                        <el-table-column prop="category" label="组织类别" width="120"></el-table-column>
                        <el-table-column label="操作" width="80" align="center" v-if="!isView">
                            <template #default="{ $index }">
                                <el-button type="danger" size="small" @click="removeOrg($index)" link>
                                    <i class="fas fa-trash-alt"></i>
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>

        <!-- 选择组织弹窗 -->
        <el-dialog v-model="orgDialogVisible" title="选择组织" width="700px">
            <el-input v-model="orgSearchText" placeholder="搜索组织名称" clearable style="margin-bottom: 16px;">
                <template #prefix>
                    <i class="fas fa-search"></i>
                </template>
            </el-input>
            <el-table :data="filteredOrgList" border stripe height="400" @selection-change="handleTempOrgSelection">
                <el-table-column type="selection" width="55" />
                <el-table-column prop="shortName" label="组织简称" width="150" />
                <el-table-column prop="fullName" label="组织名称" min-width="250" />
                <el-table-column prop="category" label="组织类别" width="120" />
            </el-table>
            <template #footer>
                <el-button @click="orgDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmSelectOrgs">确定（已选 {{ tempSelectedOrgs.length }} 个）</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>

                        }

                    // 根据ID加载数据
                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };

                        // 默认数据
                        formData.value = {
                            code: 'AQTR-' + id.padStart(4, '0'),

                            organizations: []

                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 格式化数字（千分号）
                const formatNumber = (value) => {
                    if (value === null || value === undefined) return '无上限';
                    return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                };

                // 规则类型变化
                const handleRuleTypeChange = () => {
                    if (formData.value.ruleType === 'proportion' && formData.value.proportionRules.length === 0) {
                        formData.value.proportionRules.push({ basisName: '', ratio: 0 });
                    }
                    if (formData.value.ruleType === 'excess' && formData.value.excessRules.length === 0) {
                        formData.value.excessRules.push({ lowerLimit: 0, upperLimit: 0, ratio: 0 });
                    }
                };

                // 比例提取表格操作
                const addProportionRow = () => {
                    formData.value.proportionRules.push({ basisName: '', ratio: 0 });
                };
                const removeProportionRow = (index) => {
                    formData.value.proportionRules.splice(index, 1);
                };

                // 超额累退表格操作
                const addExcessRow = () => {
                    formData.value.excessRules.push({ lowerLimit: 0, upperLimit: 0, ratio: 0 });
                };
                const removeExcessRow = (index) => {
                    formData.value.excessRules.splice(index, 1);
                };

                // 组织操作

                    selectedOrgs.value = selection;

                };

                    tempSelectedOrgs.value = selection;
                };

                    tempSelectedOrgs.value.forEach(org => {

                        }
                    });
                    orgDialogVisible.value = false;
                    ElMessage.success('添加成功');
                };
                const removeOrg = (index) => {
                    formData.value.organizations.splice(index, 1);
                };
                const batchDeleteOrgs = () => {
                    selectedOrgs.value.forEach(item => {
                        const index = formData.value.organizations.indexOf(item);
                        if (index > -1) formData.value.organizations.splice(index, 1);
                    });
                    selectedOrgs.value = [];
                    ElMessage.success('删除成功');
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {

                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 返回列表
                const goBack = () => {
