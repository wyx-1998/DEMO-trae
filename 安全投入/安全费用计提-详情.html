<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全费用计提管理 - 详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        /* 三列布局 */
        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        /* 底部按钮条 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 计算公式高亮 */
        .formula-hint {
            font-size: 12px;
            color: #67C23A;
            margin-top: 4px;
        }

        /* 表单标签右对齐，最多6字换行 */
        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 200px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        /* 总计行样式 */
        .summary-row {
            background-color: #fafafa !important;
        }

        .summary-row td {
            background-color: #fafafa !important;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="140px"
                        label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="编号" prop="code" required>
                                    <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="组织名称" prop="orgName" required>
                                    <el-input v-model="formData.orgName" placeholder="组织名称" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="所属行业类型" prop="industryType" required>
                                    <el-input v-model="formData.industryType" placeholder="行业类型" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取类型" prop="extractType" required>
                                    <el-input v-model="formData.extractType" placeholder="提取类型" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取规则类型" prop="ruleType" required>
                                    <el-select v-model="formData.ruleType" placeholder="请选择" disabled
                                        style="width: 100%;">
                                        <el-option label="超额累退" value="excess"></el-option>
                                        <el-option label="比例提取" value="proportion"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取周期类型" prop="cycleType" required>
                                    <el-select v-model="formData.cycleType" placeholder="请选择" disabled
                                        style="width: 100%;">
                                        <el-option label="年度分摊提取" value="yearly"></el-option>
                                        <el-option label="月度实时提取" value="monthly"></el-option>
                                        <el-option label="项目进度提取" value="project"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取周期" prop="cycle" required>
                                    <el-date-picker v-model="formData.cycle" type="year" placeholder="请选择年份"
                                        value-format="YYYY" style="width: 100%;" :disabled="isView"
                                        @change="handleCycleChange" />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 提取数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('extract')">
                    <div class="module-title">
                        <i class="fas fa-calculator"></i>
                        提取数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.extract }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.extract }">
                    <el-form :model="formData" label-width="200px" label-position="left">
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="提取依据名称" prop="basisName" required>
                                    <el-input v-model="formData.basisName" placeholder="提取依据" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="提取依据值" prop="basisValue" required>
                                    <el-input v-model="formData.basisValueDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleBasisValueInput" @blur="formatBasisValue" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="本周期应提取金额（万元）" required>
                                    <el-input :model-value="formatAmount(calculatedAmount)" disabled>
                                        <template #suffix>
                                            <el-button link type="primary" @click="showCalculationDialog"
                                                style="padding: 0; margin-right: 8px;">
                                                <i class="fas fa-calculator" style="font-size: 16px;"></i>
                                            </el-button>
                                        </template>
                                    </el-input>
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="本周期计划投入预算（万元）" required>
                                    <el-input :model-value="formatAmount(formData.planBudget)" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="上一周期结余金额（万元）" prop="carryOver" required>
                                    <el-input v-model="formData.carryOverDisplay" placeholder="请输入金额" :disabled="isView"
                                        @input="handleCarryOverInput" @blur="formatCarryOver" />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="本周期计提金额（万元）" required>
                                    <el-input v-model="formData.totalAccrualDisplay" placeholder="请输入金额"
                                        :disabled="isView" @input="handleTotalAccrualInput" @blur="formatTotalAccrual" />
                                    <div class="formula-hint">= 本周期应提取金额 + 上一周期结余金额</div>
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 详细计划模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('plan')">
                    <div class="module-title">
                        <i class="fas fa-list-alt"></i>
                        详细计划
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.plan }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.plan }">
                    <el-table :data="categoriesWithTotal" border stripe :row-class-name="tableRowClassName">
                        <el-table-column type="index" label="序号" width="60" align="center">
                            <template #default="{ row }">
                                {{ row.isSummary ? '' : row.index }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="name" label="投入类别名称" min-width="350">
                            <template #default="{ row }">
                                <span :style="{ fontWeight: row.isSummary ? '600' : 'normal' }">{{ row.name }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="planCost" label="本周期计划投入费用（万元）" width="200" align="right">
                            <template #default="{ row }">
                                <span :style="{ fontWeight: row.isSummary ? '600' : 'normal' }">{{ formatAmount(row.planCost) }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="accrualAmount" label="本周期计提金额（万元）" width="200">
                            <template #default="{ row }">
                                <el-input v-if="!isView && !row.isSummary" v-model="row.accrualAmountDisplay" placeholder="请输入"
                                    @input="handleCategoryInput(row)" @blur="formatCategoryAmount(row)" />
                                <span v-else :style="{ fontWeight: row.isSummary ? '600' : 'normal', color: row.isSummary ? '#409EFF' : '' }">{{ formatAmount(row.accrualAmount) }}</span>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">取消</el-button>
            <el-button type="primary" @click="handleSave" v-if="!isView">
                <i class="fas fa-save"></i> 保存
            </el-button>
            <el-button type="primary" @click="switchToEdit" v-if="isView">
                <i class="fas fa-edit"></i> 编辑
            </el-button>
        </div>

        <!-- 计算规则弹窗 -->
        <el-dialog v-model="calculationDialogVisible" title="计提金额计算规则" width="700px">
            <div style="margin-bottom: 16px;">
                <div style="padding: 12px; background: #f0f9ff; border-left: 4px solid #409EFF; border-radius: 4px; margin-bottom: 16px;">
                    <div style="font-weight: 600; color: #303133; margin-bottom: 8px;">
                        <i class="fas fa-info-circle" style="color: #409EFF; margin-right: 6px;"></i>
                        计算规则说明
                    </div>
                    <div style="color: #606266; font-size: 14px; line-height: 1.6;">
                        采用<strong style="color: #E6A23C;">超额累退</strong>方式计算，根据提取依据值分段按不同比例提取安全费用
                    </div>
                </div>
                <el-table :data="calculationRulesDisplay" border stripe>
                    <el-table-column label="序号" width="60" align="center" type="index"></el-table-column>
                    <el-table-column label="提取依据值范围" min-width="200">
                        <template #default="{ row }">
                            <span>{{ row.range }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="提取比例" width="120" align="center">
                        <template #default="{ row }">
                            <el-tag type="success">{{ row.ratio }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="本次计提金额（万元）" width="160" align="right">
                        <template #default="{ row }">
                            <span :style="{ color: row.amount > 0 ? '#67C23A' : '#909399', fontWeight: row.amount > 0 ? '600' : 'normal' }">
                                {{ formatAmount(row.amount) }}
                            </span>
                        </template>
                    </el-table-column>
                </el-table>
                <div style="margin-top: 16px; padding: 12px; background: #f5f7fa; border-radius: 4px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 14px; color: #606266;">提取依据值：</span>
                        <span style="font-size: 16px; font-weight: 600; color: #303133;">{{ formatAmount(formData.basisValue) }} 万元</span>
                    </div>
                    <el-divider style="margin: 12px 0;"></el-divider>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 14px; color: #606266;">本周期应提取金额：</span>
                        <span style="font-size: 18px; font-weight: 700; color: #409EFF;">{{ formatAmount(calculatedAmount) }} 万元</span>
                    </div>
                </div>
            </div>
            <template #footer>
                <el-button type="primary" @click="calculationDialogVisible = false">确定</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const formRef = ref(null);

                // 页面模式
                const mode = ref('add');
                const isView = computed(() => mode.value === 'view');

                // 模块折叠状态
                const modules = ref({
                    basic: true,
                    extract: true,
                    plan: true
                });

                // 弹窗控制
                const calculationDialogVisible = ref(false);

                // 表单数据
                const formData = ref({
                    code: '',
                    orgName: 'xx电力',
                    industryType: '电力生产与供应企业',
                    extractType: '电力生产企业',
                    ruleType: 'excess',
                    cycleType: 'yearly',
                    cycle: new Date().getFullYear().toString(),
                    basisName: '上一年度营业收入（万元）',
                    basisValue: 150000,
                    basisValueDisplay: '150,000',
                    carryOver: 50000,
                    carryOverDisplay: '50,000',
                    totalAccrual: 0,
                    totalAccrualDisplay: '',
                    planBudget: 145000,
                    categories: []
                });

                // 超额累退规则（电力生产企业，基于万元）
                const excessRules = [
                    { lowerLimit: 0, upperLimit: 1000, ratio: 0.03 },           // 0-1000万: 3%
                    { lowerLimit: 1000, upperLimit: 10000, ratio: 0.015 },      // 1000万-1亿: 1.5%
                    { lowerLimit: 10000, upperLimit: 100000, ratio: 0.01 },     // 1亿-10亿: 1%
                    { lowerLimit: 100000, upperLimit: 500000, ratio: 0.008 },   // 10亿-50亿: 0.8%
                    { lowerLimit: 500000, upperLimit: 1000000, ratio: 0.006 },  // 50亿-100亿: 0.6%
                    { lowerLimit: 1000000, upperLimit: null, ratio: 0.002 }     // 100亿以上: 0.2%
                ];

                // 投入类别列表
                const defaultCategories = [
                    { code: 'TRLB-0001', name: '（一）完善、改造和维护安全防护设备、设施支出', sortOrder: 1, planCost: 200, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0002', name: '（二）配备、维护、保养应急救援器材、设备设施支出', sortOrder: 2, planCost: 180, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0003', name: '（三）开展重大危险源检测、评估、监控支出', sortOrder: 3, planCost: 150, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0004', name: '（四）安全生产检查、评估评价、咨询和标准化建设支出', sortOrder: 4, planCost: 120, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0005', name: '（五）安全生产宣传、教育、培训支出', sortOrder: 5, planCost: 100, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0006', name: '（六）配备和更新现场作业人员安全防护用品支出', sortOrder: 6, planCost: 80, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0007', name: '（七）安全生产适用的新技术、新设备的推广应用支出', sortOrder: 7, planCost: 150, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0008', name: '（八）安全设施及特种设备检测检验支出', sortOrder: 8, planCost: 100, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0009', name: '（九）安全生产责任保险支出', sortOrder: 9, planCost: 50, accrualAmount: 0, accrualAmountDisplay: '' },
                    { code: 'TRLB-0010', name: '（十）与安全生产直接相关的其他支出', sortOrder: 10, planCost: 70, accrualAmount: 0, accrualAmountDisplay: '' }
                ];

                // 表单验证规则
                const formRules = ref({
                    cycle: [{ required: true, message: '请选择提取周期', trigger: 'change' }]
                });

                // 计算应提取金额（超额累退）
                const calculatedAmount = computed(() => {
                    const basisValue = formData.value.basisValue || 0;
                    let total = 0;
                    let remaining = basisValue;

                    for (const rule of excessRules) {
                        if (remaining <= 0) break;

                        const upperLimit = rule.upperLimit || Infinity;
                        const rangeSize = upperLimit - rule.lowerLimit;
                        const applicableAmount = Math.min(remaining, rangeSize);

                        if (basisValue > rule.lowerLimit) {
                            total += applicableAmount * rule.ratio;
                            remaining -= applicableAmount;
                        }
                    }

                    return Math.round(total * 1000000) / 1000000;
                });

                // 计算本周期计提金额（自动计算值）
                const totalAccrualCalculated = computed(() => {
                    return calculatedAmount.value + (formData.value.carryOver || 0);
                });

                // 计算计划投入合计
                const totalPlanCost = computed(() => {
                    return formData.value.categories.reduce((sum, item) => sum + (item.planCost || 0), 0);
                });

                // 计算类别计提金额合计
                const totalCategoryAccrual = computed(() => {
                    return formData.value.categories.reduce((sum, item) => sum + (item.accrualAmount || 0), 0);
                });

                // 带合计行的类别数据
                const categoriesWithTotal = computed(() => {
                    const data = formData.value.categories.map((cat, index) => ({
                        ...cat,
                        index: index + 1
                    }));
                    // 添加合计行
                    const summary = {
                        isSummary: true,
                        index: '',
                        name: '合计',
                        planCost: totalPlanCost.value,
                        accrualAmount: totalCategoryAccrual.value,
                        accrualAmountDisplay: ''
                    };
                    data.push(summary);
                    return data;
                });

                // 计算规则显示数据
                const calculationRulesDisplay = computed(() => {
                    const basisValue = formData.value.basisValue || 0;
                    const results = [];
                    let remaining = basisValue;

                    for (const rule of excessRules) {
                        const upperLimit = rule.upperLimit || Infinity;
                        const rangeSize = upperLimit - rule.lowerLimit;
                        const applicableAmount = Math.min(remaining, rangeSize);
                        
                        let amount = 0;
                        if (basisValue > rule.lowerLimit && remaining > 0) {
                            amount = applicableAmount * rule.ratio;
                            remaining -= applicableAmount;
                        }

                        const rangeText = rule.upperLimit 
                            ? `${formatAmount(rule.lowerLimit)} - ${formatAmount(rule.upperLimit)} 万元`
                            : `${formatAmount(rule.lowerLimit)} 万元以上`;

                        results.push({
                            range: rangeText,
                            ratio: (rule.ratio * 100).toFixed(2) + '%',
                            amount: amount
                        });
                    }

                    return results;
                });

                // 格式化金额（千分号，不显示末尾的0）
                const formatAmount = (value) => {
                    if (value === null || value === undefined || value === '') return '-';
                    const num = parseFloat(value);
                    if (isNaN(num)) return '-';
                    // 使用千分号格式化，但不显示末尾的0
                    const formatted = new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 6
                    }).format(num);
                    return formatted;
                };

                // 解析金额字符串
                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                // 处理提取依据值输入
                const handleBasisValueInput = (value) => {
                    formData.value.basisValueDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化提取依据值
                const formatBasisValue = () => {
                    const value = parseAmount(formData.value.basisValueDisplay);
                    formData.value.basisValue = value;
                    formData.value.basisValueDisplay = formatAmount(value);
                };

                // 处理结余金额输入
                const handleCarryOverInput = (value) => {
                    formData.value.carryOverDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化结余金额
                const formatCarryOver = () => {
                    const value = parseAmount(formData.value.carryOverDisplay);
                    formData.value.carryOver = value;
                    formData.value.carryOverDisplay = formatAmount(value);
                };

                // 处理计提金额输入
                const handleTotalAccrualInput = (value) => {
                    formData.value.totalAccrualDisplay = value.replace(/[^\d.]/g, '');
                };

                // 格式化计提金额
                const formatTotalAccrual = () => {
                    const value = parseAmount(formData.value.totalAccrualDisplay);
                    formData.value.totalAccrual = value;
                    formData.value.totalAccrualDisplay = formatAmount(value);
                };

                // 处理类别金额输入
                const handleCategoryInput = (row) => {
                    row.accrualAmountDisplay = row.accrualAmountDisplay.replace(/[^\d.]/g, '');
                };

                // 格式化类别金额
                const formatCategoryAmount = (row) => {
                    const value = parseAmount(row.accrualAmountDisplay);
                    row.accrualAmount = value;
                    row.accrualAmountDisplay = formatAmount(value);
                };

                // 提取周期变化
                const handleCycleChange = () => {
                    generateCode();
                };

                // 生成编号
                const generateCode = () => {
                    const year = formData.value.cycle || new Date().getFullYear().toString();
                    formData.value.code = `AQTRJH-${year}-001`;
                };

                // 监听计算值变化，自动更新显示
                watch(totalAccrualCalculated, (newVal) => {
                    if (!formData.value.totalAccrualDisplay || formData.value.totalAccrualDisplay === '') {
                        formData.value.totalAccrual = newVal;
                        formData.value.totalAccrualDisplay = formatAmount(newVal);
                    }
                });

                // 初始化
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    const id = urlParams.get('id');

                    // 初始化类别列表
                    formData.value.categories = JSON.parse(JSON.stringify(defaultCategories));

                    if (id && (mode.value === 'view' || mode.value === 'edit')) {
                        loadData(id);
                    } else {
                        generateCode();
                        // 初始化计提金额
                        formData.value.totalAccrual = totalAccrualCalculated.value;
                        formData.value.totalAccrualDisplay = formatAmount(totalAccrualCalculated.value);
                    }
                });

                // 加载数据
                const loadData = (id) => {
                    const presetData = {
                        '1': {
                            code: 'AQTRJH-2026-001',
                            orgName: 'xx电力',
                            industryType: '电力生产与供应企业',
                            extractType: '电力生产企业',
                            ruleType: 'excess',
                            cycleType: 'yearly',
                            cycle: '2026',
                            basisName: '上一年度营业收入（万元）',
                            basisValue: 150000,
                            basisValueDisplay: '150,000',
                            carryOver: 50000,
                            carryOverDisplay: '50,000',
                            totalAccrual: 0,
                            totalAccrualDisplay: '',
                            planBudget: 145000,
                            categories: defaultCategories.map(cat => ({
                                ...cat,
                                accrualAmount: cat.planCost * 1.1,
                                accrualAmountDisplay: formatAmount(cat.planCost * 1.1)
                            }))
                        }
                    };

                    if (presetData[id]) {
                        formData.value = { ...presetData[id] };
                        // 初始化计提金额
                        if (!formData.value.totalAccrual) {
                            formData.value.totalAccrual = totalAccrualCalculated.value;
                            formData.value.totalAccrualDisplay = formatAmount(totalAccrualCalculated.value);
                        } else {
                            formData.value.totalAccrualDisplay = formatAmount(formData.value.totalAccrual);
                        }
                    } else {
                        generateCode();
                    }
                };

                // 切换模块
                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                // 表格行样式
                const tableRowClassName = ({ row }) => {
                    if (row.isSummary) {
                        return 'summary-row';
                    }
                    return '';
                };

                // 显示计算规则弹窗
                const showCalculationDialog = () => {
                    calculationDialogVisible.value = true;
                };

                // 保存
                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            ElMessage.success('保存成功');
                            setTimeout(() => {
                                goBack();
                            }, 1000);
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                // 切换到编辑模式
                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                // 返回列表
                const goBack = () => {
                    window.location.href = '安全费用计提.html';
                };

                return {
                    formRef,
                    mode,
                    isView,
                    modules,
                    formData,
                    formRules,
                    calculatedAmount,
                    totalAccrualCalculated,
                    totalPlanCost,
                    totalCategoryAccrual,
                    categoriesWithTotal,
                    calculationDialogVisible,
                    calculationRulesDisplay,
                    toggleModule,
                    formatAmount,
                    handleBasisValueInput,
                    formatBasisValue,
                    handleCarryOverInput,
                    formatCarryOver,
                    handleTotalAccrualInput,
                    formatTotalAccrual,
                    handleCategoryInput,
                    formatCategoryAmount,
                    handleCycleChange,
                    tableRowClassName,
                    showCalculationDialog,
                    handleSave,
                    switchToEdit,
                    goBack
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>

</html>
