<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>费用使用记录（相关方） - 详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-title i {
            color: #409EFF;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
        }

        .module-content.collapsed {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
        }

        .form-item.full-width {
            flex: 1;
            width: 100%;
        }

        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        .el-form-item__label {
            text-align: right !important;
            justify-content: flex-end !important;
            display: inline-block !important;
            max-width: 170px !important;
            word-break: break-word !important;
            white-space: normal !important;
            line-height: 1.5 !important;
            height: auto !important;
        }

        .project-select-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-select-input .el-select {
            flex: 1;
        }

        .project-select-btn {
            flex-shrink: 0;
        }

        .project-dialog-search {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .project-dialog-search .el-input {
            width: 200px;
        }

        @media (max-width: 1200px) {
            .form-item {
                flex: 0 0 calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .form-item {
                flex: 1;
                width: 100%;
            }
        }

        /* 增加说明标识样式 */
        body {
            counter-reset: info-mark-counter;
        }

        .info-mark {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 16px;
            height: 16px;
            background-color: #E6A23C;
            border-radius: 2px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 4px;
            position: relative;
            top: -1px;
            font-size: 10px;
            color: #fff;
            line-height: 1;
        }

        .info-mark::after {
            counter-increment: info-mark-counter;
            content: counter(info-mark-counter);
        }

        .info-mark:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="app" class="container">
        <div class="form-container">
            <!-- 基础数据模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('basic')">
                    <div class="module-title">
                        <i class="fas fa-info-circle"></i>
                        基础数据
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.basic }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.basic }">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="170px"
                        label-position="left">
                        <!-- 第一行：关联相关方项目、项目名称、安全费用项目编号 -->
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="关联相关方项目" prop="relatedProject" required>
                                    <template #label>
                                        关联相关方项目
                                        <info-mark content="携带列表页左侧树所选的相关方项目"></info-mark>
                                    </template>
                                    <div class="project-select-input">
                                        <el-select v-model="formData.relatedProject" placeholder="请选择项目"
                                            :disabled="pageType==='project' || isView" style="flex: 1;" filterable>
                                            <el-option v-for="project in allProjects" :key="project.id"
                                                :label="project.name" :value="project.id"></el-option>
                                        </el-select>
                                        <el-button class="project-select-btn" :disabled="pageType==='project' || isView"
                                            @click="openProjectDialog">
                                            <i class="fas fa-search"></i>
                                        </el-button>
                                    </div>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="安全费用项目名称" prop="projectName" required>
                                    <template #label>
                                        安全费用项目名称
                                        <info-mark
                                            content="1、根据所选相关方项目过滤数据，如果没选择相关方项目则不显示数据；2、数据来源：安全费用计划(相关方)；3、选择后自动填充后续字段"></info-mark>
                                    </template>
                                    <el-select v-model="formData.projectName" placeholder="请选择安全费用项目"
                                        :disabled="pageType==='project' || pageType==='record' && isView"
                                        style="width: 100%;" @change="handleProjectChange" filterable>
                                        <el-option v-for="item in projectOptions" :key="item.id" :label="item.name"
                                            :value="item.name"></el-option>
                                    </el-select>
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="安全费用项目编号" prop="code" required>
                                    <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="支出范围" prop="category" required>
                                    <el-input v-model="formData.category" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="项目内容" prop="projectContent" required>
                                    <el-input v-model="formData.projectContent" type="textarea" :rows="3" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="计划完成时间" prop="planDate" required>
                                    <el-input v-model="formData.planDate" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="计划金额(万元)" prop="planCost" required>
                                    <el-input v-model="formData.planCostDisplay" disabled />
                                </el-form-item>
                            </div>
                            <div class="form-item">
                                <el-form-item label="责任单位（部门）" prop="responsibleUnit" required>
                                    <el-input v-model="formData.responsibleUnit" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <el-form-item label="责任人" prop="responsiblePerson" required>
                                    <el-input v-model="formData.responsiblePerson" disabled />
                                </el-form-item>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item full-width">
                                <el-form-item label="备注" prop="remark">
                                    <el-input v-model="formData.remark" type="textarea" :rows="3" disabled />
                                </el-form-item>
                            </div>
                        </div>
                    </el-form>
                </div>
            </div>

            <!-- 实际使用模块 -->
            <div class="form-module">
                <div class="module-header" @click="toggleModule('actual')">
                    <div class="module-title">
                        <i class="fas fa-coins"></i>
                        实际使用
                    </div>
                    <i class="fas fa-chevron-down module-toggle" :class="{ collapsed: !modules.actual }"></i>
                </div>
                <div class="module-content" :class="{ collapsed: !modules.actual }">

                    <!-- 场景1：Project View Mode (List of Records) -->
                    <template v-if="pageType === 'project'">
                        <el-table :data="projectUsageRecords" style="width: 100%" stripe border>
                            <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                            <el-table-column prop="code" label="项目使用编号" min-width="150"></el-table-column>
                            <el-table-column prop="actualDate" label="实际使用时间" min-width="120"></el-table-column>
                            <el-table-column prop="actualCost" label="实际金额(万元)" min-width="140" align="right">
                                <template #default="{ row }">
                                    {{ formatAmount(row.actualCost / 10000) }}
                                </template>
                            </el-table-column>
                            <el-table-column prop="actualProjectContent" label="实际项目内容" min-width="200"
                                show-overflow-tooltip></el-table-column>
                            <el-table-column label="附件" min-width="100">
                                <template #default="{ row }">
                                    <el-button v-if="row.attachments && row.attachments.length > 0" size="small" link
                                        type="primary">
                                        查看({{ row.attachments.length }})
                                    </el-button>
                                    <span v-else>-</span>
                                </template>
                            </el-table-column>
                            <el-table-column prop="remark" label="备注" min-width="150"
                                show-overflow-tooltip></el-table-column>
                        </el-table>
                    </template>

                    <!-- 场景2：Record View/Edit Mode (Single Record Form) -->
                    <template v-else>
                        <el-form :model="formData" :rules="formRules" ref="actualFormRef" label-width="170px"
                            label-position="left">
                            <div class="form-row">
                                <div class="form-item">
                                    <el-form-item label="项目使用编号" prop="code">
                                        <template #label>
                                            项目使用编号
                                            <info-mark content="编号规则 XGFSJSY-yyyymmdd-0001"></info-mark>
                                        </template>
                                        <el-input v-model="formData.code" placeholder="自动生成" disabled />
                                    </el-form-item>
                                </div>
                                <div class="form-item">
                                    <el-form-item label="实际使用时间" prop="actualDate" required>
                                        <el-date-picker v-model="formData.actualDate" type="date" placeholder="请选择日期"
                                            value-format="YYYY-MM-DD" style="width: 100%;" :disabled="isView" />
                                    </el-form-item>
                                </div>
                                <div class="form-item">
                                    <el-form-item label="实际金额(万元)" prop="actualCost" required>
                                        <template #label>
                                            实际金额(万元)
                                            <info-mark content="金额单位为万元，千分位，保留小数点后6位，小数点后面无意义的0不显示"></info-mark>
                                        </template>
                                        <el-input v-model="formData.actualCostDisplay" placeholder="请输入金额"
                                            :disabled="isView" @input="handleCostInput" @blur="formatCost">
                                            <template #suffix>
                                                <span style="color: #909399;">万元</span>
                                            </template>
                                        </el-input>
                                    </el-form-item>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-item full-width">
                                    <el-form-item label="实际项目内容" prop="actualProjectContent" required>
                                        <template #label>
                                            实际项目内容
                                            <info-mark content="保存时需进行负面清单校验"></info-mark>
                                        </template>
                                        <el-input v-model="formData.actualProjectContent" type="textarea" :rows="3"
                                            placeholder="请输入实际项目内容" :disabled="isView" :maxlength="200"
                                            show-word-limit />
                                    </el-form-item>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-item full-width">
                                    <el-form-item label="备注" prop="remark">
                                        <el-input v-model="formData.remark" type="textarea" :rows="3"
                                            placeholder="请输入备注" :disabled="isView" :maxlength="500" show-word-limit />
                                    </el-form-item>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-item full-width">
                                    <el-form-item label="附件" prop="attachments" required>
                                        <template #label>
                                            附件
                                            <info-mark content="1、相关方的实际使用记录必须上传附件"></info-mark>
                                        </template>
                                        <el-upload action="#" :auto-upload="false" :file-list="formData.attachments"
                                            :disabled="isView" multiple>
                                            <el-button type="primary" :disabled="isView">
                                                <i class="fas fa-upload"></i> 上传附件
                                            </el-button>
                                            <template #tip>
                                                <div class="el-upload__tip">支持上传多个文件</div>
                                            </template>
                                        </el-upload>
                                    </el-form-item>
                                </div>
                            </div>
                        </el-form>
                    </template>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="form-actions">
            <el-button @click="goBack">返回</el-button>

            <!-- Record Mode Actions -->
            <template v-if="pageType === 'record'">
                <el-button type="primary" @click="handleSave" v-if="!isView">
                    <i class="fas fa-save"></i> 保存
                </el-button>
                <el-button type="primary" @click="switchToEdit" v-if="isView">
                    <i class="fas fa-edit"></i> 编辑
                </el-button>
            </template>
        </div>

        <!-- 项目选择弹窗 -->
        <el-dialog v-model="projectDialogVisible" width="700px" :close-on-click-modal="false">
            <template #header>
                <div style="font-size: 18px; color: #303133; font-weight: bold;">
                    选择相关方项目
                    <info-mark
                        content="1、数据为当前登录账号所属组织下的所属相关方的相关方项目（需要过滤掉项目状态为已完成的，其他所有状态的相关方项目均可被选择）；2、数据来源：相关方管理-项目管理-项目档案"></info-mark>
                </div>
            </template>
            <div class="project-dialog-search">
                <el-input v-model="projectSearch.name" placeholder="请输入项目名称" clearable>
                    <template #prefix>
                        <i class="fas fa-file-alt"></i>
                    </template>
                </el-input>
                <el-input v-model="projectSearch.code" placeholder="请输入项目编号" clearable>
                    <template #prefix>
                        <i class="fas fa-hashtag"></i>
                    </template>
                </el-input>
                <el-button type="primary" @click="searchProjects">
                    <i class="fas fa-search"></i> 搜索
                </el-button>
                <el-button @click="resetProjectSearch">
                    <i class="fas fa-redo"></i> 重置
                </el-button>
            </div>
            <el-table :data="filteredProjects" style="width: 100%" stripe border highlight-current-row>
                <el-table-column label="确认" width="80" align="center">
                    <template #default="{ row }">
                        <el-button link type="primary" @click="confirmSelection(row)">
                            确认
                        </el-button>
                    </template>
                </el-table-column>
                <el-table-column prop="code" label="相关方项目编号" min-width="150"></el-table-column>
                <el-table-column prop="name" label="相关方项目名称" min-width="200"></el-table-column>
                <el-table-column prop="contractor" label="相关方名称" min-width="150"></el-table-column>
            </el-table>
            <template #footer>
                <el-button @click="projectDialogVisible = false">取消</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
            setup() {
                const formRef = ref(null);
                const actualFormRef = ref(null);

                // 页面状态
                const mode = ref('add'); // view, edit, add
                const pageType = ref('record'); // record (single usage record), project (list of usage records)
                const isView = computed(() => mode.value === 'view');

                // 模块折叠状态
                const modules = ref({
                    basic: true,
                    actual: true
                });

                // 项目选择弹窗
                const projectDialogVisible = ref(false);
                const projectSearch = ref({ name: '' });

                // 所有可选项目
                const allProjects = ref([
                    { id: 'p1', code: 'XGF-PRJ-001', name: '变电站改造项目', contractor: '中电建设承包商' },
                    { id: 'p2', code: 'XGF-PRJ-002', name: '输电线路检修项目', contractor: '中电建设承包商' },
                    { id: 'p3', code: 'XGF-PRJ-003', name: '配电网升级项目', contractor: '中电建设承包商' },
                    { id: 'p4', code: 'XGF-PRJ-004', name: '电缆敷设工程', contractor: '华能施工队' },
                    { id: 'p5', code: 'XGF-PRJ-005', name: '设备安装项目', contractor: '华能施工队' }
                ]);

                // 过滤后的项目列表
                const filteredProjects = computed(() => {
                    let data = allProjects.value.filter(p => p.contractor === '中电建设承包商');
                    if (projectSearch.value.name) {
                        data = data.filter(p => p.name.includes(projectSearch.value.name));
                    }
                    if (projectSearch.value.code) {
                        data = data.filter(p => p.code.includes(projectSearch.value.code));
                    }
                    return data;
                });

                // 项目选项
                const projectOptions = ref([
                    {
                        id: 1,
                        name: '现场消防设备维护保养',
                        category: '消防设施维护及检测',
                        content: '检查现场消防设备并进行维修保养，确保消防设备正常',
                        planDate: '2026-01-05',
                        planCost: 80000,
                        responsibleUnit: '施工一队',
                        responsiblePerson: '张三'
                    },
                    {
                        id: 2,
                        name: '施工人员防护装备采购',
                        category: '安全防护设备',
                        content: '采购安全帽、防护眼镜、防护手套等个人防护装备',
                        planDate: '2026-02-28',
                        planCost: 120000,
                        responsibleUnit: '安全监督组',
                        responsiblePerson: '李四'
                    }
                ]);

                // 表单数据
                const formData = ref({
                    relatedProject: '',
                    code: '',
                    projectName: '',
                    category: '',
                    projectContent: '',
                    planDate: '',
                    planCost: 0,
                    planCostDisplay: '',
                    responsibleUnit: '',
                    responsiblePerson: '',
                    actualDate: new Date().toISOString().slice(0, 10),
                    actualCost: 0,
                    actualCostDisplay: '',
                    actualProjectContent: '',
                    remark: '',
                    attachments: []
                });

                // 项目关联的使用记录列表 (Project Mode)
                const projectUsageRecords = ref([]);

                // 表单验证规则
                const formRules = ref({
                    relatedProject: [{ required: true, message: '请选择关联相关方项目', trigger: 'change' }],
                    code: [{ required: true, message: '请输入安全费用项目编号', trigger: 'blur' }],
                    projectName: [{ required: true, message: '请选择项目', trigger: 'change' }],
                    category: [{ required: true, message: '请输入支出范围', trigger: 'blur' }],
                    responsibleUnit: [{ required: true, message: '请输入责任单位', trigger: 'blur' }],
                    responsiblePerson: [{ required: true, message: '请输入责任人', trigger: 'blur' }],
                    actualDate: [{ required: true, message: '请选择实际使用时间', trigger: 'change' }],
                    actualCost: [{ required: true, message: '请输入实际金额', trigger: 'blur' }],
                    actualProjectContent: [{ required: true, message: '请输入实际项目内容', trigger: 'blur' }],
                    attachments: [{ required: true, message: '请上传附件', trigger: 'change', type: 'array' }]
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 6
                    }).format(value);
                };

                const parseAmount = (str) => {
                    if (!str) return 0;
                    return parseFloat(str.replace(/,/g, '')) || 0;
                };

                const handleCostInput = (value) => {
                    formData.value.actualCostDisplay = value.replace(/[^\d.]/g, '');
                };

                const formatCost = () => {
                    const value = parseAmount(formData.value.actualCostDisplay);
                    formData.value.actualCost = value * 10000;
                    formData.value.actualCostDisplay = formatAmount(value);
                };

                const handleProjectChange = (projectName) => {
                    const selected = projectOptions.value.find(p => p.name === projectName);
                    if (selected) {
                        formData.value.category = selected.category;
                        formData.value.projectContent = selected.content;
                        formData.value.planDate = selected.planDate;
                        formData.value.planCost = selected.planCost;
                        formData.value.planCostDisplay = formatAmount(selected.planCost / 10000);
                        formData.value.responsibleUnit = selected.responsibleUnit;
                        formData.value.responsiblePerson = selected.responsiblePerson;
                    }
                };

                const generateCode = () => {
                    const now = new Date();
                    const dateStr = now.getFullYear().toString() +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0');
                    const randomNum = String(Math.floor(Math.random() * 9999) + 1).padStart(4, '0');
                    formData.value.code = `XGFSJSY-${dateStr}-${randomNum}`;
                };

                const openProjectDialog = () => {
                    projectDialogVisible.value = true;
                    // selectedProjectInDialog.value = formData.value.relatedProject; // Removed as we use inline selection
                };

                const searchProjects = () => { };

                const resetProjectSearch = () => {
                    projectSearch.value = { name: '', code: '' };
                };

                // 确认选择项目 (直接点击确认按钮)
                const confirmSelection = (row) => {
                    formData.value.relatedProject = row.id;
                    projectDialogVisible.value = false;
                };

                const loadData = (id, type) => {
                    if (type === 'project') {
                        // 加载项目基础信息
                        const project = projectOptions.value.find(p => p.id == id);
                        if (project) {
                            formData.value.code = '-';
                            formData.value.projectName = project.name;
                            formData.value.relatedProject = 'p1'; // 模拟关联项目
                            handleProjectChange(project.name);
                        }

                        // 加载项目关联的列表数据 (模拟)
                        if (id == 1) {
                            projectUsageRecords.value = [
                                {
                                    code: 'XGFSJSY-20260105-0001',
                                    actualDate: '2026-01-05',
                                    actualCost: 5000,
                                    actualProjectContent: '1月份消防设备巡检，更换灭火器3个',
                                    remark: '无',
                                    attachments: []
                                },
                                {
                                    code: 'XGFSJSY-20260205-0001',
                                    actualDate: '2026-02-05',
                                    actualCost: 10000,
                                    actualProjectContent: '2月份消防设备维修，更换消防栓阀门',
                                    remark: '无',
                                    attachments: [{ name: '维修单.pdf' }]
                                }
                            ];
                        } else {
                            projectUsageRecords.value = [];
                        }

                    } else {
                        // 加载单条记录信息 (type === 'record')
                        const recordData = {
                            '101': {
                                relatedProject: 'p1',
                                code: 'XGFSJSY-20260105-0001',
                                projectName: '现场消防设备维护保养',
                                actualDate: '2026-01-05',
                                actualCost: 5000,
                                actualCostDisplay: '5,000',
                                actualProjectContent: '1月份消防设备巡检',
                                remark: '',
                                attachments: []
                            }
                        };
                        const data = recordData[id];
                        if (data) {
                            formData.value = { ...formData.value, ...data };
                            formData.value.actualCostDisplay = formatAmount(data.actualCost / 10000);
                            handleProjectChange(data.projectName);
                        }
                    }
                };

                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    mode.value = urlParams.get('mode') || 'add';
                    pageType.value = urlParams.get('type') || 'record';
                    const id = urlParams.get('id');

                    if (pageType.value === 'project' && id) {
                        loadData(id, 'project');
                    } else if (pageType.value === 'record' && id) {
                        loadData(id, 'record');
                    } else if (mode.value === 'add') {
                        generateCode();
                    }
                });

                const toggleModule = (name) => {
                    modules.value[name] = !modules.value[name];
                };

                const handleSave = () => {
                    formRef.value?.validate((valid) => {
                        if (valid) {
                            if (actualFormRef.value) {
                                actualFormRef.value.validate(actualValid => {
                                    if (actualValid) {
                                        ElMessage.success('保存成功');
                                        setTimeout(() => goBack(), 1000);
                                    } else {
                                        ElMessage.warning('请填写实际使用信息的必填项');
                                    }
                                })
                            } else {
                                ElMessage.success('保存成功');
                                setTimeout(() => goBack(), 1000);
                            }
                        } else {
                            ElMessage.warning('请填写必填项');
                        }
                    });
                };

                const switchToEdit = () => {
                    mode.value = 'edit';
                };

                const goBack = () => {
                    // 检查URL参数中的from字段,确定返回到哪个页面
                    const urlParams = new URLSearchParams(window.location.search);
                    const from = urlParams.get('from');

                    if (from === 'statistics-related') {
                        window.location.href = '统计查询-相关方.html';
                    } else {
                        window.location.href = '安全投入(相关方).html';
                    }
                };

                return {
                    formRef, actualFormRef,
                    mode, pageType, isView, modules, formData, formRules, projectOptions,
                    projectUsageRecords, allProjects, filteredProjects,
                    projectDialogVisible, projectSearch,
                    formatAmount, handleCostInput, formatCost, handleProjectChange,
                    toggleModule, handleSave, switchToEdit, goBack,
                    openProjectDialog, searchProjects, resetProjectSearch,
                    confirmSelection
                };
            }
        });

        app.component('info-mark', {
            props: ['content'],
            template: `
                <el-popover
                    placement="top"
                    title="说明"
                    :width="200"
                    trigger="click"
                    :content="content"
                >
                    <template #reference>
                        <span class="info-mark" @click.stop></span>
                    </template>
                </el-popover>
            `
        });

        app.use(ElementPlus).mount('#app');
    </script>
</body>

</html>
