<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入 - 正在开发中</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .icon-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 32px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }

            50% {
                transform: scale(1.02);
                box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.2);
            }
        }

        .icon-wrapper i {
            font-size: 80px;
            color: #fff;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .title {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .features {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto 40px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            width: 220px;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .feature-card i {
            font-size: 36px;
            color: #fff;
            margin-bottom: 16px;
        }

        .feature-card h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .feature-card p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #fff;
            color: #667eea;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            transform: translateY(-3px);
        }

        .progress-info {
            margin-top: 48px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 16px auto 0;
            overflow: hidden;
        }

        .progress-bar-inner {
            width: 30%;
            height: 100%;
            background: linear-gradient(90deg, #fff 0%, rgba(255, 255, 255, 0.6) 100%);
            border-radius: 3px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 20%;
            }

            50% {
                width: 45%;
            }

            100% {
                width: 20%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon-wrapper">
            <i class="fas fa-cogs"></i>
        </div>

        <h1 class="title">功能正在开发中</h1>
        <p class="subtitle">
            我们正在努力完善此功能模块<br>
            敬请期待更多精彩功能上线
        </p>

        <div class="features">
            <div class="feature-card">
                <i class="fas fa-chart-line"></i>
                <h3>数据分析</h3>
                <p>智能分析安全投入数据，提供决策支持</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-tasks"></i>
                <h3>流程管理</h3>
                <p>规范化的费用审批和管理流程</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-file-alt"></i>
                <h3>报表统计</h3>
                <p>多维度统计报表，一键导出</p>
            </div>
        </div>

        <div class="action-buttons">
            <a href="计提标准库.html" class="btn btn-primary">
                <i class="fas fa-database"></i> 计提标准库
            </a>
            <a href="javascript:history.back()" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> 返回上一页
            </a>
        </div>

        <div class="progress-info">
            <p>开发进度</p>
            <div class="progress-bar">
                <div class="progress-bar-inner"></div>
            </div>
        </div>
    </div>
</body>

</html>
