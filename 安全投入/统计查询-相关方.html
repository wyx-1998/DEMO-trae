<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入 - 多维度统计分析（相关方）</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 16px;
            overflow: hidden;
            display: flex;
            gap: 16px;
        }

        /* 左侧项目树面板 - 来自 安全投入(相关方).html */
        .left-panel {
            width: 280px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .tree-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-header i {
            color: #409EFF;
        }

        .tree-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .tree-node {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .tree-node:hover {
            background: #f5f7fa;
        }

        .tree-node.active {
            background: #ecf5ff;
            color: #409EFF;
        }

        .tree-node-root {
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-node-root i {
            color: #E6A23C;
            font-size: 14px;
        }

        .tree-children {
            margin-left: 16px;
            margin-top: 4px;
        }

        .tree-node-child {
            font-size: 14px;
            color: #606266;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-node-child i {
            color: #67C23A;
            font-size: 12px;
        }

        /* 右侧内容区 */
        .content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            overflow: hidden;
        }

        /* 查询条件区 */
        .query-section {
            background: #fff;
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .query-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .query-title-text {
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .query-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .query-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .query-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }

        /* 快捷统计卡片 */
        .quick-stats {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
        }

        .quick-stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            flex: 1;
            min-width: 0;
        }

        .quick-stat-card.double-width {
            flex: 2;
        }

        .quick-stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .quick-stat-card-divider {
            width: 1px;
            background: #f0f0f0;
        }

        .quick-stat-card-section {
            flex: 1;
        }

        .quick-stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .quick-stat-title {
            font-size: 14px;
            color: #606266;
            font-weight: 500;
        }

        .quick-stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }

        .quick-stat-icon.blue {
            background: linear-gradient(135deg, #409EFF 0%, #36D1DC 100%);
        }

        .quick-stat-icon.green {
            background: linear-gradient(135deg, #67C23A 0%, #20c997 100%);
        }

        .quick-stat-icon.orange {
            background: linear-gradient(135deg, #E6A23C 0%, #F7BA2A 100%);
        }

        .quick-stat-icon.purple {
            background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 100%);
        }

        .quick-stat-content {
            flex: 1;
        }

        .quick-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #303133;
            margin-bottom: 8px;
        }

        .quick-stat-subtitle {
            font-size: 12px;
            color: #606266;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .quick-stat-progress {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-stat-progress-label {
            font-size: 12px;
            color: #606266;
            white-space: nowrap;
            min-width: 42px;
        }

        .quick-stat-progress-bar {
            flex: 1;
        }

        .quick-stat-compare {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
        }

        .quick-stat-compare-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        .quick-stat-compare-item.up {
            color: #F56C6C;
        }

        .quick-stat-compare-item.down {
            color: #67C23A;
        }

        /* 数据展示区 */
        .data-section {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .data-tabs {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .data-tabs .el-tabs__content {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .data-tabs .el-tab-pane {
            height: 100%;
            overflow: hidden;
        }

        /* 表格容器 */
        .table-container {
            height: 100%;
            padding: 16px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        .table-container .el-table {
            flex: 1;
            min-height: 0;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                max-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .query-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <!-- 左侧相关方项目树 -->
            <div class="left-panel">
                <div class="tree-header">
                    <i class="fas fa-sitemap"></i>
                    <span>相关方项目</span>
                </div>
                <div class="tree-content">
                    <div v-for="contractor in contractors" :key="contractor.id">
                        <div class="tree-node"
                            :class="{ active: selectedContractor === contractor.id && !selectedProject }"
                            @click="selectContractor(contractor.id)">
                            <div class="tree-node-root">
                                <i class="fas fa-building"></i>
                                <span>{{ contractor.name }}</span>
                            </div>
                        </div>
                        <div class="tree-children">
                            <div v-for="project in contractor.projects" :key="project.id" class="tree-node"
                                :class="{ active: selectedProject === project.id }" @click="selectProject(project.id)">
                                <div class="tree-node-child">
                                    <i class="fas fa-folder"></i>
                                    <span>{{ project.name }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧内容区 -->
            <div class="content-panel">
                <!-- 查询条件区 -->


                <!-- 快捷统计卡片区 -->
                <div class="quick-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <!-- 计划总额 -->
                    <div class="quick-stat-card" @click="handleCardClick('plan')">
                        <div class="quick-stat-header">
                            <div class="quick-stat-title">计划总额（万元）</div>
                            <div class="quick-stat-icon purple">
                                <i class="fas fa-clipboard-list"></i>
                            </div>
                        </div>
                        <div class="quick-stat-content">
                            <div class="quick-stat-value">{{ formatMoney(quickStats.planTotal) }}</div>
                        </div>
                    </div>

                    <!-- 提取总额、实际总额和投入率合并卡片 -->
                    <div class="quick-stat-card" @click="handleCardClick('accrualAndActual')">
                        <div class="quick-stat-content" style="display: flex; flex-direction: column; height: 100%;">
                            <!-- 三个并排的区域 -->
                            <div style="display: flex; gap: 20px; flex: 1;">
                                <!-- 提取总额部分 - 相关方页面通常没有提取，但保持结构一致 -->
                                <div class="quick-stat-card-section" style="flex: 1;" v-if="isCompanyNode">
                                    <div class="quick-stat-header" style="margin-bottom: 8px;">
                                        <div class="quick-stat-title">实际提取总额（万元）</div>
                                        <div class="quick-stat-icon blue">
                                            <i class="fas fa-coins"></i>
                                        </div>
                                    </div>
                                    <div class="quick-stat-value">{{ formatMoney(quickStats.accrualTotal) }}</div>
                                </div>

                                <div class="quick-stat-card-divider" style="width: 1px; height: auto; margin: 0;"
                                    v-if="isCompanyNode"></div>

                                <!-- 实际总额部分 -->
                                <div class="quick-stat-card-section" style="flex: 1;">
                                    <div class="quick-stat-header" style="margin-bottom: 8px;">
                                        <div class="quick-stat-title">实际使用总额（万元）</div>
                                        <div class="quick-stat-icon orange">
                                            <i class="fas fa-chart-line"></i>
                                        </div>
                                    </div>
                                    <div class="quick-stat-value">{{ formatMoney(quickStats.actualTotal) }}</div>
                                </div>

                                <div class="quick-stat-card-divider" style="width: 1px; height: auto; margin: 0;"
                                    v-if="isCompanyNode"></div>

                                <!-- 投入率部分 - 仅当有提取时有投入率 -->
                                <div class="quick-stat-card-section" style="flex: 1;" v-if="isCompanyNode">
                                    <div class="quick-stat-header" style="margin-bottom: 8px;">
                                        <div style="display: flex; align-items: center; gap: 4px;">
                                            <span class="quick-stat-title">使用率（%）</span>
                                            <el-tooltip placement="top" effect="light">
                                                <template #content>
                                                    使用率=实际使用总额/实际提取总额×100%
                                                </template>
                                                <i class="fas fa-question-circle"
                                                    style="color: #909399; font-size: 12px; cursor: help;"></i>
                                            </el-tooltip>
                                        </div>
                                        <div class="quick-stat-icon green">
                                            <i class="fas fa-percentage"></i>
                                        </div>
                                    </div>
                                    <div class="quick-stat-value">{{ quickStats.completionRate }}%</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 数据展示区 -->
                <div class="data-section">
                    <el-tabs v-model="activeTab" class="data-tabs">
                        <!-- Tab1: 支出范围维度 -->
                        <el-tab-pane label="支出范围维度" name="category">
                            <div class="table-container">
                                <el-table :data="categoryTableData" stripe border style="width: 100%; height: 100%;"
                                    v-loading="tableLoading" show-summary :summary-method="getCategorySummary">
                                    <el-table-column prop="index" label="序号" width="70" align="center"
                                        fixed></el-table-column>
                                    <el-table-column prop="categoryName" label="支出范围" min-width="350" fixed
                                        show-overflow-tooltip></el-table-column>
                                    <el-table-column prop="planAmount" label="计划总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.planAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column v-if="isCompanyNode" prop="accrualAmount" label="实际提取总额（万元）"
                                        width="150" align="right" sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.accrualAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="actualAmount" label="实际使用总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.actualAmount / 10000) }}
                                        </template>
                                    </el-table-column>

                            </div>
                        </el-tab-pane>

                        <!-- Tab2: 项目维度 -->
                        <el-tab-pane label="项目维度" name="project">
                            <div class="table-container">
                                <el-table :data="projectTableData" stripe border style="width: 100%; flex: 1;"
                                    v-loading="tableLoading">
                                    <el-table-column prop="index" label="序号" width="70" align="center"
                                        fixed></el-table-column>
                                    <el-table-column prop="projectName" label="项目名称" width="200"
                                        fixed></el-table-column>
                                    <el-table-column prop="categoryName" label="支出范围" width="150"></el-table-column>
                                    <el-table-column prop="planAmount" label="计划总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.planAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <!-- <el-table-column v-if="isCompanyNode" prop="accrualAmount" label="提取总额（万元）"
                                        width="150" align="right" sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.accrualAmount / 10000) }}
                                        </template>
                                    </el-table-column> -->
                                    <el-table-column prop="actualAmount" label="实际使用总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.actualAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="deptName" label="责任部门" width="150"></el-table-column>
                                    <el-table-column prop="responsiblePerson" label="责任人" width="120"></el-table-column>
                                </el-table>
                                <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
                                    <el-pagination v-model:current-page="tablePage" v-model:page-size="tablePageSize"
                                        :page-sizes="[20, 50, 100]" layout="total, sizes, prev, pager, next, jumper"
                                        :total="tableTotal" small />
                                </div>
                            </div>
                        </el-tab-pane>
                    </el-tabs>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>

                        q1: 160000, q2: 170000, q3: 175000, q4: 175000,
                        m1: 55000, m2: 52500, m3: 52500, m4: 56000, m5: 57000, m6: 57000,
                        m7: 58000, m8: 58500, m9: 58500, m10: 58000, m11: 58500, m12: 58500
                    },
                    {
                        index: 9,
                        categoryName: '（九）安全生产责任保险支出',
                        planAmount: 450000,
                        budgetAmount: 430000,
                        accrualAmount: 440000,
                        actualAmount: 400000,
                        q1: 100000, q2: 100000, q3: 100000, q4: 100000,
                        m1: 33000, m2: 33500, m3: 33500, m4: 33000, m5: 33500, m6: 33500,
                        m7: 33000, m8: 33500, m9: 33500, m10: 33000, m11: 33500, m12: 33500
                    },
                    {

                        planAmount: 670000,

                        accrualAmount: 650000,

                        q1: 140000, q2: 145000, q3: 150000, q4: 145000,

                        m7: 50000, m8: 50000, m9: 50000, m10: 48000, m11: 48500, m12: 48500
                    }
                ]);

                // 项目维度表格数据
                const projectTableData = ref([
                    {
                        index: 1,
                        projectName: '车间防护栏杆更新',
                        categoryName: '安全防护设施',
                        planType: 'ancuo',
                        planAmount: 500000,
                        budgetAmount: 480000,
                        accrualAmount: 490000,
                        actualAmount: 455000,
                        deptName: '安全生产部',
                        responsiblePerson: '张三'
                    },
                    {
                        index: 2,
                        projectName: '全员安全培训',
                        categoryName: '安全培训教育',
                        planType: 'ancuo',
                        planAmount: 350000,
                        budgetAmount: 340000,
                        accrualAmount: 345000,
                        actualAmount: 328000,
                        deptName: '安全生产部',
                        responsiblePerson: '李四'
                    }
                ]);

                // 选择相关方
                const selectContractor = (contractorId) => {
                    selectedContractor.value = contractorId;
                    selectedProject.value = null;
                    const contractor = contractors.value.find(c => c.id === contractorId);
                    if (contractor) {
                        ElMessage.success(`已选择：${contractor.name}`);
                    }
                    handleQuery();
                };

                // 选择项目
                const selectProject = (projectId) => {
                    selectedProject.value = projectId;
                    let foundProject = null;
                    contractors.value.forEach(c => {
                        const p = c.projects.find(p => p.id === projectId);
                        if (p) foundProject = p;
                    });
                    if (foundProject) {
                        ElMessage.success(`已选择：${foundProject.name}`);
                    }
                    handleQuery();
                };

                const handleQuery = () => {
                    tableLoading.value = true;
                    setTimeout(() => {
                        tableLoading.value = false;
                        ElMessage.success('查询成功');
                    }, 500);
                };

                const formatMoney = (value) => {
                    if (value >= 100000000) {
                        return (value / 100000000).toFixed(2) + '亿';
                    } else if (value >= 10000) {
                        return (value / 10000).toFixed(2) + '万';
                    }
                    return value.toFixed(2);
                };

                const formatNumber = (num) => {
                    if (num === null || num === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 6
                    }).format(num);
                };



                const handleCardClick = (type) => {
                    ElMessage.info(`点击了${type}卡片，可跳转到详情页面`);
                };

                const getCategorySummary = (param) => {
                    const { columns, data } = param;
                    const sums = [];
                    columns.forEach((column, index) => {
                        if (index === 0) {
                            sums[index] = '合计';
                            return;
                        }
                        if (index === 1) {
                            sums[index] = '';
                            return;
                        }
                        const values = data.map(item => Number(item[column.property]));
                        if (!values.every(value => Number.isNaN(value))) {
                            const sum = values.reduce((prev, curr) => {
                                const value = Number(curr);
                                if (!Number.isNaN(value)) {
                                    return prev + curr;
                                } else {
                                    return prev;
                                }
                            }, 0);
                            sums[index] = formatNumber(sum / 10000);
                        } else {
                            sums[index] = '-';
                        }
                    });
                    return sums;
                };

                return {
                    activeTab,
                    tableLoading,
                    tablePage,
                    tablePageSize,
                    tableTotal,
                    isCompanyNode,
                    quickStats,
                    categoryTableData,
                    projectTableData,
                    contractors,
                    selectedContractor,
                    selectedProject,
                    selectContractor,
                    selectProject,
                    formatMoney,
                    formatNumber,
                    handleCardClick,
                    getCategorySummary
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
