<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入 - 多维度统计分析</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 16px;
            overflow: hidden;
            display: flex;
            gap: 16px;
        }

        /* 左侧组织树面板 */
        .org-tree-panel {
            width: 260px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .tree-search {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .tree-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        /* 右侧内容区 */
        .content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            overflow: hidden;
        }

        /* 查询条件区 */
        .query-section {
            background: #fff;
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .query-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .query-title-text {
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .query-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .query-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .query-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }

        /* 快捷统计卡片 */
        .quick-stats {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
        }

        .quick-stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            flex: 1;
            min-width: 0;
        }

        .quick-stat-card.double-width {
            flex: 2;
        }

        .quick-stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .quick-stat-card-divider {
            width: 1px;
            background: #f0f0f0;
        }

        .quick-stat-card-section {
            flex: 1;
        }

        .quick-stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .quick-stat-title {
            font-size: 14px;
            color: #606266;
            font-weight: 500;
        }

        .quick-stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }

        .quick-stat-icon.blue {
            background: linear-gradient(135deg, #409EFF 0%, #36D1DC 100%);
        }

        .quick-stat-icon.green {
            background: linear-gradient(135deg, #67C23A 0%, #20c997 100%);
        }

        .quick-stat-icon.orange {
            background: linear-gradient(135deg, #E6A23C 0%, #F7BA2A 100%);
        }

        .quick-stat-icon.purple {
            background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 100%);
        }

        .quick-stat-content {
            flex: 1;
        }

        .quick-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #303133;
            margin-bottom: 8px;
        }

        .quick-stat-subtitle {
            font-size: 12px;
            color: #606266;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .quick-stat-progress {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-stat-progress-label {
            font-size: 12px;
            color: #606266;
            white-space: nowrap;
            min-width: 42px;
        }

        .quick-stat-progress-bar {
            flex: 1;
        }

        .quick-stat-compare {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
        }

        .quick-stat-compare-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        .quick-stat-compare-item.up {
            color: #F56C6C;
        }

        .quick-stat-compare-item.down {
            color: #67C23A;
        }

        /* 数据展示区 */
        .data-section {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .data-tabs {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .data-tabs .el-tabs__content {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .data-tabs .el-tab-pane {
            height: 100%;
            overflow: hidden;
        }

        /* 表格容器 */
        .table-container {
            height: 100%;
            padding: 16px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        .table-container .el-table {
            flex: 1;
            min-height: 0;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }

            .org-tree-panel {
                width: 100%;
                max-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .query-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <!-- 左侧组织树面板 -->
            <div class="org-tree-panel">
                <div class="tree-search">
                    <el-input v-model="treeFilterText" placeholder="搜索组织" clearable size="small">
                        <template #prefix>
                            <i class="fas fa-search" style="color: #999;"></i>
                        </template>
                    </el-input>
                </div>
                <div class="tree-body">
                    <el-tree ref="treeRef" :data="orgTreeData" :props="treeProps" node-key="id" default-expand-all
                        :filter-node-method="filterNode" @node-click="handleTreeNodeClick" highlight-current>
                        <template #default="{ node, data }">
                            <span class="custom-tree-node">
                                <i :class="data.children ? 'fas fa-folder' : 'fas fa-building'"
                                    style="margin-right: 6px; color: #409EFF;"></i>
                                <span>{{ node.label }}</span>
                            </span>
                        </template>
                    </el-tree>
                </div>
            </div>

            <!-- 右侧内容区 -->
            <div class="content-panel">
                <!-- 查询条件区 -->
                <div class="query-section">
                    <div class="query-title" @click="queryCollapsed = !queryCollapsed">
                        <div class="query-title-text">
                            <i class="fas fa-filter"></i>
                            <span>查询条件</span>
                        </div>
                        <el-icon :class="{ 'is-rotate': !queryCollapsed }">
                            <i class="fas fa-chevron-down"></i>
                        </el-icon>
                    </div>
                    <el-collapse-transition>
                        <div v-show="!queryCollapsed" class="query-form">
                            <div class="query-row">
                                <el-form-item label="统计周期" style="margin-bottom: 0;">
                                    <el-date-picker v-model="queryForm.year" type="year" placeholder="选择年份"
                                        value-format="YYYY" style="width: 140px;" size="small" />
                                </el-form-item>
                                <el-form-item label="时间粒度" style="margin-bottom: 0;">
                                    <el-select v-model="queryForm.granularity" placeholder="请选择" style="width: 140px;"
                                        size="small" @change="handleGranularityChange">
                                        <el-option label="年度" value="year"></el-option>
                                        <el-option label="季度" value="quarter"></el-option>
                                        <el-option label="月度" value="month"></el-option>
                                    </el-select>
                                </el-form-item>
                                <div style="flex: 1;"></div>
                                <el-button type="primary" size="small" @click="handleQuery">
                                    <i class="fas fa-search"></i> 查询
                                </el-button>
                                <el-button size="small" @click="handleReset">
                                    <i class="fas fa-redo"></i> 重置
                                </el-button>
                            </div>
                        </div>
                    </el-collapse-transition>
                </div>

                <!-- 快捷统计卡片区 -->
                <div class="quick-stats" style="display: grid; grid-template-columns: 1fr 2fr; gap: 12px;">
                    <!-- 计划总额 -->
                    <div class="quick-stat-card" @click="handleCardClick('plan')">
                        <div class="quick-stat-header">
                            <div class="quick-stat-title">计划总额（万元）</div>
                            <div class="quick-stat-icon purple">
                                <i class="fas fa-clipboard-list"></i>
                            </div>
                        </div>
                        <div class="quick-stat-content">
                            <div class="quick-stat-value">{{ formatMoney(quickStats.planTotal) }}</div>
                        </div>
                    </div>

                    <!-- 提取总额、实际总额和投入率合并卡片 -->
                    <div class="quick-stat-card" @click="handleCardClick('accrualAndActual')">
                        <div class="quick-stat-content" style="display: flex; flex-direction: column; height: 100%;">
                            <!-- 三个并排的区域 -->
                            <div style="display: flex; gap: 20px; flex: 1;">
                                <!-- 提取总额部分 -->
                                <div class="quick-stat-card-section" style="flex: 1;">
                                    <div class="quick-stat-header" style="margin-bottom: 8px;">
                                        <div class="quick-stat-title">提取总额（万元）</div>
                                        <div class="quick-stat-icon blue">
                                            <i class="fas fa-coins"></i>
                                        </div>
                                    </div>
                                    <div class="quick-stat-value">{{ formatMoney(quickStats.accrualTotal) }}</div>
                                </div>

                                <div class="quick-stat-card-divider" style="width: 1px; height: auto; margin: 0;"></div>

                                <!-- 实际总额部分 -->
                                <div class="quick-stat-card-section" style="flex: 1;">
                                    <div class="quick-stat-header" style="margin-bottom: 8px;">
                                        <div class="quick-stat-title">实际总额（万元）</div>
                                        <div class="quick-stat-icon orange">
                                            <i class="fas fa-chart-line"></i>
                                        </div>
                                    </div>
                                    <div class="quick-stat-value">{{ formatMoney(quickStats.actualTotal) }}</div>
                                </div>

                                <div class="quick-stat-card-divider" style="width: 1px; height: auto; margin: 0;"></div>

                                <!-- 投入率部分 -->
                                <div class="quick-stat-card-section" style="flex: 1;">
                                    <div class="quick-stat-header" style="margin-bottom: 8px;">
                                        <div style="display: flex; align-items: center; gap: 4px;">
                                            <span class="quick-stat-title">投入率（%）</span>
                                            <el-tooltip placement="top" effect="light">
                                                <template #content>
                                                    投入率=实际总额/提取总额×100%
                                                </template>
                                                <i class="fas fa-question-circle"
                                                    style="color: #909399; font-size: 12px; cursor: help;"></i>
                                            </el-tooltip>
                                        </div>
                                        <div class="quick-stat-icon green">
                                            <i class="fas fa-percentage"></i>
                                        </div>
                                    </div>
                                    <div class="quick-stat-value">{{ quickStats.completionRate }}%</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 数据展示区 -->
                <div class="data-section">
                    <el-tabs v-model="activeTab" class="data-tabs">
                        <!-- Tab1: 支出范围维度 -->
                        <el-tab-pane label="支出范围维度" name="category">
                            <div class="table-container">
                                <el-table :data="categoryTableData" stripe border style="width: 100%; height: 100%;"
                                    v-loading="tableLoading" show-summary :summary-method="getCategorySummary"
                                    :key="'category-' + queryForm.granularity">
                                    <el-table-column prop="index" label="序号" width="70" align="center"
                                        fixed></el-table-column>
                                    <el-table-column prop="categoryName" label="支出范围名称" min-width="350" fixed
                                        show-overflow-tooltip></el-table-column>
                                    <el-table-column prop="planAmount" label="计划总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.planAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column v-if="isCompanyNode" prop="accrualAmount" label="提取总额（万元）"
                                        width="150" align="right" sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.accrualAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="actualAmount" label="实际总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.actualAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <!-- 季度列组 - 仅当时间粒度为季度时显示 -->
                                    <el-table-column v-if="queryForm.granularity === 'quarter'" label="实际总额（万元）"
                                        align="center">
                                        <el-table-column label="一季度" width="120" align="right">
                                            <template #default="{ row }">
                                                {{ formatNumber(row.q1 / 10000) }}
                                            </template>
                                        </el-table-column>
                                        <el-table-column label="二季度" width="120" align="right">
                                            <template #default="{ row }">
                                                {{ formatNumber(row.q2 / 10000) }}
                                            </template>
                                        </el-table-column>
                                        <el-table-column label="三季度" width="120" align="right">
                                            <template #default="{ row }">
                                                {{ formatNumber(row.q3 / 10000) }}
                                            </template>
                                        </el-table-column>
                                        <el-table-column label="四季度" width="120" align="right">
                                            <template #default="{ row }">
                                                {{ formatNumber(row.q4 / 10000) }}
                                            </template>
                                        </el-table-column>
                                    </el-table-column>
                                    <!-- 月份列组 - 仅当时间粒度为月份时显示 -->
                                    <el-table-column v-if="queryForm.granularity === 'month'" label="实际总额（万元）"
                                        align="center">
                                        <el-table-column v-for="m in 12" :key="m" :label="`${m}月`" width="100"
                                            align="right">
                                            <template #default="{ row }">
                                                {{ formatNumber(row['m' + m] / 10000) }}
                                            </template>
                                        </el-table-column>
                                    </el-table-column>
                                </el-table>
                            </div>
                        </el-tab-pane>

                        <!-- Tab2: 项目维度 -->
                        <el-tab-pane label="项目维度" name="project">
                            <div class="table-container">
                                <el-table :data="projectTableData" stripe border style="width: 100%; flex: 1;"
                                    v-loading="tableLoading">
                                    <el-table-column prop="index" label="序号" width="70" align="center"
                                        fixed></el-table-column>
                                    <el-table-column prop="projectName" label="项目名称" width="200"
                                        fixed></el-table-column>
                                    <el-table-column prop="categoryName" label="支出范围名称" width="150"></el-table-column>
                                    <el-table-column prop="planAmount" label="计划总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.planAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column v-if="isCompanyNode" prop="accrualAmount" label="提取总额（万元）"
                                        width="150" align="right" sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.accrualAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="actualAmount" label="实际总额（万元）" width="150" align="right"
                                        sortable>
                                        <template #default="{ row }">
                                            {{ formatNumber(row.actualAmount / 10000) }}
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="deptName" label="责任部门" width="150"></el-table-column>
                                    <el-table-column prop="responsiblePerson" label="责任人" width="120"></el-table-column>
                                </el-table>
                                <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
                                    <el-pagination v-model:current-page="tablePage" v-model:page-size="tablePageSize"
                                        :page-sizes="[20, 50, 100]" layout="total, sizes, prev, pager, next, jumper"
                                        :total="tableTotal" small />
                                </div>
                            </div>
                        </el-tab-pane>
                    </el-tabs>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, reactive, watch, computed } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            setup() {
                const treeRef = ref(null);
                const treeFilterText = ref('');
                const queryCollapsed = ref(false);
                const activeTab = ref('category');
                const tableLoading = ref(false);
                const tablePage = ref(1);
                const tablePageSize = ref(20);
                const tableTotal = ref(100);
                const selectedNodeType = ref('company'); // 'company' 或 'contractor'

                // 是否为公司节点（国投电力公司及其子节点）
                const isCompanyNode = computed(() => {
                    return selectedNodeType.value === 'company';
                });

                const orgTreeData = ref([
                    {
                        id: 1,
                        label: '国投电力公司',
                        children: [
                            {
                                id: 11,
                                label: '安全生产部',
                                children: [
                                    { id: 111, label: '安全监察科' },
                                    { id: 112, label: '职业健康科' }
                                ]
                            },
                            {
                                id: 12,
                                label: '生产技术部',
                                children: [
                                    { id: 121, label: '工艺技术科' },
                                    { id: 122, label: '设备管理科' }
                                ]
                            },
                            {
                                id: 13,
                                label: '财务部',
                                children: [
                                    { id: 131, label: '资金管理科' },
                                    { id: 132, label: '成本核算科' }
                                ]
                            }
                        ]
                    },
                    {
                        id: 2,
                        label: '承包商',
                        children: [
                            {
                                id: 21,
                                label: '中电建设承包商',
                                children: [
                                    { id: 211, label: '变电站改造项目' },
                                    { id: 212, label: '输电线路检修项目' },
                                    { id: 213, label: '配电网升级项目' }
                                ]
                            },
                            {
                                id: 22,
                                label: '华能施工队',
                                children: [
                                    { id: 221, label: '电缆敷设工程' },
                                    { id: 222, label: '设备安装项目' }
                                ]
                            }
                        ]
                    }
                ]);

                const treeProps = {
                    children: 'children',
                    label: 'label'
                };

                const queryForm = reactive({
                    year: new Date().getFullYear().toString(),
                    granularity: 'year'
                });

                const quickStats = reactive({
                    planTotal: 15800000,
                    anCuo: 8500000,
                    fanCuo: 5200000,
                    other: 2100000,
                    planYoy: 12.5,
                    planMom: 3.2,
                    budgetTotal: 15000000,
                    budgetYoy: 8.3,
                    budgetMom: -2.1,
                    accrualTotal: 14200000,
                    accrualYoy: 10.2,
                    accrualMom: 4.5,
                    actualTotal: 12855000,
                    actualYoy: 15.6,
                    actualMom: 5.8,
                    completionRate: ((12855000 / 14200000) * 100).toFixed(2)
                });

                // 类别维度表格数据（使用电力生产与供应企业一级投入类别）
                const categoryTableData = ref([
                    {
                        index: 1,
                        categoryName: '（一）安全防护设备、设施支出',
                        planAmount: 2500000,
                        budgetAmount: 2400000,
                        accrualAmount: 2450000,
                        actualAmount: 2200000,
                        q1: 500000, q2: 550000, q3: 600000, q4: 550000,
                        m1: 180000, m2: 170000, m3: 150000, m4: 185000, m5: 180000, m6: 185000,
                        m7: 195000, m8: 200000, m9: 205000, m10: 180000, m11: 185000, m12: 185000
                    },
                    {
                        index: 2,
                        categoryName: '（二）应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                        planAmount: 1800000,
                        budgetAmount: 1750000,
                        accrualAmount: 1820000,
                        actualAmount: 1680000,
                        q1: 400000, q2: 420000, q3: 450000, q4: 410000,
                        m1: 130000, m2: 135000, m3: 135000, m4: 140000, m5: 140000, m6: 140000,
                        m7: 150000, m8: 150000, m9: 150000, m10: 135000, m11: 137500, m12: 137500
                    },
                    {
                        index: 3,
                        categoryName: '（三）开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出',
                        planAmount: 1500000,
                        budgetAmount: 1450000,
                        accrualAmount: 1480000,

                const formatMoney = (value) => {
                    if (value >= 100000000) {
                        return (value / 100000000).toFixed(2) + '亿';
                    } else if (value >= 10000) {
                        return (value / 10000).toFixed(2) + '万';
                    }
                    return value.toFixed(2);
                };

                const formatNumber = (num) => {
                    if (num === null || num === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 6
                    }).format(num);
                };

                const getProgressColor = (percentage) => {
                    if (percentage >= 90) return '#67C23A';
                    if (percentage >= 70) return '#E6A23C';
                    return '#F56C6C';
                };

                const filterNode = (value, data) => {
                    if (!value) return true;
                    return data.label.indexOf(value) !== -1;
                };

                const handleTreeNodeClick = (data) => {
                    // 检查节点ID来确定是公司节点还是承包商节点
                    // id为1或以1开头的是公司节点，id为2或以2开头的是承包商节点
                    const idStr = String(data.id);
                    if (idStr === '1' || idStr.startsWith('1')) {
                        selectedNodeType.value = 'company';
                    } else if (idStr === '2' || idStr.startsWith('2')) {
                        selectedNodeType.value = 'contractor';
                    }
                    ElMessage.success(`已选择：${data.label}`);
                    handleQuery();
                };

                const handleQuery = () => {

                };

                    queryForm.year = new Date().getFullYear().toString();

                };

                const getCategorySummary = (param) => {
                    const { columns, data } = param;
                    const sums = [];
                    columns.forEach((column, index) => {
                        if (index === 0) {
                            sums[index] = '合计';
                            return;
                        }
                        if (index === 1) {
                            sums[index] = '';
                            return;
                        }
                        const values = data.map(item => Number(item[column.property]));
                        if (!values.every(value => Number.isNaN(value))) {
                            const sum = values.reduce((prev, curr) => {
                                const value = Number(curr);
                                if (!Number.isNaN(value)) {
                                    return prev + curr;
                                } else {
                                    return prev;
                                }
                            }, 0);
                            sums[index] = formatNumber(sum / 10000);
                        } else {
                            sums[index] = '-';
                        }
                    });
                    return sums;
                };
