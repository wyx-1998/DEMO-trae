<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建交底记录 - 安全管理系统</title>
    <!-- Element UI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .page-header {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #3366CC;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid #ebeef5;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
        }

        .module-title i {
            margin-right: 8px;
            color: #3366CC;
        }

        .module-content {
            padding: 24px;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .form-item.full-width {
            flex: none;
            width: 100%;
        }

        .form-label {
            flex-shrink: 0;
            width: 120px;
            padding-top: 12px;
            font-weight: normal;
            color: #909399;
            font-size: 14px;
            text-align: left;
            position: relative;
        }

        .form-label.required::before {
            content: '*';
            color: #f56c6c;
            position: absolute;
            left: -12px;
            top: 12px;
        }

        .form-control {
            flex: 1;
            min-width: 0;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #3366CC;
            box-shadow: 0 0 0 2px rgba(51, 102, 204, 0.2);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        .personnel-list {
            margin-top: 16px;
        }

        .personnel-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f5f7fa;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .personnel-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .personnel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #409eff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: #fafbfc;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            gap: 8px;
        }

        .btn-primary {
            background: #3366CC;
            border-color: #3366CC;
            color: white;
        }

        .btn-primary:hover {
            background: #2952a3;
            border-color: #2952a3;
        }

        .btn-secondary {
            background: white;
            border-color: #dcdfe6;
            color: #606266;
        }

        .btn-secondary:hover {
            background: #f5f7fa;
            border-color: #c0c4cc;
        }
    </style>
</head>
<body>
    <div id="app" class="container" v-cloak>
        <div class="page-header">
            <h1 class="page-title">新建交底记录</h1>
        </div>

        <div class="form-container">
            <!-- 线上教育培训交底 -->
            <div class="form-module" v-if="formData.briefingType === 'online'">
                <div class="module-header">
                    <div class="module-title">
                        <i class="fas fa-graduation-cap"></i>
                        线上教育培训交底
                    </div>
                </div>
                <div class="module-content">
                    <div class="form-row">
                        <div class="form-item">
                            <label class="form-label required">交底名称</label>
                            <div class="form-control">
                                <input type="text" class="form-input" v-model="formData.briefingName" placeholder="请输入交底名称">
                            </div>
                        </div>
                        <div class="form-item">
                            <label class="form-label required">交底方式</label>
                            <div class="form-control">
                                <select class="form-select" v-model="formData.briefingType">
                                    <option value="online">线上教育培训交底</option>
                                    <option value="offline">线下交底，纸质签字上传</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-item">
                            <label class="form-label required">交底日期</label>
                            <div class="form-control">
                                <el-date-picker
                                    v-model="formData.briefingDate"
                                    type="date"
                                    placeholder="选择日期"
                                    style="width: 100%;">
                                </el-date-picker>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label class="form-label required">交底人</label>
                            <div class="form-control">
                                <el-button type="primary" size="small" @click="selectBriefingPerson">选择交底人</el-button>
                                <div v-if="formData.briefingPersons && formData.briefingPersons.length > 0" style="margin-top: 8px;">
                                    <el-tag v-for="(person, index) in formData.briefingPersons" :key="index" closable @close="removeBriefingPerson(index)" style="margin-right: 8px; margin-bottom: 4px;">
                                        {{ person.name }}
                                    </el-tag>
                                </div>
                            </div>
                        </div>
                        <div class="form-item">
                            <label class="form-label required">教育培训</label>
                            <div class="form-control">
                                <el-select v-model="formData.trainingId" placeholder="请选择对应的培训" style="width: 100%;">
                                    <el-option label="培训1" value="1"></el-option>
                                    <el-option label="培训2" value="2"></el-option>
                                </el-select>
                                <el-button type="text" style="margin-top: 8px;" @click="goToCreateTraining">去发布培训</el-button>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item full-width">
                            <label class="form-label">接收交底人（参加培训人员）</label>
                            <div class="form-control">
                                <div class="personnel-list">
                                    <div v-if="formData.receivers && formData.receivers.length === 0" style="text-align: center; padding: 40px; color: #909399;">
                                        选择教育培训后，将自动显示参加培训的人员
                                    </div>
                                    <div v-else>
                                        <div v-for="(person, index) in formData.receivers" :key="index" class="personnel-item">
                                            <div class="personnel-info">
                                                <div class="personnel-avatar">{{ person.name.charAt(0) }}</div>
                                                <div>
                                                    <div style="font-weight: 500;">{{ person.name }}</div>
                                                    <div style="font-size: 12px; color: #909399;">{{ person.department }}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 线下交底 -->
            <div class="form-module" v-if="formData.briefingType === 'offline'">
                <div class="module-header">
                    <div class="module-title">
                        <i class="fas fa-file-signature"></i>
                        线下交底
                    </div>
                </div>
                <div class="module-content">
                    <div class="form-row">
                        <div class="form-item">
                            <label class="form-label required">交底名称</label>
                            <div class="form-control">
                                <input type="text" class="form-input" v-model="formData.briefingName" placeholder="请输入交底名称">
                            </div>
                        </div>
                        <div class="form-item">
                            <label class="form-label required">交底方式</label>
                            <div class="form-control">
                                <select class="form-select" v-model="formData.briefingType">
                                    <option value="online">线上教育培训交底</option>
                                    <option value="offline">线下交底，纸质签字上传</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-item">
                            <label class="form-label required">交底日期</label>
                            <div class="form-control">
                                <el-date-picker
                                    v-model="formData.briefingDate"
                                    type="date"
                                    placeholder="选择日期"
                                    style="width: 100%;">
                                </el-date-picker>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label class="form-label required">交底地点</label>
                            <div class="form-control">
                                <input type="text" class="form-input" v-model="formData.briefingLocation" placeholder="请输入交底地点">
                            </div>
                        </div>
                        <div class="form-item">
                            <label class="form-label required">交底人</label>
                            <div class="form-control">
                                <el-button type="primary" size="small" @click="selectBriefingPerson">选择交底人</el-button>
                                <div v-if="formData.briefingPersons && formData.briefingPersons.length > 0" style="margin-top: 8px;">
                                    <el-tag v-for="(person, index) in formData.briefingPersons" :key="index" closable @close="removeBriefingPerson(index)" style="margin-right: 8px; margin-bottom: 4px;">
                                        {{ person.name }}
                                    </el-tag>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item full-width">
                            <label class="form-label required">交底内容</label>
                            <div class="form-control">
                                <textarea class="form-input form-textarea" v-model="formData.briefingContent" placeholder="请输入交底内容"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item full-width">
                            <label class="form-label">交底附件</label>
                            <div class="form-control">
                                <el-upload
                                    class="upload-demo"
                                    action="#"
                                    :file-list="formData.briefingAttachments"
                                    :on-preview="handlePreview"
                                    :on-remove="handleRemove">
                                    <el-button size="small" type="primary">点击上传</el-button>
                                    <div slot="tip" class="el-upload__tip">支持上传PDF、DOC、DOCX、JPG、PNG等格式文件</div>
                                </el-upload>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item full-width">
                            <label class="form-label required">接收交底人</label>
                            <div class="form-control">
                                <div style="margin-bottom: 12px;">
                                    <el-button type="primary" size="small" @click="selectReceivers">添加</el-button>
                                    <el-button type="danger" size="small" @click="batchDeleteReceivers" :disabled="!selectedReceivers || selectedReceivers.length === 0">批量删除</el-button>
                                </div>
                                <div class="personnel-list">
                                    <div v-if="formData.receivers && formData.receivers.length === 0" style="text-align: center; padding: 40px; color: #909399;">
                                        暂未添加接收交底人
                                    </div>
                                    <div v-else>
                                        <div v-for="(person, index) in formData.receivers" :key="index" class="personnel-item">
                                            <el-checkbox v-model="person.selected" @change="handleReceiverSelect"></el-checkbox>
                                            <div class="personnel-info">
                                                <div class="personnel-avatar">{{ person.name.charAt(0) }}</div>
                                                <div>
                                                    <div style="font-weight: 500;">{{ person.name }}</div>
                                                    <div style="font-size: 12px; color: #909399;">{{ person.department }}</div>
                                                </div>
                                            </div>
                                            <el-button type="text" icon="el-icon-delete" @click="removeReceiver(index)" style="color: #f56c6c;"></el-button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 表单操作按钮 -->
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" @click="handleCancel">
                <i class="fas fa-times"></i>
                关闭
            </button>
            <button type="button" class="btn btn-primary" @click="handleSave">
                <i class="fas fa-save"></i>
                保存
            </button>
        </div>
    </div>

    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
    <!-- Element UI -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    formData: {
                        briefingName: '',
                        briefingType: 'online', // 默认线上
                        briefingDate: '',
                        briefingLocation: '',
                        briefingPersons: [],
                        briefingContent: '',
                        briefingAttachments: [],
                        trainingId: '',
                        receivers: []
                    },
                    selectedReceivers: []
                };
            },
            methods: {
                selectBriefingPerson() {
                    this.$message.info('人员选择功能需要集成组织树选择组件');
                },
                removeBriefingPerson(index) {
                    this.formData.briefingPersons.splice(index, 1);
                },
                selectReceivers() {
                    this.$message.info('人员选择功能需要集成组织树选择组件');
                },
                removeReceiver(index) {
                    this.formData.receivers.splice(index, 1);
                },
                handleReceiverSelect() {
                    this.selectedReceivers = this.formData.receivers.filter(p => p.selected);
                },
                batchDeleteReceivers() {
                    this.formData.receivers = this.formData.receivers.filter(p => !p.selected);
                    this.selectedReceivers = [];
                },
                goToCreateTraining() {
                    this.$message.info('跳转到教育培训发布创建培训页面');
                },
                handlePreview(file) {
                    console.log('预览', file);
                },
                handleRemove(file, fileList) {
                    this.formData.briefingAttachments = fileList;
                },
                handleCancel() {
                    this.$confirm('确定要关闭吗？未保存的数据将丢失。', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(() => {
                        window.history.back();
                    }).catch(() => {});
                },
                handleSave() {
                    // 表单验证
                    if (!this.formData.briefingName) {
                        this.$message.warning('请输入交底名称');
                        return;
                    }
                    if (!this.formData.briefingDate) {
                        this.$message.warning('请选择交底日期');
                        return;
                    }
                    if (this.formData.briefingPersons.length === 0) {
                        this.$message.warning('请选择交底人');
                        return;
                    }
                    if (this.formData.briefingType === 'online') {
                        if (!this.formData.trainingId) {
                            this.$message.warning('请选择教育培训');
                            return;
                        }
                    } else {
                        if (!this.formData.briefingLocation) {
                            this.$message.warning('请输入交底地点');
                            return;
                        }
                        if (!this.formData.briefingContent) {
                            this.$message.warning('请输入交底内容');
                            return;
                        }
                        if (this.formData.receivers.length === 0) {
                            this.$message.warning('请添加接收交底人');
                            return;
                        }
                    }

                    this.$message.success('保存成功');
                    setTimeout(() => {
                        window.history.back();
                    }, 1000);
                }
            },
            watch: {
                'formData.trainingId'(newVal) {
                    if (newVal && this.formData.briefingType === 'online') {
                        // 根据培训ID加载参加培训的人员
                        // 这里应该调用API获取人员列表
                        this.formData.receivers = [
                            { name: '张三', department: '工程部', selected: false },
                            { name: '李四', department: '安全部', selected: false },
                            { name: '王五', department: '工程部', selected: false }
                        ];
                    }
                }
            }
        });
    </script>
</body>
</html>
