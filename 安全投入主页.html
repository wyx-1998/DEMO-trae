<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入管理系统</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background-color: #f5f7fa;
            overflow-x: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏样式 */
        .header {
            height: 64px;
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            border-bottom: 1px solid #e8e8e8;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #409EFF;
        }

        .logo i {
            font-size: 28px;
            color: #409EFF;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-left: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.3s;
            color: #333;
        }

        .user-info:hover {
            background-color: #f5f5f5;
        }

        /* 顶部导航样式 */
        .top-nav {
            display: flex;
            align-items: center;
            gap: 0;
            margin-left: 30px;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            text-decoration: none;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-link:hover {
            background-color: #f5f5f5;
            color: #409EFF;
        }

        .nav-item.active .nav-link {
            background-color: #409EFF;
            color: #fff;
        }

        .nav-item.active .nav-link:hover {
            background-color: #66b1ff;
            color: #fff;
        }

        /* 主体布局 */
        .main-container {
            flex: 1;
            display: flex;
            align-items: stretch;
            overflow: hidden;
            height: calc(100vh - 64px);
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 256px;
            background: #ffffff;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
            transition: width 0.3s;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar.collapsed {
            width: 64px;
        }

        .menu-toggle {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e4e7ed;
            cursor: pointer;
            color: #409EFF;
            transition: background-color 0.3s;
            flex-shrink: 0;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .menu-toggle:hover {
            background-color: #f5f5f5;
        }

        /* 菜单容器 */
        .el-menu {
            flex: 1;
            border-right: none;
        }

        /* 菜单图标间距 */
        .el-menu .el-menu-item i,
        .el-menu .el-sub-menu__title i {
            margin-right: 12px;
        }

        /* 白色主题菜单样式 */
        .el-menu--vertical .el-menu-item:hover,
        .el-menu--vertical .el-sub-menu__title:hover {
            background-color: #f5f5f5 !important;
        }

        .el-menu--vertical .el-menu-item.is-active {
            background-color: #e6f7ff !important;
            border-right: 3px solid #409EFF;
            color: #409EFF !important;
        }

        .el-sub-menu .el-menu-item {
            background-color: #fafafa !important;
        }

        .el-sub-menu .el-menu-item:hover {
            background-color: #f5f5f5 !important;
        }

        .el-sub-menu .el-menu-item.is-active {
            background-color: #e6f7ff !important;
            color: #409EFF !important;
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .page-nav-container {
            background: #fff;
            border-bottom: 1px solid #e4e7ed;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #606266;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .back-button:hover {
            color: #409eff;
        }

        .page-nav-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #303133;
        }

        .page-nav-title i {
            font-size: 20px;
            color: #409EFF;
        }

        .main-content {
            flex: 1;
            padding: 0;
            overflow-y: auto;
            background: #f0f2f5;
        }

        /* 页面内容样式 */
        .content-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e4e7ed;
        }

        .page-header i {
            font-size: 24px;
            color: #409EFF;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #303133;
            margin: 0;
        }

        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 64px;
            }

            .header-left .breadcrumb {
                display: none;
            }

            .main-content {
                padding: 0;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3366CC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="app-container">
            <!-- 顶部导航栏 -->
            <header class="header">
                <div class="header-left">
                    <div class="logo">
                        <i class="fas fa-coins"></i>
                        <span>安全生产费用管理</span>
                    </div>

                    <!-- 顶部主导航 -->
                    <nav class="top-nav">
                        <div class="nav-item" :class="{ active: currentModule === 'internal' }">
                            <a href="#" class="nav-link" @click.prevent="switchModule('internal')">
                                <i class="fas fa-building"></i>
                                <span>安全生产费用管理（内部企业）</span>
                            </a>
                        </div>
                        <div class="nav-item" :class="{ active: currentModule === 'related' }">
                            <a href="#" class="nav-link" @click.prevent="switchModule('related')">
                                <i class="fas fa-handshake"></i>
                                <span>安全生产费用管理（相关方）</span>
                            </a>
                        </div>
                    </nav>
                </div>
                <div class="header-right">
                    <el-dropdown @command="handleUserCommand">
                        <div class="user-info">
                            <i class="fas fa-user-circle"></i>
                            <span>管理员</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <template #dropdown>
                            <el-dropdown-menu>
                                <el-dropdown-item command="profile">
                                    <i class="fas fa-user"></i> 个人信息
                                </el-dropdown-item>
                                <el-dropdown-item command="settings">
                                    <i class="fas fa-cog"></i> 系统设置
                                </el-dropdown-item>
                                <el-dropdown-item divided command="logout">
                                    <i class="fas fa-sign-out-alt"></i> 退出登录
                                </el-dropdown-item>
                            </el-dropdown-menu>
                        </template>
                    </el-dropdown>
                </div>
            </header>

            <!-- 主体容器 -->
            <div class="main-container">
                <!-- 侧边栏 -->
                <aside class="sidebar" :class="{ collapsed: isCollapsed }">
                    <div class="menu-toggle" @click="toggleSidebar">
                        <i :class="isCollapsed ? 'fas fa-angle-double-right' : 'fas fa-angle-double-left'"></i>
                    </div>
                    <el-menu :default-active="activeMenu" :collapse="isCollapsed" :unique-opened="true"
                        @select="handleMenuSelect" background-color="#ffffff" text-color="#666666"
                        active-text-color="#1890ff">

                        <!-- 内部企业菜单 -->
                        <template v-if="currentModule === 'internal'">
                            <el-sub-menu index="safety-expense-standard-lib">
                                <template #title>
                                    <i class="fas fa-database"></i>
                                    <span>安全费用标准库</span>
                                </template>
                                <el-menu-item index="accrual-standard">
                                    <i class="fas fa-calculator"></i>
                                    <template #title>计提标准库</template>
                                </el-menu-item>
                                <el-menu-item index="investment-category">
                                    <i class="fas fa-tags"></i>
                                    <template #title>支出范围库</template>
                                </el-menu-item>
                                <el-menu-item index="negative-list-library">
                                    <i class="fas fa-solid fa-ban"></i>
                                    <template #title>负面清单库</template>
                                </el-menu-item>
                            </el-sub-menu>
                            <el-menu-item index="safety-investment-dashboard">
                                <i class="fas fa-chart-bar"></i>
                                <template #title>数据看板</template>
                            </el-menu-item>
                            <el-sub-menu index="safety-expense-plan">
                                <template #title>
                                    <i class="fas fa-tasks"></i>
                                    <span>安全费用计划</span>
                                </template>
                                <el-menu-item index="preliminary-review-plan">
                                    <i class="fas fa-file-alt"></i>
                                    <template #title>预审计划</template>
                                </el-menu-item>
                                <el-menu-item index="formal-plan">
                                    <i class="fas fa-file-contract"></i>
                                    <template #title>正式计划</template>
                                </el-menu-item>
                                <el-menu-item index="plan-change">
                                    <i class="fas fa-exchange-alt"></i>
                                    <template #title>计划变更</template>
                                </el-menu-item>
                            </el-sub-menu>
                            <el-menu-item index="safety-expense-accrual" @click="showExtractionTypeDialog">
                                <i class="fas fa-receipt"></i>
                                <template #title>安全费用提取</template>
                            </el-menu-item>
                            <el-menu-item index="expense-management">
                                <i class="fas fa-file-invoice-dollar"></i>
                                <template #title>安全费用使用</template>
                            </el-menu-item>
                            <el-menu-item index="statistical-query">
                                <i class="fas fa-search"></i>
                                <template #title>统计查询</template>
                            </el-menu-item>
                        </template>

                        <!-- 相关方菜单 -->
                        <template v-else-if="currentModule === 'related'">
                            <el-menu-item index="related-investment-plan">
                                <i class="fas fa-tasks"></i>
                                <template #title>安全费用计划</template>
                            </el-menu-item>
                            <el-menu-item index="related-expense-records">
                                <i class="fas fa-file-invoice-dollar"></i>
                                <template #title>安全费用使用</template>
                            </el-menu-item>
                            <el-menu-item index="related-statistical-query">
                                <i class="fas fa-search"></i>
                                <template #title>统计查询</template>
                            </el-menu-item>
                        </template>

                    </el-menu>
                </aside>

                <!-- 内容区域 -->
                <main class="content-area">
                    <!-- 页面导航栏 -->
                    <div class="page-nav-container">
                        <!-- 返回按钮 -->
                        <button v-if="showBackButton" @click="goBack" class="back-button">
                            < 返回 </button>

                                <!-- 页面标题 -->
                                <div class="page-nav-title">
                                    <i :class="currentPageIcon"></i>
                                    <span>{{ currentPageTitle }}</span>
                                </div>
                    </div>

                    <!-- 主内容区 -->
                    <div class="main-content">
                        <!-- 计提标准库列表页面 -->
                        <div class="content-wrapper" v-if="activeMenu === 'accrual-standard'">
                            <iframe src="./安全投入/计提标准库.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 计提标准库详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'accrual-standard-detail'">
                            <iframe src="./安全投入/计提标准库-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 支出范围库页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'investment-category'">
                            <iframe src="./安全投入/支出范围库.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 预审计划页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'preliminary-review-plan'">
                            <iframe src="./安全投入/预审计划.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 正式计划页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'formal-plan'">
                            <iframe src="./安全投入/正式计划.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 计划变更页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'plan-change'">
                            <iframe src="./安全投入/计划变更.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 安措计划详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'safety-measures-plan-detail'">
                            <iframe src="./安全投入/安措计划-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 计划提取列表页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'planned-extraction'">
                            <iframe src="./安全投入/计划提取.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 计划提取详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'planned-extraction-detail'">
                            <iframe :src="plannedExtractionDetailSrc"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 实际提取页面（暂无，显示开发中） -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'actual-extraction'">
                            <div class="page-header">
                                <i class="fas fa-hand-holding-usd"></i>
                                <h2 class="page-title">实际提取</h2>
                            </div>
                            <div class="page-content">
                                <el-empty description="功能开发中...">
                                    <el-button type="primary" @click="showMessage">
                                        <i class="fas fa-tools"></i> 敬请期待
                                    </el-button>
                                </el-empty>
                            </div>
                        </div>

                        <!-- 安全费用计提详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'safety-expense-accrual-detail'">
                            <iframe src="./安全投入/计划提取-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 数据看板页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'safety-investment-dashboard'">
                            <iframe src="./安全投入/数据看板.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 统计查询页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'statistical-query'">
                            <iframe src="./安全投入/统计查询.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 负面清单库页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'negative-list-library'">
                            <iframe src="./安全投入/负面清单库.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 安全费用使用列表页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'expense-management'">
                            <iframe src="./安全投入/安全费用使用.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 安全费用使用详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'expense-management-detail'">
                            <iframe src="./安全投入/安全费用使用-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- ========== 相关方模块页面 ========== -->

                        <!-- 相关方-安全投入计划列表页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-investment-plan'">
                            <iframe src="./安全投入/安全投入计划(相关方).html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 相关方-安全投入计划详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-investment-plan-detail'">
                            <iframe src="./安全投入/安全投入计划(相关方)-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 相关方-安全费用计提列表页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-expense-accrual'">
                            <iframe src="./安全投入/安全费用计提(相关方).html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 相关方-安全费用计提详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-expense-accrual-detail'">
                            <iframe src="./安全投入/安全费用计提(相关方)-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 相关方-费用使用记录列表页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-expense-records'">
                            <iframe src="./安全投入/安全投入(相关方).html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 相关方-费用使用记录详情页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-expense-records-detail'">
                            <iframe src="./安全投入/安全投入(相关方)-详情.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 相关方-统计查询页面 -->
                        <div class="content-wrapper" v-else-if="activeMenu === 'related-statistical-query'">
                            <iframe src="./安全投入/统计查询-相关方.html"
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>

                        <!-- 其他页面的默认内容 -->
                        <div class="content-wrapper" v-else>
                            <div class="page-header">
                                <i :class="getMenuIcon(activeMenu)"></i>
                                <h2 class="page-title">{{ getMenuTitle(activeMenu) }}</h2>
                            </div>
                            <div class="page-content">
                                <el-empty description="功能开发中...">
                                    <el-button type="primary" @click="showMessage">
                                        <i class="fas fa-tools"></i> 敬请期待
                                    </el-button>
                                </el-empty>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <!-- 类型选择弹窗 -->
        <el-dialog v-model="typeSelectDialogVisible" title="选择提取类型" width="500px" :close-on-click-modal="false">
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <el-radio-group v-model="selectedCycleType" style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="padding: 16px; border: 1px solid #ebeef5; border-radius: 8px; cursor: pointer;"
                        :style="{ borderColor: selectedCycleType === 'yearly' ? '#409EFF' : '#ebeef5', background: selectedCycleType === 'yearly' ? '#ecf5ff' : '#fff' }"
                        @click="selectedCycleType = 'yearly'">
                        <el-radio label="yearly" style="width: 100%;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px; color: #303133;">年度分摊提取</div>
                            </div>
                        </el-radio>
                    </div>
                    <div style="padding: 16px; border: 1px solid #ebeef5; border-radius: 8px; cursor: pointer;"
                        :style="{ borderColor: selectedCycleType === 'monthly' ? '#409EFF' : '#ebeef5', background: selectedCycleType === 'monthly' ? '#ecf5ff' : '#fff' }"
                        @click="selectedCycleType = 'monthly'">
                        <el-radio label="monthly" style="width: 100%;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px; color: #303133;">月度实时提取</div>
                            </div>
                        </el-radio>
                    </div>
                    <div style="padding: 16px; border: 1px solid #ebeef5; border-radius: 8px; cursor: pointer;"
                        :style="{ borderColor: selectedCycleType === 'projectProgress' ? '#409EFF' : '#ebeef5', background: selectedCycleType === 'projectProgress' ? '#ecf5ff' : '#fff' }"
                        @click="selectedCycleType = 'projectProgress'">
                        <el-radio label="projectProgress" style="width: 100%;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px; color: #303133;">工程进度提取</div>

                            </div>
                        </el-radio>
                    </div>
                    <div style="padding: 16px; border: 1px solid #ebeef5; border-radius: 8px; cursor: pointer;"
                        :style="{ borderColor: selectedCycleType === 'custom' ? '#409EFF' : '#ebeef5', background: selectedCycleType === 'custom' ? '#ecf5ff' : '#fff' }"
                        @click="selectedCycleType = 'custom'">
                        <el-radio label="custom" style="width: 100%;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px; color: #303133;">自定义提取</div>
                            </div>
                        </el-radio>
                    </div>
                </el-radio-group>
            </div>
            <template #footer>
                <el-button @click="typeSelectDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmTypeSelection">确定</el-button>
            </template>
        </el-dialog>
    </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <!-- Element Plus Icons -->
    <script src="https://unpkg.com/@element-plus/icons-vue/dist/index.iife.js"></script>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        const app = createApp({
            setup() {
                // 响应式数据
                const isCollapsed = ref(false);
                const currentModule = ref('internal'); // 默认选中内部企业模块
                const activeMenu = ref('safety-investment-dashboard'); // 默认选中数据看板
                const currentPageTitle = ref('数据看板');
                const currentPageIcon = ref('fas fa-chart-bar');
                const showBackButton = ref(false);
                const navigationHistory = ref([]);

                // 类型选择弹窗
                const typeSelectDialogVisible = ref(false);
                const selectedCycleType = ref('yearly');
                const plannedExtractionDetailSrc = ref('./安全投入/计划提取-详情.html');

                // 菜单配置
                const menuConfig = {
                    // 内部企业菜单
                    'accrual-standard': { title: '计提标准库', icon: 'fas fa-calculator' },
                    'accrual-standard-detail': { title: '计提标准库详情', icon: 'fas fa-info-circle' },
                    'investment-category': { title: '支出范围库', icon: 'fas fa-tags' },
                    'negative-list-library': { title: '负面清单库', icon: 'fas fa-solid fa-ban' },
                    'safety-investment-dashboard': { title: '数据看板', icon: 'fas fa-chart-bar' },
                    // 安全费用计划子菜单
                    'preliminary-review-plan': { title: '预审计划', icon: 'fas fa-file-alt' },
                    'formal-plan': { title: '正式计划', icon: 'fas fa-file-contract' },
                    'safety-measures-plan-detail': { title: '安措计划详情', icon: 'fas fa-info-circle' },
                    // 安全费用提取子菜单
                    'planned-extraction': { title: '计划提取', icon: 'fas fa-calendar-check' },
                    'planned-extraction-detail': { title: '计划提取详情', icon: 'fas fa-info-circle' },
                    'actual-extraction': { title: '实际提取', icon: 'fas fa-hand-holding-usd' },
                    'expense-management': { title: '安全费用使用', icon: 'fas fa-file-invoice-dollar' },
                    'expense-management-detail': { title: '安全费用使用详情', icon: 'fas fa-info-circle' },
                    'statistical-query': { title: '统计查询', icon: 'fas fa-search' },
                    // 相关方菜单
                    'related-investment-plan': { title: '安全费用计划', icon: 'fas fa-tasks' },
                    'related-investment-plan-detail': { title: '安全费用计划详情', icon: 'fas fa-info-circle' },
                    //'related-expense-accrual': { title: '安全费用计提', icon: 'fas fa-receipt' },
                    //'related-expense-accrual-detail': { title: '安全费用计提详情', icon: 'fas fa-info-circle' },
                    'related-expense-records': { title: '安全费用使用', icon: 'fas fa-file-invoice-dollar' },
                    'related-expense-records-detail': { title: '安全费用使用详情', icon: 'fas fa-info-circle' },
                    'related-statistical-query': { title: '统计查询', icon: 'fas fa-search' }
                };

                // 方法
                const toggleSidebar = () => {
                    isCollapsed.value = !isCollapsed.value;
                };

                // 切换模块
                const switchModule = (module) => {
                    currentModule.value = module;

                    // 切换模块时重置页面状态
                    navigationHistory.value = [];
                    showBackButton.value = false;

                    // 根据模块设置默认页面
                    if (module === 'internal') {
                        activeMenu.value = 'safety-investment-dashboard';
                        currentPageTitle.value = '数据看板';
                        currentPageIcon.value = 'fas fa-chart-bar';
                    } else if (module === 'related') {
                        activeMenu.value = 'related-investment-plan';
                        currentPageTitle.value = '安全投入计划';
                        currentPageIcon.value = 'fas fa-tasks';
                    }
                };

                const handleMenuSelect = (index) => {
                    // 拦截计划提取菜单
                    if (index === 'planned-extraction') {
                        selectedCycleType.value = 'yearly';
                        typeSelectDialogVisible.value = true;
                        return;
                    }

                    activeMenu.value = index;
                    currentPageTitle.value = menuConfig[index]?.title || '未知页面';
                    currentPageIcon.value = menuConfig[index]?.icon || 'el-icon-document';

                    // 点击菜单时清空导航历史并隐藏返回按钮
                    navigationHistory.value = [];
                    showBackButton.value = false;
                };

                // 确认类型选择
                const confirmTypeSelection = () => {
                    typeSelectDialogVisible.value = false;

                    // 根据选择设置详情页地址
                    if (selectedCycleType.value === 'monthly') {
                        plannedExtractionDetailSrc.value = './安全投入/计划提取-详情-月度.html?mode=add';
                    } else if (selectedCycleType.value === 'projectProgress') {
                        plannedExtractionDetailSrc.value = './安全投入/计划提取-详情-工程进度.html?mode=add';
                    } else if (selectedCycleType.value === 'custom') {
                        plannedExtractionDetailSrc.value = './安全投入/计划提取-详情-自定义提取.html?mode=add';
                    } else {
                        plannedExtractionDetailSrc.value = './安全投入/计划提取-详情.html?mode=add';
                    }

                    // 切换到详情页视图
                    activeMenu.value = 'planned-extraction-detail';
                    currentPageTitle.value = '计划提取详情';
                    currentPageIcon.value = 'fas fa-info-circle';

                    // 标记为需要返回按钮（可选，看用户习惯，这里设为true方便返回）
                    // 此时返回按钮逻辑可能需要适配，因为没有前置页面压栈。
                    // 我们可以手动压入一个"假"的计划提取列表页到栈中，或者只是显示返回按钮让其回退到 Dashboard 或其他。
                    // 简单处理：不显示返回按钮，或者视为顶级跳转。
                    // 用户需求是"不要打开计划提取页面"，所以这里直接进入详情页。
                    showBackButton.value = false;
                    navigationHistory.value = [];
                };

                // 显示提取类型选择弹窗
                const showExtractionTypeDialog = () => {
                    selectedCycleType.value = 'yearly';
                    typeSelectDialogVisible.value = true;
                };

                // 返回上一页功能
                const goBack = () => {
                    if (navigationHistory.value.length > 0) {
                        const lastPage = navigationHistory.value.pop();
                        activeMenu.value = lastPage.menu;
                        currentPageTitle.value = lastPage.title;
                        currentPageIcon.value = lastPage.icon;

                        // 如果导航历史为空，隐藏返回按钮
                        showBackButton.value = navigationHistory.value.length > 0;
                    }
                };

                const handleUserCommand = (command) => {
                    switch (command) {
                        case 'profile':
                            ElMessage.info('个人信息功能开发中...');
                            break;
                        case 'settings':
                            ElMessage.info('系统设置功能开发中...');
                            break;
                        case 'logout':
                            ElMessageBox.confirm('确定要退出登录吗？', '提示', {
                                confirmButtonText: '确定',
                                cancelButtonText: '取消',
                                type: 'warning'
                            }).then(() => {
                                ElMessage.success('已退出登录');
                            }).catch(() => {
                                ElMessage.info('已取消退出');
                            });
                            break;
                    }
                };

                const getMenuIcon = (menuKey) => {
                    return menuConfig[menuKey]?.icon || 'fas fa-file';
                };

                const getMenuTitle = (menuKey) => {
                    return menuConfig[menuKey]?.title || '未知页面';
                };

                const showMessage = () => {
                    ElMessage({
                        message: '该功能正在开发中，敬请期待！',
                        type: 'info',
                        duration: 3000
                    });
                };

                const handleIframeLoad = () => {
                    console.log('页面加载完成');
                };

                // 添加页面导航处理功能
                const handlePageNavigation = (event) => {
                    // 检查消息来源和类型
                    if (event.data && event.data.type === 'navigate') {
                        const { page, data, mode, title, icon } = event.data;

                        // 保存当前页面到导航历史（只有在页面内跳转时才保存）
                        if (activeMenu.value) {
                            navigationHistory.value.push({
                                menu: activeMenu.value,
                                title: currentPageTitle.value,
                                icon: currentPageIcon.value
                            });
                        }

                        // 相关方模块的页面映射
                        let targetPage = page;
                        if (currentModule.value === 'related') {
                            // 根据当前所在的相关方列表页面，映射到对应的详情页面
                            const relatedPageMapping = {
                                'other-plan-detail': 'related-investment-plan-detail',
                                'safety-expense-accrual-detail': 'related-expense-accrual-detail',
                                'expense-management-detail': 'related-expense-records-detail'
                            };
                            targetPage = relatedPageMapping[page] || page;
                        }

                        // 切换到指定页面
                        activeMenu.value = targetPage;

                        // 使用传递的标题和图标，或者从菜单配置中获取
                        if (title) {
                            currentPageTitle.value = title;
                        } else if (menuConfig[targetPage]) {
                            currentPageTitle.value = menuConfig[targetPage].title;
                        } else {
                            currentPageTitle.value = '未知页面';
                        }

                        if (icon) {
                            currentPageIcon.value = icon;
                        } else if (menuConfig[targetPage]) {
                            currentPageIcon.value = menuConfig[targetPage].icon;
                        } else {
                            currentPageIcon.value = 'el-icon-document';
                        }

                        // 显示返回按钮
                        showBackButton.value = true;

                        // 如果有数据传递，存储到sessionStorage
                        if (data) {
                            sessionStorage.setItem(`${targetPage}_data`, JSON.stringify(data));
                        }
                        if (mode) {
                            sessionStorage.setItem(`${targetPage}_mode`, mode);
                        }
                    }
                };

                // 生命周期
                onMounted(() => {
                    // 添加页面消息监听器
                    window.addEventListener('message', handlePageNavigation);
                    ElMessage.success({
                        message: '欢迎使用安全投入管理系统！',
                        duration: 3000
                    });
                });

                return {
                    isCollapsed,
                    currentModule,
                    activeMenu,
                    currentPageTitle,
                    currentPageIcon,
                    showBackButton,
                    navigationHistory,
                    menuConfig,
                    toggleSidebar,
                    switchModule,
                    handleMenuSelect,
                    goBack,
                    handleUserCommand,
                    getMenuIcon,
                    getMenuTitle,
                    showMessage,
                    showMessage,
                    handleIframeLoad,
                    typeSelectDialogVisible,
                    selectedCycleType,
                    confirmTypeSelection,
                    showExtractionTypeDialog,
                    plannedExtractionDetailSrc
                };
            }
        });

        // 注册Element Plus图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }

        app.use(ElementPlus).mount('#app');
    </script>
</body>

</html>
