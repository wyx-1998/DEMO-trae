<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全管理系统</title>
    
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background-color: #f5f7fa;
            overflow-x: hidden;
        }
        
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航栏样式 */
        .header {
            height: 64px;
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            border-bottom: 1px solid #e8e8e8;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #1890ff;
        }
        
        .logo i {
            font-size: 28px;
            color: #1890ff;
        }
        
        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-left: 24px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.3s;
            color: #333;
        }
        
        .user-info:hover {
            background-color: #f5f5f5;
        }
        
        /* 主体布局 */
        .main-container {
            flex: 1;
            display: flex;
            align-items: stretch; /* 确保子元素高度一致 */
            overflow: hidden;
            height: calc(100vh - 64px); /* 减去头部高度 */
        }
        
        /* 侧边栏样式 */
        .sidebar {
            width: 256px;
            background: #ffffff;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
            transition: width 0.3s;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            height: 100%; /* 确保侧边栏占满容器高度 */
        }
        
        .sidebar.collapsed {
            width: 64px;
        }
        
        .menu-toggle {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e4e7ed;
            cursor: pointer;
            color: #1890ff;
            transition: background-color 0.3s;
            flex-shrink: 0; /* 防止收缩 */
            height: 64px; /* 设置固定高度 */
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        
        .menu-toggle:hover {
            background-color: #f5f5f5;
        }
        
        /* 菜单容器 */
        .el-menu {
            flex: 1; /* 菜单占据剩余空间 */
            border-right: none;
        }
        
        /* 菜单图标间距 */
        .el-menu .el-menu-item i,
        .el-menu .el-sub-menu__title i {
            margin-right: 12px;
        }
        
        /* 白色主题菜单样式 */
        .el-menu--vertical .el-menu-item:hover,
        .el-menu--vertical .el-sub-menu__title:hover {
            background-color: #f5f5f5 !important;
        }
        
        .el-menu--vertical .el-menu-item.is-active {
            background-color: #e6f7ff !important;
            border-right: 3px solid #1890ff;
            color: #1890ff !important;
        }
        
        .el-sub-menu .el-menu-item {
            background-color: #fafafa !important;
        }
        
        .el-sub-menu .el-menu-item:hover {
            background-color: #f5f5f5 !important;
        }
        
        .el-sub-menu .el-menu-item.is-active {
            background-color: #e6f7ff !important;
            color: #1890ff !important;
        }
        
        /* 内容区域 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%; /* 确保内容区域占满容器高度 */
        }
        
        .tabs-container {
            background: #fff;
            border-bottom: 1px solid #e4e7ed;
            padding: 0 24px;
            height: 64px; /* 与菜单切换按钮高度保持一致 */
            display: flex;
            align-items: center;
        }
        
        /* 页签样式优化 */
        .el-tabs--border-card > .el-tabs__header {
            background-color: #f8f9fa;
            border: none;
            border-radius: 8px 8px 0 0;
        }
        
        .el-tabs--border-card > .el-tabs__header .el-tabs__item {
            border: none;
            color: #606266;
            background-color: transparent;
            transition: all 0.3s ease;
            margin-right: 2px;
            border-radius: 6px 6px 0 0;
            padding: 0 20px;
            font-weight: 500;
        }
        
        .el-tabs--border-card > .el-tabs__header .el-tabs__item:hover {
            background-color: #ecf5ff;
            color: #3366CC;
        }
        
        .el-tabs--border-card > .el-tabs__header .el-tabs__item.is-active {
            background-color: #3366CC;
            color: #fff;
            border-bottom: 2px solid #3366CC;
            box-shadow: 0 2px 8px rgba(51, 102, 204, 0.2);
        }
        
        .el-tabs--border-card > .el-tabs__header .el-tabs__item.is-active .el-icon-close {
            color: #fff;
        }
        
        .el-tabs--border-card > .el-tabs__header .el-tabs__item .el-icon-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
        
        .el-tabs--border-card > .el-tabs__content {
            padding: 0;
            border: none;
            border-radius: 0 0 8px 8px;
        }
        
        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #f0f2f5;
        }
        
        /* 页面内容样式 */
        .content-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e4e7ed;
        }
        
        .page-header i {
            font-size: 24px;
            color: #3366CC;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #303133;
            margin: 0;
        }
        
        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #3366CC 0%, #4a7bd8 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 64px;
            }
            
            .header-left .breadcrumb {
                display: none;
            }
            
            .main-content {
                padding: 15px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3366CC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- 顶部导航栏 -->
            <header class="header">
                <div class="header-left">
                    <div class="logo">
                        <i class="fas fa-shield-alt"></i>
                        <span>安全管理系统</span>
                    </div>
                    <div class="breadcrumb">
                        <i class="fas fa-home"></i>
                        {{ currentMenuName }}
                    </div>
                </div>
                <div class="header-right">
                    <el-dropdown @command="handleUserCommand">
                        <div class="user-info">
                            <i class="fas fa-user-circle"></i>
                            <span>管理员</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <template #dropdown>
                            <el-dropdown-menu>
                                <el-dropdown-item command="profile">
                                    <i class="fas fa-user"></i> 个人信息
                                </el-dropdown-item>
                                <el-dropdown-item command="settings">
                                    <i class="fas fa-cog"></i> 系统设置
                                </el-dropdown-item>
                                <el-dropdown-item divided command="logout">
                                    <i class="fas fa-sign-out-alt"></i> 退出登录
                                </el-dropdown-item>
                            </el-dropdown-menu>
                        </template>
                    </el-dropdown>
                </div>
            </header>
            
            <!-- 主体容器 -->
            <div class="main-container">
                <!-- 侧边栏 -->
                <aside class="sidebar" :class="{ collapsed: isCollapsed }">
                    <div class="menu-toggle" @click="toggleSidebar">
                        <i :class="isCollapsed ? 'fas fa-bars' : 'fas fa-times'"></i>
                    </div>
                    <el-menu
                        :default-active="activeMenu"
                        :collapse="isCollapsed"
                        :unique-opened="true"
                        @select="handleMenuSelect"
                        background-color="#ffffff"
                        text-color="#666666"
                        active-text-color="#1890ff">
                        
                        <el-sub-menu index="meeting">
                            <template #title>
                                <i class="fas fa-users-cog"></i>
                                <span>安全会议</span>
                            </template>
                            <el-menu-item index="meeting-management">
                                <i class="fas fa-calendar-alt"></i>
                                <template #title>安全会议管理</template>
                            </el-menu-item>
                            <el-menu-item index="meeting-tasks">
                                <i class="fas fa-tasks"></i>
                                <template #title>会议后任务管理</template>
                            </el-menu-item>
                        </el-sub-menu>
                        
                    </el-menu>
                </aside>
                
                <!-- 内容区域 -->
                <main class="content-area">
                    <!-- 页签容器 -->
                    <div class="tabs-container">
                        <el-tabs
                            v-model="activeTab"
                            type="border-card"
                            closable
                            @tab-remove="removeTab">
                            <el-tab-pane
                                v-for="tab in tabs"
                                :key="tab.name"
                                :label="tab.title"
                                :name="tab.name">
                            </el-tab-pane>
                        </el-tabs>
                    </div>
                    
                    <!-- 主内容区 -->
                    <div class="main-content">
                        <!-- 页面内容 -->
                        <div class="content-wrapper" v-if="activeTab === 'meeting-management'">
                            <!-- 安全会议管理页面内容 -->
                            <iframe 
                                src="./安全会议管理.html" 
                                style="width: 100%; height: 100%; border: none; border-radius: 8px;"
                                @load="handleIframeLoad">
                            </iframe>
                        </div>
                        
                        <!-- 其他页面的默认内容 -->
                        <div class="content-wrapper" v-else>
                            <div class="page-header">
                                <i :class="getMenuIcon(activeTab)"></i>
                                <h2 class="page-title">{{ getMenuTitle(activeTab) }}</h2>
                            </div>
                            <div class="page-content">
                                <el-empty description="功能开发中...">
                                    <el-button type="primary" @click="showMessage">
                                        <i class="fas fa-tools"></i> 敬请期待
                                    </el-button>
                                </el-empty>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3.3.8/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    
    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;
        
        createApp({
            setup() {
                // 响应式数据
                const isCollapsed = ref(false);
                const activeMenu = ref('meeting-management');
                const activeTab = ref('meeting-management');
                const currentMenuName = ref('安全会议管理');
                
                // 页签管理
                const tabs = ref([
                    { name: 'meeting-management', title: '安全会议管理' }
                ]);
                
                // 统计数据
                const stats = reactive({
                    totalUsers: 1248,
                    securityEvents: 23,
                    systemHealth: 98,
                    onlineUsers: 156
                });
                
                // 系统状态
                const systemStatus = reactive({
                    cpu: 45,
                    memory: 67,
                    disk: 32
                });
                
                // 最新事件
                const recentEvents = ref([
                    {
                        id: 1,
                        time: '2024-01-15 14:30',
                        type: 'success',
                        description: '系统安全扫描完成'
                    },
                    {
                        id: 2,
                        time: '2024-01-15 13:45',
                        type: 'warning',
                        description: '检测到异常登录尝试'
                    },
                    {
                        id: 3,
                        time: '2024-01-15 12:20',
                        type: 'info',
                        description: '用户权限更新'
                    }
                ]);
                
                // 菜单配置
                const menuConfig = {
                    'meeting-management': { title: '安全会议管理', icon: 'fas fa-calendar-alt' },
                    'meeting-tasks': { title: '会议后任务管理', icon: 'fas fa-tasks' }
                };
                
                // 方法
                const toggleSidebar = () => {
                    isCollapsed.value = !isCollapsed.value;
                };
                
                const handleMenuSelect = (index) => {
                    activeMenu.value = index;
                    currentMenuName.value = menuConfig[index]?.title || '未知页面';
                    
                    // 添加或切换到对应页签
                    const existingTab = tabs.value.find(tab => tab.name === index);
                    if (!existingTab) {
                        tabs.value.push({
                            name: index,
                            title: menuConfig[index]?.title || '未知页面'
                        });
                    }
                    activeTab.value = index;
                };
                
                const removeTab = (targetName) => {
                    if (targetName === 'meeting-management') {
                        ElMessage.warning('安全会议管理页签不能关闭');
                        return;
                    }
                    
                    const tabIndex = tabs.value.findIndex(tab => tab.name === targetName);
                    if (tabIndex > -1) {
                        tabs.value.splice(tabIndex, 1);
                        
                        // 如果关闭的是当前活动页签，切换到安全会议管理
                        if (activeTab.value === targetName) {
                            activeTab.value = 'meeting-management';
                            activeMenu.value = 'meeting-management';
                            currentMenuName.value = '安全会议管理';
                        }
                    }
                };
                
                const handleUserCommand = (command) => {
                    switch (command) {
                        case 'profile':
                            ElMessage.info('个人信息功能开发中...');
                            break;
                        case 'settings':
                            ElMessage.info('系统设置功能开发中...');
                            break;
                        case 'logout':
                            ElMessageBox.confirm('确定要退出登录吗？', '提示', {
                                confirmButtonText: '确定',
                                cancelButtonText: '取消',
                                type: 'warning'
                            }).then(() => {
                                ElMessage.success('已退出登录');
                            }).catch(() => {
                                ElMessage.info('已取消退出');
                            });
                            break;
                    }
                };
                
                const getProgressColor = (percentage) => {
                    if (percentage < 50) return '#67c23a';
                    if (percentage < 80) return '#e6a23c';
                    return '#f56c6c';
                };
                
                const getMenuIcon = (menuKey) => {
                    return menuConfig[menuKey]?.icon || 'fas fa-file';
                };
                
                const getMenuTitle = (menuKey) => {
                    return menuConfig[menuKey]?.title || '未知页面';
                };
                
                const showMessage = () => {
                    ElMessage({
                        message: '该功能正在开发中，敬请期待！',
                        type: 'info',
                        duration: 3000
                    });
                };
                
                const handleIframeLoad = () => {
                    console.log('安全会议管理页面加载完成');
                };
                
                // 模拟数据更新
                const updateStats = () => {
                    setInterval(() => {
                        stats.onlineUsers = Math.floor(Math.random() * 50) + 120;
                        systemStatus.cpu = Math.floor(Math.random() * 30) + 30;
                        systemStatus.memory = Math.floor(Math.random() * 40) + 50;
                        systemStatus.disk = Math.floor(Math.random() * 20) + 25;
                    }, 5000);
                };
                
                // 生命周期
                onMounted(() => {
                    updateStats();
                    ElMessage.success('欢迎使用安全管理系统！');
                });
                
                return {
                    isCollapsed,
                    activeMenu,
                    activeTab,
                    currentMenuName,
                    tabs,
                    stats,
                    systemStatus,
                    recentEvents,
                    toggleSidebar,
                    handleMenuSelect,
                    removeTab,
                    handleUserCommand,
                    getProgressColor,
                    getMenuIcon,
                    getMenuTitle,
                    showMessage,
                    handleIframeLoad
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
