<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全投入计划（相关方）</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            gap: 16px;
        }

        /* 左侧项目树 */
        .tree-panel {
            width: 280px;
            flex-shrink: 0;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tree-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-header i {
            color: #409EFF;
        }

        .tree-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .tree-node {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .tree-node:hover {
            background: #f5f7fa;
        }

        .tree-node.active {
            background: #ecf5ff;
            color: #409EFF;
        }

        .tree-node-root {
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-node-root i {
            color: #E6A23C;
            font-size: 14px;
        }

        .tree-children {
            margin-left: 16px;
            margin-top: 4px;
        }

        .tree-node-child {
            font-size: 14px;
            color: #606266;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-node-child i {
            color: #67C23A;
            font-size: 12px;
        }

        .custom-tree-node {
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .content-card {
            flex: 1;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .function-bar {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .function-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-area {
            padding: 20px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .search-fields {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .search-fields-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-fields-row .el-form-item {
            margin-bottom: 0;
        }

        .search-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            margin-left: 16px;
            padding-top: 2px;
        }

        .expand-btn {
            color: #409EFF;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .expand-btn:hover {
            color: #66b1ff;
        }

        .table-area {
            flex: 1;
            padding: 24px;
            overflow-x: auto;
        }

        .pagination-bar {
            padding: 16px 24px;
            background: #f8f9fa;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
        }

        .content-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .project-tag {
            background: #e1f3d8;
            color: #67C23A;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* 增加说明标识样式 */
        body {
            counter-reset: info-mark-counter;
        }

        .info-mark {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 16px;
            height: 16px;
            background-color: #E6A23C;
            border-radius: 2px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 4px;
            position: relative;
            top: -1px;
            font-size: 10px;
            color: #fff;
            line-height: 1;
        }

        .info-mark::after {
            counter-increment: info-mark-counter;
            content: counter(info-mark-counter);
        }

        .info-mark:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <div class="main-content">
            <!-- 左侧项目树 -->
            <div class="tree-panel">
                <div class="tree-search" style="padding: 12px;">
                    <el-input v-model="treeFilterText" placeholder="请输入相关方项目名称" clearable size="small">
                        <template #prefix>
                            <i class="fas fa-search" style="color: #999;"></i>
                        </template>
                    </el-input>
                    <!-- 相关方项目状态过滤 -->
                    <div style="margin-top: 8px;">
                        <el-radio-group v-model="projectStatusFilter" size="small">
                            <el-radio label="unfinished">未完成</el-radio>
                            <el-radio label="all">全部</el-radio>
                            <info-mark
                                content="1、为当前登录的账号所属的相关方，下级节点为所属相关方在当前登录组织下的相关方项目，其中未完成的项目按照开工时间正序排序，选择全部时展示全部的相关方项目"></info-mark>
                        </el-radio-group>
                    </div>
                </div>
                <div class="tree-content">
                    <div v-for="contractor in filteredContractors" :key="contractor.id">
                        <div class="tree-node"
                            :class="{ active: selectedContractor === contractor.id && !selectedProject }"
                            @click="selectContractor(contractor.id)">
                            <div class="tree-node-root">
                                <i class="fas fa-building"></i>
                                <span>{{ contractor.name }}</span>
                            </div>
                        </div>
                        <div class="tree-children">
                            <div v-for="project in contractor.projects" :key="project.id" class="tree-node"
                                :class="{ active: selectedProject === project.id }" @click="selectProject(project.id)">
                                <div class="tree-node-child">
                                    <i class="fas fa-folder"></i>
                                    <span>{{ project.name }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧内容区 -->
            <div class="content-card">
                <!-- 功能按钮区 -->
                <div class="function-bar">
                    <div class="function-left">
                        <el-button type="primary" @click="handleAdd">
                            <i class="fas fa-plus"></i> 新建
                        </el-button>
                        <el-button type="danger" @click="handleBatchDelete" :disabled="selectedRows.length === 0">
                            <i class="fas fa-trash-alt"></i> 批量删除
                        </el-button>
                        <el-button @click="handleImport">
                            <i class="fas fa-file-import"></i> 导入
                        </el-button>
                        <el-button @click="handleExport">
                            <i class="fas fa-file-export"></i> 导出
                        </el-button>
                    </div>
                </div>

                <!-- 搜索区域 -->
                <div class="search-area">
                    <el-form :model="searchForm" :inline="true">
                        <div class="search-row">
                            <div class="search-fields">
                                <!-- 第一行：3个字段 -->
                                <div class="search-fields-row">
                                    <el-form-item label="支出范围">
                                        <template #label>
                                            支出范围
                                            <info-mark content="支出范围下拉选项为支出范围简称"></info-mark>
                                        </template>
                                        <el-select v-model="searchForm.category" placeholder="请选择支出范围" clearable
                                            style="width: 300px;">
                                            <el-option label="(一)安全防护设备、设施支出" value="(一)安全防护设备、设施支出"></el-option>
                                            <el-option label="(二)应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出"
                                                value="(二)应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出"></el-option>
                                            <el-option
                                                label="(三)开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出"
                                                value="(三)开展重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，安全生产信息化、智能化建设、运维和网路安全支出"></el-option>
                                            <el-option label="(四)安全生产检查、评估评价、咨询和标准化建设支出"
                                                value="(四)安全生产检查、评估评价、咨询和标准化建设支出"></el-option>
                                            <el-option label="(五)安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出"
                                                value="(五)安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出"></el-option>
                                            <el-option label="(六)配备和更新现场作业人员安全防护用品支出"
                                                value="(六)配备和更新现场作业人员安全防护用品支出"></el-option>
                                            <el-option label="(七)安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出"
                                                value="(七)安全生产适用的新技术、新标准、新工艺、新设备的推广应用支出"></el-option>
                                            <el-option label="(八)安全设施及特种设备检测检验、检定校准支出"
                                                value="(八)安全设施及特种设备检测检验、检定校准支出"></el-option>
                                            <el-option label="(九)安全生产责任保险支出" value="(九)安全生产责任保险支出"></el-option>
                                            <el-option label="(十)与安全生产直接相关的其他支出" value="(十)与安全生产直接相关的其他支出"></el-option>
                                        </el-select>
                                    </el-form-item>
                                    <el-form-item label="安全费用项目名称">
                                        <el-input v-model="searchForm.projectName" placeholder="请输入安全费用项目名称" clearable
                                            style="width: 180px;" />
                                    </el-form-item>
                                    <el-form-item label="责任单位">
                                        <el-select v-model="searchForm.responsibleUnit" placeholder="请选择责任单位" clearable
                                            style="width: 160px;">
                                            <el-option label="施工一队" value="施工一队"></el-option>
                                            <el-option label="施工二队" value="施工二队"></el-option>
                                            <el-option label="安全监督组" value="安全监督组"></el-option>
                                        </el-select>
                                    </el-form-item>
                                </div>
                                <!-- 第二行：展开后显示的字段 -->
                                <div class="search-fields-row" v-show="isExpanded">
                                    <el-form-item label="责任人">
                                        <el-input v-model="searchForm.responsiblePerson" placeholder="请输入责任人" clearable
                                            style="width: 120px;" />
                                    </el-form-item>
                                    <el-form-item label="计划完成时间">
                                        <el-date-picker v-model="searchForm.planDate" type="daterange"
                                            range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
                                            value-format="YYYY-MM-DD" style="width: 260px;" />
                                    </el-form-item>
                                </div>
                            </div>
                            <!-- 按钮区域固定在右侧 -->
                            <div class="search-buttons">
                                <el-button type="primary" @click="handleSearch">
                                    <i class="fas fa-search"></i> 查询
                                </el-button>
                                <el-button @click="handleReset">
                                    <i class="fas fa-redo"></i> 重置
                                </el-button>
                                <span class="expand-btn" @click="toggleExpand">
                                    {{ isExpanded ? '收起' : '展开' }}
                                    <i :class="isExpanded ? 'fas fa-angle-up' : 'fas fa-angle-down'"></i>
                                </span>
                            </div>
                        </div>
                    </el-form>
                </div>

                <!-- 表格区域 -->
                <div class="table-area">
                    <el-table :data="pagedData" style="width: 100%" stripe border v-loading="loading"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <!-- 关联相关方项目放在第一列 -->
                        <el-table-column prop="relatedProject" label="关联相关方项目" min-width="160"
                            fixed="left"></el-table-column>
                        <el-table-column prop="projectCode" label="安全费用项目编号" min-width="160">
                            <template #header>
                                安全费用项目编号
                                <info-mark content="编号规则 XGFAQJH-yyyymmdd-0001"></info-mark>
                            </template>
                        </el-table-column>
                        <el-table-column prop="projectName" label="安全费用项目名称" min-width="180">
                            <template #header>
                                安全费用项目名称
                                <info-mark content="项目名称超长时，使用 Tooltip"></info-mark>
                            </template>
                            <template #default="{ row }">
                                <a href="javascript:void(0)" @click="handleView(row)"
                                    style="color: #409EFF; text-decoration: underline; cursor: pointer;">{{
                                    row.projectName }}</a>
                            </template>
                        </el-table-column>
                        <!-- 支出范围移到项目名称右侧 -->
                        <el-table-column prop="category" label="支出范围" min-width="200"></el-table-column>
                        <el-table-column prop="projectContent" label="项目内容" min-width="200">
                            <template #header>
                                项目内容
                                <info-mark content="项目内容超长时，使用 Tooltip"></info-mark>
                            </template>
                            <template #default="{ row }">
                                <el-tooltip :content="row.projectContent" placement="top" :show-after="300">
                                    <div class="content-cell">{{ row.projectContent }}</div>
                                </el-tooltip>
                            </template>
                        </el-table-column>
                        <el-table-column prop="planDate" label="计划完成时间" min-width="120"></el-table-column>
                        <el-table-column prop="planCost" label="计划金额(万元)" min-width="150" align="right">
                            <template #header>
                                计划金额(万元)
                                <info-mark content="单位为万元，金额均需要千分号间隔，6位小数，小数点后面无意义的0不显示"></info-mark>
                            </template>
                            <template #default="{ row }">
                                {{ formatAmount(row.planCost) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="responsibleUnit" label="责任单位（部门）" min-width="140"></el-table-column>
                        <el-table-column prop="responsiblePerson" label="责任人" min-width="100"></el-table-column>
                        <el-table-column label="操作" width="120" fixed="right" align="center">
                            <template #header>
                                操作
                                <info-mark content="如果安全费用项目已有使用记录，则不允许被删除"></info-mark>
                            </template>
                            <template #default="{ row }">
                                <el-button size="small" @click="handleView(row)" link>
                                    <i class="fas fa-eye" style="color: #67C23A;"></i>
                                </el-button>
                                <el-button size="small" @click="handleEdit(row)" link>
                                    <i class="fas fa-edit" style="color: #409EFF;"></i>
                                </el-button>
                                <el-button size="small" @click="handleDelete(row)" link>
                                    <i class="fas fa-trash-alt" style="color: #F56C6C;"></i>
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 分页 -->
                <div class="pagination-bar">
                    <el-pagination background size="small" v-model:current-page="currentPage"
                        v-model:page-size="pageSize" :page-sizes="[10, 20, 50, 100]" :total="filteredData.length"
                        layout="total, ->, sizes, prev, pager, next, jumper" />
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp, ref, computed } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        const app = createApp({
            setup() {
                const loading = ref(false);
                const selectedRows = ref([]);
                const currentPage = ref(1);
                const pageSize = ref(20);
                const isExpanded = ref(false);

                // 选中的相关方和项目
                const selectedContractor = ref('c1');
                const selectedProject = ref(null);
                const selectedNode = ref(null); // 当前选中的树节点

                // 树相关
                const treeFilterText = ref('');
                const projectStatusFilter = ref('unfinished'); // 相关方项目状态过滤：'unfinished'(未完成) 或 'all'(全部)              // 相关方和项目树数据（承包商 > 项目）
                const contractors = ref([
                    {
                        id: 'c1',
                        name: '中电建设承包商',
                        projects: [
                            { id: 'p1', name: '变电站改造项目' },
                            { id: 'p2', name: '输电线路检修项目' },
                            { id: 'p3', name: '配电网升级项目' }
                        ]
                    }
                ]);

                // 选择承包商
                const selectContractor = (contractorId) => {
                    selectedContractor.value = contractorId;
                    selectedProject.value = null;
                    currentPage.value = 1;
                };

                // 选择项目
                const selectProject = (projectId) => {
                    selectedProject.value = projectId;
                    currentPage.value = 1;
                };

                // 过滤后的承包商和项目（基于搜索框）
                const filteredContractors = computed(() => {
                    if (!treeFilterText.value) {
                        return contractors.value;
                    }
                    const keyword = treeFilterText.value.toLowerCase();
                    return contractors.value.map(contractor => {
                        // 过滤项目
                        const filteredProjects = contractor.projects.filter(project =>
                            project.name.toLowerCase().includes(keyword)
                        );
                        // 如果承包商名称匹配或有匹配的项目，则显示
                        if (contractor.name.toLowerCase().includes(keyword) || filteredProjects.length > 0) {
                            return {
                                ...contractor,
                                projects: contractor.name.toLowerCase().includes(keyword)
                                    ? contractor.projects  // 承包商名称匹配时显示所有项目
                                    : filteredProjects     // 否则只显示匹配的项目
                            };
                        }
                        return null;
                    }).filter(Boolean);
                });

                const searchForm = ref({
                    category: '',
                    projectName: '',
                    responsibleUnit: '',
                    responsiblePerson: '',
                    planDate: null
                });

                // 切换展开/收起
                const toggleExpand = () => {
                    isExpanded.value = !isExpanded.value;
                };

                // 模拟表格数据
                const tableData = ref([
                    {
                        id: 1,
                        category: '(一)安全防护设备、设施支出',
                        projectCode: 'XGFAQJH-20260101-0001',
                        projectName: '施工现场安全标识设置',
                        projectContent: '在施工现场设置安全警示标识、安全通道指引等',
                        planDate: '2026-03-31',
                        planCost: 30000,
                        relatedProject: '变电站改造项目',
                        relatedProjectId: 'p1',
                        contractorId: 'c1',
                        responsibleUnit: '施工一队',
                        responsiblePerson: '王建国'
                    },
                    {
                        id: 2,
                        category: '(二)应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                        projectCode: 'XGFAQJH-20260101-0002',
                        projectName: '施工人员防护装备配置',
                        projectContent: '为施工人员配置安全帽、反光背心、安全带等防护装备',
                        planDate: '2026-02-28',
                        planCost: 85000,
                        relatedProject: '变电站改造项目',
                        relatedProjectId: 'p1',
                        contractorId: 'c1',
                        responsibleUnit: '安全监督组',
                        responsiblePerson: '李明'
                    },
                    {
                        id: 3,
                        category: '(五)安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出',
                        projectCode: 'XGFAQJH-20260101-0003',
                        projectName: '高压作业安全培训',
                        projectContent: '对高压作业人员进行专项安全培训，包括操作规程、应急处置等',
                        planDate: '2026-04-30',
                        planCost: 45000,
                        relatedProject: '输电线路检修项目',
                        relatedProjectId: 'p2',
                        contractorId: 'c1',
                        responsibleUnit: '施工二队',
                        responsiblePerson: '张伟'
                    },
                    {
                        id: 4,
                        category: '(二)应急救援器材、设备设施支出和应急队伍建设、应急预案制修订与应急演练支出',
                        projectCode: 'XGFAQJH-20260101-0004',
                        projectName: '现场急救设备配置',
                        projectContent: '配置急救箱、担架、AED除颤仪等急救设备',
                        planDate: '2026-03-15',
                        planCost: 60000,
                        relatedProject: '电缆敷设工程',
                        relatedProjectId: 'p4',
                        contractorId: 'c2',
                        responsibleUnit: '施工一队',
                        responsiblePerson: '刘强'
                    },
                    {
                        id: 5,
                        category: '(四)安全生产检查、评估评价、咨询和标准化建设支出',
                        projectCode: 'XGFAQJH-20260101-0005',
                        projectName: '施工现场隐患排查',
                        projectContent: '定期对施工现场进行安全隐患排查，建立整改台账',
                        planDate: '2026-12-31',
                        planCost: 25000,
                        relatedProject: '设备安装项目',
                        relatedProjectId: 'p5',
                        contractorId: 'c2',
                        responsibleUnit: '安全监督组',
                        responsiblePerson: '赵刚'
                    }
                ]);

                // 过滤后的数据
                const filteredData = computed(() => {
                    let data = tableData.value;

                    // 根据选中的相关方和项目筛选
                    if (selectedContractor.value) {
                        data = data.filter(item => item.contractorId === selectedContractor.value);
                    }
                    if (selectedProject.value) {
                        data = data.filter(item => item.relatedProjectId === selectedProject.value);
                    }

                    if (searchForm.value.category) {
                        data = data.filter(item => item.category === searchForm.value.category);
                    }
                    if (searchForm.value.projectName) {
                        data = data.filter(item => item.projectName.includes(searchForm.value.projectName));
                    }
                    if (searchForm.value.responsibleUnit) {
                        data = data.filter(item => item.responsibleUnit === searchForm.value.responsibleUnit);
                    }
                    if (searchForm.value.responsiblePerson) {
                        data = data.filter(item => item.responsiblePerson.includes(searchForm.value.responsiblePerson));
                    }
                    if (searchForm.value.planDate && searchForm.value.planDate.length === 2) {
                        const [start, end] = searchForm.value.planDate;
                        data = data.filter(item => item.planDate >= start && item.planDate <= end);
                    }

                    return data;
                });

                // 分页数据
                const pagedData = computed(() => {
                    const start = (currentPage.value - 1) * pageSize.value;
                    return filteredData.value.slice(start, start + pageSize.value);
                });

                // 格式化金额
                const formatAmount = (value) => {
                    if (value === null || value === undefined) return '-';
                    return new Intl.NumberFormat('zh-CN', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 6
                    }).format(value);
                };

                // 搜索
                const handleSearch = () => {
                    loading.value = true;
                    currentPage.value = 1;
                    setTimeout(() => {
                        loading.value = false;
                        ElMessage.success('查询完成');
                    }, 300);
                };

                // 重置
                const handleReset = () => {
                    searchForm.value = {
                        category: '',
                        projectName: '',
                        responsibleUnit: '',
                        responsiblePerson: '',
                        planDate: null
                    };
                    currentPage.value = 1;
                };

                // 选择变化
                const handleSelectionChange = (selection) => {
                    selectedRows.value = selection;
                };

                // 新建
                const handleAdd = () => {
                    window.location.href = '安全投入计划(相关方)-详情.html?mode=add';
                };

                // 批量删除
                const handleBatchDelete = () => {
                    ElMessageBox.confirm(
                        `确定要删除选中的 ${selectedRows.value.length} 条记录吗？`,
                        '确认删除',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        ElMessage.success('删除成功');
                        selectedRows.value = [];
                    }).catch(() => { });
                };

                // 删除单条
                const handleDelete = (row) => {
                    ElMessageBox.confirm(
                        `确定要删除项目"${row.projectName}"吗？`,
                        '确认删除',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    ).then(() => {
                        ElMessage.success('删除成功');
                    }).catch(() => { });
                };

                // 查看
                const handleView = (row) => {
                    window.location.href = `安全投入计划(相关方)-详情.html?mode=view&id=${row.id}`;
                };

                // 编辑
                const handleEdit = (row) => {
                    window.location.href = `安全投入计划(相关方)-详情.html?mode=edit&id=${row.id}`;
                };

                // 变更
                const handleChange = (row) => {
                    window.location.href = `安全投入计划(相关方)-详情.html?mode=change&id=${row.id}`;
                };

                // 导入
                const handleImport = () => {
                    ElMessage.info('导入功能开发中...');
                };

                // 导出
                const handleExport = () => {
                    ElMessage.info('导出功能开发中...');
                };

                return {
                    loading,
                    selectedRows,
                    currentPage,
                    pageSize,
                    isExpanded,
                    selectedContractor,
                    selectedProject,
                    treeFilterText,
                    projectStatusFilter,
                    contractors,
                    filteredContractors,
                    selectContractor,
                    selectProject,
                    searchForm,
                    tableData,
                    filteredData,
                    pagedData,
                    toggleExpand,
                    formatAmount,
                    handleSearch,
                    handleReset,
                    handleSelectionChange,
                    handleAdd,
                    handleBatchDelete,
                    handleDelete,
                    handleView,
                    handleEdit,

                    handleImport,
                    handleExport
                };
            }
        });

        app.component('info-mark', {
            props: ['content'],
            template: `
                <el-popover
                    placement="top"
                    title="说明"
                    :width="200"
                    trigger="click"
                    :content="content"
                >
                    <template #reference>
                        <span class="info-mark" @click.stop></span>
                    </template>
                </el-popover>
            `
        });

        app.use(ElementPlus).mount('#app');
    </script>
</body>

</html>
