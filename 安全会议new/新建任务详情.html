<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建任务详情</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background: #f5f7fa; }
    .page-container { width: 100%; margin: 0; padding: 16px 24px 120px; }
    .form-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1); overflow: hidden; }
    .form-section { border-bottom: 1px solid #ebeef5; }
    .form-section:last-child { border-bottom: none; }
    .section-header { display:flex; align-items:center; justify-content:space-between; padding: 20px 24px; border-bottom: 1px solid #ebeef5; cursor: pointer; transition: all 0.3s ease; }
    .section-title { font-size: 16px; font-weight: 600; color: #303133; display: flex; align-items:center; gap: 8px; }
    .section-title i { color: #3366CC; margin-right: 8px; }
    .module-toggle { color: #909399; transition: transform 0.3s ease; }
    .module-toggle.collapsed { transform: rotate(-90deg); }
    .section-body { padding: 24px; transition: all 0.3s ease; }
    .section-body.collapsed { display: none; }
    .fixed-actions { position: fixed; left: 0; right: 0; bottom: 0; background: #fafbfc; border-top: 1px solid #ebeef5; padding: 24px; display: flex; justify-content: flex-end; gap: 12px; z-index: 1000; box-shadow: 0 -2px 8px rgba(0,0,0,0.1); }
    .operation-col .el-button { margin: 0 4px; }
  </style>
  <link rel="stylesheet" href="../styles/main.css" />
  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
  <div id="app">
    <div class="page-container">
      <div class="form-container" id="formContainer">

        <!-- 基本信息 -->
        <div class="form-section">
          <div class="section-header" @click="toggleModule('basic')">
            <div class="section-title"><i class="fa-solid fa-circle-info"></i> 基本信息</div>
            <i :class="['fas','fa-chevron-down','module-toggle', { collapsed: moduleCollapsed.basic }]" ></i>
          </div>
          <div class="section-body" :class="{ collapsed: moduleCollapsed.basic }">
            <el-form :model="form" ref="formRef" label-width="140px">
              <el-row :gutter="16">
                <el-col :span="8">
                  <el-form-item label="任务编号">
                    <el-input v-model="form.code" placeholder="保存时自动生成，可编辑" clearable :disabled="isViewMode"></el-input>
                  </el-form-item>
                </el-col>
                <el-col :span="8">
                  <el-form-item label="关联会议" required>
                    <el-select v-model="form.meeting" placeholder="请选择会议" filterable style="width:100%" :disabled="isViewMode">
                      <el-option v-for="opt in meetingOptions" :key="opt" :label="opt" :value="opt" />
                    </el-select>
                  </el-form-item>
                </el-col>
                <el-col :span="8">
                  <el-form-item label="任务名称" required>
                    <el-input v-model="form.name" placeholder="请输入任务名称" clearable :disabled="isViewMode"></el-input>
                  </el-form-item>
                </el-col>
              </el-row>

              <el-row :gutter="16">
                <el-col :span="8">
                  <el-form-item label="详细描述">
                    <el-input type="textarea" :rows="4" v-model="form.description" placeholder="请输入任务详细描述" :disabled="isViewMode"></el-input>
                  </el-form-item>
                </el-col>
                <el-col :span="8">
                  <el-form-item label="任务接收人" required>
                    <el-select v-model="form.receivers" multiple placeholder="请选择接收人" filterable style="width:100%" :disabled="isViewMode">
                      <el-option v-for="opt in personOptions" :key="opt" :label="opt" :value="opt" />
                    </el-select>
                  </el-form-item>
                </el-col>
                <el-col :span="8">
                  <el-form-item label="截止日期" required>
                    <el-date-picker v-model="form.deadline" type="date" placeholder="选择截止日期" style="width:100%" :disabled="isViewMode"></el-date-picker>
                  </el-form-item>
                </el-col>
              </el-row>

              <el-row :gutter="16">
                <el-col :span="8">
                  <el-form-item label="责任人" required>
                    <el-select v-model="form.owner" placeholder="请选择责任人" filterable style="width:100%" :disabled="isViewMode">
                      <el-option v-for="opt in personOptions" :key="opt" :label="opt" :value="opt" />
                    </el-select>
                  </el-form-item>
                </el-col>
              </el-row>
            </el-form>
          </div>
        </div>

        <!-- 子任务完成情况 -->
        <div class="form-section">
          <div class="section-header" @click="toggleModule('subtasks')">
            <div class="section-title"><i class="fa-solid fa-list-check"></i> 子任务完成情况</div>
            <i :class="['fas','fa-chevron-down','module-toggle', { collapsed: moduleCollapsed.subtasks }]" ></i>
          </div>
          <div class="section-body" :class="{ collapsed: moduleCollapsed.subtasks }">
            <el-table :data="subtaskData" border stripe>
              <el-table-column prop="code" label="任务编号" width="140"></el-table-column>
              <el-table-column prop="name" label="任务名称" min-width="160"></el-table-column>
              <el-table-column prop="receiver" label="任务接收人" width="140"></el-table-column>
              <el-table-column prop="deadline" label="截止日期" width="160"></el-table-column>
              <el-table-column label="完成情况" width="160">
                <template slot-scope="scope">
                  <el-tag :type="subStatusTag(scope.row.status)">{{ scope.row.status }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="200" fixed="right" class-name="operation-col">
                <template slot-scope="scope">
                  <el-button type="text" icon="el-icon-view" @click="viewSubtask(scope.row)">查看</el-button>
                  <el-button type="text" icon="el-icon-document" v-if="scope.row.hasDelayRecord" @click="openDelayRecord(scope.row)">延期记录</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </div>

      </div>

      <!-- 底部操作按钮 -->
      <div class="fixed-actions">
        <el-button @click="handleCancel">取消</el-button>
        <el-button type="primary" @click="handleSave">保存</el-button>
        <el-button type="success" @click="handleSaveAndDispatch">保存并下发</el-button>
      </div>
    </div>
  </div>

  <!-- 弹窗：延期记录 -->
  <script type="text/x-template" id="delay-record-template"></script>

  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          isViewMode: new URLSearchParams(location.search).get('mode') === 'view',
          moduleCollapsed: { basic: false, subtasks: false },
          meetingOptions: ['年度安全工作会议','安全生产管理委员会','安全生产会议','安全监督网络会议','专题会议','防汛工作例会'],
          personOptions: ['张三','李四','王五','赵六','钱七'],
          form: { code: '', meeting: '', name: '', description: '', receivers: [], deadline: '', owner: '' },
          subtaskData: [
            { code:'ST2024100101', name:'现场整改A', receiver:'张三', deadline:'2024-10-12', status:'待完成', hasDelayRecord:false },
            { code:'ST2024100102', name:'资料归档B', receiver:'李四', deadline:'2024-10-13', status:'审批中', hasDelayRecord:true },
            { code:'ST2024100103', name:'培训实施C', receiver:'王五', deadline:'2024-10-20', status:'已完成', hasDelayRecord:false }
          ]
        }
      },
      methods: {
        toggleModule(key) { this.$set(this.moduleCollapsed, key, !this.moduleCollapsed[key]); },
        subStatusTag(st) { return st==='已完成' ? 'success' : (st==='审批中'?'warning':'info'); },
        viewSubtask(row) {
          this.$alert(`查看子任务：${row.name}\n完成情况：${row.status}`, '子任务详情（示例）');
        },
        openDelayRecord(row) {
          this.$alert(`延期记录（示例）：\n子任务 ${row.code} 曾申请延期，审批通过。`, '延期记录');
        },
        handleCancel() { window.history.back(); },
        handleSave() { this.$message.success('已保存（示例）'); },
        handleSaveAndDispatch() { this.$message.success('已保存并下发（示例）'); }
      },
      created() {
        const id = new URLSearchParams(location.search).get('id');
        if (id) {
          // 示例：填充数据
          this.form = { code: id, meeting:'安全生产会议', name:'隐患整改任务', description:'根据会议决定，组织整改单位完成整改并上传凭证', receivers:['张三','李四'], deadline:'2024-10-15', owner:'王五' };
        } else {
          this.form.code = 'T-' + new Date().getTime();
        }
      }
    })
  </script>
</body>
</html>
