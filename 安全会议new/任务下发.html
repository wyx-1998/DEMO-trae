<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务下发</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background: #f5f7fa; }
    .page-container { width: 100%; margin: 0; padding: 16px 24px; }
    .page-header { background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .page-title { font-size: 20px; font-weight: 600; color: #303133; display: flex; align-items: center; gap: 10px; }
    .search-form { background: #fff; padding: 16px; margin: 14px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .operation-col .el-button { margin: 0 4px; }
    [v-cloak] { display: none; }
  </style>
  <link rel="stylesheet" href="../styles/main.css" />
  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <div class="page-container">
      <div class="page-header">
        <div class="page-title"><i class="fa-solid fa-clipboard-list"></i> 任务下发</div>
        <div>
          <el-button type="primary" icon="el-icon-plus" @click="handleCreate">新建</el-button>
          <el-button type="danger" icon="el-icon-delete" :disabled="multipleSelection.length===0" @click="confirmBatchDelete">批量删除</el-button>
        </div>
      </div>

      <!-- 状态子标签 -->
      <div class="search-form">
        <el-tabs v-model="dispatchStatus" @tab-click="handleDispatchStatus">
          <el-tab-pane label="待完成" name="todo"></el-tab-pane>
          <el-tab-pane label="已完成" name="done"></el-tab-pane>
          <el-tab-pane label="草稿" name="draft"></el-tab-pane>
        </el-tabs>
      </div>

      <!-- 搜索表单 -->
      <div class="search-form">
        <el-form :model="searchDispatch" :inline="true" label-width="100px">
          <el-form-item label="任务名称">
            <el-input v-model="searchDispatch.name" placeholder="请输入任务名称" clearable></el-input>
          </el-form-item>
          <el-form-item label="截止日期">
            <el-date-picker v-model="searchDispatch.deadline" type="date" placeholder="选择截止日期" clearable></el-date-picker>
          </el-form-item>
          <el-form-item label="责任人">
            <el-select v-model="searchDispatch.owner" placeholder="请选择责任人" clearable style="min-width:200px">
              <el-option v-for="opt in personOptions" :key="opt" :label="opt" :value="opt" />
            </el-select>
          </el-form-item>
          <el-form-item label="关联会议">
            <el-select v-model="searchDispatch.meeting" placeholder="请选择关联会议" clearable style="min-width:220px">
              <el-option v-for="opt in meetingOptions" :key="opt" :label="opt" :value="opt" />
            </el-select>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" icon="el-icon-search" @click="handleSearch">搜索</el-button>
            <el-button icon="el-icon-refresh" @click="handleReset">重置</el-button>
          </el-form-item>
        </el-form>
      </div>

      <!-- 列表：任务下发 -->
      <el-table :data="filteredDispatch" style="width: 100%" stripe border @selection-change="handleSelectionChange">
        <el-table-column type="selection" width="50"></el-table-column>
        <el-table-column prop="code" label="任务编号" width="140" sortable></el-table-column>
        <el-table-column prop="name" label="任务名称" min-width="160" sortable></el-table-column>
        <el-table-column prop="deadline" label="截止日期" width="160" sortable></el-table-column>
        <el-table-column prop="owner" label="责任人" width="140"></el-table-column>
        <el-table-column prop="meeting" label="关联会议" min-width="180"></el-table-column>
        <el-table-column label="完成情况" width="140">
          <template slot-scope="scope">
            <el-tag :type="statusTag(scope.row.status)">{{ scope.row.status }}</el-tag>
          </template>
        </el-template>
        </el-table-column>
        <el-table-column label="操作" width="260" fixed="right" class-name="operation-col">
          <template slot-scope="scope">
            <el-button type="text" icon="el-icon-view" @click="viewDispatch(scope.row)">查看</el-button>
            <el-button type="text" icon="el-icon-edit" @click="editDispatch(scope.row)">编辑</el-button>
            <el-button type="text" icon="el-icon-time" @click="openDelayDialog(scope.row)">延期申请</el-button>
            <el-button type="text" icon="el-icon-delete" style="color:#F56C6C" @click="deleteDispatch(scope.$index, scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- 分页 -->
      <div style="margin-top: 14px; display:flex; justify-content:flex-end;">
        <el-pagination @current-change="handleCurrentChange" :current-page="currentPage" :page-size="pageSize" layout="total, prev, pager, next" :total="filteredDispatch.length"></el-pagination>
      </div>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          dispatchStatus: 'todo',
          searchDispatch: { name: '', deadline: '', owner: '', meeting: '' },
          meetingOptions: ['年度安全工作会议','安全生产管理委员会','安全生产会议','安全监督网络会议','专题会议','防汛工作例会'],
          personOptions: ['张三','李四','王五','赵六','钱七'],
          dispatchData: [],
          multipleSelection: [],
          pageSize: 10,
          currentPage: 1
        }
      },
      computed: {
        filteredDispatch() {
          let data = this.dispatchData.slice();
          // 状态过滤
          if (this.dispatchStatus === 'todo') data = data.filter(d => d.status === '未完成' || d.status === '部分完成');
          else if (this.dispatchStatus === 'done') data = data.filter(d => d.status === '已完成');
          else if (this.dispatchStatus === 'draft') data = data.filter(d => d.status === '草稿');
          // 搜索过滤
          if (this.searchDispatch.name) data = data.filter(d => d.name.includes(this.searchDispatch.name));
          if (this.searchDispatch.deadline) data = data.filter(d => d.deadline === this.searchDispatch.deadline);
          if (this.searchDispatch.owner) data = data.filter(d => d.owner === this.searchDispatch.owner);
          if (this.searchDispatch.meeting) data = data.filter(d => d.meeting === this.searchDispatch.meeting);
          return data;
        }
      },
      methods: {
        initMock() {
          this.dispatchData = [
            { code:'TD2024100101', name:'隐患整改任务', deadline:'2024-10-15', owner:'张三', meeting:'安全生产会议', status:'未完成' },
            { code:'TD2024100202', name:'应急演练准备', deadline:'2024-10-20', owner:'李四', meeting:'安全监督网络会议', status:'部分完成' },
            { code:'TD2024100303', name:'安全培训组织', deadline:'2024-10-25', owner:'王五', meeting:'教育培训专题会', status:'草稿' },
            { code:'TD2024100404', name:'设备检修跟进', deadline:'2024-10-30', owner:'赵六', meeting:'专题会议', status:'已完成' }
          ];
        },
        handleDispatchStatus() { this.currentPage = 1; },
        handleSearch() { this.currentPage = 1; },
        handleReset() { this.searchDispatch = { name:'', deadline:'', owner:'', meeting:'' }; },
        handleSelectionChange(val) { this.multipleSelection = val; },
        handleCurrentChange(page) { this.currentPage = page; },
        statusTag(st) { return st==='已完成' ? 'success' : (st==='部分完成'?'warning':(st==='草稿'?'info':'danger')); },
        // 按钮与跳转
        handleCreate() { window.location.href = './新建任务详情.html'; },
        confirmBatchDelete() { this.$message.warning('示例环境：批量删除未真正执行'); },
        viewDispatch(row) { window.location.href = `./新建任务详情.html?mode=view&id=${encodeURIComponent(row.code)}`; },
        editDispatch(row) { window.location.href = `./新建任务详情.html?id=${encodeURIComponent(row.code)}`; },
        deleteDispatch(index, row) { this.$confirm(`确认删除任务 ${row.name}？`, '提示', { type:'warning' }).then(()=>{ this.dispatchData.splice(index,1); }); },
        openDelayDialog(row) {
          window.location.href = `./任务执行详情.html?id=${encodeURIComponent(row.code)}&openDelay=true&deadline=${encodeURIComponent(row.deadline)}&meeting=${encodeURIComponent(row.meeting)}&name=${encodeURIComponent(row.name)}`;
        }
      },
      created() { this.initMock(); }
    })
  </script>
</body>
</html>
