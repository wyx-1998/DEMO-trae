<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建建设项目 - 安全管理系统</title>
    
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #303133;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .page-header {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #3366CC;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #909399;
            font-size: 14px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-module {
            border-bottom: 1px solid #ebeef5;
        }

        .form-module:last-child {
            border-bottom: none;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid #ebeef5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
            display: flex;
            align-items: center;
        }

        .module-title i {
            margin-right: 8px;
            color: #3366CC;
        }

        .module-toggle {
            color: #909399;
            transition: transform 0.3s ease;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-content {
            padding: 24px;
            transition: all 0.3s ease;
        }

        .module-content.collapsed {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-item {
            flex: 0 0 calc(33.333% - 16px);
            min-width: 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .form-item.full-width {
            flex: none;
            width: 100%;
        }

        .form-item.half-width {
            flex: 0 0 calc(50% - 12px);
        }

        .form-label {
            flex-shrink: 0;
            width: 120px;
            padding-top: 12px;
            font-weight: normal;
            color: #909399;
            font-size: 14px;
            text-align: left;
            line-height: 1.4;
            position: relative;
        }

        .form-label.required::before {
            content: '*';
            color: #f56c6c;
            position: absolute;
            left: -12px;
            top: 12px;
        }

        .form-control {
            flex: 1;
            min-width: 0;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #3366CC;
            box-shadow: 0 0 0 2px rgba(51, 102, 204, 0.2);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 40px;
        }

        /* 表格样式 */
        .table-container {
            border: 1px solid #ebeef5;
            border-radius: 4px;
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .table th,
        .table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
            vertical-align: middle;
        }

        .table th {
            background: #f5f7fa;
            font-weight: 600;
            color: #303133;
            font-size: 14px;
        }

        .table td {
            font-size: 14px;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        .table-input:focus {
            outline: none;
            border-color: #3366CC;
            box-shadow: 0 0 0 2px rgba(51, 102, 204, 0.2);
        }

        .table-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 8px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 32px;
        }

        /* 上传组件样式 */
        .upload-area {
            border: 2px dashed #d9d9d9;
            border-radius: 6px;
            background: #fafafa;
            text-align: center;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #409eff;
            background: #f5f7fa;
        }

        .upload-area.dragover {
            border-color: #409eff;
            background: #ecf5ff;
        }

        .upload-icon {
            font-size: 28px;
            color: #c0c4cc;
            margin-bottom: 8px;
        }

        .upload-text {
            color: #606266;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .upload-hint {
            color: #909399;
            font-size: 12px;
        }

        .upload-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-list {
            margin-top: 12px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-icon {
            color: #409eff;
        }

        .file-name {
            font-size: 14px;
            color: #303133;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .file-action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .file-action-btn.delete {
            background: #f56c6c;
            color: white;
        }

        .file-action-btn.delete:hover {
            background: #f78989;
        }

        /* 底部按钮栏 */
        .form-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 16px 24px;
            border-top: 1px solid #ebeef5;
            box-shadow: 0 -2px 12px 0 rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .btn-primary {
            background: #3366CC;
            color: white;
        }

        .btn-primary:hover {
            background: #2952a3;
        }

        .btn-secondary {
            background: #909399;
            color: white;
        }

        .btn-secondary:hover {
            background: #82848a;
        }

        .btn-outline {
            background: white;
            color: #606266;
            border: 1px solid #dcdfe6;
        }

        .btn-outline:hover {
            background: #f5f7fa;
            border-color: #c0c4cc;
        }

        /* 坐标输入组件 */
        .coordinate-input {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .coordinate-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coordinate-label {
            font-size: 14px;
            color: #606266;
            white-space: nowrap;
        }

        .coordinate-field {
            width: 120px;
        }

        /* 单选按钮组样式 */
        .radio-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .radio-input {
            margin: 0;
        }

        .radio-label {
            font-size: 14px;
            color: #303133;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <div class="page-header">
            <h1 class="page-title">
                <i class="fas fa-plus-circle"></i>
                新建建设项目
            </h1>
            <p class="page-subtitle">请填写建设项目的基本信息和相关单位信息</p>
        </div>

        <!-- 表单容器 -->
        <div class="form-container">
            <form id="projectForm">
                <!-- 基本信息模块 -->
                <div class="form-module">
                    <div class="module-header" onclick="toggleModule(this)">
                        <div class="module-title">
                            <i class="fas fa-info-circle"></i>
                            基本信息
                        </div>
                        <i class="fas fa-chevron-down module-toggle"></i>
                    </div>
                    <div class="module-content">
                        <div class="form-row">
                            <div class="form-item">
                                <label class="form-label required">项目编号</label>
                                <div class="form-control">
                                    <input type="text" class="form-input" name="projectCode" placeholder="请输入项目编号" required>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label required">项目名称</label>
                                <div class="form-control">
                                    <input type="text" class="form-input" name="projectName" placeholder="请输入项目名称" required>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label required">统计年份</label>
                                <div class="form-control">
                                    <select class="form-input form-select" name="statisticsYear" required>
                                        <option value="">请选择统计年份</option>
                                        <option value="2024">2024年</option>
                                        <option value="2025">2025年</option>
                                        <option value="2026">2026年</option>
                                        <option value="2027">2027年</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-item">
                                <label class="form-label required">项目管理类型</label>
                                <div class="form-control">
                                    <select class="form-input form-select" name="managementType" required>
                                        <option value="">请选择管理类型</option>
                                        <option value="EPC">EPC</option>
                                        <option value="EPCM">EPCM</option>
                                        <option value="PC">PC</option>
                                        <option value="C">C</option>
                                        <option value="EMC">EMC</option>
                                        <option value="DB">DB</option>
                                        <option value="CM">CM</option>
                                        <option value="PMC">PMC</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label required">建设类别</label>
                                <div class="form-control">
                                    <select class="form-input form-select" name="constructionCategory" required>
                                        <option value="">请选择建设类别</option>
                                        <option value="工业建筑">工业建筑</option>
                                        <option value="民用建筑">民用建筑</option>
                                        <option value="商用建筑">商用建筑</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label required">建设性质</label>
                                <div class="form-control">
                                    <select class="form-input form-select" name="constructionNature" required>
                                        <option value="">请选择建设性质</option>
                                        <option value="新建">新建</option>
                                        <option value="扩建">扩建</option>
                                        <option value="改建">改建</option>
                                        <option value="迁建">迁建</option>
                                        <option value="恢复">恢复</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-item">
                                <label class="form-label required">项目投资</label>
                                <div class="form-control">
                                    <input type="number" class="form-input" name="investment" placeholder="请输入投资金额（万元）" step="0.01" required>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label">经纬度坐标</label>
                                <div class="form-control">
                                    <div class="coordinate-input">
                                        <div class="coordinate-group">
                                            <span class="coordinate-label">经度:</span>
                                            <input type="number" class="form-input coordinate-field" name="longitude" placeholder="经度" step="0.000001">
                                        </div>
                                        <div class="coordinate-group">
                                            <span class="coordinate-label">纬度:</span>
                                            <input type="number" class="form-input coordinate-field" name="latitude" placeholder="纬度" step="0.000001">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-item full-width">
                                <label class="form-label required">项目地址</label>
                                <div class="form-control">
                                    <input type="text" class="form-input" name="projectAddress" placeholder="请输入详细的项目地址" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-item full-width">
                                <label class="form-label">项目概况</label>
                                <div class="form-control">
                                    <textarea class="form-input form-textarea" name="projectOverview" placeholder="请输入项目概况描述" rows="4"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-item">
                                <label class="form-label required">计划开工日期</label>
                                <div class="form-control">
                                    <input type="date" class="form-input" name="plannedStartDate" required>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label required">计划竣工日期</label>
                                <div class="form-control">
                                    <input type="date" class="form-input" name="plannedCompletionDate" required>
                                </div>
                            </div>
                            <div class="form-item">
                                <label class="form-label required">是否纳入安全管理</label>
                                <div class="form-control">
                                    <div class="radio-group">
                                        <label class="radio-item">
                                            <input type="radio" class="radio-input" name="safetyManagement" value="是" required>
                                            <span class="radio-label">是</span>
                                        </label>
                                        <label class="radio-item">
                                            <input type="radio" class="radio-input" name="safetyManagement" value="否" required>
                                            <span class="radio-label">否</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 项目单位模块 -->
                <div class="form-module">
                    <div class="module-header" onclick="toggleModule(this)">
                        <div class="module-title">
                            <i class="fas fa-building"></i>
                            项目单位
                        </div>
                        <i class="fas fa-chevron-down module-toggle"></i>
                    </div>
                    <div class="module-content">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th style="width: 15%;">单位类型</th>
                                        <th style="width: 15%;">组织类型</th>
                                        <th style="width: 30%;">单位名称</th>
                                        <th style="width: 20%;">项目负责人</th>
                                        <th style="width: 20%;">联系方式</th>
                                    </tr>
                                </thead>
                                <tbody id="projectUnitsTable">
                                    <tr>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[0][unitType]" placeholder="单位类型">
                                        </td>
                                        <td>
                                            <select class="table-select" name="projectUnits[0][orgType]">
                                                <option value="">请选择</option>
                                                <option value="内部企业">内部企业</option>
                                                <option value="外部企业">外部企业</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[0][unitName]" placeholder="单位名称">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[0][manager]" placeholder="项目负责人">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[0][contact]" placeholder="联系方式">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[1][unitType]" placeholder="单位类型">
                                        </td>
                                        <td>
                                            <select class="table-select" name="projectUnits[1][orgType]">
                                                <option value="">请选择</option>
                                                <option value="内部企业">内部企业</option>
                                                <option value="外部企业">外部企业</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[1][unitName]" placeholder="单位名称">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[1][manager]" placeholder="项目负责人">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="projectUnits[1][contact]" placeholder="联系方式">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 其他相关单位模块 -->
                <div class="form-module">
                    <div class="module-header" onclick="toggleModule(this)">
                        <div class="module-title">
                            <i class="fas fa-users"></i>
                            其他相关单位
                        </div>
                        <i class="fas fa-chevron-down module-toggle"></i>
                    </div>
                    <div class="module-content">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th style="width: 15%;">单位类型</th>
                                        <th style="width: 15%;">组织类型</th>
                                        <th style="width: 30%;">单位名称</th>
                                        <th style="width: 20%;">项目负责人</th>
                                        <th style="width: 20%;">联系方式</th>
                                    </tr>
                                </thead>
                                <tbody id="relatedUnitsTable">
                                    <tr>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[0][unitType]" placeholder="单位类型">
                                        </td>
                                        <td>
                                            <select class="table-select" name="relatedUnits[0][orgType]">
                                                <option value="">请选择</option>
                                                <option value="内部企业">内部企业</option>
                                                <option value="外部企业">外部企业</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[0][unitName]" placeholder="单位名称">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[0][manager]" placeholder="项目负责人">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[0][contact]" placeholder="联系方式">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[1][unitType]" placeholder="单位类型">
                                        </td>
                                        <td>
                                            <select class="table-select" name="relatedUnits[1][orgType]">
                                                <option value="">请选择</option>
                                                <option value="内部企业">内部企业</option>
                                                <option value="外部企业">外部企业</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[1][unitName]" placeholder="单位名称">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[1][manager]" placeholder="项目负责人">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[1][contact]" placeholder="联系方式">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[2][unitType]" placeholder="单位类型">
                                        </td>
                                        <td>
                                            <select class="table-select" name="relatedUnits[2][orgType]">
                                                <option value="">请选择</option>
                                                <option value="内部企业">内部企业</option>
                                                <option value="外部企业">外部企业</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[2][unitName]" placeholder="单位名称">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[2][manager]" placeholder="项目负责人">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[2][contact]" placeholder="联系方式">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[3][unitType]" placeholder="单位类型">
                                        </td>
                                        <td>
                                            <select class="table-select" name="relatedUnits[3][orgType]">
                                                <option value="">请选择</option>
                                                <option value="内部企业">内部企业</option>
                                                <option value="外部企业">外部企业</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[3][unitName]" placeholder="单位名称">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[3][manager]" placeholder="项目负责人">
                                        </td>
                                        <td>
                                            <input type="text" class="table-input" name="relatedUnits[3][contact]" placeholder="联系方式">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 项目资料模块 -->
                <div class="form-module">
                    <div class="module-header" onclick="toggleModule(this)">
                        <div class="module-title">
                            <i class="fas fa-file-upload"></i>
                            项目资料
                        </div>
                        <i class="fas fa-chevron-down module-toggle"></i>
                    </div>
                    <div class="module-content">
                        <div class="form-row">
                            <div class="form-item full-width">
                                <label class="form-label">项目资料</label>
                                <div class="form-control">
                                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                                        <div class="upload-icon">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                        </div>
                                        <div class="upload-text">点击上传文件或拖拽文件到此处</div>
                                        <div class="upload-hint">支持 PDF、DOC、DOCX、XLS、XLSX、JPG、PNG 等格式，单个文件不超过 10MB</div>
                                        <input type="file" id="fileInput" class="upload-input" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" onchange="handleFileUpload(this)">
                                    </div>
                                    <div class="file-list" id="fileList"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- 底部按钮栏 -->
        <div class="form-actions">
            <div class="action-buttons">
                <button type="button" class="btn btn-outline" onclick="resetForm()">
                    <i class="fas fa-undo"></i>
                    重置
                </button>
                <button type="button" class="btn btn-secondary" onclick="saveDraft()">
                    <i class="fas fa-save"></i>
                    保存草稿
                </button>
                <button type="button" class="btn btn-primary" onclick="submitForm()">
                    <i class="fas fa-check"></i>
                    提交
                </button>
            </div>
        </div>
    </div>

    <script>
        // 模块折叠/展开功能
        function toggleModule(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.module-toggle');
            
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                toggle.classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
                toggle.classList.add('collapsed');
            }
        }

        // 文件上传处理
        let uploadedFiles = [];

        function handleFileUpload(input) {
            const files = Array.from(input.files);
            const fileList = document.getElementById('fileList');
            
            files.forEach(file => {
                if (file.size > 10 * 1024 * 1024) {
                    alert(`文件 ${file.name} 超过 10MB 限制`);
                    return;
                }
                
                uploadedFiles.push(file);
                
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <i class="fas fa-file file-icon"></i>
                        <span class="file-name">${file.name}</span>
                    </div>
                    <div class="file-actions">
                        <button type="button" class="file-action-btn delete" onclick="removeFile(this, '${file.name}')">
                            删除
                        </button>
                    </div>
                `;
                
                fileList.appendChild(fileItem);
            });
            
            // 清空input以允许重复选择同一文件
            input.value = '';
        }

        function removeFile(button, fileName) {
            uploadedFiles = uploadedFiles.filter(file => file.name !== fileName);
            button.closest('.file-item').remove();
        }

        // 表单验证
        function validateForm() {
            const form = document.getElementById('projectForm');
            const requiredFields = form.querySelectorAll('[required]');
            let isValid = true;
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.style.borderColor = '#f56c6c';
                    isValid = false;
                } else {
                    field.style.borderColor = '#dcdfe6';
                }
            });
            
            // 验证日期逻辑
            const startDate = form.querySelector('[name="plannedStartDate"]').value;
            const endDate = form.querySelector('[name="plannedCompletionDate"]').value;
            
            if (startDate && endDate && new Date(startDate) >= new Date(endDate)) {
                alert('计划竣工日期必须晚于计划开工日期');
                isValid = false;
            }
            
            return isValid;
        }

        // 表单提交
        function submitForm() {
            if (!validateForm()) {
                alert('请填写所有必填字段');
                return;
            }
            
            const formData = new FormData(document.getElementById('projectForm'));
            
            // 添加上传的文件
            uploadedFiles.forEach(file => {
                formData.append('projectFiles', file);
            });
            
            // 这里可以添加实际的提交逻辑
            console.log('表单数据:', formData);
            alert('项目创建成功！');
        }

        // 保存草稿
        function saveDraft() {
            const formData = new FormData(document.getElementById('projectForm'));
            
            // 这里可以添加保存草稿的逻辑
            console.log('保存草稿:', formData);
            alert('草稿已保存！');
        }

        // 重置表单
        function resetForm() {
            if (confirm('确定要重置表单吗？所有已填写的内容将被清空。')) {
                document.getElementById('projectForm').reset();
                uploadedFiles = [];
                document.getElementById('fileList').innerHTML = '';
            }
        }

        // 拖拽上传功能
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files);
            const fileInput = document.getElementById('fileInput');
            
            // 模拟文件选择
            const dt = new DataTransfer();
            files.forEach(file => dt.items.add(file));
            fileInput.files = dt.files;
            
            handleFileUpload(fileInput);
        });
    </script>
</body>
</html>
