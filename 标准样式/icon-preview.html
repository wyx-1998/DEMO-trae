<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>删除图标预览</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .icon-item {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .icon-item:hover {
            border-color: #F56C6C;
            box-shadow: 0 4px 12px rgba(245, 108, 108, 0.2);
        }
        
        .icon-item.selected {
            border-color: #F56C6C;
            background: #fff5f5;
        }
        
        .icon-display {
            font-size: 32px;
            color: #F56C6C;
            margin-bottom: 10px;
        }
        
        .icon-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .icon-description {
            font-size: 12px;
            color: #666;
        }
        
        .current-icon {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        
        .current-icon .icon-display {
            color: #1890ff;
        }
        
        .button-preview {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .button-preview h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .preview-button {
            background: none;
            border: none;
            color: #F56C6C;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 5px;
        }
        
        .preview-button:hover {
            background: rgba(245, 108, 108, 0.1);
        }
        
        .note {
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            color: #d46b08;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>删除图标选择预览</h1>
        
        <div class="icon-grid">
            <div class="icon-item current-icon" data-icon="fa-trash">
                <div class="icon-display">
                    <i class="fas fa-trash"></i>
                </div>
                <div class="icon-name">fa-trash</div>
                <div class="icon-description">当前使用 - 经典垃圾桶</div>
            </div>
            
            <div class="icon-item" data-icon="fa-times">
                <div class="icon-display">
                    <i class="fas fa-times"></i>
                </div>
                <div class="icon-name">fa-times</div>
                <div class="icon-description">简洁X号 - 现代风格</div>
            </div>
            
            <div class="icon-item" data-icon="fa-trash-alt">
                <div class="icon-display">
                    <i class="fas fa-trash-alt"></i>
                </div>
                <div class="icon-name">fa-trash-alt</div>
                <div class="icon-description">空心垃圾桶 - 轻量感</div>
            </div>
            
            <div class="icon-item" data-icon="fa-minus-circle">
                <div class="icon-display">
                    <i class="fas fa-minus-circle"></i>
                </div>
                <div class="icon-name">fa-minus-circle</div>
                <div class="icon-description">减号圆圈 - 温和删除</div>
            </div>
            
            <div class="icon-item" data-icon="fa-times-circle">
                <div class="icon-display">
                    <i class="fas fa-times-circle"></i>
                </div>
                <div class="icon-name">fa-times-circle</div>
                <div class="icon-description">X号圆圈 - 有边界感</div>
            </div>
            
            <div class="icon-item" data-icon="fa-ban">
                <div class="icon-display">
                    <i class="fas fa-ban"></i>
                </div>
                <div class="icon-name">fa-ban</div>
                <div class="icon-description">禁止图标 - 移除概念</div>
            </div>
            
            <div class="icon-item" data-icon="fa-backspace">
                <div class="icon-display">
                    <i class="fas fa-backspace"></i>
                </div>
                <div class="icon-name">fa-backspace</div>
                <div class="icon-description">退格键 - 删除操作</div>
            </div>
            
            <div class="icon-item" data-icon="fa-trash-can">
                <div class="icon-display">
                    <i class="fas fa-trash-can"></i>
                </div>
                <div class="icon-name">fa-trash-can</div>
                <div class="icon-description">垃圾桶变体 - 现代版本</div>
            </div>
        </div>
        
        <div class="button-preview">
            <h3>按钮效果预览：</h3>
            <button class="preview-button" id="preview-btn">
                <i class="fas fa-trash" id="preview-icon"></i>
            </button>
            <span>鼠标悬停查看效果</span>
        </div>
        
        <div class="note">
            <strong>提示：</strong> 点击任意图标可以预览按钮效果。选择你喜欢的图标后，告诉我图标名称（如 "fa-times"），我会立即为你更新到安全会议管理页面中。
        </div>
    </div>
    
    <script>
        const iconItems = document.querySelectorAll('.icon-item');
        const previewIcon = document.getElementById('preview-icon');
        
        iconItems.forEach(item => {
            item.addEventListener('click', () => {
                // 移除所有选中状态
                iconItems.forEach(i => i.classList.remove('selected'));
                // 添加选中状态
                item.classList.add('selected');
                
                // 更新预览按钮
                const iconClass = item.dataset.icon;
                previewIcon.className = `fas ${iconClass}`;
            });
        });
    </script>
</body>
</html>
