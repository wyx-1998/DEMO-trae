<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重大危险源管理 - 重大危险源台账</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
      background-color: #f5f7fa;
    }

    .app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .content-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .function-bar {
      padding: 16px 24px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .function-left {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-area {
      padding: 20px 24px;
      background: #fafafa;
      border-bottom: 1px solid #f0f0f0;
    }

    .search-form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: end;
    }

    .search-form .el-form-item {
      margin-bottom: 0;
    }

    .search-form .el-form-item .el-input,
    .search-form .el-form-item .el-select {
      width: 100%;
    }

    .search-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .more-filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: end;
      margin-top: 12px;
    }

    .more-filters .el-form-item {
      margin-bottom: 0;
    }

    .more-filters .el-form-item .el-select {
      width: 100%;
    }

    .table-area {
      padding: 24px;
      overflow-x: auto;
    }

    .table-area .el-table {
      min-width: 1400px;
    }

    .el-table__header .cell {
      white-space: nowrap;
    }

    .pagination-bar {
      padding: 16px 24px;
      background: #f8f9fa;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }

    .el-button--primary {
      --el-button-bg-color: #409EFF;
      --el-button-border-color: #409EFF;
    }

    /* 风险等级色标 */
    .risk-level-tag {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      color: white;
    }

    .risk-level-low {
      background-color: #67c23a;
      color: #fff;
    }

    .risk-level-medium {
      background-color: #f7ba2a;
      color: #606266;
    }

    .risk-level-high {
      background-color: #e6a23c;
      color: #fff;
    }

    .risk-level-critical {
      background-color: #f56c6c;
      color: #fff;
    }

    /* 页签样式 */
    .el-tabs {
      background: #fff;
      padding: 0 4px;
    }

    .el-tabs__header {
      margin: 0 0 16px 0;
    }

    .el-tabs__item {
      font-size: 14px;
      padding: 0 20px;
    }

    .el-tabs__item i {
      margin-right: 6px;
    }

  </style>
</head>

<body>
  <div id="app" class="app-container">
    <div class="main-content">
      <div class="content-card">
        <div class="function-bar">
          <div class="function-left">
            <el-button type="primary" @click="syncFromRiskLedger"><i class="fas fa-sync-alt"></i> 同步数据</el-button>
            <el-button type="warning" @click="exportData"><i class="fas fa-file-export"></i> 导出</el-button>
            <el-button @click="batchExport" type="success"><i class="fas fa-download"></i> 批量导出</el-button>
          </div>
        </div>

        <div class="search-area">
          <el-form :model="searchForm" label-position="left" class="search-form">
            <el-form-item label="重大危险级别">
              <el-select v-model="searchForm.riskLevel" clearable placeholder="请选择重大危险级别" style="width: 100%">
                <el-option label="一级" value="critical" />
                <el-option label="二级" value="high" />
                <el-option label="三级" value="medium" />
                <el-option label="四级" value="low" />
              </el-select>
            </el-form-item>
            <el-form-item label="重大危险源编号">
              <el-input v-model="searchForm.keyword" placeholder="请输入重大危险源编号" clearable />
            </el-form-item>
            <el-form-item label="所属单元">
              <el-select v-model="searchForm.unit" placeholder="请选择所属单元" clearable style="width: 100%">
                <el-option label="生产" value="production" />
                <el-option label="储存" value="storage" />
                <el-option label="使用" value="usage" />
                <el-option label="搬运" value="transport" />
              </el-select>
            </el-form-item>
          </el-form>

          <el-form v-show="showMoreFilters" :model="searchForm" label-position="left" class="more-filters">
            <el-form-item label="主要负责人">
              <el-input v-model="searchForm.responsiblePersonMain" placeholder="请输入主要负责人" clearable />
            </el-form-item>
            <el-form-item label="技术负责人">
              <el-input v-model="searchForm.responsiblePersonTechnical" placeholder="请输入技术负责人" clearable />
            </el-form-item>
            <el-form-item label="操作负责人">
              <el-input v-model="searchForm.responsiblePersonOperational" placeholder="请输入操作负责人" clearable />
            </el-form-item>
          </el-form>

          <div class="search-buttons">
            <el-button type="primary" @click="search"><i class="fas fa-search"></i> 查询</el-button>
            <el-button @click="reset"><i class="fas fa-redo"></i> 重置</el-button>
            <el-button text type="primary" @click="toggleMore">
              <i :class="showMoreFilters ? 'fas fa-angle-up' : 'fas fa-angle-down'"></i>
              {{ showMoreFilters ? '收起' : '展开更多' }}
            </el-button>
          </div>
        </div>

        <div class="table-area">
          <el-tabs v-model="activeTab" @tab-change="handleTabChange" style="margin-bottom: 16px;">
            <el-tab-pane label="当前重大危险源" name="current">
              <template #label>
                <span><i class="fas fa-check-circle"></i> 当前重大危险源</span>
              </template>
            </el-tab-pane>
            <el-tab-pane label="历史重大危险源" name="history">
              <template #label>
                <span><i class="fas fa-history"></i> 历史重大危险源</span>
              </template>
            </el-tab-pane>
          </el-tabs>
          <el-table :data="pagedData" style="width:100%" stripe border @selection-change="handleSelectionChange"
            v-loading="loading">
            <el-table-column type="selection" width="55"></el-table-column>
            <el-table-column prop="code" label="重大危险源编号" min-width="160" fixed="left">
              <template #default="{ row }">
                <el-link type="primary" @click="goView(row)">{{ row.code }}</el-link>
              </template>
            </el-table-column>
            <el-table-column prop="unit" label="所属单元" width="100">
              <template #default="{ row }">
                <el-tag :type="getUnitTagType(row.unit)" size="small">
                  {{ getUnitLabel(row.unit) }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="areaName" label="存储区域" min-width="180">
              <template #default="{ row }">
                {{ row.warehouseName }} - {{ row.areaName }}
              </template>
            </el-table-column>
            <el-table-column prop="rValue" label="R值" width="100">
              <template #default="{ row }">
                <el-tag :type="getRValueTagType(row.rValue)" size="small">
                  {{ row.rValue ? row.rValue.toFixed(1) : '0.0' }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="chemicalCount" label="化学品种类" width="100">
              <template #default="{ row }">
                {{ row.chemicalCount || 0 }}种
              </template>
            </el-table-column>
            <el-table-column prop="riskLevel" label="重大危险级别" width="120">
              <template #default="{ row }">
                <span v-if="row.riskLevel && ['critical', 'high', 'medium', 'low'].includes(row.riskLevel)" 
                      :class="['risk-level-tag', getRiskLevelClass(row.riskLevel)]">
                  {{ getRiskLevelLabel(row.riskLevel) }}
                </span>
                <span v-else style="color: #909399;">已核销</span>
              </template>
            </el-table-column>
            <el-table-column prop="deactivateDate" label="核销日期" width="120">
              <template #default="{ row }">
                <span v-if="activeTab === 'history'">{{ row.deactivateDate || '-' }}</span>
                <span v-else style="color: #c0c4cc;">-</span>
              </template>
            </el-table-column>
            <el-table-column prop="responsiblePersonMain" label="主要负责人" min-width="120">
              <template #default="{ row }">
                {{ row.responsiblePersons?.main || '-' }}
              </template>
            </el-table-column>
            <el-table-column prop="responsiblePersonTechnical" label="技术负责人" min-width="120">
              <template #default="{ row }">
                {{ row.responsiblePersons?.technical || '-' }}
              </template>
            </el-table-column>
            <el-table-column prop="responsiblePersonOperational" label="操作负责人" min-width="120">
              <template #default="{ row }">
                {{ row.responsiblePersons?.operational || '-' }}
              </template>
            </el-table-column>
            <el-table-column label="操作" width="120" fixed="right">
              <template #default="scope">
                <el-button size="small" type="primary" @click="goView(scope.row)">
                  <i class="fas fa-eye"></i> 查看
                </el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>

        <div class="pagination-bar">
          <el-pagination background size="small" v-model:current-page="currentPage" v-model:page-size="pageSize"
            :page-sizes="[10, 20, 50, 100]" :total="filteredData.length"
            layout="total, ->, sizes, prev, pager, next, jumper" />
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>

        return {
          searchForm: {
            keyword: '',

            riskLevel: '',
            responsiblePersonMain: '',
            responsiblePersonTechnical: '',
            responsiblePersonOperational: ''
          },
          showMoreFilters: false,
          activeTab: 'current',
          tableData: [],
          selectedRows: [],
          currentPage: 1,
          pageSize: 20,
          loading: false
        }
      },
      computed: {
        filteredData() {
          // 先根据页签过滤当前/历史数据
          let data = this.tableData.filter(d => {
            if (this.activeTab === 'current') {
              // 当前重大危险源：riskLevel 为 1-4 且 isActive 不为 false
              return d.isActive !== false && d.riskLevel && ['critical', 'high', 'medium', 'low'].includes(d.riskLevel);
            } else {
              // 历史重大危险源：isActive 为 false 或 riskLevel 不在 1-4 范围内
              return d.isActive === false || !d.riskLevel || !['critical', 'high', 'medium', 'low'].includes(d.riskLevel);
            }
          });
          
          // 再根据搜索条件过滤
          data = data.filter(d => {
            const keywordOk = !this.searchForm.keyword ||
              d.code.includes(this.searchForm.keyword) ||
              (d.warehouseName && d.warehouseName.includes(this.searchForm.keyword)) ||
              (d.areaName && d.areaName.includes(this.searchForm.keyword));
            const unitOk = !this.searchForm.unit || d.unit === this.searchForm.unit;
            const riskLevelOk = !this.searchForm.riskLevel || d.riskLevel === this.searchForm.riskLevel;
            const responsiblePersonMainOk = !this.searchForm.responsiblePersonMain ||
              (d.responsiblePersons?.main && d.responsiblePersons.main.includes(this.searchForm.responsiblePersonMain));
            const responsiblePersonTechnicalOk = !this.searchForm.responsiblePersonTechnical ||
              (d.responsiblePersons?.technical && d.responsiblePersons.technical.includes(this.searchForm.responsiblePersonTechnical));
            const responsiblePersonOperationalOk = !this.searchForm.responsiblePersonOperational ||
              (d.responsiblePersons?.operational && d.responsiblePersons.operational.includes(this.searchForm.responsiblePersonOperational));
            return keywordOk && unitOk && riskLevelOk && responsiblePersonMainOk && responsiblePersonTechnicalOk && responsiblePersonOperationalOk;
          });
          return data;
        },
        pagedData() {
          const start = (this.currentPage - 1) * this.pageSize;
          return this.filteredData.slice(start, start + this.pageSize);
        }
      },
      mounted() {
        this.loadData();
      },
      methods: {
        // 从危险化学品安全风险分布台账加载数据
        loadData() {
          this.loading = true;
          try {
            // 尝试从sessionStorage获取危险化学品安全风险分布台账的数据
            const riskLedgerData = sessionStorage.getItem('riskLedgerData');
            if (riskLedgerData) {
              const data = JSON.parse(riskLedgerData);
              this.convertRiskLedgerToMajorHazard(data);
            } else {
              // 如果没有缓存数据，使用模拟数据（实际应该通过API获取）
              this.loadMockData();
            }
          } catch (error) {
            console.error('加载数据失败:', error);
            ElMessage.error('加载数据失败，使用模拟数据');
            this.loadMockData();
          } finally {
            this.loading = false;
          }
        },
        // 从危险化学品安全风险分布台账同步数据
        syncFromRiskLedger() {
          this.loading = true;
          ElMessage.info('正在同步数据...');
          setTimeout(() => {
            // 实际应该调用API获取最新数据
            // 这里模拟从危险化学品安全风险分布台账获取数据
            const riskLedgerData = sessionStorage.getItem('riskLedgerData');
            if (riskLedgerData) {
              const data = JSON.parse(riskLedgerData);
              this.convertRiskLedgerToMajorHazard(data);
              ElMessage.success('数据同步成功');
            } else {
              this.loadMockData();
              ElMessage.success('已加载模拟数据');
            }
            this.loading = false;
          }, 1000);
        },
        // 将危险化学品安全风险分布台账数据转换为重大危险源格式
        convertRiskLedgerToMajorHazard(riskLedgerData) {
          // 包含所有数据（包括当前和历史），不再过滤
          const majorHazards = riskLedgerData;
          
          this.tableData = majorHazards.map(item => ({
            code: item.areaCode || `WH-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            unit: item.unitType || 'storage',
            areaName: item.areaName || '',
            warehouseName: item.warehouseName || '',
            storageArea: item.storageArea || '',
            rValue: item.rValue || 0,
            riskLevel: this.convertRiskLevel(item.riskLevel),
            chemicalCount: item.chemicalCount || 0,
            totalInventory: item.totalInventory || '0kg',
            judgmentType: item.judgmentType || 'single',
            responsiblePersons: {
              main: item.responsiblePerson || '-',
              technical: '-',
              operational: '-'
            },
            recordDate: item.lastUpdateTime ? this.formatDate(item.lastUpdateTime) : new Date().toISOString().split('T')[0],
            chemicals: item.chemicals || [],
            calculationResult: item.calculationResult || 0,
            isActive: item.isActive !== undefined ? item.isActive : true, // 默认为当前

              deactivateDate: '2024-09-20',
              chemicals: [
                { chemicalName: '丙酮', casNo: '67-64-1' }
              ]
            }
          ];
          
          const allData = [...mockRiskLedgerData, ...historicalData];
          this.convertRiskLedgerToMajorHazard(allData);
        },
        // 转换风险等级
        convertRiskLevel(level) {
          if (level >= 1 && level <= 4) {
            return level === 1 ? 'critical' : level === 2 ? 'high' : level === 3 ? 'medium' : 'low';
          }
          return 'low';
        },
        // 格式化日期
        formatDate(dateStr) {
          if (!dateStr) return new Date().toISOString().split('T')[0];
          try {
            const date = new Date(dateStr);
            return date.toISOString().split('T')[0];
          } catch (e) {
            return dateStr.split(' ')[0] || new Date().toISOString().split('T')[0];
          }
        },
        // 获取R值标签类型
        getRValueTagType(value) {
          if (!value) return 'info';
          if (value >= 100) return 'danger';
          if (value >= 50) return 'warning';
          if (value >= 10) return 'warning';
          return 'success';
        },
        search() {
          this.loading = true;
          setTimeout(() => {
            this.loading = false;
            this.currentPage = 1;
            ElMessage.success('查询完成');
          }, 500);
        },
        reset() {
          this.searchForm = {
            keyword: '',
            unit: '',
            riskLevel: '',
            responsiblePersonMain: '',
            responsiblePersonTechnical: '',
            responsiblePersonOperational: ''
          };
          this.currentPage = 1;
        },
        toggleMore() {
          this.showMoreFilters = !this.showMoreFilters;
        },
        handleTabChange(tabName) {
          this.currentPage = 1; // 切换页签时重置到第一页
        },
        exportData() {
          ElMessage.success('导出功能开发中');
        },
        batchExport() {
          if (this.selectedRows.length === 0) {
            ElMessage.warning('请选择要导出的记录');
            return;
          }
          ElMessage.success(`已导出 ${this.selectedRows.length} 条记录`);
        },
        handleSelectionChange(selection) {
          this.selectedRows = selection;
        },
        goView(row) {
          try {
            const message = {
              type: 'navigate',
              page: 'major-hazard-detail',
              data: { code: row.code },
              title: '重大危险源台账详情',
              icon: 'fas fa-info-circle'
            };
            console.log('发送查看消息:', message);
            
            // 检测是否在iframe中
            const isInIframe = window.self !== window.top;
            
            if (isInIframe) {
              // 在iframe中，发送消息给父窗口
              try {
                window.parent.postMessage(message, '*');
                console.log('消息已发送到父窗口');
              } catch (e) {
                console.error('发送消息失败:', e);
                // 备用方案：尝试使用window.top
                try {
                  window.top.postMessage(message, '*');
                } catch (e2) {
                  console.error('使用window.top也失败:', e2);
                  // 最后的备用方案：直接跳转
                  this.fallbackNavigate('major-hazard-detail', row.code);
                }
              }
            } else {
              // 不在iframe中，直接跳转
              console.log('不在iframe中，使用直接跳转');
              this.fallbackNavigate('major-hazard-detail', row.code);
            }
          } catch (error) {
            console.error('跳转失败:', error);
            ElMessage.error('跳转失败: ' + error.message);
            // 备用方案：直接跳转
            this.fallbackNavigate('major-hazard-detail', row.code);
          }
        },
        goEdit(row) {
          try {
            const message = {
              type: 'navigate',
              page: 'major-hazard-edit',
              data: { code: row.code, mode: 'edit' },
              title: '编辑重大危险源',
              icon: 'fas fa-edit'
            };
            console.log('发送编辑消息:', message);
            
            // 检测是否在iframe中
            const isInIframe = window.self !== window.top;
            
            if (isInIframe) {
              // 在iframe中，发送消息给父窗口
              try {
                window.parent.postMessage(message, '*');
                console.log('消息已发送到父窗口');
              } catch (e) {
                console.error('发送消息失败:', e);
                // 备用方案：尝试使用window.top
                try {
                  window.top.postMessage(message, '*');
                } catch (e2) {
                  console.error('使用window.top也失败:', e2);
                  // 最后的备用方案：直接跳转
                  this.fallbackNavigate('major-hazard-edit', row.code, 'edit');
                }
              }
            } else {
              // 不在iframe中，直接跳转
              console.log('不在iframe中，使用直接跳转');
              this.fallbackNavigate('major-hazard-edit', row.code, 'edit');
            }
          } catch (error) {
            console.error('跳转失败:', error);
            ElMessage.error('跳转失败: ' + error.message);
            // 备用方案：直接跳转
            this.fallbackNavigate('major-hazard-edit', row.code, 'edit');
          }
        },
        // 备用导航方案：直接跳转到对应页面
        fallbackNavigate(page, code, mode) {
          try {
            let fileName = '';
            if (page === 'major-hazard-detail') {
              fileName = '重大危险源台账-详情.html';
            } else if (page === 'major-hazard-edit') {
              fileName = '重大危险源台账-新建.html';
            }
            
            if (fileName) {
              // 将数据存储到sessionStorage
              if (code) {
                sessionStorage.setItem(`${page}_data`, JSON.stringify({ code: code }));
              }
              if (mode) {
                sessionStorage.setItem(`${page}_mode`, mode);
              }
              
              // 构建URL：基于当前文件路径
              const currentPath = window.location.pathname;
              const currentDir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
              const url = currentDir + fileName;
              
              console.log('备用跳转信息:');
              console.log('当前路径:', currentPath);
              console.log('当前目录:', currentDir);
              console.log('目标文件名:', fileName);
              console.log('目标URL:', url);
              
              // 直接跳转
              window.location.href = url;
            } else {
              ElMessage.error('无法确定跳转页面');
            }
          } catch (error) {
            console.error('备用跳转失败:', error);
            ElMessage.error('跳转失败: ' + error.message);
          }
        },
        getUnitLabel(unit) {
          const map = {
            'production': '生产',
            'storage': '储存',
            'usage': '使用',
            'transport': '搬运'
          };
          return map[unit] || unit;
        },
        getUnitTagType(unit) {
          const map = {
            'production': 'success',
            'storage': 'primary',
            'usage': 'warning',
            'transport': 'danger'
          };
          return map[unit] || '';
        },
        getRiskLevelLabel(level) {
          const map = {
            'low': '四级',
            'medium': '三级',
            'high': '二级',
            'critical': '一级'
          };
          return map[level] || level;
        },
        getRiskLevelClass(level) {
          const map = {
            'low': 'risk-level-low',
            'medium': 'risk-level-medium',
            'high': 'risk-level-high',
            'critical': 'risk-level-critical'
          };
          return map[level] || '';
        },
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>

</html>
