<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重大危险源管理 - 新建/编辑重大危险源</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
      background-color: #f5f7fa;
    }

    .app-container {
      min-height: 100vh;
      padding: 24px;
    }

    .form-header {
      background: #fff;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-title {
      font-size: 20px;
      font-weight: 600;
      color: #303133;
    }

    .form-card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #409EFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title i {
      color: #409EFF;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row.full-width {
      grid-template-columns: 1fr;
    }

    .el-form-item {
      margin-bottom: 20px;
    }

    .readonly-field {
      background-color: #f5f7fa;
    }

    .responsible-persons-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .person-form {
      background: #f5f7fa;
      padding: 16px;
      border-radius: 6px;
      border-left: 3px solid #409EFF;
    }

    .person-form-title {
      font-size: 14px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 12px;
    }

    .photo-upload-area {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .upload-item {
      position: relative;
      width: 100%;
      padding-top: 75%;
      background: #f5f7fa;
      border-radius: 6px;
      overflow: hidden;
      border: 2px dashed #d9d9d9;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .upload-item:hover {
      border-color: #409EFF;
    }

    .upload-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #909399;
      font-size: 12px;
    }

    .upload-placeholder i {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .monitoring-config {
      margin-top: 20px;
    }

    .monitoring-item-form {
      background: #f5f7fa;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .monitoring-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .monitoring-item-title {
      font-size: 14px;
      font-weight: 600;
      color: #303133;
    }

    .form-actions {
      background: #fff;
      padding: 20px 24px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .required-mark {
      color: #f56c6c;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div id="app" class="app-container">
    <!-- 表单头部 -->
    <div class="form-header">
      <div class="form-title">{{ formMode === 'create' ? '新建重大危险源' : '编辑重大危险源' }}</div>
      <el-button @click="goBack">
        <i class="fas fa-arrow-left"></i> 返回
      </el-button>
    </div>

    <el-form ref="formRef" :model="formData" :rules="formRules" label-width="140px" label-position="right">
      <!-- 基础信息 -->
      <div class="form-card">
        <div class="card-title">
          <i class="fas fa-info-circle"></i>
          基础信息
        </div>
        <div class="form-row">
          <el-form-item label="所属单元" prop="unit">
            <el-select v-model="formData.unit" placeholder="请选择所属单元" style="width: 100%">
              <el-option label="生产" value="production" />
              <el-option label="储存" value="storage" />
              <el-option label="使用" value="usage" />
              <el-option label="搬运" value="transport" />
            </el-select>
          </el-form-item>
          <el-form-item label="危险化学品名称" prop="chemicalName">
            <el-input v-model="formData.chemicalName" placeholder="请输入危险化学品名称" />
          </el-form-item>
        </div>
        <div class="form-row">
          <el-form-item label="CAS号" prop="cas">
            <el-input v-model="formData.cas" placeholder="XXXXX-XX-X" />
          </el-form-item>
          <el-form-item label="危险化学品类别" prop="category">
            <el-select v-model="formData.category" placeholder="请选择类别" style="width: 100%">
              <el-option v-for="cat in categoryOptions" :key="cat.value" :label="cat.label" :value="cat.value" />
            </el-select>
          </el-form-item>
        </div>
        <div class="form-row">
          <el-form-item label="最大库存/最大操作量" prop="maxStock">
            <el-input-number v-model="formData.maxStock" :min="0" :precision="2" style="width: 100%" />
          </el-form-item>
          <el-form-item label="计量单位" prop="unit">
            <el-select v-model="formData.stockUnit" placeholder="请选择单位" style="width: 100%">
              <el-option label="L" value="L" />
              <el-option label="kg" value="kg" />
              <el-option label="t" value="t" />
              <el-option label="m³" value="m³" />
            </el-select>
          </el-form-item>
        </div>
        <div class="form-row">
          <el-form-item label="临界量判定结论" prop="criticalJudgment">
            <el-input v-model="formData.criticalJudgment" readonly class="readonly-field">
              <template #prefix>
                <i class="fas fa-calculator"></i>
              </template>
            </el-input>
            <div style="font-size: 12px; color: #909399; margin-top: 4px;">
              根据GB18218规则自动计算
            </div>
          </el-form-item>
          <el-form-item label="风险等级" prop="riskLevel">
            <el-select v-model="formData.riskLevel" placeholder="请选择风险等级" style="width: 100%">
              <el-option label="可容许" value="low" />
              <el-option label="超限" value="exceed" />
            </el-select>
          </el-form-item>
        </div>
      </div>

      <!-- 包保与公示 -->
      <div class="form-card">
        <div class="card-title">
          <i class="fas fa-users"></i>
          包保与公示
        </div>
        <div class="responsible-persons-section">
          <div class="person-form">
            <div class="person-form-title"><span class="required-mark">*</span>主要负责人</div>
            <el-form-item prop="responsiblePersons.main.name" :rules="[{ required: true, message: '请输入姓名', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.main.name" placeholder="姓名" />
            </el-form-item>
            <el-form-item prop="responsiblePersons.main.position" :rules="[{ required: true, message: '请输入职务', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.main.position" placeholder="职务" />
            </el-form-item>
            <el-form-item prop="responsiblePersons.main.contact" :rules="[{ required: true, message: '请输入联系方式', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.main.contact" placeholder="联系方式" />
            </el-form-item>
          </div>
          <div class="person-form">
            <div class="person-form-title"><span class="required-mark">*</span>技术负责人</div>
            <el-form-item prop="responsiblePersons.technical.name" :rules="[{ required: true, message: '请输入姓名', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.technical.name" placeholder="姓名" />
            </el-form-item>
            <el-form-item prop="responsiblePersons.technical.position" :rules="[{ required: true, message: '请输入职务', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.technical.position" placeholder="职务" />
            </el-form-item>
            <el-form-item prop="responsiblePersons.technical.contact" :rules="[{ required: true, message: '请输入联系方式', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.technical.contact" placeholder="联系方式" />
            </el-form-item>
          </div>
          <div class="person-form">
            <div class="person-form-title"><span class="required-mark">*</span>操作负责人</div>
            <el-form-item prop="responsiblePersons.operational.name" :rules="[{ required: true, message: '请输入姓名', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.operational.name" placeholder="姓名" />
            </el-form-item>
            <el-form-item prop="responsiblePersons.operational.position" :rules="[{ required: true, message: '请输入职务', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.operational.position" placeholder="职务" />
            </el-form-item>
            <el-form-item prop="responsiblePersons.operational.contact" :rules="[{ required: true, message: '请输入联系方式', trigger: 'blur' }]">
              <el-input v-model="formData.responsiblePersons.operational.contact" placeholder="联系方式" />
            </el-form-item>
          </div>
        </div>
        <div style="margin-top: 24px;">
          <el-form-item label="公示牌位置" prop="publicityLocation">
            <el-input v-model="formData.publicityLocation" placeholder="请输入公示牌位置" />
          </el-form-item>
        </div>
        <div style="margin-top: 20px;">
          <el-form-item label="公示牌照片" prop="publicityPhotos">
            <div class="photo-upload-area">
              <div class="upload-item" v-for="(photo, index) in formData.publicityPhotos" :key="index">
                <img v-if="photo" :src="photo" alt="公示牌照片" />
                <div v-else class="upload-placeholder" @click="uploadPhoto(index)">
                  <i class="fas fa-camera"></i>
                  <span>点击上传</span>
                </div>
              </div>
              <div class="upload-item" v-if="formData.publicityPhotos.length < 5" @click="addPhoto">
                <div class="upload-placeholder">
                  <i class="fas fa-plus"></i>
                  <span>添加照片</span>
                </div>
              </div>
            </div>
            <div style="font-size: 12px; color: #909399; margin-top: 8px;">
              至少上传1张照片
            </div>
          </el-form-item>
        </div>
        <div style="margin-top: 20px;">
          <el-form-item label="承诺公告链接/附件" prop="commitmentNotice">
            <el-input v-model="formData.commitmentNotice" placeholder="请输入链接或上传附件">
              <template #append>
                <el-button @click="uploadFile"><i class="fas fa-upload"></i></el-button>
              </template>
            </el-input>
          </el-form-item>
        </div>
      </div>

      <!-- 监测接入 -->
      <div class="form-card">
        <div class="card-title">
          <i class="fas fa-chart-line"></i>
          监测接入
        </div>
        <div class="monitoring-config">
          <div class="monitoring-item-form" v-for="(item, index) in formData.monitoringItems" :key="index">
            <div class="monitoring-item-header">
              <div class="monitoring-item-title">监测指标 {{ index + 1 }}</div>
              <el-button size="small" type="danger" text @click="removeMonitoringItem(index)" v-if="formData.monitoringItems.length > 1">
                <i class="fas fa-trash"></i> 删除
              </el-button>
            </div>
            <div class="form-row">
              <el-form-item :label="`指标名称${index === 0 ? '（核心指标）' : ''}`" :prop="`monitoringItems.${index}.name`"
                :rules="[{ required: true, message: '请输入指标名称', trigger: 'blur' }]">
                <el-select v-model="item.name" placeholder="请选择指标" style="width: 100%">
                  <el-option label="压力" value="压力" />
                  <el-option label="液位" value="液位" />
                  <el-option label="温度" value="温度" />
                  <el-option label="流量" value="流量" />
                  <el-option label="气体浓度" value="气体浓度" />
                </el-select>
              </el-form-item>
              <el-form-item label="阈值" :prop="`monitoringItems.${index}.threshold`"
                :rules="[{ required: true, message: '请输入阈值', trigger: 'blur' }]">
                <el-input-number v-model="item.threshold" :min="0" :precision="2" style="width: 100%" />
              </el-form-item>
            </div>
            <div class="form-row">
              <el-form-item label="单位" :prop="`monitoringItems.${index}.unit`"
                :rules="[{ required: true, message: '请选择单位', trigger: 'change' }]">
                <el-select v-model="item.unit" placeholder="请选择单位" style="width: 100%">
                  <el-option label="MPa" value="MPa" />
                  <el-option label="%" value="%" />
                  <el-option label="℃" value="℃" />
                  <el-option label="L/min" value="L/min" />
                  <el-option label="ppm" value="ppm" />
                </el-select>
              </el-form-item>
              <el-form-item label="数据源标识" :prop="`monitoringItems.${index}.dataSource`"
                :rules="[{ required: true, message: '请输入数据源标识', trigger: 'blur' }]">
                <el-input v-model="item.dataSource" placeholder="请输入数据源标识" />
              </el-form-item>
            </div>
          </div>
          <el-button type="primary" text @click="addMonitoringItem">
            <i class="fas fa-plus"></i> 添加监测指标
          </el-button>
        </div>
      </div>

      <!-- 备案信息 -->
      <div class="form-card">
        <div class="card-title">
          <i class="fas fa-file-alt"></i>
          备案信息
        </div>
        <div class="form-row">
          <el-form-item label="属地部门" prop="localDepartment">
            <el-input v-model="formData.localDepartment" placeholder="请输入属地部门" />
          </el-form-item>
          <el-form-item label="报备日期" prop="recordDate">
            <el-date-picker v-model="formData.recordDate" type="date" placeholder="请选择日期" style="width: 100%" />
          </el-form-item>
        </div>
        <div class="form-row">
          <el-form-item label="登记系统ID" prop="systemId">
            <el-input v-model="formData.systemId" placeholder="请输入登记系统ID" />
          </el-form-item>
        </div>
      </div>

      <!-- 表单操作 -->
      <div class="form-actions">
        <el-button @click="goBack">取消</el-button>
        <el-button type="primary" @click="submitForm" :loading="submitting">
          <i class="fas fa-save"></i> 保存
        </el-button>
      </div>
    </el-form>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
  <script>
    const { createApp } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
      data() {
        return {
          formMode: 'create',
          submitting: false,
          formData: {
            unit: '',
            chemicalName: '',
            cas: '',
            category: '',
            maxStock: null,
            stockUnit: '',
            criticalJudgment: '',
            riskLevel: '',
            responsiblePersons: {
              main: {
                name: '',
                position: '',
                contact: ''
              },
              technical: {
                name: '',
                position: '',
                contact: ''
              },
              operational: {
                name: '',
                position: '',
                contact: ''
              }
            },
            publicityLocation: '',
            publicityPhotos: [''],
            commitmentNotice: '',
            monitoringItems: [
              {
                name: '',
                threshold: null,
                unit: '',
                dataSource: ''
              }
            ],
            localDepartment: '',
            recordDate: '',
            systemId: ''
          },
          categoryOptions: [
            { label: '爆炸物', value: 'explosive' },
            { label: '易燃气体', value: 'flammable_gas' },
            { label: '易燃液体', value: 'flammable_liquid' },
            { label: '易燃固体', value: 'flammable_solid' },
            { label: '氧化性物质', value: 'oxidizing' },
            { label: '毒性物质', value: 'toxic' },
            { label: '腐蚀性物质', value: 'corrosive' }
          ],
          formRules: {
            unit: [{ required: true, message: '请选择所属单元', trigger: 'change' }],
            chemicalName: [{ required: true, message: '请输入危险化学品名称', trigger: 'blur' }],
            cas: [
              { required: true, message: '请输入CAS号', trigger: 'blur' },
              { pattern: /^\d{2,7}-\d{2}-\d$/, message: 'CAS号格式不正确', trigger: 'blur' }
            ],
            category: [{ required: true, message: '请选择危险化学品类别', trigger: 'change' }],
            maxStock: [{ required: true, message: '请输入最大库存/最大操作量', trigger: 'blur' }],
            stockUnit: [{ required: true, message: '请选择计量单位', trigger: 'change' }],
            riskLevel: [{ required: true, message: '请选择风险等级', trigger: 'change' }],
            publicityLocation: [{ required: true, message: '请输入公示牌位置', trigger: 'blur' }],
            commitmentNotice: [{ required: true, message: '请输入承诺公告链接或上传附件', trigger: 'blur' }],
            localDepartment: [{ required: true, message: '请输入属地部门', trigger: 'blur' }],
            recordDate: [{ required: true, message: '请选择报备日期', trigger: 'change' }],
            systemId: [{ required: true, message: '请输入登记系统ID', trigger: 'blur' }]
          }
        }
      },
      watch: {
        'formData.maxStock'(newVal) {
          if (newVal && this.formData.category) {
            this.calculateCriticalJudgment();
          }
        },
        'formData.category'() {
          if (this.formData.maxStock) {
            this.calculateCriticalJudgment();
          }
        }
      },
      mounted() {
        const mode = sessionStorage.getItem('major-hazard-create_mode') || sessionStorage.getItem('major-hazard-edit_mode');
        if (mode === 'edit') {
          this.formMode = 'edit';
          // 加载编辑数据
          const data = sessionStorage.getItem('major-hazard-edit_data');
          if (data) {
            try {
              const params = JSON.parse(data);
              // 根据code加载数据
              console.log('加载编辑数据:', params);
            } catch (e) {
              console.error('解析数据失败:', e);
            }
          }
        }
      },
      methods: {
        calculateCriticalJudgment() {
          // 模拟临界量判定计算（实际应根据GB18218规则计算）
          if (this.formData.maxStock && this.formData.category) {
            // 简化示例：假设临界量为100
            const criticalValue = 100;
            if (this.formData.maxStock >= criticalValue) {
              this.formData.criticalJudgment = '≥临界量';
              this.formData.riskLevel = 'exceed';
            } else {
              this.formData.criticalJudgment = '<临界量';
              this.formData.riskLevel = 'low';
            }
          }
        },
        addPhoto() {
          if (this.formData.publicityPhotos.length < 5) {
            this.formData.publicityPhotos.push('');
          }
        },
        uploadPhoto(index) {
          ElMessage.info('图片上传功能开发中');
        },
        uploadFile() {
          ElMessage.info('文件上传功能开发中');
        },
        addMonitoringItem() {
          this.formData.monitoringItems.push({
            name: '',
            threshold: null,
            unit: '',
            dataSource: ''
          });
        },
        removeMonitoringItem(index) {
          this.formData.monitoringItems.splice(index, 1);
        },
        goBack() {
          window.parent.postMessage({
            type: 'navigate',
            page: 'major-hazard-ledger',
            title: '重大危险源台账',
            icon: 'fas fa-table'
          }, '*');
        },
        submitForm() {
          this.$refs.formRef.validate((valid) => {
            if (!valid) {
              ElMessage.warning('请完善表单信息');
              return;
            }

            // 验证公示牌照片
            const validPhotos = this.formData.publicityPhotos.filter(p => p);
            if (validPhotos.length === 0) {
              ElMessage.warning('请至少上传1张公示牌照片');
              return;
            }

            // 验证监测指标
            const hasCoreIndicator = this.formData.monitoringItems.some(item => 
              ['压力', '液位', '温度'].includes(item.name)
            );
            if (!hasCoreIndicator) {
              ElMessage.warning('至少需要配置一个核心指标（压力/液位/温度）');
              return;
            }

            this.submitting = true;
            setTimeout(() => {
              this.submitting = false;
              ElMessage.success(this.formMode === 'create' ? '新建成功' : '保存成功');
              this.goBack();
            }, 1000);
          });
        }
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>

</html>
