<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重大危险源管理 - 包保履职记录</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
      background-color: #f5f7fa;
    }

    .app-container {
      min-height: 100vh;
      padding: 24px;
    }

    .content-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .function-bar {
      padding: 16px 24px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .function-left {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-area {
      padding: 20px 24px;
      background: #fafafa;
      border-bottom: 1px solid #f0f0f0;
    }

    .search-form {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: end;
    }

    .search-form .el-form-item {
      margin-bottom: 0;
    }

    .search-form .el-form-item .el-input,
    .search-form .el-form-item .el-select {
      width: 100%;
    }

    .search-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .table-area {
      padding: 24px;
      overflow-x: auto;
    }

    .table-area .el-table {
      min-width: 1200px;
    }

    .el-table__header .cell {
      white-space: nowrap;
    }

    .pagination-bar {
      padding: 16px 24px;
      background: #f8f9fa;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }

    .el-button--primary {
      --el-button-bg-color: #409EFF;
      --el-button-border-color: #409EFF;
    }

    .duty-type-tag {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .duty-type-main {
      background-color: #409EFF;
      color: #fff;
    }

    .duty-type-technical {
      background-color: #67c23a;
      color: #fff;
    }

    .duty-type-operational {
      background-color: #e6a23c;
      color: #fff;
    }

    .completion-rate {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .completion-rate-bar {
      width: 100px;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .completion-rate-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .completion-rate-fill.high {
      background-color: #67c23a;
    }

    .completion-rate-fill.medium {
      background-color: #e6a23c;
    }

    .completion-rate-fill.low {
      background-color: #f56c6c;
    }
  </style>
</head>

<body>
  <div id="app" class="app-container">
    <div class="content-card">
      <div class="function-bar">
        <div class="function-left">
          <el-button type="primary" @click="openCreate">
            <i class="fas fa-plus"></i> 新增记录
          </el-button>
          <el-button type="warning" @click="exportData">
            <i class="fas fa-file-export"></i> 导出
          </el-button>
        </div>
      </div>

      <div class="search-area">
        <el-form :model="searchForm" label-position="left" class="search-form">
          <el-form-item label="责任人类别">
            <el-select v-model="searchForm.dutyType" placeholder="请选择责任人类别" clearable style="width: 100%">
              <el-option label="主要负责人" value="main" />
              <el-option label="技术负责人" value="technical" />
              <el-option label="操作负责人" value="operational" />
            </el-select>
          </el-form-item>
          <el-form-item label="排查时间">
            <el-date-picker v-model="searchForm.dateRange" type="daterange" range-separator="至"
              start-placeholder="开始日期" end-placeholder="结束日期" style="width: 100%" />
          </el-form-item>
          <el-form-item label="企业/单元">
            <el-input v-model="searchForm.unit" placeholder="请输入企业/单元" clearable />
          </el-form-item>
          <el-form-item label="重大危险源编号">
            <el-input v-model="searchForm.code" placeholder="请输入编号" clearable />
          </el-form-item>
        </el-form>
        <div class="search-buttons">
          <el-button type="primary" @click="search">
            <i class="fas fa-search"></i> 查询
          </el-button>
          <el-button @click="reset">
            <i class="fas fa-redo"></i> 重置
          </el-button>
        </div>
      </div>

      <div class="table-area">
        <el-table :data="pagedData" style="width:100%" stripe border v-loading="loading">
          <el-table-column prop="code" label="重大危险源编号" width="160"></el-table-column>
          <el-table-column prop="dutyType" label="责任人类别" width="120">
            <template #default="{ row }">
              <span :class="['duty-type-tag', getDutyTypeClass(row.dutyType)]">
                {{ getDutyTypeLabel(row.dutyType) }}
              </span>
            </template>
          </el-table-column>
          <el-table-column prop="dutyPerson" label="责任人" width="120"></el-table-column>
          <el-table-column prop="inspectionTime" label="排查时间" width="180"></el-table-column>
          <el-table-column prop="inspectionScope" label="排查范围" min-width="200">
            <template #default="{ row }">
              <el-tooltip :content="row.inspectionScope" placement="top">
                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  {{ row.inspectionScope }}
                </div>
              </el-tooltip>
            </template>
          </el-table-column>
          <el-table-column prop="problemCount" label="问题数量" width="100" align="center">
            <template #default="{ row }">
              <el-tag :type="row.problemCount > 0 ? 'danger' : 'success'" size="small">
                {{ row.problemCount }}
              </el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="completionRate" label="整改完成率" width="140">
            <template #default="{ row }">
              <div class="completion-rate">
                <div class="completion-rate-bar">
                  <div :class="['completion-rate-fill', getCompletionRateClass(row.completionRate)]"
                    :style="{ width: row.completionRate + '%' }"></div>
                </div>
                <span style="font-size: 12px; color: #606266;">{{ row.completionRate }}%</span>
              </div>
            </template>
          </el-table-column>
          <el-table-column label="隐患条目引用" width="140">
            <template #default="{ row }">
              <el-button size="small" type="primary" text @click="viewHiddenDangers(row)" v-if="row.hiddenDangerCount > 0">
                查看 ({{ row.hiddenDangerCount }})
              </el-button>
              <span v-else style="color: #909399;">-</span>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="180" fixed="right">
            <template #default="scope">
              <el-button size="small" type="primary" @click="goEdit(scope.row)">
                <i class="fas fa-edit"></i> 编辑
              </el-button>
              <el-button size="small" type="danger" @click="deleteRecord(scope.row)">
                <i class="fas fa-trash"></i> 删除
              </el-button>
            </template>
          </el-table-column>
        </el-table>
      </div>

      <div class="pagination-bar">
        <el-pagination background size="small" v-model:current-page="currentPage" v-model:page-size="pageSize"
          :page-sizes="[10, 20, 50, 100]" :total="filteredData.length"
          layout="total, ->, sizes, prev, pager, next, jumper" />
      </div>
    </div>

    <!-- 新增/编辑记录抽屉 -->
    <el-drawer v-model="showDrawer" :title="drawerTitle" size="600px" :before-close="handleDrawerClose">
      <el-form ref="drawerFormRef" :model="drawerFormData" :rules="drawerFormRules" label-width="120px"
        label-position="right">
        <el-form-item label="重大危险源编号" prop="code">
          <el-select v-model="drawerFormData.code" placeholder="请选择重大危险源" style="width: 100%">
            <el-option v-for="item in hazardSourceOptions" :key="item.value" :label="item.label" :value="item.value" />
          </el-select>
        </el-form-item>
        <el-form-item label="责任人类别" prop="dutyType">
          <el-select v-model="drawerFormData.dutyType" placeholder="请选择责任人类别" style="width: 100%">
            <el-option label="主要负责人" value="main" />
            <el-option label="技术负责人" value="technical" />
            <el-option label="操作负责人" value="operational" />
          </el-select>
        </el-form-item>
        <el-form-item label="责任人" prop="dutyPerson">
          <el-input v-model="drawerFormData.dutyPerson" placeholder="请输入责任人姓名" />
        </el-form-item>
        <el-form-item label="排查时间" prop="inspectionTime">
          <el-date-picker v-model="drawerFormData.inspectionTime" type="datetime" placeholder="请选择排查时间"
            style="width: 100%" />
        </el-form-item>
        <el-form-item label="排查范围" prop="inspectionScope">
          <el-input v-model="drawerFormData.inspectionScope" type="textarea" :rows="3"
            placeholder="请输入排查范围，涵盖装置/区域" maxlength="200" show-word-limit />
        </el-form-item>
        <el-form-item label="问题数量" prop="problemCount">
          <el-input-number v-model="drawerFormData.problemCount" :min="0" style="width: 100%" />
          <div style="font-size: 12px; color: #909399; margin-top: 4px;">
            问题数量将根据关联的隐患记录自动统计
          </div>
        </el-form-item>
        <el-form-item label="隐患条目引用">
          <el-button type="primary" text @click="linkHiddenDangers">
            <i class="fas fa-link"></i> 关联隐患记录
          </el-button>
          <div style="font-size: 12px; color: #909399; margin-top: 8px;">
            已关联 {{ drawerFormData.hiddenDangerCount }} 条隐患记录
          </div>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="submitDrawerForm" :loading="submitting">
            <i class="fas fa-save"></i> 保存
          </el-button>
          <el-button @click="handleDrawerClose">取消</el-button>
        </el-form-item>
      </el-form>
    </el-drawer>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
  <script>
    const { createApp } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
      data() {
        return {
          searchForm: {
            dutyType: '',
            dateRange: null,
            unit: '',
            code: ''
          },
          tableData: [
            {
              id: 1,
              code: 'WH-2024-001',
              dutyType: 'main',
              dutyPerson: '张三',
              inspectionTime: '2024-03-10 09:00:00',
              inspectionScope: '生产车间A区、B区，包括压力容器、管道系统、安全阀等',
              problemCount: 3,
              completionRate: 100,
              hiddenDangerCount: 3
            },
            {
              id: 2,
              code: 'WH-2024-001',
              dutyType: 'technical',
              dutyPerson: '李四',
              inspectionTime: '2024-03-15 14:00:00',
              inspectionScope: '监测系统、报警装置、应急设备',
              problemCount: 2,
              completionRate: 50,
              hiddenDangerCount: 2
            },
            {
              id: 3,
              code: 'WH-2024-002',
              dutyType: 'operational',
              dutyPerson: '王五',
              inspectionTime: '2024-03-20 08:00:00',
              inspectionScope: '操作区域、作业现场、安全标识',
              problemCount: 1,
              completionRate: 0,
              hiddenDangerCount: 1
            }
          ],
          selectedRows: [],
          currentPage: 1,
          pageSize: 20,
          loading: false,
          showDrawer: false,
          drawerMode: 'create',
          submitting: false,
          drawerFormData: {
            code: '',
            dutyType: '',
            dutyPerson: '',
            inspectionTime: '',
            inspectionScope: '',
            problemCount: 0,
            hiddenDangerCount: 0
          },
          drawerFormRules: {
            code: [{ required: true, message: '请选择重大危险源编号', trigger: 'change' }],
            dutyType: [{ required: true, message: '请选择责任人类别', trigger: 'change' }],
            dutyPerson: [{ required: true, message: '请输入责任人姓名', trigger: 'blur' }],
            inspectionTime: [{ required: true, message: '请选择排查时间', trigger: 'change' }],
            inspectionScope: [{ required: true, message: '请输入排查范围', trigger: 'blur' }]
          },
          hazardSourceOptions: [
            { label: 'WH-2024-001', value: 'WH-2024-001' },
            { label: 'WH-2024-002', value: 'WH-2024-002' },
            { label: 'WH-2024-003', value: 'WH-2024-003' }
          ]
        }
      },
      computed: {
        drawerTitle() {
          return this.drawerMode === 'create' ? '新增包保履职记录' : '编辑包保履职记录';
        },
        filteredData() {
          let data = this.tableData.filter(d => {
            const dutyTypeOk = !this.searchForm.dutyType || d.dutyType === this.searchForm.dutyType;
            const dateOk = !this.searchForm.dateRange || 
              (new Date(d.inspectionTime) >= this.searchForm.dateRange[0] && 
               new Date(d.inspectionTime) <= this.searchForm.dateRange[1]);
            const unitOk = !this.searchForm.unit || d.code.includes(this.searchForm.unit);
            const codeOk = !this.searchForm.code || d.code.includes(this.searchForm.code);
            return dutyTypeOk && dateOk && unitOk && codeOk;
          });
          return data;
        },
        pagedData() {
          const start = (this.currentPage - 1) * this.pageSize;
          return this.filteredData.slice(start, start + this.pageSize);
        }
      },
      methods: {
        search() {
          this.loading = true;
          setTimeout(() => {
            this.loading = false;
            this.currentPage = 1;
            ElMessage.success('查询完成');
          }, 500);
        },
        reset() {
          this.searchForm = {
            dutyType: '',
            dateRange: null,
            unit: '',
            code: ''
          };
          this.currentPage = 1;
        },
        exportData() {
          ElMessage.success('导出功能开发中');
        },
        openCreate() {
          this.drawerMode = 'create';
          this.drawerFormData = {
            code: '',
            dutyType: '',
            dutyPerson: '',
            inspectionTime: '',
            inspectionScope: '',
            problemCount: 0,
            hiddenDangerCount: 0
          };
          this.showDrawer = true;
        },
        goEdit(row) {
          this.drawerMode = 'edit';
          this.drawerFormData = {
            code: row.code,
            dutyType: row.dutyType,
            dutyPerson: row.dutyPerson,
            inspectionTime: row.inspectionTime,
            inspectionScope: row.inspectionScope,
            problemCount: row.problemCount,
            hiddenDangerCount: row.hiddenDangerCount
          };
          this.showDrawer = true;
        },
        handleDrawerClose() {
          this.$refs.drawerFormRef?.resetFields();
          this.showDrawer = false;
        },
        submitDrawerForm() {
          this.$refs.drawerFormRef.validate((valid) => {
            if (!valid) {
              ElMessage.warning('请完善表单信息');
              return;
            }
            this.submitting = true;
            setTimeout(() => {
              this.submitting = false;
              ElMessage.success(this.drawerMode === 'create' ? '新增成功' : '保存成功');
              this.handleDrawerClose();
              this.search();
            }, 1000);
          });
        },
        linkHiddenDangers() {
          ElMessage.info('跳转到隐患模块关联记录');
        },
        viewHiddenDangers(row) {
          ElMessage.info(`查看${row.code}的隐患记录`);
        },
        deleteRecord(row) {
          ElMessageBox.confirm(
            `确定要删除这条履职记录吗？`,
            '确认删除',
            {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }
          ).then(() => {
            const index = this.tableData.findIndex(item => item.id === row.id);
            if (index !== -1) {
              this.tableData.splice(index, 1);
              ElMessage.success('删除成功');
            }
          }).catch(() => {
            ElMessage.info('已取消删除');
          });
        },
        getDutyTypeLabel(type) {
          const map = {
            'main': '主要负责人',
            'technical': '技术负责人',
            'operational': '操作负责人'
          };
          return map[type] || type;
        },
        getDutyTypeClass(type) {
          const map = {
            'main': 'duty-type-main',
            'technical': 'duty-type-technical',
            'operational': 'duty-type-operational'
          };
          return map[type] || '';
        },
        getCompletionRateClass(rate) {
          if (rate >= 80) return 'high';
          if (rate >= 50) return 'medium';
          return 'low';
        }
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>

</html>
